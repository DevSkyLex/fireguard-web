<hlm-sheet
  side="right"
  [state]="sheetState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-sheet-content
    *hlmSheetPortal
    class="w-full overflow-y-auto sm:w-[480px] sm:max-w-none"
    data-testid="intervention-work-item-sheet"
  >
    <hlm-sheet-header>
      <h3 hlmSheetTitle i18n="@@intervention.workItemDrawer.header">Add work item</h3>
      <p hlmSheetDescription i18n="@@intervention.wif.hint">
        Add a task to the prepared scope. Only an action is required — target and assignee can be
        set now or later during execution.
      </p>
    </hlm-sheet-header>

    <app-intervention-work-item-form
      [pending]="pending()"
      [disabled]="disabled()"
      [serverError]="serverError()"
      [targetOptions]="targetOptions()"
      [memberOptions]="memberOptions()"
      (submitted)="submitted.emit($event)"
      (cancelled)="visibleChange.emit(false)"
    />
  </hlm-sheet-content>
</hlm-sheet>
