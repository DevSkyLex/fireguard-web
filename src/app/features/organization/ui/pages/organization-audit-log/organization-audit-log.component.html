<div id="organization-audit-log" class="flex h-full min-h-0 flex-col">
  <section
    class="border-b border-surface-200 bg-surface-50 px-4 py-8 sm:px-6 md:px-7 lg:px-8 dark:border-surface-800 dark:bg-surface-900"
  >
    <h1 i18n="@@audit.page.title" class="text-2xl font-semibold">Audit log</h1>
    <p i18n="@@audit.page.subtitle" class="text-sm text-surface-500 dark:text-surface-400">
      Platform-wide security and compliance ledger. Not limited to the current organization.
    </p>
  </section>

  <section class="flex min-h-0 flex-1 flex-col gap-4 overflow-y-auto p-4 sm:p-6 md:p-7 lg:p-8">
    @if (store.listError(); as error) {
      <p-message severity="error">
        <div class="flex flex-wrap items-center gap-3">
          <span>{{ error.message ?? loadErrorFallback }}</span>
          <p-button
            i18n-label="@@audit.page.retry"
            label="Retry"
            icon="pi pi-refresh"
            severity="secondary"
            [text]="true"
            (onClick)="retry()"
          />
        </div>
      </p-message>
    }

    <app-audit-event-table
      class="flex min-h-0 flex-1 flex-col"
      [auditEvents]="store.auditEvents()"
      [total]="store.totalAuditEvents()"
      [loading]="store.isLoading()"
      [empty]="store.isEmpty()"
      [initialPage]="page()"
      (load)="onLoad($event)"
      (pageChange)="onPageChange($event)"
      (viewDetails)="onViewDetails($event)"
    />
  </section>

  <app-audit-event-detail-drawer
    [visible]="selectedEvent() !== null"
    [auditEvent]="selectedEvent()"
    (visibleChange)="onDrawerVisibleChange($event)"
  />
</div>
