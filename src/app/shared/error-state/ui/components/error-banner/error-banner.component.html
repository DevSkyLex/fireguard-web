<p-message severity="error" class="block">
  <div class="flex w-full flex-wrap items-center justify-between gap-3">
    <span class="flex items-center gap-2">
      <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
      <span>{{ message() }}</span>
    </span>
    @if (retryable()) {
      <p-button
        severity="secondary"
        [outlined]="true"
        size="small"
        icon="pi pi-refresh"
        [loading]="retrying()"
        [label]="retryLabel"
        (onClick)="retried.emit()"
      />
    }
  </div>
</p-message>
