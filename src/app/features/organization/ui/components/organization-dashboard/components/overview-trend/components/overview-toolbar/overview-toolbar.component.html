<div class="flex items-center gap-2">
  <p-select
    i18n-ariaLabel="@@org.trend.granularity"
    ariaLabel="Granularity"
    [formControl]="granularityControl"
    [options]="store.granularityOptions()"
    optionLabel="label"
    optionValue="value"
    [loading]="store.isQueryLoading()"
    size="small"
  />

  <p-overlay-badge [badgeDisabled]="activeFilterCount() <= 0">
    <p-button
      i18n-label="@@org.trend.filters"
      label="Filters"
      icon="pi pi-filter"
      severity="secondary"
      size="small"
      [outlined]="true"
      [disabled]="!filtersAvailable()"
      (onClick)="filterToggle.emit()"
    />
  </p-overlay-badge>

  <p-button
    icon="pi pi-ellipsis-v"
    severity="secondary"
    size="small"
    outlined
    (onClick)="menuToggle.emit($event)"
  />
</div>
