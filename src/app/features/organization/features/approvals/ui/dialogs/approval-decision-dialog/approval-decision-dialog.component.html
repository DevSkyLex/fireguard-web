<hlm-alert-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-alert-dialog-content
    class="max-h-[calc(100svh-2rem)] overflow-y-auto overscroll-contain"
    *hlmAlertDialogPortal
    data-testid="approval-decision-dialog"
  >
    <hlm-alert-dialog-header>
      <h2 hlmAlertDialogTitle>{{ title() }}</h2>
      <p hlmAlertDialogDescription>{{ description() }}</p>
      @if (target(); as current) {
        <app-approval-status-tag [value]="current.request.status" />
      }
    </hlm-alert-dialog-header>

    <hlm-field class="gap-1">
      <label
        for="approval-decision-note"
        hlmFieldLabel
        class="text-xs font-medium text-muted-foreground"
        i18n="@@approvals.decide.noteLabel"
        >Decision note (optional)</label
      >
      <textarea
        hlmTextarea
        id="approval-decision-note"
        rows="3"
        class="w-full"
        data-testid="approval-decision-note"
        placeholder="Add context for the record"
        i18n-placeholder="@@approvals.decide.notePlaceholder"
        [formField]="noteForm.note"
      ></textarea>
      <hlm-field-description
        id="approval-decision-note-counter"
        class="self-end text-xs text-muted-foreground"
        data-testid="approval-decision-note-counter"
      >
        {{ noteModel().note.length }}/{{ maxLength }}
      </hlm-field-description>
    </hlm-field>

    @if (errorText() || blockedReason(); as error) {
      <p class="text-sm text-destructive" role="alert" data-testid="approval-decision-error">
        {{ error }}
      </p>
    }

    @if (refreshErrorText(); as error) {
      <p class="text-sm text-destructive" role="alert">{{ error }}</p>
    }
    @if (errorText() || refreshErrorText()) {
      <button
        hlmBtn
        type="button"
        variant="outline"
        [disabled]="refreshing() || pending()"
        (click)="refreshRequested.emit()"
        data-testid="approval-decision-refresh"
      >
        <span i18n="@@approvals.decide.refresh">Check latest state</span>
      </button>
    }

    <hlm-alert-dialog-footer>
      <button hlmAlertDialogCancel class="min-w-0 shrink">
        <span class="truncate" i18n="@@common.cancel">Cancel</span>
      </button>
      <button
        hlmAlertDialogAction
        class="min-w-0 shrink"
        data-testid="approval-decision-accept"
        [disabled]="pending() || refreshing() || !canSubmit() || noteForm().invalid()"
        [attr.aria-busy]="pending()"
        (click)="accept()"
      >
        <span class="truncate">{{ acceptLabel() }}</span>
      </button>
    </hlm-alert-dialog-footer>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
