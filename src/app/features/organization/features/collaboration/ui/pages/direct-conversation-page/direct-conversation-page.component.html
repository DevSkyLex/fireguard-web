<header
  class="flex h-12 shrink-0 items-center gap-2.5 border-b px-3 md:px-4"
  data-testid="direct-conversation-header"
>
  <a
    hlmBtn
    variant="ghost"
    size="icon"
    class="size-11 shrink-0 lg:hidden"
    data-testid="direct-conversation-back"
    i18n-aria-label="@@messages.conversation.back"
    aria-label="Back to conversations"
    [routerLink]="messagesRouteBase()"
  >
    <ng-icon name="lucideArrowLeft" class="text-base" aria-hidden="true" />
  </a>

  <hlm-avatar class="size-8 shrink-0">
    @if (counterpartAvatarUrl(); as avatarUrl) {
      <img hlmAvatarImage [src]="avatarUrl" alt="" />
    }
    <span hlmAvatarFallback class="text-[10px]">
      {{ isCounterpartResolved() ? counterpartName().charAt(0) : '?' }}
    </span>
  </hlm-avatar>

  <span
    class="min-w-0 truncate text-sm font-semibold"
    data-testid="direct-conversation-name"
    [class.text-foreground]="isCounterpartResolved()"
    [class.text-muted-foreground]="!isCounterpartResolved()"
  >
    {{ counterpartName() }}
  </span>
</header>

<app-message-thread
  [messages]="messages()"
  [loading]="thread.isLoading()"
  [hasMore]="thread.hasMore()"
  [errorMessage]="loadErrorMessage()"
  [canReact]="canWrite()"
  [canWrite]="canWrite()"
  [actionsEnabled]="true"
  [actionsBusy]="thread.isInteracting()"
  (loadMore)="thread.loadOlder()"
  (retried)="thread.retryFailed($event)"
  (loadRetried)="thread.load(conversationId())"
  (reactionToggled)="toggleReaction($event)"
  (threadRequested)="replyTargetId.set($event)"
  (pinToggleRequested)="togglePin($event)"
  (saveToggleRequested)="toggleSave($event)"
  (editRequested)="editTargetId.set($event)"
  (deleteRequested)="deleteTargetId.set($event)"
  (caughtUp)="markRead()"
>
  <app-message-composer
    [pending]="thread.isPosting()"
    [readOnly]="!canWrite()"
    [placeholder]="composerPlaceholder()"
    [members]="mentionCandidates()"
    (sent)="send($event)"
  />
</app-message-thread>

<app-message-reply-sheet
  [visible]="replyTargetId() !== null"
  [parent]="replyTargetView()"
  [canWrite]="canWrite()"
  [members]="mentionCandidates()"
  (visibleChange)="onReplySheetVisibleChange($event)"
  (replyPosted)="thread.noteReplyPosted($event)"
/>

<app-message-edit-dialog
  [visible]="editTargetId() !== null"
  [message]="editTargetMessage()"
  [pending]="editDialogBusy()"
  [error]="editDialogError()"
  (visibleChange)="onEditDialogVisibleChange($event)"
  (submitted)="submitEdit($event)"
/>

<app-message-delete-dialog
  [visible]="deleteTargetId() !== null"
  [pending]="deleteDialogBusy()"
  [error]="deleteDialogError()"
  (visibleChange)="onDeleteDialogVisibleChange($event)"
  (confirmed)="confirmDeleteMessage()"
/>
