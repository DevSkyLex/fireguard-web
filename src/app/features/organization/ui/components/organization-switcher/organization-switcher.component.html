@if (active(); as organization) {
  <ul hlmSidebarMenu>
    <li hlmSidebarMenuItem>
      <button
        hlmSidebarMenuButton
        size="lg"
        id="organization-switcher-trigger"
        [hlmDropdownMenuTrigger]="menu"
        [side]="menuSide()"
        align="start"
      >
        <app-organization-avatar
          size="sm"
          [name]="organization.name"
          [logoUrl]="organization.logoUrl"
          [initials]="organization.initials"
        />

        <div class="grid flex-1 text-left text-sm leading-tight">
          <span class="truncate font-medium">{{ organization.name }}</span>
          @if (organization.planName; as planName) {
            <span class="truncate text-xs text-muted-foreground">{{ planName }}</span>
          }
        </div>

        <ng-icon name="lucideChevronsUpDown" class="ml-auto text-base" aria-hidden="true" />
      </button>
    </li>
  </ul>

  <ng-template #menu>
    <hlm-dropdown-menu class="flex max-h-[calc(100svh-2rem)] min-w-64 flex-col rounded-lg">
      <div class="flex items-center gap-2 px-2 py-1.5">
        <app-organization-avatar
          size="sm"
          [name]="organization.name"
          [logoUrl]="organization.logoUrl"
          [initials]="organization.initials"
        />
        <div class="grid flex-1 text-left text-sm leading-tight">
          <span class="truncate font-medium">{{ organization.name }}</span>
          @if (organization.planName; as planName) {
            <span class="truncate text-xs text-muted-foreground">{{ planName }}</span>
          }
        </div>
      </div>

      @if (quickLinks().length > 0) {
        <hlm-dropdown-menu-separator />

        @for (link of quickLinks(); track link.id) {
          <a
            hlmDropdownMenuItem
            class="gap-2 max-sm:min-h-11"
            [routerLink]="link.route"
            [queryParams]="link.queryParams"
          >
            <ng-icon [name]="link.icon" class="text-sm" aria-hidden="true" />
            <span>{{ link.label }}</span>
          </a>
        }
      }

      <hlm-dropdown-menu-separator />

      <div
        class="max-h-[7.5rem] scroll-fade-y overflow-y-auto overscroll-contain"
        data-testid="organization-switcher-list"
      >
        @for (option of options(); track option.id) {
          <button
            hlmDropdownMenuItem
            class="min-h-10 gap-2 max-sm:min-h-11"
            [attr.aria-current]="option.active ? 'true' : null"
            (click)="select(option)"
          >
            <app-organization-avatar
              size="xs"
              [name]="option.name"
              [logoUrl]="option.logoUrl"
              [initials]="option.initials"
            />
            <span class="truncate">{{ option.name }}</span>
            @if (option.active) {
              <ng-icon name="lucideCheck" class="ml-auto text-sm" aria-hidden="true" />
            }
          </button>
        }
      </div>

      <hlm-dropdown-menu-separator />

      <button hlmDropdownMenuItem class="gap-2 max-sm:min-h-11" (click)="createOrganization()">
        <ng-icon name="lucidePlus" class="text-sm" aria-hidden="true" />
        <span i18n="@@org.switcher.create">Create organization</span>
      </button>
    </hlm-dropdown-menu>
  </ng-template>
} @else {
  <ul hlmSidebarMenu>
    <li hlmSidebarMenuItem>
      <div class="flex h-12 items-center gap-2 p-2">
        <hlm-skeleton class="size-8 shrink-0 rounded-lg" />
        <div class="grid flex-1 gap-1.5">
          <hlm-skeleton class="h-3.5 w-24" />
          <hlm-skeleton class="h-3 w-16" />
        </div>
      </div>
    </li>
  </ul>
}
