    .fg-empty-waiting-dark .accent-fill { fill: #ff7043; }
    .fg-empty-waiting-dark .tf { fill: url(#fg-empty-waiting-dark-plane); }
    .fg-empty-waiting-dark .lf { fill: #141417; }
