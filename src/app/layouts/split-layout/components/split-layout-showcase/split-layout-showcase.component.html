<div class="flex min-h-full flex-col gap-8 p-8 text-foreground xl:p-12">
  <div class="flex items-center gap-2.5">
    <img src="favicon.svg" width="32" height="32" alt="" />
    <span class="text-lg font-semibold tracking-tight">Fireguard</span>
  </div>
  <div class="my-auto flex w-full max-w-md flex-col gap-10 py-6">
    <p
      class="max-w-[18ch] text-3xl leading-tight font-semibold tracking-tight text-balance xl:text-4xl"
      i18n="@@auth.showcase.workspace"
    >
      Your field operations workspace
    </p>
    <ul class="flex flex-col gap-7">
      @for (point of proofPoints; track point.label) {
        <li class="flex gap-4">
          <ng-icon
            [name]="point.icon"
            class="mt-0.5 shrink-0 text-lg text-muted-foreground"
            aria-hidden="true"
          />
          <div class="flex flex-col gap-1">
            <p class="text-sm font-medium">{{ point.label }}</p>
            <p class="text-sm leading-relaxed text-muted-foreground">{{ point.detail }}</p>
          </div>
        </li>
      }
    </ul>
  </div>
</div>
