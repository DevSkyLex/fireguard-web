<hlm-alert-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-alert-dialog-content
    class="max-h-[calc(100svh-2rem)] overflow-y-auto overscroll-contain"
    *hlmAlertDialogPortal
    data-testid="account-leave-organization-dialog"
  >
    <hlm-alert-dialog-header>
      @if (departureConfirmed()) {
        <h2 hlmAlertDialogTitle i18n="@@account.organizations.leftTitle">Organization left</h2>
        <p hlmAlertDialogDescription i18n="@@account.organizations.leftDescription">
          Your departure is complete. We need to check your remaining workspaces before continuing.
        </p>
      } @else {
        <h2 hlmAlertDialogTitle i18n="@@account.organizations.leaveConfirmTitle">
          Leave this organization?
        </h2>
        <p hlmAlertDialogDescription>{{ confirmText() }}</p>
      }
    </hlm-alert-dialog-header>

    @if (error(); as message) {
      <p
        role="alert"
        class="text-sm text-destructive"
        data-testid="account-leave-organization-error"
      >
        {{ message }}
      </p>
    }

    <hlm-alert-dialog-footer>
      <button hlmAlertDialogCancel class="mobile-ui:min-h-11" i18n="@@common.cancel">Cancel</button>
      <button
        hlmAlertDialogAction
        [variant]="departureConfirmed() ? 'default' : 'destructive'"
        class="mobile-ui:min-h-11"
        data-testid="account-leave-organization-confirm"
        aria-live="polite"
        [attr.aria-busy]="pending() ? 'true' : null"
        [disabled]="pending()"
        (click)="confirm()"
      >
        @if (pending()) {
          <hlm-spinner aria-hidden="true" />
          @if (departureConfirmed()) {
            <span i18n="@@account.organizations.refreshingAccess">Refreshing access…</span>
          } @else {
            <span i18n="@@account.organizations.leaving">Leaving…</span>
          }
        } @else if (departureConfirmed()) {
          <span i18n="@@account.organizations.refreshAccess">Refresh access</span>
        } @else {
          <span i18n="@@account.organizations.leaveConfirmAction">Leave organization</span>
        }
      </button>
    </hlm-alert-dialog-footer>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
