@if (store.isAvailable()) {
  <hlm-sheet
    id="assistant-sheet"
    side="right"
    [state]="store.panelOpen() ? 'open' : 'closed'"
    (stateChanged)="onSheetStateChanged($event)"
  >
    <button
      hlmSheetTrigger
      hlmBtn
      type="button"
      variant="ghost"
      size="icon-sm"
      class="max-sm:size-11"
      data-testid="assistant-toggle"
      i18n-aria-label="@@workspace.assistant.toggle.aria"
      aria-label="Assistant"
    >
      <ng-icon name="lucideSparkles" class="text-base" aria-hidden="true" />
    </button>

    <hlm-sheet-content *hlmSheetPortal class="overflow-hidden sm:max-w-xl!">
      <hlm-sheet-header class="flex-row items-center gap-2.5 pe-12">
        <span
          class="grid size-7 shrink-0 place-content-center rounded-md bg-primary/10 text-primary"
        >
          <ng-icon name="lucideSparkles" class="text-sm" aria-hidden="true" />
        </span>

        <div class="min-w-0 flex-1">
          <h2 hlmSheetTitle class="truncate" i18n="@@workspace.assistant.title">Assistant</h2>
          <p hlmSheetDescription class="truncate" i18n="@@workspace.assistant.subtitle">
            Answers about this organization
          </p>
        </div>

        @if (store.messages().length > 0) {
          <button
            hlmBtn
            type="button"
            variant="ghost"
            size="icon-sm"
            class="shrink-0"
            data-testid="assistant-new-thread"
            i18n-aria-label="@@workspace.assistant.new"
            aria-label="New conversation"
            (click)="store.startNewThread()"
          >
            <ng-icon name="lucidePenLine" class="text-sm" aria-hidden="true" />
          </button>
        }
      </hlm-sheet-header>

      <app-assistant-panel />
    </hlm-sheet-content>
  </hlm-sheet>
}
