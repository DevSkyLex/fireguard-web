<div
  class="overflow-hidden rounded-xl border border-surface-200 bg-surface-0 dark:border-surface-800 dark:bg-surface-900"
  data-testid="account-profile-form-card"
>
  <div class="border-b border-surface-200 px-[18px] py-[15px] dark:border-surface-800">
    <h2
      class="text-base font-semibold text-surface-950 dark:text-surface-50"
      i18n="@@account.profileForm.personalInfoTitle"
    >
      Personal information
    </h2>
    <p
      class="mt-0.5 text-xs text-surface-500 dark:text-surface-400"
      i18n="@@account.profileForm.personalInfoDesc"
    >
      Your name is visible to other members of your organizations.
    </p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4 p-[18px]">
    @if (hasSaveError()) {
      <p-message
        severity="error"
        class="w-full"
        [closable]="false"
        i18n="@@account.profileForm.saveError"
      >
        We couldn't save your profile. Please try again.
      </p-message>
    }

    <div class="grid grid-cols-1 gap-3.5 sm:grid-cols-2">
      <div class="flex flex-col gap-1.5">
        <label
          for="profile-first-name"
          class="text-sm font-medium text-surface-900 dark:text-surface-50"
          i18n="@@account.profileForm.firstName"
        >
          First name
        </label>
        <p-iconfield>
          <p-inputicon class="pi pi-user" />
          <input
            id="profile-first-name"
            pInputText
            formControlName="firstName"
            placeholder="First name"
            i18n-placeholder="@@account.profileForm.firstNamePh"
            maxlength="100"
            class="w-full"
            [invalid]="form.controls.firstName.invalid && form.controls.firstName.touched"
          />
        </p-iconfield>
      </div>
      <div class="flex flex-col gap-1.5">
        <label
          for="profile-last-name"
          class="text-sm font-medium text-surface-900 dark:text-surface-50"
          i18n="@@account.profileForm.lastName"
        >
          Last name
        </label>
        <input
          id="profile-last-name"
          pInputText
          formControlName="lastName"
          placeholder="Last name"
          i18n-placeholder="@@account.profileForm.lastNamePh"
          maxlength="100"
          class="w-full"
          [invalid]="form.controls.lastName.invalid && form.controls.lastName.touched"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 gap-3.5 sm:grid-cols-2">
      <div class="flex flex-col gap-1.5">
        <label
          class="text-sm font-medium text-surface-900 dark:text-surface-50"
          i18n="@@account.profileForm.username"
        >
          Username
        </label>
        <div
          class="flex h-[42px] items-center gap-2 rounded-md border border-surface-200 bg-surface-50 px-3 dark:border-surface-700 dark:bg-surface-800"
        >
          <span class="font-mono text-surface-500 dark:text-surface-400">&#64;</span>
          <span class="truncate text-sm text-surface-700 dark:text-surface-300">{{
            profile()?.username
          }}</span>
        </div>
      </div>
      <div class="flex flex-col gap-1.5">
        <label
          class="text-sm font-medium text-surface-900 dark:text-surface-50"
          i18n="@@account.profileForm.emailAddress"
        >
          Email address
        </label>
        <div
          class="flex h-[42px] items-center gap-2 rounded-md border border-surface-200 bg-surface-50 px-3 dark:border-surface-700 dark:bg-surface-800"
        >
          <i
            class="pi pi-envelope text-sm text-surface-500 dark:text-surface-400"
            aria-hidden="true"
          ></i>
          <span class="truncate text-sm text-surface-700 dark:text-surface-300">{{
            profile()?.email
          }}</span>
        </div>
      </div>
    </div>

    <div
      class="flex items-center gap-2 rounded-md border border-surface-200 bg-surface-50 px-3 py-2.5 dark:border-surface-700 dark:bg-surface-800"
    >
      <i class="pi pi-lock text-xs text-surface-500 dark:text-surface-400" aria-hidden="true"></i>
      <span
        class="text-xs text-surface-500 dark:text-surface-400"
        i18n="@@account.profileForm.readonlyHint"
      >
        Your username and email are managed by your identity provider and can't be changed here.
      </span>
    </div>

    <div class="flex items-center justify-end gap-2">
      <p-button
        type="button"
        label="Reset"
        i18n-label="@@common.reset"
        severity="secondary"
        [outlined]="true"
        [disabled]="form.pristine || saving()"
        (onClick)="reset()"
      />
      <p-button
        type="submit"
        label="Save changes"
        i18n-label="@@common.saveChanges"
        icon="pi pi-check"
        [loading]="saving()"
        [disabled]="form.invalid || form.pristine || saving()"
      />
    </div>
  </form>
</div>
