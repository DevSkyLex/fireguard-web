<div
  hlmItemGroup
  role="listbox"
  [attr.aria-label]="listLabel()"
  [attr.data-testid]="testId()"
  class="gap-0"
  (keydown)="onKeydown($event)"
>
  @for (option of items(); track option.id; let i = $index) {
    @if (!$first) {
      <hlm-item-separator class="my-0" />
    }
    <button
      #itemOption
      type="button"
      role="option"
      hlmItem
      size="sm"
      [attr.aria-selected]="option.id === selectedId()"
      [attr.tabindex]="i === activeIndex() ? 0 : -1"
      [attr.data-testid]="optionTestId()"
      [class.bg-muted]="option.id === selectedId()"
      (click)="activate(option.id)"
      class="mobile-ui:min-h-11"
    >
      <hlm-item-content>
        <span hlmItemTitle>
          @if (option.id === selectedId()) {
            <ng-icon name="lucideCheck" class="shrink-0 text-foreground" aria-hidden="true" />
          }
          <span class="truncate">{{ option.label }}</span>
        </span>
      </hlm-item-content>
      @if (decorator(); as tpl) {
        <ng-container *ngTemplateOutlet="tpl; context: { $implicit: option.data }" />
      }
    </button>
  } @empty {
    <p class="px-2 py-1.5 text-sm text-muted-foreground">{{ emptyMessage() }}</p>
  }
</div>
