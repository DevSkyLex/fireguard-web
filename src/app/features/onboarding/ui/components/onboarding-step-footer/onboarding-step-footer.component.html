<hlm-separator class="sm:hidden" />
<div class="flex flex-col gap-3 py-3 sm:py-0">
  <div class="flex w-full min-w-0 flex-col gap-1">
    @if (gateReason(); as reason) {
      <p
        class="text-xs text-muted-foreground"
        data-testid="onboarding-step-gate-reason"
        [id]="gate.reasonId()"
      >
        {{ reason }}
      </p>
    }
    <button
      hlmBtn
      type="submit"
      class="min-h-11 w-full"
      #gate="appGateReason"
      [attr.data-testid]="submitTestId()"
      [disabled]="pending() || gateReason() !== null"
      [appGateReason]="gateReason()"
      [attr.aria-busy]="pending() ? 'true' : null"
      aria-live="polite"
    >
      @if (pending()) {
        <hlm-spinner />
        <span>{{ pendingLabel() }}</span>
      } @else {
        <span>{{ label() }}</span>
      }
    </button>
  </div>
  @if (skippable()) {
    <button
      hlmBtn
      type="button"
      variant="ghost"
      class="min-h-11 w-full"
      data-testid="onboarding-wizard-skip"
      [disabled]="pending()"
      (click)="skipped.emit()"
    >
      <span i18n="@@onboarding.wizard.skip">Skip for now</span>
    </button>
  }
</div>
