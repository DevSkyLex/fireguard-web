<div id="login-page" class="flex w-full flex-col gap-6">
  <app-page-heading
    heading="Sign in"
    i18n-heading="@@auth.login.title"
    description="Access your FireGuard workspace."
    i18n-description="@@auth.login.subtitle"
  />

  <app-login-form
    [pending]="authStore.isLoggingIn()"
    [serverError]="authStore.loginError()"
    (submitted)="login($event)"
  />

  <p class="text-center text-sm text-muted-foreground">
    <span i18n="@@auth.login.noAccount">No account yet?</span>
    <a
      class="ml-1 font-medium text-foreground underline-offset-4 hover:underline focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
      routerLink="/auth/register"
      i18n="@@auth.login.register"
      >Create one</a
    >
  </p>
</div>
