<div id="interventions" class="flex min-h-0 flex-1 flex-col gap-4">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <span id="interventions-view-label" i18n="@@intervention.view.label" class="sr-only">View</span>
    <p-selectbutton
      [options]="viewOptions"
      [allowEmpty]="false"
      optionLabel="label"
      optionValue="value"
      size="small"
      ariaLabelledBy="interventions-view-label"
      i18n-pTooltip="@@intervention.view.tooltip"
      pTooltip="Switch view (V)"
      tooltipPosition="bottom"
      [ngModel]="view()"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="setView($event)"
    >
      <ng-template #item let-item>
        <span class="flex items-center gap-2">
          <i [class]="item.icon" aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </span>
      </ng-template>
    </p-selectbutton>

    <p-button
      i18n-label="@@intervention.newButton"
      label="New intervention"
      icon="pi pi-plus"
      severity="primary"
      size="small"
      (onClick)="openCreate()"
    />
  </div>

  <section class="flex flex-row flex-wrap items-stretch gap-4">
    <app-intervention-metric
      class="min-w-56 flex-1"
      variant="in_progress"
      i18n-title="@@intervention.metric.inProgress.title"
      title="In progress"
      i18n-description="@@intervention.metric.inProgress.desc"
      description="Field work underway"
      icon="pi pi-wrench"
      [value]="inProgressTotal()"
      [loading]="boardStore.countsLoading()"
    />
    <app-intervention-metric
      class="min-w-56 flex-1"
      variant="review"
      i18n-title="@@intervention.metric.inReview.title"
      title="In review"
      i18n-description="@@intervention.metric.inReview.desc"
      description="Awaiting review"
      icon="pi pi-eye"
      [value]="inReviewTotal()"
      [loading]="boardStore.countsLoading()"
    />
    <app-intervention-metric
      class="min-w-56 flex-1"
      variant="planned"
      i18n-title="@@intervention.metric.planned.title"
      title="Planned"
      i18n-description="@@intervention.metric.planned.desc"
      description="Scheduled ahead"
      icon="pi pi-calendar"
      [value]="plannedTotal()"
      [loading]="boardStore.countsLoading()"
    />
    <app-intervention-metric
      class="min-w-56 flex-1"
      variant="published"
      i18n-title="@@intervention.metric.published.title"
      title="Published"
      i18n-description="@@intervention.metric.published.desc"
      description="Completed"
      icon="pi pi-check-circle"
      [value]="publishedTotal()"
      [loading]="boardStore.countsLoading()"
    />
  </section>

  @if (view() === 'board') {
    <app-intervention-board
      class="flex min-h-0 flex-1 flex-col"
      [columns]="boardStore.columns()"
      [loading]="boardStore.loading()"
      [empty]="boardStore.isEmpty()"
      [error]="boardStore.loadError()"
      [canPlan]="canPlan()"
      [canExecute]="canExecute()"
      [canReview]="canReview()"
      [canPublish]="canPublish()"
      (view)="onView($event)"
      (advance)="onAdvance($event)"
      (abandon)="onAbandon($event)"
      (retryRequested)="retryBoard()"
      (loadMore)="onLoadMore($event)"
      (createRequested)="openCreate()"
    />
  } @else if (view() === 'calendar') {
    <app-intervention-calendar
      class="flex min-h-0 flex-1 flex-col"
      [interventions]="calendarStore.interventions()"
      [loading]="calendarStore.loading()"
      [currentMemberIri]="calendarStore.currentMemberIri()"
      [showCreate]="false"
      (selectIntervention)="onView($event)"
      (selectDay)="openCreateOnDay($event)"
      (focusedDateChange)="onCalendarFocusChange($event)"
    />
  } @else {
    <app-intervention-table
      class="flex min-h-0 flex-1 flex-col"
      [interventions]="store.interventionList()"
      [total]="store.totalInterventions()"
      [loading]="store.isLoadingInterventions()"
      [empty]="store.isEmpty()"
      [error]="store.listError()"
      [initialPage]="page()"
      [showHeading]="false"
      [showCreate]="false"
      (load)="onLoad($event)"
      (pageChange)="onPageChange($event)"
      (createRequested)="openCreate()"
      (view)="onView($event)"
    />
  }
</div>

<app-intervention-create-drawer
  [visible]="createDrawerVisible()"
  (visibleChange)="createDrawerVisible.set($event)"
  [loading]="store.isCreating()"
  [optionsLoading]="planningOptions.loading()"
  [siteOptions]="planningOptions.sites()"
  [memberOptions]="planningOptions.members()"
  [initialPlannedStartAt]="initialPlannedStartAt()"
  (submitted)="create($event)"
/>
