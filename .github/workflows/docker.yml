name: Docker Image

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
      - develop
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    timeout-minutes: 30
    env:
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout deployment verifier
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve publishing event
        id: context
        run: node .github/scripts/deployment-context.mjs

      - name: Verify exact CI and SonarQube gate
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ steps.context.outputs.source-branch }}
          SOURCE_SHA: ${{ steps.context.outputs.source-sha }}
          EXPECTED_RUN_ID: ${{ steps.context.outputs.run-id }}
          SONAR_PROJECT_PREFIX: fireguard-web
          SONAR_DEPLOYMENTS_READY: ${{ vars[steps.context.outputs.source-branch == 'main' && 'SONAR_READY_MAIN' || 'SONAR_READY_DEVELOP'] }}
        run: node .github/scripts/verify-ci.mjs

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Prepare image references
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_ref="${image_name}:sha-${SOURCE_SHA}"
          if [ "$SOURCE_BRANCH" = "main" ]; then
            channel_ref="${image_name}:latest"
          else
            channel_ref="${image_name}:develop"
          fi

          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "channel_ref=${channel_ref}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image_ref }}
            ${{ steps.image.outputs.channel_ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger VPS deployment
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && steps.verified.outputs.verified-run-id || '' }}
        run: |
          test -n "$IMAGE_DIGEST"
          gh workflow run deploy-vps.yml --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_BRANCH" \
            -f image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}" -f source_run_id="$SOURCE_RUN_ID"
