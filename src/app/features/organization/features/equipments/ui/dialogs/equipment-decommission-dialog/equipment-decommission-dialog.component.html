<hlm-alert-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-alert-dialog-content
    class="max-h-[calc(100svh-2rem)] overflow-y-auto overscroll-contain"
    *hlmAlertDialogPortal
    data-testid="equipment-decommission-dialog"
  >
    <hlm-alert-dialog-header>
      <h2 hlmAlertDialogTitle i18n="@@equipment.decommissionDialog.title">
        Decommission this equipment?
      </h2>
      <p hlmAlertDialogDescription i18n="@@equipment.decommissionDialog.description">
        “{{ equipmentName() }}” leaves the active fleet for good. It stays readable in reports and
        past inspections, but no lifecycle action remains available on it afterwards — not even
        putting it back in service.
      </p>
    </hlm-alert-dialog-header>
    <hlm-alert-dialog-footer>
      <button
        hlmAlertDialogCancel
        class="max-sm:min-h-11"
        [disabled]="pending()"
        i18n="@@common.cancel"
      >
        Cancel
      </button>
      <button
        hlmAlertDialogAction
        variant="destructive"
        class="max-sm:min-h-11"
        data-testid="equipment-decommission-confirm"
        [disabled]="pending()"
        (click)="confirm()"
        i18n="@@equipment.decommissionDialog.confirm"
      >
        Decommission
      </button>
    </hlm-alert-dialog-footer>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
