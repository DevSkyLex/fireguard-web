<hlm-dialog [state]="dialogState()" (stateChanged)="onStateChanged($event)">
  <hlm-dialog-content
    class="sm:max-w-sm"
    data-testid="intervention-view-save-dialog"
    *hlmDialogPortal
  >
    <hlm-dialog-header>
      <h3 hlmDialogTitle i18n="@@intervention.views.saveTitle">Save this view</h3>
    </hlm-dialog-header>

    <div class="flex flex-col gap-2">
      <label hlmLabel for="intervention-view-name" i18n="@@intervention.views.nameLabel"
        >View name</label
      >
      <input
        hlmInput
        id="intervention-view-name"
        type="text"
        class="w-full"
        data-testid="intervention-view-save-name"
        placeholder="e.g. Urgent on my site"
        i18n-placeholder="@@intervention.views.namePlaceholder"
        [attr.maxlength]="maxLength"
        [value]="draftName()"
        (input)="onNameInput($event)"
        (keydown.enter)="save()"
      />
    </div>

    <hlm-dialog-footer>
      <button hlmBtn type="button" variant="outline" (click)="cancel()">
        <span i18n="@@common.cancel">Cancel</span>
      </button>
      <button
        hlmBtn
        type="button"
        data-testid="intervention-view-save-confirm"
        [disabled]="!canSave()"
        (click)="save()"
      >
        <span i18n="@@intervention.views.saveConfirm">Save view</span>
      </button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
