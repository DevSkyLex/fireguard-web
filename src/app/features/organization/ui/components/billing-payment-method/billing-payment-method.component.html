<section class="flex flex-col gap-3">
  <div class="flex flex-col gap-0.5">
    <h2
      class="text-sm font-semibold text-surface-900 dark:text-surface-100"
      i18n="@@billing.paymentMethod.title"
    >
      Payment method
    </h2>
    <p class="text-xs text-surface-500 dark:text-surface-400" i18n="@@billing.paymentMethod.desc">
      Card details are managed in the secure billing portal.
    </p>
  </div>

  @if (loading()) {
    <p class="text-sm text-surface-500 dark:text-surface-400" i18n="@@common.loading">Loading…</p>
  } @else {
    <div
      class="flex flex-wrap items-center justify-between gap-4 rounded-xl border border-surface-200 p-5 dark:border-surface-800"
    >
      @if (hasCard()) {
        <div class="flex min-w-0 items-center gap-3.5">
          <span
            class="grid h-[30px] w-[46px] shrink-0 place-items-center rounded-md border border-surface-200 bg-surface-100 text-[11px] font-bold tracking-[0.06em] text-surface-950 uppercase dark:border-surface-800 dark:bg-surface-800 dark:text-surface-50"
            aria-hidden="true"
          >
            {{ method()?.brand }}
          </span>
          <div class="flex min-w-0 flex-col">
            <span class="text-sm font-medium text-surface-950 tabular-nums dark:text-surface-50">
              •••• •••• •••• {{ method()?.last4 }}
            </span>
            @if (expiry()) {
              <span class="mt-0.5 text-xs text-surface-500 tabular-nums dark:text-surface-400">
                <span i18n="@@billing.paymentMethod.expires">Expires</span> {{ expiry() }}
              </span>
            }
          </div>
        </div>
      } @else {
        <p
          class="text-sm text-surface-500 dark:text-surface-400"
          i18n="@@billing.paymentMethod.none"
        >
          No card on file.
        </p>
      }

      <p-button
        i18n-label="@@billing.paymentMethod.manage"
        label="Manage in portal"
        icon="pi pi-external-link"
        severity="secondary"
        [outlined]="true"
        size="small"
        [loading]="busy()"
        (onClick)="manage.emit()"
      />
    </div>
  }
</section>
