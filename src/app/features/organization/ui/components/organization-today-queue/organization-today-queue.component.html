@if (visible()) {
  <section class="flex flex-col gap-2">
    <div class="flex items-center gap-2">
      <h2 class="text-base font-semibold text-surface-900 dark:text-surface-0">{{ label() }}</h2>

      @if (!loading()) {
        <span
          class="rounded-full bg-surface-100 px-2 py-0.5 text-xs font-semibold text-surface-600 tabular-nums dark:bg-surface-800 dark:text-surface-300"
          >{{ total() }}</span
        >
      }

      @if (actionLabel(); as action) {
        <p-button
          [label]="action"
          severity="secondary"
          [text]="true"
          size="small"
          icon="pi pi-arrow-right"
          iconPos="right"
          styleClass="ml-auto max-sm:min-h-11"
          (onClick)="actioned.emit()"
        />
      }
    </div>

    <div
      class="overflow-hidden rounded-md border border-surface-200 bg-surface-0 dark:border-surface-800 dark:bg-surface-900"
    >
      @if (loading()) {
        <div class="flex flex-col gap-3 p-4">
          <p-skeleton height="1rem" width="60%" />
          <p-skeleton height="1rem" width="45%" />
        </div>
      } @else {
        @for (intervention of interventions(); track intervention.id) {
          <button
            type="button"
            class="flex w-full items-center gap-3 border-b border-surface-200 px-4 py-3 text-left last:border-b-0 hover:bg-surface-50 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-primary max-sm:min-h-11 dark:border-surface-800 dark:hover:bg-surface-800"
            (click)="opened.emit(intervention)"
          >
            <app-intervention-priority-icon [priority]="intervention.priority" />

            <span class="flex min-w-0 flex-1 flex-col gap-0.5">
              <span class="flex min-w-0 items-center gap-2">
                <span class="font-mono text-xs text-surface-500 dark:text-surface-400"
                  >FG-{{ intervention.number }}</span
                >
                <span class="truncate text-sm text-surface-900 dark:text-surface-0">{{
                  intervention.name
                }}</span>
              </span>

              @if (notes()[intervention.id]; as note) {
                <span class="truncate text-xs text-surface-500 dark:text-surface-400">{{
                  note
                }}</span>
              }
            </span>

            <app-intervention-tag kind="status" [value]="intervention.status" />
          </button>
        }
      }
    </div>
  </section>
}
