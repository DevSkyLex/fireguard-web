name: ${COMPOSE_PROJECT_NAME:-fireguard-web}

services:
  fireguard-web:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    container_name: ${CONTAINER_NAME:-fireguard-web}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${APP_PORT:-4000}
      FIREGUARD_RUNTIME_CONFIG: 'true'
      APP_API_URL: ${APP_API_URL:?APP_API_URL is required}
      APP_MERCURE_HUB_URL: ${APP_MERCURE_HUB_URL:?APP_MERCURE_HUB_URL is required}
      APP_NAME: ${APP_NAME:-Fireguard}
      APP_MAINTENANCE: ${APP_MAINTENANCE:-false}
      # Unions with the loopback names baked into the build manifest by
      # angular.json; the engine merges both sources, it does not replace one.
      NG_ALLOWED_HOSTS: ${APP_HOST:?APP_HOST is required}
    networks:
      - traefik_proxy
    labels:
      - 'traefik.enable=true'

      - 'traefik.http.routers.${TRAEFIK_ROUTER_NAME:-fireguard-web}-http.rule=Host(`${APP_HOST:?APP_HOST is required}`)'
      - 'traefik.http.routers.${TRAEFIK_ROUTER_NAME:-fireguard-web}-http.entrypoints=web'
      - 'traefik.http.routers.${TRAEFIK_ROUTER_NAME:-fireguard-web}-http.middlewares=${TRAEFIK_ROUTER_NAME:-fireguard-web}-https-redirect'
      - 'traefik.http.middlewares.${TRAEFIK_ROUTER_NAME:-fireguard-web}-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.${TRAEFIK_ROUTER_NAME:-fireguard-web}.rule=Host(`${APP_HOST:?APP_HOST is required}`)'
      - 'traefik.http.routers.${TRAEFIK_ROUTER_NAME:-fireguard-web}.entrypoints=websecure'
      - 'traefik.http.routers.${TRAEFIK_ROUTER_NAME:-fireguard-web}.tls=true'
      - 'traefik.http.routers.${TRAEFIK_ROUTER_NAME:-fireguard-web}.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.${TRAEFIK_ROUTER_NAME:-fireguard-web}.middlewares=${TRAEFIK_SECURE_MIDDLEWARES:?TRAEFIK_SECURE_MIDDLEWARES is required}'
      - 'traefik.http.middlewares.${TRAEFIK_ROUTER_NAME:-fireguard-web}-security.headers.contenttypenosniff=true'
      - 'traefik.http.services.${TRAEFIK_ROUTER_NAME:-fireguard-web}.loadbalancer.server.port=${APP_PORT:-4000}'

networks:
  traefik_proxy:
    external: true
