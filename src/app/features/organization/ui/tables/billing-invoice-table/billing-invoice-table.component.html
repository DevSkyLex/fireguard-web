<p-card [styleClass]="cardStyleClass" [pt]="cardPt">
  <ng-template pTemplate="header">
    <div class="flex min-w-0 flex-col gap-0.5">
      <h2
        i18n="@@org.invoiceTable.title"
        class="text-[15px] font-semibold tracking-[-0.01em] text-surface-950 dark:text-surface-50"
      >
        Invoices
      </h2>
      <p i18n="@@org.invoiceTable.subtitle" class="text-xs text-surface-500 dark:text-surface-400">
        Download your invoices as PDF documents.
      </p>
    </div>
  </ng-template>

  <ng-template pTemplate="content">
    <p-table
      [value]="loading() ? skeletonItems : [...invoices()]"
      dataKey="id"
      [paginator]="!(loading() || invoices().length === 0)"
      [rows]="rows"
      [rowsPerPageOptions]="rowsPerPageOptions"
      [paginatorDropdownAppendTo]="'body'"
      [showCurrentPageReport]="true"
      i18n-currentPageReportTemplate="@@org.invoiceTable.pageReport"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} invoices"
      [rowHover]="true"
      [pt]="{ tbody: { class: '[&>tr:last-child>td]:border-b-0' } }"
    >
      <ng-template pTemplate="header">
        <tr>
          <th i18n="@@org.invoiceTable.colInvoice" class="min-w-64">Invoice</th>
          <th i18n="@@org.invoiceTable.colDate" class="hidden min-w-36 md:table-cell">Date</th>
          <th i18n="@@org.invoiceTable.colAmount" class="min-w-32">Amount</th>
          <th i18n="@@org.invoiceTable.colStatus" class="min-w-40">Status</th>
          <th class="w-20">
            <span i18n="@@org.invoiceTable.actions" class="sr-only">Actions</span>
          </th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-invoice>
        @if (loading()) {
          <tr>
            <td><p-skeleton width="9rem" height="0.875rem" /></td>
            <td class="hidden md:table-cell"><p-skeleton width="7rem" height="0.875rem" /></td>
            <td><p-skeleton width="5rem" height="0.875rem" /></td>
            <td><p-skeleton width="6rem" height="1.75rem" borderRadius="999px" /></td>
            <td><p-skeleton shape="circle" size="2rem" class="ml-auto" /></td>
          </tr>
        } @else {
          <tr class="group">
            <td>
              <span
                class="truncate font-semibold text-surface-950 tabular-nums dark:text-surface-50"
              >
                {{ invoice.number || invoice.id }}
              </span>
            </td>
            <td class="hidden md:table-cell">
              <span class="text-surface-600 tabular-nums dark:text-surface-400">
                {{ invoice.createdAt | date: 'mediumDate' }}
              </span>
            </td>
            <td>
              <span class="font-medium text-surface-950 tabular-nums dark:text-surface-50">
                {{ amountLabel(invoice) }}
              </span>
            </td>
            <td>
              <p-tag
                [severity]="statusDescriptor(invoice.status).severity"
                [icon]="statusDescriptor(invoice.status).icon"
                [value]="statusDescriptor(invoice.status).label"
              />
            </td>
            <td class="text-right">
              @if (invoice.invoicePdf || invoice.hostedInvoiceUrl) {
                <p-button
                  icon="pi pi-download"
                  severity="secondary"
                  size="small"
                  [outlined]="true"
                  i18n-ariaLabel="@@org.invoiceTable.downloadAria"
                  ariaLabel="Download invoice"
                  (onClick)="openInvoice(invoice)"
                  class="transition-opacity duration-150 pointer-fine:opacity-0 pointer-fine:group-focus-within:opacity-100 pointer-fine:group-hover:opacity-100"
                />
              }
            </td>
          </tr>
        }
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr class="bg-transparent! [&>td]:border-b-0!">
          <td colspan="5">
            <app-empty-state
              icon="pi-file"
              i18n-title="@@org.invoiceTable.emptyTitle"
              title="No invoices yet"
              i18n-description="@@org.invoiceTable.emptyDesc"
              description="Invoices will appear here once your organization is billed."
            />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </ng-template>
</p-card>
