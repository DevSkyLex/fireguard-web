@if (activePanel(); as panel) {
  <!--
    Mobile: full-screen overlay above the conversation column (prototype z-index 46).
    Desktop (lg = 1024px): a fixed-width column pinned to the right, width owned
    by the contribution.

    `lg:h-full` is required, not decorative: the stretching flex child is this
    component's own host, and the aside inside it is a normal block, so without
    it the column is only as tall as its content.
  -->
  <aside
    id="workspace-panel"
    class="absolute inset-0 z-40 flex min-h-0 flex-col border-surface-200 bg-surface-0 lg:static lg:z-auto lg:h-full lg:flex-none lg:border-l dark:border-surface-800 dark:bg-surface-900"
    [class]="panel.widthClass"
    [attr.aria-label]="panel.ariaLabel"
  >
    <ng-container *ngComponentOutlet="panel.component" />
  </aside>
}
