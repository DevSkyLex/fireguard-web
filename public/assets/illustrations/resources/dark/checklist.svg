<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" fill="none" role="img" aria-labelledby="fg-checklist-dark-title fg-checklist-dark-description" class="fg-checklist-dark">
  <title id="fg-checklist-dark-title">Checklist</title>
  <desc id="fg-checklist-dark-description">A clipboard of task lines under a vermilion clip, one item checked off.</desc>
  <defs>
    <linearGradient id="fg-checklist-dark-plane" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#141416"/>
      <stop offset="1" stop-color="#101012"/>
    </linearGradient>
  </defs>
  <style>
    .fg-checklist-dark { stroke-linecap: butt; stroke-linejoin: miter; stroke-width: 2; stroke-opacity: .45; }
    .fg-checklist-dark .edge, .fg-checklist-dark .seam { stroke: #a1a1aa; }
    .fg-checklist-dark .seam { stroke: #51515c; }
    .fg-checklist-dark .seam, .fg-checklist-dark .accent-seam { stroke-width: 1.35; }
    .fg-checklist-dark .shade { fill: #000000; fill-opacity: .28; }
    .fg-checklist-dark .soft { stroke: #46464f; stroke-width: 1.1; }
    .fg-checklist-dark .guide { stroke: #6b6b75; stroke-width: .8; stroke-dasharray: 2 4; opacity: .55; }
    .fg-checklist-dark .accent-edge, .fg-checklist-dark .accent-seam, .fg-checklist-dark .accent { stroke: #ff7043; }
    .fg-checklist-dark .accent { stroke-width: 1.1; }
    .fg-checklist-dark .accent-fill { fill: #ff7043; }
    .fg-checklist-dark .accent-tint { fill: #43261d; stroke: #ff7043; stroke-width: 1.1; }
    .fg-checklist-dark .tf { fill: url(#fg-checklist-dark-plane); }
    .fg-checklist-dark .lf { fill: #141417; }
    .fg-checklist-dark .rf { fill: #0d0d0f; }
    .fg-checklist-dark .at { fill: #4a2a20; }
    .fg-checklist-dark .af { fill: #3c221a; }
    .fg-checklist-dark .ar { fill: #2e1a14; }
    .fg-checklist-dark .accent-edge, .fg-checklist-dark .accent-seam, .fg-checklist-dark .accent, .fg-checklist-dark .accent-tint { stroke-opacity: 1; }
  </style>
