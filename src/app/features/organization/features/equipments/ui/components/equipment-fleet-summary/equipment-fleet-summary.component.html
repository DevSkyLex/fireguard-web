@if (hasContent()) {
  <div class="grid grid-cols-2 gap-3 md:grid-cols-4" data-testid="equipment-kpi-strip">
    @for (metric of metrics(); track metric.title) {
      <app-metric-card
        [icon]="metric.icon"
        [title]="metric.title"
        [value]="metric.value"
        [description]="metric.description"
        [loading]="loading()"
      />
    }
  </div>
}
