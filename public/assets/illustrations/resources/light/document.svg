<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" fill="none" role="img" aria-labelledby="fg-document-light-title fg-document-light-description" class="fg-document-light">
  <title id="fg-document-light-title">Document</title>
  <desc id="fg-document-light-description">A tabbed stack of records whose top sheet has a vermilion folded corner.</desc>
  <defs>
    <linearGradient id="fg-document-light-plane" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fafafb"/>
    </linearGradient>
  </defs>
  <style>
    .fg-document-light { stroke-linecap: butt; stroke-linejoin: miter; stroke-width: 2; }
    .fg-document-light .edge, .fg-document-light .seam { stroke: #777781; }
    .fg-document-light .seam { stroke-width: 1.35; }
    .fg-document-light .shade { fill: #1b1b24; fill-opacity: .055; }
    .fg-document-light .soft { stroke: #a1a1ab; stroke-width: 1.1; }
    .fg-document-light .guide { stroke: #85858f; stroke-width: .8; stroke-dasharray: 2 4; opacity: .55; }
    .fg-document-light .accent { stroke: #f4511e; }
    .fg-document-light .accent { stroke-width: 1.1; }
    .fg-document-light .accent-fill { fill: #f4511e; }
    .fg-document-light .accent-tint { fill: #fadfd7; stroke: #f4511e; stroke-width: 1.1; }
    .fg-document-light .tf { fill: url(#fg-document-light-plane); }
    .fg-document-light .lf { fill: #eeeef1; }
    .fg-document-light .rf { fill: #dddde3; }
  </style>
