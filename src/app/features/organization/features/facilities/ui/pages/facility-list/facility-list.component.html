<div id="facility-list" class="flex h-full flex-col gap-6 p-3 sm:p-6 md:p-7 lg:p-8">
  @if (store.rootListCallState().status === 'error') {
    <p-message severity="error" class="block">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <span class="flex items-center gap-2">
          <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
          <span i18n="@@facility.list.errorText"
            >The facilities could not be loaded. Check your connection and try again.</span
          >
        </span>
        <p-button
          i18n-label="@@facility.list.retry"
          label="Retry"
          icon="pi pi-refresh"
          severity="danger"
          [text]="true"
          size="small"
          (onClick)="retry()"
        />
      </div>
    </p-message>
  }
  @if (canViewTree()) {
    <div class="flex justify-end">
      <p-selectButton
        [options]="viewOptions"
        [ngModel]="activeView()"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
        i18n-ariaLabel="@@facility.view.aria"
        ariaLabel="Facility view"
        (ngModelChange)="onViewChange($event)"
      >
        <ng-template #item let-option>
          <span class="flex items-center gap-2">
            <i [class]="option.icon" aria-hidden="true"></i>
            <span>{{ option.label }}</span>
          </span>
        </ng-template>
      </p-selectButton>
    </div>
  }

  @if (activeView() === 'tree') {
    <app-facility-tree-table
      class="flex min-h-0 flex-1 flex-col"
      [nodes]="treeStore.nodes()"
      [loading]="treeStore.isQueryLoading()"
      [hasError]="treeStore.queryHasError()"
      (view)="onViewTreeNode($event)"
      (retry)="reloadTree()"
    />
  } @else {
    <app-facility-table
      class="flex min-h-0 flex-1 flex-col"
      [facilities]="store.rootFacilities()"
      [total]="store.totalRootFacilities()"
      [loading]="store.isLoadingRootFacilities()"
      [empty]="store.isRootEmpty()"
      [initialPage]="page()"
      [createDisabled]="atFacilityLimit()"
      [createDisabledTooltip]="quotaLimitTooltip"
      (load)="onLoad($event)"
      (pageChange)="onPageChange($event)"
      (view)="onView($event)"
      (edit)="onEdit($event)"
      (add)="onAdd()"
      (archive)="onArchive($event)"
      (restore)="onRestore($event)"
      (bulkArchive)="onBulkArchive($event)"
    />
  }
</div>
