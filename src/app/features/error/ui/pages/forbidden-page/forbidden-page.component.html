<div
  id="forbidden-page"
  class="flex w-full max-w-full min-w-0 flex-col items-center gap-8 text-center sm:max-w-xl"
>
  <div class="flex flex-col gap-2">
    <app-error-scene
      code="403"
      primaryIcon="lucideLockKeyhole"
      secondaryIcon="lucideKeyRound"
      accentIcon="lucideShieldX"
    />
    <app-page-heading
      size="large"
      heading="You cannot open this workspace"
      i18n-heading="@@error.forbidden.title"
      description="None of your organizations is accessible with this account. Sign out and use another account, or contact an administrator of your organization."
      i18n-description="@@error.forbidden.description"
    />
    @if (signedInAs(); as signedInAs) {
      <p hlmMuted i18n="@@error.forbidden.signedInAs">Signed in as {{ signedInAs }}</p>
    }
  </div>

  <div class="grid w-full max-w-md grid-cols-1 items-stretch gap-3 sm:grid-cols-2">
    <button
      hlmBtn
      size="lg"
      class="h-11 min-h-11 gap-2"
      [disabled]="logoutPort.isLoggingOut()"
      [attr.aria-busy]="logoutPort.isLoggingOut() ? 'true' : null"
      (click)="logoutPort.logout()"
    >
      <ng-icon name="lucideLogOut" class="text-sm" aria-hidden="true" />
      <span i18n="@@error.forbidden.signOut">Sign out</span>
    </button>
    <a
      hlmBtn
      variant="outline"
      size="lg"
      class="h-11 min-h-11"
      routerLink="/"
      i18n="@@error.forbidden.home"
    >
      Try my workspace again
    </a>
  </div>
</div>
