<div id="forgot-password-page" class="flex w-full flex-col gap-6">
  <app-page-heading
    heading="Reset your password"
    i18n-heading="@@auth.forgotPassword.title"
    description="Tell us your address and we will send you a code."
    i18n-description="@@auth.forgotPassword.subtitle"
  />

  <app-email-request-form
    [pending]="passwordResetStore.isRequesting()"
    [submitLabel]="submitLabel"
    (submitted)="request($event)"
  />

  <p class="text-center text-sm text-muted-foreground">
    <a
      class="font-medium text-foreground underline-offset-4 hover:underline focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
      routerLink="/auth/login"
      i18n="@@auth.forgotPassword.backToSignIn"
      >Back to sign in</a
    >
  </p>
</div>
