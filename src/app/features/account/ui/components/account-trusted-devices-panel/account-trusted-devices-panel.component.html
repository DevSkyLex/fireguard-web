<div class="flex flex-col gap-4">
  @if (store.listCallState().error; as error) {
    <app-error-banner
      [message]="error.message ?? loadErrorMessage"
      [retrying]="store.listCallState().status === 'pending'"
      (retried)="reload()"
    />
  }
  @if (store.revokeCallState().error; as error) {
    <app-error-banner [message]="error.message ?? revokeErrorMessage" [retryable]="false" />
  }
  @if (store.revokeAllCallState().error; as error) {
    <app-error-banner [message]="error.message ?? revokeAllErrorMessage" [retryable]="false" />
  }

  <app-trusted-device-table
    [devices]="store.devices()"
    [total]="store.totalDevices()"
    [loading]="store.listCallState().status === 'pending'"
    [empty]="store.totalDevices() === 0"
    [revokingAll]="store.isRevokingAll()"
    [hasDevices]="store.totalDevices() > 0"
    (load)="load($event)"
    (revokeAll)="revokeAll()"
    (revoke)="revoke($event)"
  />
</div>
