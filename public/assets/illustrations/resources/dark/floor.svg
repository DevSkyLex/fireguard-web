  <title id="fg-floor-dark-title">Floor</title>
  <desc id="fg-floor-dark-description">Three stacked floor plates pulled apart, the selected level shown in vermilion.</desc>
  <defs>
    <linearGradient id="fg-floor-dark-plane" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#141416"/>
      <stop offset="1" stop-color="#101012"/>
    </linearGradient>
  </defs>
  <style>
    .fg-floor-dark { stroke-linecap: butt; stroke-linejoin: miter; stroke-width: 2; stroke-opacity: .45; }
    .fg-floor-dark .edge, .fg-floor-dark .seam { stroke: #a1a1aa; }
    .fg-floor-dark .seam { stroke: #51515c; }
    .fg-floor-dark .seam, .fg-floor-dark .accent-seam { stroke-width: 1.35; }
    .fg-floor-dark .shade { fill: #000000; fill-opacity: .28; }
    .fg-floor-dark .soft { stroke: #46464f; stroke-width: 1.1; }
    .fg-floor-dark .guide { stroke: #6b6b75; stroke-width: .8; stroke-dasharray: 2 4; opacity: .55; }
    .fg-floor-dark .accent-edge, .fg-floor-dark .accent-seam, .fg-floor-dark .accent { stroke: #ff7043; }
    .fg-floor-dark .accent { stroke-width: 1.1; }
    .fg-floor-dark .accent-fill { fill: #ff7043; }
    .fg-floor-dark .tf { fill: url(#fg-floor-dark-plane); }
    .fg-floor-dark .lf { fill: #141417; }
    .fg-floor-dark .at { fill: #4a2a20; }
    .fg-floor-dark .af { fill: #3c221a; }
    .fg-floor-dark .accent-edge, .fg-floor-dark .accent-seam, .fg-floor-dark .accent { stroke-opacity: 1; }
  </style>
