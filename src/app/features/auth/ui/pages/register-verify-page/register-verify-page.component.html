<div id="register-verify-page" class="mx-auto flex w-full max-w-md min-w-0 flex-col gap-8">
  <app-page-heading
    heading="Confirm your email"
    i18n-heading="@@auth.registerVerify.title"
    description="Enter the code we just sent you."
    i18n-description="@@auth.registerVerify.subtitle"
  />

  <app-otp-form
    [pending]="registerStore.isVerifying()"
    [showResend]="true"
    [resending]="registerStore.isResending()"
    [serverError]="registerStore.verifyError() ?? registerStore.resendError()"
    [resendAvailableIn]="registerStore.resendAvailableIn()"
    (submitted)="verify($event)"
    (resent)="resend()"
  />

  <p
    class="flex flex-wrap items-center justify-center gap-x-1 border-t border-border pt-4 text-center text-sm text-muted-foreground"
  >
    <a
      class="inline-flex min-h-11 items-center justify-center rounded-sm font-medium text-foreground underline-offset-4 hover:underline focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
      routerLink="/auth/login"
      [queryParams]="{ returnUrl: returnUrl || undefined }"
      i18n="@@auth.forgotPassword.backToSignIn"
      >Back to sign in</a
    >
  </p>
</div>
