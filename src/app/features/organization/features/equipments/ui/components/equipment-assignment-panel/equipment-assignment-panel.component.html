<section
  class="rounded-md border border-surface-200 bg-surface-0 dark:border-surface-800 dark:bg-surface-900"
>
  <header
    class="flex items-center gap-2 border-b border-surface-200 px-4 py-3 dark:border-surface-800"
  >
    <i class="pi pi-building text-sm text-surface-500 dark:text-surface-400" aria-hidden="true"></i>
    <h2
      class="text-[15px] font-semibold tracking-[-0.01em] text-surface-950 dark:text-surface-50"
      i18n="@@equipment.assign.title"
    >
      Facility assignment
    </h2>
  </header>
  <div class="p-4">
    <div
      class="mb-4 flex items-center gap-3 rounded-md bg-surface-50 px-3 py-2.5 dark:bg-surface-800/60"
    >
      <span
        class="flex size-8 items-center justify-center rounded-md bg-surface-100 dark:bg-surface-800"
      >
        <i
          class="pi pi-map-marker text-sm text-surface-500 dark:text-surface-400"
          aria-hidden="true"
        ></i>
      </span>
      <div class="min-w-0">
        <p class="text-xs text-surface-500 dark:text-surface-400" i18n="@@equipment.assign.current">
          Current facility
        </p>
        @if (facilityId(); as fid) {
          <button
            type="button"
            class="truncate text-left text-sm font-medium text-primary-600 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:text-primary-400"
            (click)="viewFacility.emit(fid)"
          >
            {{ currentFacilityLabel() }}
          </button>
        } @else {
          <p class="truncate text-sm font-medium text-surface-900 dark:text-surface-100">
            {{ currentFacilityLabel() }}
          </p>
        }
      </div>
    </div>
    @if (canManage() && !decommissioned()) {
      <div class="flex flex-col gap-2">
        <p-select
          i18n-ariaLabel="@@equipment.assign.selectFacility"
          ariaLabel="Select a facility"
          [options]="[...options()]"
          [formControl]="control"
          optionLabel="label"
          optionValue="value"
          placeholder="Select a facility"
          i18n-placeholder="@@equipment.assign.selectFacility"
          class="w-full"
        />
        <div class="flex justify-end gap-2">
          @if (facilityId()) {
            <p-button
              label="Unassign"
              i18n-label="@@equipment.assign.unassign"
              icon="pi pi-link-slash"
              severity="secondary"
              [outlined]="true"
              size="small"
              [loading]="loading()"
              (onClick)="unassign.emit()"
            />
          }
          <p-button
            label="Assign"
            i18n-label="@@equipment.assign.assign"
            icon="pi pi-link"
            size="small"
            [loading]="loading()"
            [disabled]="!control.value"
            (onClick)="control.value && assign.emit(control.value)"
          />
        </div>
      </div>
    }
  </div>
</section>
