<header class="flex flex-col {{ size() === 'large' ? 'gap-4' : 'gap-1.5' }}">
  <h1
    class="{{
      size() === 'large' ? 'text-3xl sm:text-4xl' : 'text-2xl'
    }} font-semibold tracking-tight text-foreground"
  >
    {{ heading() }}
  </h1>
  @if (description(); as text) {
    <p
      class="{{
        size() === 'large' ? 'text-base leading-relaxed' : 'text-sm'
      }} text-muted-foreground"
    >
      {{ text }}
    </p>
  }
  <ng-content />
</header>
