<hlm-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-dialog-content
    class="max-h-[calc(100svh-2rem)] overflow-y-auto overscroll-contain sm:max-w-md"
    data-testid="channel-edit-dialog"
    *hlmDialogPortal
  >
    <hlm-dialog-header>
      <h3 hlmDialogTitle i18n="@@channels.editDialog.title">Channel settings</h3>
      <p hlmDialogDescription i18n="@@channels.editDialog.description">
        Rename the channel or move it under a different parent.
      </p>
    </hlm-dialog-header>

    <app-channel-edit-form
      [visible]="visible()"
      [name]="name()"
      [parentChannelId]="parentChannelId()"
      [parentOptions]="parentOptions()"
      [pending]="pending()"
      (submitted)="onFormSubmitted($event)"
      (cancelled)="visibleChange.emit(false)"
    />
  </hlm-dialog-content>
</hlm-dialog>
