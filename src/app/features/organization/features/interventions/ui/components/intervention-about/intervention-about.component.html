<div class="flex flex-col gap-1">
  <div data-testid="intervention-about-status">
    <app-inplace-field label="Status" i18n-label="@@intervention.prop.status" class="w-full">
      <span fieldValue>
        <app-intervention-tag kind="status" [value]="intervention().status" asOption />
      </span>
    </app-inplace-field>
  </div>

  <div data-testid="intervention-about-reference">
    <app-inplace-field
      label="Reference"
      i18n-label="@@intervention.detail.reference"
      class="w-full"
    >
      <span fieldValue class="font-mono tabular-nums">FG-{{ intervention().number }}</span>
    </app-inplace-field>
  </div>

  <div data-testid="intervention-about-type">
    <app-inplace-field label="Type" i18n-label="@@intervention.list.columnType" class="w-full">
      <span fieldValue>
        <app-intervention-tag kind="type" [value]="intervention().type" asOption />
      </span>
    </app-inplace-field>
  </div>

  <div data-testid="intervention-about-updated">
    <app-inplace-field label="Updated" i18n-label="@@common.updated" class="w-full">
      <span fieldValue class="tabular-nums">{{
        intervention().updatedAt | appOrgDate: 'date' : regionalFormatting()
      }}</span>
    </app-inplace-field>
  </div>

  <div data-testid="intervention-description-field">
    <app-inplace-field
      #descriptionField
      label="Description"
      i18n-label="@@intervention.pf.description"
      commit="confirm"
      orientation="vertical"
      class="w-full"
      [editable]="canEditDetails()"
      [editing]="editState().open === 'description'"
      [pending]="editState().saving === 'description'"
      [error]="editState().failed === 'description' ? editState().failure : null"
      [canSave]="canSaveDescription()"
      (editingChange)="onDescriptionEditing($event)"
      (saved)="saveDescription()"
    >
      @if (intervention().description; as text) {
        <span fieldValue class="whitespace-pre-line">{{ text }}</span>
      } @else {
        <span fieldValue class="text-muted-foreground" i18n="@@intervention.detail.noDescription">
          No description yet. Add context, scope notes or instructions for this intervention.
        </span>
      }

      <textarea
        fieldEditor
        hlmTextarea
        rows="3"
        class="w-full"
        data-testid="intervention-description-input"
        [attr.maxlength]="descriptionMaxLength"
        [attr.aria-labelledby]="descriptionField.labelId"
        [value]="descriptionDraft()"
        (input)="descriptionDraft.set($any($event.target).value)"
      ></textarea>
    </app-inplace-field>
  </div>
</div>
