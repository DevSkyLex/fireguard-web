<form [formGroup]="form" (ngSubmit)="submit()" class="flex h-full flex-col">
  <div class="flex flex-1 flex-col gap-5">
    <div class="flex flex-col gap-2">
      <label for="invite-email" class="text-sm font-medium text-surface-900 dark:text-surface-50">
        <ng-container i18n="@@org.invForm.emailLabel">Email address</ng-container>
        <span class="text-red-500" aria-hidden="true">&nbsp;*</span>
      </label>
      <input
        id="invite-email"
        pInputText
        type="email"
        autocomplete="email"
        formControlName="email"
        placeholder="member@example.com"
        class="w-full"
        [invalid]="form.controls.email.invalid && form.controls.email.touched"
      />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <p-message severity="error" variant="simple" size="small">
          <span i18n="@@org.invForm.emailError">Enter a valid email address.</span>
        </p-message>
      } @else {
        <small i18n="@@org.invForm.emailHelp" class="text-surface-500 dark:text-surface-400">
          We'll email them a secure link to join.
        </small>
      }
    </div>

    <div class="flex flex-col gap-2">
      <label for="invite-role" class="text-sm font-medium text-surface-900 dark:text-surface-50">
        <ng-container i18n="@@org.invForm.role">Initial role</ng-container>
      </label>
      <p-select
        inputId="invite-role"
        [options]="[...roles()]"
        optionLabel="name"
        optionValue="id"
        formControlName="roleId"
        i18n-placeholder="@@org.invForm.rolePlaceholder"
        placeholder="Select a role"
        [showClear]="true"
        styleClass="w-full"
        [invalid]="form.controls.roleId.invalid && form.controls.roleId.touched"
      />
      <small i18n="@@org.invForm.roleHelp" class="text-surface-500 dark:text-surface-400">
        New members receive this role. You can change it later.
      </small>
    </div>
  </div>

  <div
    class="mt-6 flex items-center justify-end gap-2 border-t border-surface-200 pt-4 dark:border-surface-800"
  >
    <p-button
      type="button"
      i18n-label="@@common.cancel"
      label="Cancel"
      severity="secondary"
      [text]="true"
      [disabled]="loading()"
      (onClick)="cancelled.emit()"
    />
    <p-button
      type="submit"
      i18n-label="@@org.invForm.submit"
      label="Send invitation"
      icon="pi pi-send"
      [loading]="loading()"
      [disabled]="form.invalid || loading()"
    />
  </div>
</form>
