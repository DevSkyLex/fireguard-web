<hlm-alert-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-alert-dialog-content *hlmAlertDialogPortal data-testid="channel-delete-dialog">
    <hlm-alert-dialog-header>
      <h2 hlmAlertDialogTitle i18n="@@channels.room.deleteConfirmTitle">Delete this channel?</h2>
      <p hlmAlertDialogDescription i18n="@@channels.room.deleteConfirmDescription">
        Its messages, pins, files and links stay, but the channel itself is gone for everyone. This
        cannot be undone.
      </p>
    </hlm-alert-dialog-header>

    @if (error(); as storeError) {
      <p role="alert" class="text-sm text-destructive" data-testid="channel-delete-error">
        {{ storeError.message }}
      </p>
    }

    <hlm-alert-dialog-footer>
      <button
        hlmAlertDialogCancel
        class="max-sm:min-h-11"
        [disabled]="pending()"
        i18n="@@channels.room.deleteConfirmCancel"
      >
        Cancel
      </button>
      <button
        hlmAlertDialogAction
        variant="destructive"
        class="max-sm:min-h-11"
        data-testid="channel-delete-confirm"
        [disabled]="pending()"
        [attr.aria-busy]="pending() ? 'true' : null"
        (click)="confirm()"
        i18n="@@channels.room.deleteConfirmAction"
      >
        Delete
      </button>
    </hlm-alert-dialog-footer>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
