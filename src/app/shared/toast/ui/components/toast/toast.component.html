<p-toast class="app-toast-deck" position="bottom-center">
  <ng-template let-message #headless let-closeFn="closeFn">
    <div
      role="status"
      aria-live="polite"
      (click)="closeFn($event)"
      class="flex w-full cursor-pointer items-start gap-3 rounded-lg border border-surface-200 bg-surface-0 px-4 py-3 shadow-lg transition-colors hover:border-surface-300 dark:border-surface-800 dark:bg-surface-900 dark:hover:border-surface-700"
    >
      <span class="sr-only">{{ severityLabel(message) }}:</span>
      <span
        aria-hidden="true"
        class="mt-1.5 size-2 shrink-0 rounded-full"
        [ngClass]="dotClass(message)"
      ></span>
      <div class="flex min-w-0 flex-1 flex-col gap-0.5">
        <span class="text-sm font-semibold text-surface-950 dark:text-surface-50">
          {{ message.summary }}
        </span>
        @if (message.detail) {
          <span class="text-xs text-surface-500 dark:text-surface-400">{{ message.detail }}</span>
        }
      </div>
      <time class="mt-0.5 shrink-0 text-xs font-medium text-surface-400 dark:text-surface-500">
        {{ relativeLabel(message) }}
      </time>

      <!--
        The card itself dismisses on click, which is a pointer-only affordance:
        a keyboard user had no way to clear a toast. This is the focusable
        equivalent, and it stops the click from bubbling twice.
      -->
      <button
        type="button"
        class="-m-1.5 flex size-11 shrink-0 items-center justify-center rounded-md text-surface-400 transition-colors hover:text-surface-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary sm:size-8 dark:text-surface-500 dark:hover:text-surface-300"
        i18n-aria-label="@@common.dismiss"
        aria-label="Dismiss"
        (click)="closeFn($event); $event.stopPropagation()"
      >
        <i class="pi pi-times text-xs" aria-hidden="true"></i>
      </button>
    </div>
  </ng-template>
</p-toast>
