@if (isLoading()) {
  <ul hlmSidebarMenu>
    <li hlmSidebarMenuItem>
      <div
        class="flex h-12 items-center gap-2 p-2"
        role="status"
        i18n-aria-label="@@account.menu.loading"
        aria-label="Loading your account"
      >
        <hlm-skeleton class="size-8 shrink-0 rounded-lg" />
        <div class="grid flex-1 gap-1.5">
          <hlm-skeleton class="h-3.5 w-24" />
          <hlm-skeleton class="h-3 w-28" />
        </div>
      </div>
    </li>
  </ul>
} @else if (displayName()) {
  <ul hlmSidebarMenu>
    <li hlmSidebarMenuItem>
      <button
        hlmSidebarMenuButton
        size="lg"
        id="account-menu-trigger"
        [hlmDropdownMenuTrigger]="menu"
        [side]="menuSide()"
        align="end"
      >
        <hlm-avatar class="size-8 shrink-0">
          @if (avatarUrl(); as pictureUrl) {
            <img hlmAvatarImage [src]="pictureUrl" [alt]="displayName()" />
          }
          <span
            hlmAvatarFallback
            class="bg-sidebar-primary text-xs font-semibold text-sidebar-primary-foreground"
            >{{ initials() }}</span
          >
        </hlm-avatar>

        <div class="grid flex-1 text-left text-sm leading-tight">
          <span class="truncate font-medium">{{ displayName() }}</span>
          @if (email(); as address) {
            <span class="truncate text-xs text-muted-foreground">{{ address }}</span>
          }
        </div>

        <ng-icon name="lucideEllipsisVertical" class="ml-auto text-base" aria-hidden="true" />
      </button>
    </li>
  </ul>

  <ng-template #menu>
    <hlm-dropdown-menu class="min-w-56 rounded-lg">
      <hlm-dropdown-menu-label>
        <div class="flex items-center gap-2 px-1 py-1.5 text-left text-sm">
          <hlm-avatar class="size-8 shrink-0">
            @if (avatarUrl(); as pictureUrl) {
              <img hlmAvatarImage [src]="pictureUrl" [alt]="displayName()" />
            }
            <span
              hlmAvatarFallback
              class="bg-sidebar-primary text-xs font-semibold text-sidebar-primary-foreground"
              >{{ initials() }}</span
            >
          </hlm-avatar>
          <div class="grid flex-1 leading-tight">
            <span class="truncate font-medium text-foreground">{{ displayName() }}</span>
            @if (email(); as address) {
              <span class="truncate text-xs text-muted-foreground">{{ address }}</span>
            }
          </div>
        </div>
      </hlm-dropdown-menu-label>

      <hlm-dropdown-menu-separator />

      <hlm-dropdown-menu-group>
        <button hlmDropdownMenuItem class="gap-2" (click)="goToProfile()">
          <ng-icon name="lucideUserRound" class="text-sm" aria-hidden="true" />
          <span i18n="@@account.menu.profile">Account</span>
        </button>
        <button hlmDropdownMenuItem class="gap-2" (click)="goToSecurity()">
          <ng-icon name="lucideShieldCheck" class="text-sm" aria-hidden="true" />
          <span i18n="@@account.menu.security">Security</span>
        </button>
        <button hlmDropdownMenuItem class="gap-2" (click)="goToOrganizations()">
          <ng-icon name="lucideBuilding2" class="text-sm" aria-hidden="true" />
          <span i18n="@@account.menu.organizations">Your organizations</span>
        </button>
        <button hlmDropdownMenuItem class="gap-2" (click)="goToNotifications()">
          <ng-icon name="lucideBell" class="text-sm" aria-hidden="true" />
          <span i18n="@@account.menu.notifications">Notifications</span>
        </button>
        <button hlmDropdownMenuItem class="gap-2" (click)="goToNotificationPreferences()">
          <ng-icon name="lucideSettings2" class="text-sm" aria-hidden="true" />
          <span i18n="@@account.menu.notificationPreferences">Notification preferences</span>
        </button>
      </hlm-dropdown-menu-group>

      <hlm-dropdown-menu-separator />

      <button hlmDropdownMenuItem class="gap-2" (click)="logout()">
        <ng-icon name="lucideLogOut" class="text-sm" aria-hidden="true" />
        <span i18n="@@account.menu.logout">Log out</span>
      </button>
    </hlm-dropdown-menu>
  </ng-template>
}
