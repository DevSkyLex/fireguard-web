<div id="register-page" class="mx-auto flex w-full max-w-xl flex-col gap-8 px-6 sm:px-8">
  <section class="flex flex-col gap-2">
    <h1
      class="text-2xl font-semibold tracking-tight text-surface-900 sm:text-[1.75rem] dark:text-surface-50"
      i18n="@@auth.register.title"
    >
      Create your account
    </h1>
    <p
      class="text-sm leading-relaxed text-surface-500 dark:text-surface-400"
      i18n="@@auth.register.subtitle"
    >
      Start setting up your fire-safety workspace in a couple of minutes.
    </p>
  </section>

  <!-- Registration form -->
  <app-register-form
    [loading]="loading()"
    [email]="invitedEmail()"
    [serverError]="registerStore.registerError()"
    (submitted)="handleRegister($event)"
  />

  <!-- Sign-in link -->
  <p class="text-center text-sm text-surface-500 dark:text-surface-400">
    <span i18n="@@auth.register.haveAccount">Already have an account?</span>
    <a
      routerLink="/auth/login"
      class="ml-1 font-medium text-primary hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
      i18n="@@auth.register.signInLink"
    >
      Sign in
    </a>
  </p>
</div>
