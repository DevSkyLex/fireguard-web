<label
  [for]="inputId()"
  class="group relative flex h-full cursor-pointer items-start gap-3 overflow-hidden rounded-lg border border-surface-200 p-4 transition-colors select-none has-[:checked]:border-primary has-[:checked]:bg-primary-50/20 has-[:disabled]:cursor-not-allowed has-[:disabled]:opacity-50 has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-primary dark:border-surface-800 dark:bg-surface-900 dark:has-[:checked]:border-primary-700 dark:has-[:checked]:bg-primary-950/10"
>
  <input
    type="radio"
    class="peer sr-only"
    [id]="inputId()"
    [name]="name()"
    [value]="value()"
    [checked]="selectedValue() === value()"
    [disabled]="disabled()"
    (change)="selected.emit(value())"
  />

  @if (icon(); as icon) {
    <i
      [class]="
        icon +
        ' pointer-events-none absolute top-1/2 -right-8 -translate-y-1/2 text-9xl text-surface-100/75 group-has-[:checked]:text-primary-100/75 dark:text-surface-900 dark:group-has-[:checked]:text-primary-950'
      "
      aria-hidden="true"
    ></i>
  }

  <div class="relative z-10 flex w-full flex-row items-start justify-between gap-3">
    <div class="flex min-w-0 flex-col gap-1 pt-0.5">
      @if (icon(); as icon) {
        <i
          [class]="icon + ' mb-1 text-xl text-primary dark:text-primary-300'"
          aria-hidden="true"
        ></i>
      }

      <span class="text-base leading-tight font-medium text-surface-900 dark:text-surface-100">
        {{ label() }}
      </span>

      @if (description(); as description) {
        <span class="text-sm leading-normal text-surface-500 dark:text-surface-400">
          {{ description }}
        </span>
      }
    </div>

    <span
      aria-hidden="true"
      class="mt-0.5 grid size-5 shrink-0 place-items-center rounded-full border-2 border-surface-300 transition-colors group-has-[:checked]:border-primary dark:border-surface-600 dark:group-has-[:checked]:border-primary-400"
    >
      <span
        class="size-2.5 scale-0 rounded-full bg-primary opacity-0 transition group-has-[:checked]:scale-100 group-has-[:checked]:opacity-100 motion-reduce:transition-none dark:bg-primary-400"
      ></span>
    </span>
  </div>
</label>
