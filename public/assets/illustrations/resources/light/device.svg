<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" fill="none" role="img" aria-labelledby="fg-device-light-title fg-device-light-description" class="fg-device-light">
  <title id="fg-device-light-title">Device</title>
  <desc id="fg-device-light-description">A trusted phone, its lit screen showing a checked shield.</desc>
