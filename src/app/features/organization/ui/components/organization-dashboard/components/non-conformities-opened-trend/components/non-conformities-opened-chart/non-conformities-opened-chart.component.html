<div class="h-72">
  @if (loading()) {
    <p-skeleton height="100%" class="w-full" />
  } @else if (hasError()) {
    <div class="flex h-full items-center justify-center">
      <app-error-state
        [dense]="true"
        icon="pi-exclamation-triangle"
        i18n-title="@@org.trend.ncOpened.chartErrorTitle"
        title="Couldn't load this chart"
      >
        <p-button
          i18n-label="@@org.trend.ncOpened.chartRetry"
          label="Retry"
          icon="pi pi-refresh"
          severity="secondary"
          [text]="true"
          size="small"
          (onClick)="retry()"
        />
      </app-error-state>
    </div>
  } @else if (!hasData()) {
    <div class="flex h-full items-center justify-center">
      <app-empty-state
        icon="pi-chart-bar"
        i18n-title="@@org.trend.ncOpened.chartEmptyTitle"
        title="No data yet"
        i18n-description="@@org.trend.ncOpened.chartEmptyDesc"
        description="No activity in the selected period."
      />
    </div>
  } @else {
    <p-chart
      type="line"
      [data]="data()"
      [options]="options()"
      class="block h-full"
      [style]="{ height: '100%' }"
      fluid
    />
  }
</div>
