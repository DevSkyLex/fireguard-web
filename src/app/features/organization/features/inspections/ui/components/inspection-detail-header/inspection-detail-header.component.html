<div
  class="rounded-md border border-surface-200 bg-surface-0 p-4 dark:border-surface-800 dark:bg-surface-900"
>
  <app-page-header [title]="headerTitle()">
    <p-avatar avatar aria-hidden="true" icon="pi pi-clipboard" shape="square" size="xlarge" />

    <p-tag
      titleAccessory
      [severity]="statusDescriptor(inspection().status).severity"
      [icon]="statusDescriptor(inspection().status).icon"
      [value]="statusDescriptor(inspection().status).label"
    />
    <p-tag
      titleAccessory
      [severity]="resultDescriptor(inspection().result).severity"
      [icon]="resultDescriptor(inspection().result).icon"
      [value]="resultDescriptor(inspection().result).label"
    />

    <div
      meta
      class="flex flex-wrap items-center gap-3 text-sm text-surface-500 dark:text-surface-400"
    >
      <span class="inline-flex items-center gap-1.5">
        <i class="pi pi-user text-xs" aria-hidden="true"></i>
        {{ inspection().inspector?.displayName || unknownInspectorLabel }}
      </span>
      <span>{{ inspection().performedAt | date: 'medium' }}</span>
    </div>

    @if (canManage()) {
      <div actions class="flex flex-wrap items-center gap-2">
        @if (inspection().status === 'draft') {
          <p-button
            i18n-label="@@inspection.header.submit"
            label="Submit"
            icon="pi pi-send"
            size="small"
            [loading]="loading()"
            (onClick)="submitInspection.emit()"
          />
          <p-button
            i18n-label="@@common.cancel"
            label="Cancel"
            icon="pi pi-times"
            severity="danger"
            [outlined]="true"
            size="small"
            [loading]="loading()"
            (onClick)="cancelInspection.emit()"
          />
        }
        @if (inspection().status === 'submitted') {
          <p-button
            i18n-label="@@inspection.header.close"
            label="Close inspection"
            icon="pi pi-lock"
            size="small"
            [loading]="loading()"
            (onClick)="closeInspection.emit()"
          />
        }
      </div>
    }
  </app-page-header>
</div>
