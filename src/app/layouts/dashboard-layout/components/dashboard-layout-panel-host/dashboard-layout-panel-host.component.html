<!--
  Ported from the kit's `.ws-info`: a 330px column with a hairline border on the
  left, its own scroller, and a 56px header row matching the shell header.
-->
@for (panel of visiblePanels(); track panel.id) {
  <aside
    class="flex h-full shrink-0 flex-col border-l border-surface-200 bg-surface-0 dark:border-surface-800 dark:bg-surface-950"
    [style.width.px]="panelWidth"
    [attr.aria-label]="panel.title()"
  >
    <header
      class="flex h-14 shrink-0 items-center justify-between gap-2 border-b border-surface-200 px-4 dark:border-surface-800"
    >
      <!--
        Inside the drawer the panel covers the page, so dismissing it is going
        *back*, and the control leads the header the way a back affordance
        does. Inline it sits beside the page and is closed, so the cross stays
        on the right. Same action, and the difference is not decoration: a
        cross over a covering surface reads as "discard".
      -->
      @if (overlay()) {
        <p-button
          type="button"
          icon="pi pi-chevron-left"
          severity="secondary"
          size="small"
          [text]="true"
          [rounded]="true"
          i18n-ariaLabel="@@layout.panel.backAria"
          ariaLabel="Back"
          data-testid="panel-back"
          (onClick)="panelService.close(panel.id)"
        />
      }

      <h2
        class="truncate text-sm font-semibold text-surface-900 dark:text-surface-100"
        [class.flex-1]="overlay()"
      >
        {{ panel.title() }}
      </h2>

      @if (!overlay()) {
        <p-button
          type="button"
          icon="pi pi-times"
          severity="secondary"
          size="small"
          [text]="true"
          [rounded]="true"
          i18n-ariaLabel="@@layout.panel.closeAria"
          ariaLabel="Close panel"
          data-testid="panel-close"
          (onClick)="panelService.close(panel.id)"
        />
      }
    </header>

    <div class="min-h-0 flex-1 overflow-y-auto overscroll-contain">
      <ng-container *ngComponentOutlet="panel.component" />
    </div>
  </aside>
}
