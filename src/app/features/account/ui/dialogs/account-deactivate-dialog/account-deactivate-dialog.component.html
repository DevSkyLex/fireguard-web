<hlm-alert-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-alert-dialog-content *hlmAlertDialogPortal data-testid="account-deactivate-dialog">
    <hlm-alert-dialog-header>
      <h2 hlmAlertDialogTitle i18n="@@account.deactivate.confirmTitle">Deactivate your account?</h2>
      <p hlmAlertDialogDescription i18n="@@account.deactivate.confirmText">
        You will be signed out everywhere, and only an administrator can reactivate your account —
        signing in again will not.
      </p>
    </hlm-alert-dialog-header>

    @if (error(); as message) {
      <p role="alert" class="text-sm text-destructive" data-testid="account-deactivate-error">
        {{ message }}
      </p>
    }

    <hlm-alert-dialog-footer>
      <button hlmAlertDialogCancel class="max-sm:min-h-11" i18n="@@common.cancel">Cancel</button>
      <button
        hlmAlertDialogAction
        variant="destructive"
        class="max-sm:min-h-11"
        data-testid="account-deactivate-confirm"
        aria-live="polite"
        [attr.aria-busy]="pending() ? 'true' : null"
        [attr.aria-disabled]="pending() ? 'true' : null"
        (click)="confirm()"
      >
        @if (pending()) {
          <span i18n="@@account.deactivate.deactivating">Deactivating…</span>
        } @else {
          <span i18n="@@account.deactivate.confirmAction">Deactivate account</span>
        }
      </button>
    </hlm-alert-dialog-footer>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
