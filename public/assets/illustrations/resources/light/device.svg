    <linearGradient id="fg-device-light-cy" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f6f6f7"/><stop offset="1" stop-color="#efeff1"/></linearGradient>
    <linearGradient id="fg-device-light-screen" gradientUnits="userSpaceOnUse" x1="248.6" y1="61.1" x2="151.4" y2="244.2"><stop offset="0" stop-color="#18181b" stop-opacity="0.12"/><stop offset="1" stop-color="#18181b" stop-opacity="0.05"/></linearGradient>
    
  </defs>
  <style>
