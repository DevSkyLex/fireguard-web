<form novalidate (submit)="submit($event)" class="flex min-h-0 flex-1 flex-col">
  <hlm-field-group class="min-h-0 flex-1 overflow-y-auto px-4">
    <hlm-field>
      <label hlmFieldLabel for="channel-create-name"
        ><span i18n="@@channels.newDialog.name">Name</span><app-required-marker
      /></label>
      <input
        hlmInput
        id="channel-create-name"
        type="text"
        data-testid="channel-create-name"
        placeholder="general"
        i18n-placeholder="@@channels.newDialog.namePlaceholder"
        [formField]="createForm.name"
        [attr.aria-required]="true"
        [attr.aria-invalid]="createForm.name().touched() && createForm.name().invalid()"
      />
      @if (createForm.name().touched() && createForm.name().invalid()) {
        <hlm-field-error>{{ createForm.name().errors()[0].message }}</hlm-field-error>
      }
    </hlm-field>

    @if (parentOptions().length > 0) {
      <hlm-field>
        <label hlmFieldLabel for="new-channel-parent" i18n="@@channels.newDialog.parent"
          >Parent channel</label
        >
        <hlm-select [itemToString]="parentLabelOf" [formField]="createForm.parentChannelId">
          <hlm-select-trigger
            buttonId="new-channel-parent"
            class="w-full"
            data-testid="new-channel-parent"
          >
            <hlm-select-value
              placeholder="No parent — top level"
              i18n-placeholder="@@channels.newDialog.parentPlaceholder"
            />
          </hlm-select-trigger>
          <hlm-select-content *hlmSelectPortal>
            <hlm-select-group>
              <hlm-select-item value="" i18n="@@channels.newDialog.parentNone"
                >No parent — top level</hlm-select-item
              >
              @for (option of parentOptions(); track option.value) {
                <hlm-select-item [value]="option.value">{{ option.label }}</hlm-select-item>
              }
            </hlm-select-group>
          </hlm-select-content>
        </hlm-select>
        <hlm-field-description i18n="@@channels.newDialog.parentHint"
          >Only a top-level channel can be a parent.</hlm-field-description
        >
      </hlm-field>
    }
  </hlm-field-group>

  <hlm-sheet-footer class="flex-col sm:flex-row sm:justify-end">
    <button
      hlmBtn
      type="button"
      variant="outline"
      class="max-sm:min-h-11"
      data-testid="new-channel-cancel"
      (click)="cancelled.emit()"
    >
      <span i18n="@@common.cancel">Cancel</span>
    </button>
    <button
      hlmBtn
      type="submit"
      class="max-sm:min-h-11"
      data-testid="channel-create-submit"
      [disabled]="pending()"
      [attr.aria-busy]="pending() ? 'true' : null"
    >
      <span i18n="@@channels.newDialog.submit">Create channel</span>
    </button>
  </hlm-sheet-footer>
</form>
