<form
  class="flex min-w-0 flex-col gap-6 mobile-ui:[&_input]:text-base"
  novalidate
  (submit)="submit($event)"
>
  <div class="min-w-0">
    <hlm-field-group>
      <hlm-field>
        <label hlmFieldLabel for="onboarding-org-name"
          ><span i18n="@@onboarding.orgForm.name"> Organization name</span><app-required-marker
        /></label>
        <input
          class="max-sm:min-h-11 mobile-ui:min-h-11"
          hlmInput
          id="onboarding-org-name"
          type="text"
          data-testid="onboarding-org-name"
          placeholder="Acme Fire Safety"
          i18n-placeholder="@@onboarding.orgForm.namePlaceholder"
          [formField]="organizationForm.name"
          [attr.aria-required]="true"
        />
        <hlm-field-error>{{ organizationForm.name().errors()[0]?.message }}</hlm-field-error>
      </hlm-field>
      <fieldset hlmFieldSet>
        <legend
          hlmFieldLegend
          id="onboarding-org-profile-label"
          i18n="@@onboarding.orgForm.profile"
        >
          Organization profile
        </legend>
        <hlm-toggle-group
          type="single"
          variant="outline"
          [nullable]="false"
          [value]="organizationForm.operatingProfile().value()"
          [disabled]="pending()"
          aria-labelledby="onboarding-org-profile-label"
          (valueChange)="changeOperatingProfile($event)"
        >
          <button
            hlmToggleGroupItem
            type="button"
            value="operator"
            data-testid="onboarding-org-profile-operator"
            i18n="@@onboarding.orgForm.operator"
          >
            Site operator
          </button>
          <button
            hlmToggleGroupItem
            type="button"
            value="service_provider"
            data-testid="onboarding-org-profile-provider"
            i18n="@@onboarding.orgForm.provider"
          >
            Service provider
          </button>
        </hlm-toggle-group>
        <hlm-field-description i18n="@@onboarding.orgForm.profileHint"
          >Choose how you manage your fire-safety equipment. Access remains determined by your
          organization's permissions.</hlm-field-description
        >
      </fieldset>
    </hlm-field-group>
  </div>

  <app-onboarding-step-footer
    [label]="submitLabel"
    [pendingLabel]="pendingLabel"
    [pending]="pending()"
    [skippable]="skippable()"
    submitTestId="onboarding-org-submit"
    (skipped)="skipped.emit()"
  />
</form>
