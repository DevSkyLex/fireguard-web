<div
  id="dashboard-layout"
  class="flex h-dvh overflow-hidden bg-surface-0 transition-colors dark:bg-surface-950"
>
  <!-- Single tinted sidebar (chrome layer): brand + widgets + navigation + footer -->
  <aside
    class="hidden shrink-0 overflow-hidden transition-[width] duration-200 ease-in-out lg:flex"
    [style.width.px]="primaryIconOnly() ? 64 : 264"
  >
    <app-dashboard-layout-sidebar
      class="w-full"
      variant="primary"
      [iconOnly]="primaryIconOnly()"
      [collapsible]="isDesktopSidebar()"
    />
  </aside>

  <!-- Right column: header on top, then the single content scroller -->
  <div class="flex min-w-0 flex-1 flex-col overflow-hidden">
    <app-dashboard-layout-header />

    <!-- Mobile drawer: same sidebar rendered as an overlay below lg -->
    <p-drawer
      [visible]="sidebarService.visible()"
      (visibleChange)="sidebarService.setVisible($event)"
      [blockScroll]="true"
      i18n-ariaCloseLabel="@@layout.sidebar.closeAria"
      ariaCloseLabel="Close navigation menu"
    >
      <ng-template #headless>
        <app-dashboard-layout-sidebar />
      </ng-template>
    </p-drawer>

    <!-- Content plane: single scroller, pages render inside a centered max-width column -->
    <div class="min-h-0 flex-1 overflow-y-auto">
      <app-dashboard-layout-content>
        <router-outlet />
      </app-dashboard-layout-content>
    </div>
  </div>
</div>
