<div hlmSidebarWrapper id="dashboard-layout" class="relative h-svh overflow-hidden">
  <a
    class="sr-only rounded-md bg-background text-sm font-semibold text-foreground shadow-lg outline-2 outline-ring focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:px-3 focus:py-2"
    href="#dashboard-content"
    i18n="@@dashboard.skipToContent"
    data-testid="dashboard-skip-link"
    (click)="skipToContent($event)"
  >
    Skip to content
  </a>

  <hlm-sidebar variant="inset" collapsible="icon">
    @if (sidebarHeader.length > 0) {
      <hlm-sidebar-header>
        <app-slot-outlet [contributions]="sidebarHeader" />
      </hlm-sidebar-header>
    }

    <hlm-sidebar-content>
      <app-slot-outlet [contributions]="sidebarNav" />
    </hlm-sidebar-content>

    @if (sidebarFooter.length > 0) {
      <hlm-sidebar-footer>
        <app-slot-outlet [contributions]="sidebarFooter" />
      </hlm-sidebar-footer>
    }
  </hlm-sidebar>

  <main hlmSidebarInset id="dashboard-main" class="min-w-0 outline-none">
    <header class="flex h-12 shrink-0 items-center gap-2 px-4">
      <button hlmSidebarTrigger [srOnlyText]="toggleSidebarLabel"></button>

      <div class="mr-2 flex h-4 items-center">
        <hlm-separator orientation="vertical" />
      </div>

      <div
        class="flex min-w-0 flex-1 items-center gap-2 overflow-hidden [&>app-slot-outlet>*]:min-w-0"
      >
        <app-slot-outlet [contributions]="header" />
      </div>

      <div class="flex min-w-0 shrink-0 items-center gap-1">
        <app-slot-outlet [contributions]="headerActions" />
      </div>
    </header>

    <app-dashboard-page-header />

    <div
      #content
      id="dashboard-content"
      tabindex="-1"
      class="flex min-h-0 flex-1 flex-col overflow-y-auto rounded-b-xl outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
    >
      <div class="flex min-h-0 flex-1 flex-col px-0">
        <router-outlet />
      </div>
    </div>
  </main>

  @if (panel(); as contribution) {
    <aside
      id="dashboard-panel"
      class="fixed inset-y-2 right-2 z-30 flex w-[22rem] max-w-[calc(100vw-1rem)] shrink-0 flex-col overflow-hidden rounded-xl bg-background shadow-lg lg:static lg:inset-auto lg:z-auto lg:my-2 lg:me-2 lg:max-w-none lg:shadow-none lg:ring-1 lg:ring-foreground/10"
      i18n-aria-label="@@dashboard.panel.aria"
      aria-label="Contextual panel"
    >
      <ng-container *ngComponentOutlet="contribution.component" />
    </aside>
  }
</div>
