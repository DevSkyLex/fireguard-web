<hlm-alert-dialog
  [state]="dialogState()"
  [disableClose]="busy()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-alert-dialog-content
    class="max-h-[calc(100svh-2rem)] overflow-y-auto overscroll-contain"
    *hlmAlertDialogPortal
    data-testid="interventions-delete-dialog"
  >
    <hlm-alert-dialog-header>
      <h2 hlmAlertDialogTitle>{{ title() }}</h2>
      <p hlmAlertDialogDescription>{{ description() }}</p>
    </hlm-alert-dialog-header>

    @if (errorMessage(); as message) {
      <p role="alert" class="text-sm text-destructive" data-testid="interventions-delete-error">
        {{ message }}
      </p>
    }

    <hlm-alert-dialog-footer>
      <button
        hlmAlertDialogCancel
        class="max-sm:min-h-11"
        [disabled]="busy()"
        i18n="@@common.cancel"
      >
        Cancel
      </button>
      <button
        hlmAlertDialogAction
        variant="destructive"
        class="max-sm:min-h-11"
        data-testid="interventions-delete-confirm"
        [disabled]="busy()"
        (click)="confirmed.emit()"
        i18n="@@intervention.list.deleteConfirmAction"
      >
        Delete
      </button>
    </hlm-alert-dialog-footer>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
