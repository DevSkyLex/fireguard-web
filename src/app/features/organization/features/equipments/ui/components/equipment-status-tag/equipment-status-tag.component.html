@if (asOption()) {
  <span class="inline-flex items-center gap-2 leading-none">
    <ng-icon [name]="descriptor().icon" [class]="iconClass()" class="shrink-0" aria-hidden="true" />
    <span class="whitespace-nowrap">{{ descriptor().label }}</span>
  </span>
} @else {
  <span hlmBadge variant="outline" class="px-1.5 leading-none text-muted-foreground">
    <ng-icon [name]="descriptor().icon" [class]="iconClass()" class="shrink-0" aria-hidden="true" />
    {{ descriptor().label }}
  </span>
}
