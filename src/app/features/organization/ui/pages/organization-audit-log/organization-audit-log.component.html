<div id="organization-audit-log" class="flex h-full min-h-0 flex-col">
  <section class="px-4 pt-8 pb-4 sm:px-6 lg:px-8 xl:px-10">
    <h1
      i18n="@@audit.page.title"
      class="text-2xl font-semibold tracking-[-0.025em] text-surface-950 dark:text-surface-50"
    >
      Audit log
    </h1>
    <p
      i18n="@@audit.page.subtitle"
      class="mt-1.5 text-sm leading-6 text-surface-600 dark:text-surface-400"
    >
      Platform-wide security and compliance ledger. Not limited to the current organization.
    </p>
  </section>

  <section
    class="flex min-h-0 flex-1 flex-col gap-4 overflow-y-auto p-4 sm:px-6 sm:pb-6 lg:px-8 lg:pb-8 xl:px-10 xl:pb-10"
  >
    @if (store.listError(); as error) {
      <p-message severity="error">
        <div class="flex flex-wrap items-center gap-3">
          <span>{{ error.message ?? loadErrorFallback }}</span>
          <p-button
            i18n-label="@@audit.page.retry"
            label="Retry"
            icon="pi pi-refresh"
            severity="secondary"
            [text]="true"
            (onClick)="retry()"
          />
        </div>
      </p-message>
    }

    <app-audit-event-table
      class="flex min-h-0 flex-1 flex-col"
      [auditEvents]="store.auditEvents()"
      [total]="store.totalAuditEvents()"
      [loading]="store.isLoading()"
      [empty]="store.isEmpty()"
      [initialPage]="page()"
      (load)="onLoad($event)"
      (pageChange)="onPageChange($event)"
      (viewDetails)="onViewDetails($event)"
    />
  </section>

  <app-audit-event-detail-drawer
    [visible]="selectedEvent() !== null"
    [auditEvent]="selectedEvent()"
    (visibleChange)="onDrawerVisibleChange($event)"
  />
</div>
