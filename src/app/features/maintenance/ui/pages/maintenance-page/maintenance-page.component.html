<div id="maintenance-page" class="flex w-full max-w-md flex-col items-center gap-8 text-center">
  <div class="flex flex-col gap-2">
    <app-page-heading
      heading="Fireguard is under maintenance"
      i18n-heading="@@maintenance.title"
      description="The workspace is temporarily unavailable while we finish some work. Your data is safe — try again in a few minutes."
      i18n-description="@@maintenance.description"
    />
  </div>

  <div
    class="flex w-full flex-col items-stretch justify-center gap-3 sm:w-auto sm:flex-row sm:items-center"
  >
    <button
      hlmBtn
      size="lg"
      class="h-11 min-h-11 gap-2"
      data-testid="maintenance-retry"
      (click)="retry()"
    >
      <ng-icon name="lucideRotateCcw" class="text-sm" aria-hidden="true" />
      <span i18n="@@maintenance.retry">Try again</span>
    </button>
  </div>
</div>
