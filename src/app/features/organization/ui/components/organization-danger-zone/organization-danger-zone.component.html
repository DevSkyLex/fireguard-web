<div
  class="flex flex-col gap-4 rounded-lg border border-red-200 bg-red-50/60 p-4 sm:flex-row sm:items-center sm:justify-between dark:border-red-900 dark:bg-red-950/40"
>
  <div class="flex flex-col gap-0.5">
    <span
      i18n="@@org.danger.title"
      class="text-sm font-medium text-surface-800 dark:text-surface-100"
    >
      Delete this organization
    </span>
    <span i18n="@@org.danger.desc" class="text-sm text-surface-500 dark:text-surface-400">
      Permanently delete
      <span class="font-medium text-surface-700 dark:text-surface-200">{{
        organization()?.name ?? thisOrganizationLabel
      }}</span>
      and all of its data. This cannot be undone.
    </span>
  </div>

  <p-button
    i18n-label="@@org.danger.deleteButton"
    label="Delete organization"
    icon="pi pi-trash"
    severity="danger"
    styleClass="shrink-0 whitespace-nowrap"
    [disabled]="!organization() || deleting()"
    (onClick)="delete.emit()"
  />
</div>
