<hlm-dialog [state]="dialogState()" [disableClose]="busy()" (stateChanged)="onStateChanged($event)">
  <hlm-dialog-content
    *hlmDialogPortal
    class="max-h-[calc(100svh-2rem)] overflow-y-auto overscroll-contain sm:max-w-md"
    data-testid="facility-move-dialog"
  >
    <hlm-dialog-header>
      <h3 hlmDialogTitle i18n="@@facility.moveDialog.header">Move facility</h3>
      <p hlmDialogDescription>{{ description() }}</p>
    </hlm-dialog-header>
    @if (errorMessage(); as error) {
      <div hlmAlert variant="destructive" role="alert">
        <p hlmAlertDescription>{{ error }}</p>
      </div>
    }
    <div hlmField>
      <label hlmFieldLabel for="facility-move-parent" i18n="@@facility.moveDialog.parentLabel"
        >New parent</label
      >
      <app-facility-option-picker
        inputId="facility-move-parent"
        [formField]="moveForm.parentFacilityId"
        [options]="options()"
        [hydratedOption]="hydratedOption()"
        [allowEmpty]="allowEmpty()"
        [emptyLabel]="rootOptionLabel"
        [callState]="optionsCallState()"
        [page]="page()"
        [pageCount]="pageCount()"
        (searchChanged)="searchChanged.emit($event)"
        (pageChanged)="pageChanged.emit($event)"
      />
      @if (moveForm.parentFacilityId().touched()) {
        @for (error of moveForm.parentFacilityId().errors(); track error.kind) {
          <hlm-field-error>{{ error.message }}</hlm-field-error>
        }
      }
    </div>
    <hlm-dialog-footer>
      <button
        hlmDialogClose
        hlmBtn
        type="button"
        variant="outline"
        [disabled]="busy()"
        i18n="@@common.cancel"
      >
        Cancel
      </button>
      <button
        hlmBtn
        type="button"
        data-testid="facility-move-submit"
        [disabled]="busy() || optionsCallState().status === 'pending'"
        [attr.aria-busy]="busy() ? 'true' : null"
        (click)="submit()"
      >
        @if (busy()) {
          <span i18n="@@facility.moveDialog.submitting">Moving…</span>
        } @else {
          <span i18n="@@facility.moveDialog.submit">Move</span>
        }
      </button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
