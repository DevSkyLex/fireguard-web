<hlm-dialog [state]="dialogState()" [disableClose]="busy()" (stateChanged)="onStateChanged($event)">
  <hlm-dialog-content
    class="max-h-[calc(100svh-2rem)] overflow-y-auto overscroll-contain sm:max-w-md"
    data-testid="intervention-assign-dialog"
    *hlmDialogPortal
  >
    <hlm-dialog-header>
      <h3 hlmDialogTitle i18n="@@intervention.assign.header">Assign a responsible</h3>
      <p hlmDialogDescription>{{ description() }}</p>
    </hlm-dialog-header>

    <hlm-field>
      <label hlmFieldLabel for="intervention-assign-member" i18n="@@intervention.cf.responsible"
        >Responsible</label
      >
      <hlm-combobox
        [value]="selectedMember()"
        [itemToString]="memberLabelOf"
        (valueChange)="selectedMember.set($any($event))"
      >
        <hlm-combobox-input
          inputId="intervention-assign-member"
          placeholder="Search a member"
          i18n-placeholder="@@intervention.cf.responsiblePlaceholder"
          data-testid="intervention-assign-member-input"
        />
        <hlm-combobox-content *hlmComboboxPortal>
          <hlm-combobox-empty i18n="@@intervention.list.filterNoMember"
            >No member matches.</hlm-combobox-empty
          >
          <div hlmComboboxList>
            @for (option of members(); track option.value) {
              <hlm-combobox-item
                [value]="option.value"
                [attr.data-testid]="'intervention-assign-option-' + option.value"
              >
                <div hlmItem size="xs" class="min-w-0 border-0 p-0">
                  <div hlmItemMedia>
                    <hlm-avatar class="size-8 shrink-0">
                      @if (option.avatarUrl; as pictureUrl) {
                        <img hlmAvatarImage [src]="pictureUrl" alt="" />
                      }
                      <span hlmAvatarFallback class="text-[10px]">{{ option.initials }}</span>
                    </hlm-avatar>
                  </div>
                  <div hlmItemContent class="min-w-0">
                    <div hlmItemTitle class="truncate">{{ option.displayName }}</div>
                    @if (option.roleLabel; as line) {
                      <div hlmItemDescription class="truncate text-xs">{{ line }}</div>
                    }
                  </div>
                </div>
              </hlm-combobox-item>
            }
          </div>
        </hlm-combobox-content>
      </hlm-combobox>
    </hlm-field>

    <hlm-dialog-footer>
      <button hlmDialogClose hlmBtn type="button" variant="outline">
        <span i18n="@@common.cancel">Cancel</span>
      </button>
      <button
        hlmBtn
        type="button"
        data-testid="intervention-assign-submit"
        [disabled]="!canSubmit()"
        [attr.aria-busy]="busy() ? 'true' : null"
        (click)="submit()"
      >
        @if (busy()) {
          <span i18n="@@intervention.assign.submitting">Assigning…</span>
        } @else {
          <span i18n="@@intervention.assign.submit">Assign</span>
        }
      </button>
      <span class="sr-only" aria-live="polite">
        @if (busy()) {
          <span i18n="@@intervention.assign.submittingStatus">Assigning, please wait…</span>
        }
      </span>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
