<hlm-alert-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-alert-dialog-content
    class="max-h-[calc(100svh-2rem)] overflow-y-auto overscroll-contain mobile-ui:max-h-[calc(100dvh-2rem-env(safe-area-inset-top)-env(safe-area-inset-bottom))] mobile-ui:overflow-y-auto mobile-ui:overscroll-contain"
    *hlmAlertDialogPortal
    data-testid="organization-cancel-subscription-dialog"
  >
    <hlm-alert-dialog-header>
      <h2 hlmAlertDialogTitle i18n="@@org.settings.subscription.cancelConfirmTitle">
        Cancel this subscription?
      </h2>
      <p hlmAlertDialogDescription>{{ confirmText() }}</p>
    </hlm-alert-dialog-header>

    @if (error(); as message) {
      <div
        hlmAlert
        variant="destructive"
        role="alert"
        data-testid="organization-cancel-subscription-error"
      >
        <ng-icon name="lucideCircleAlert" aria-hidden="true" />
        <p hlmAlertTitle i18n="@@org.settings.subscription.cancelErrorTitle">
          Couldn't cancel the subscription
        </p>
        <p hlmAlertDescription>{{ message }}</p>
      </div>
    }

    <hlm-alert-dialog-footer>
      <button
        hlmAlertDialogCancel
        class="mobile-ui:min-h-11"
        i18n="@@org.settings.subscription.cancelDismiss"
      >
        Keep subscription
      </button>
      <button
        hlmAlertDialogAction
        variant="destructive"
        class="mobile-ui:min-h-11"
        data-testid="organization-cancel-subscription-confirm"
        aria-live="polite"
        [attr.aria-busy]="pending() ? 'true' : null"
        [disabled]="pending()"
        (click)="confirm()"
      >
        @if (pending()) {
          <span i18n="@@org.settings.subscription.canceling">Canceling…</span>
        } @else {
          <span i18n="@@org.settings.subscription.cancelConfirmAction">Cancel subscription</span>
        }
      </button>
    </hlm-alert-dialog-footer>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
