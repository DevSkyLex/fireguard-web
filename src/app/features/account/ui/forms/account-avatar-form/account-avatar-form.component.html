<div class="flex flex-col items-start gap-1.5" data-testid="account-avatar-form">
  @if (hasError()) {
    <p-message severity="error" class="w-full" [closable]="false" i18n="@@account.avatar.error">
      We couldn't upload your picture. Please try again.
    </p-message>
  }

  <p-fileupload
    #avatarUpload
    mode="basic"
    [accept]="acceptedAvatarTypes"
    [auto]="true"
    [customUpload]="true"
    [maxFileSize]="maxAvatarSize"
    [disabled]="uploading()"
    chooseLabel="Change picture"
    i18n-chooseLabel="@@account.avatar.change"
    chooseIcon="pi pi-upload"
    [chooseButtonProps]="chooseButtonProps"
    (uploadHandler)="onAvatarUpload($event, avatarUpload)"
  />
  <p class="text-xs text-surface-500 dark:text-surface-400" i18n="@@account.avatar.hint">
    JPEG, PNG, WebP or GIF — 5 MB max.
  </p>
</div>
