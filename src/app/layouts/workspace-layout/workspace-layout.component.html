<div
  id="workspace-layout"
  class="relative flex h-dvh w-full overflow-hidden bg-surface-0 text-surface-900 dark:bg-surface-950 dark:text-surface-100"
>
  <!--
    The bypass block. Every route in this shell puts the rail and the entire
    channel sidebar ahead of the routed column in the tab order, so reaching a
    conversation from the keyboard meant tabbing past several dozen controls —
    on every single navigation.

    The `href` is kept for the link semantics but its default is prevented: the
    document declares `<base href="/">`, so a bare `#workspace-main` resolves
    against the base and hard-navigates to the app root — the skip link threw
    the member out of the workspace entirely. The handler moves focus instead,
    which is what `<main tabindex="-1">` is there for.
  -->
  <a
    class="sr-only rounded-md bg-surface-0 px-3 py-2 text-sm font-semibold text-surface-950 shadow-lg outline-2 outline-primary focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 dark:bg-surface-900 dark:text-surface-50"
    href="#workspace-main"
    i18n="@@workspace.skipToContent"
    data-testid="workspace-skip-link"
    (click)="skipToContent($event)"
  >
    Skip to content
  </a>
  <!-- Organization rail: desktop only (60px). -->
  <app-workspace-layout-rail
    class="hidden w-[60px] flex-none flex-col items-center gap-2 border-r border-surface-200 bg-surface-50 py-3 lg:flex dark:border-surface-800 dark:bg-surface-900"
  />

  <!--
    Channel sidebar (266px). On mobile it becomes the full-viewport `list` pane;
    on desktop it can be collapsed out of view.
  -->
  <aside
    class="flex min-h-0 flex-col border-surface-200 bg-surface-0 max-lg:absolute max-lg:inset-0 max-lg:z-30 lg:w-[266px] lg:flex-none lg:border-r dark:border-surface-800 dark:bg-surface-950"
    i18n-aria-label="@@workspace.sidebar.aria"
    aria-label="Workspace sidebar"
    [class.max-lg:hidden]="shell.mobilePane() !== 'list'"
    [class.lg:hidden]="shell.sidebarCollapsed()"
  >
    <app-workspace-layout-secondary-nav />
  </aside>

  <!--
    Main column. Owns no scroller of its own: the routed page decides what
    scrolls, so a thread can scroll under a pinned composer.
  -->
  <main
    #main
    id="workspace-main"
    tabindex="-1"
    class="flex min-w-0 flex-1 flex-col overflow-hidden outline-none max-lg:absolute max-lg:inset-0 max-lg:z-20"
    [class.max-lg:hidden]="shell.mobilePane() !== 'main'"
  >
    <app-workspace-layout-header />

    <!--
      Scrolls the routed page. A standard page expects a page-level scroller and
      would otherwise be clipped by the shell's `overflow-hidden`.

      This does not conflict with a conversation view: such a view fills the
      box exactly (`h-full`) and scrolls its own thread under a pinned composer,
      leaving this container with nothing to scroll.
    -->
    <div class="flex min-h-0 flex-1 flex-col overflow-y-auto">
      <router-outlet />
    </div>
  </main>

  <!--
    Contextual panel: mono-active, width owned by the winning contribution.

    The mobile pane is part of the condition because below `lg` the panel is an
    `absolute inset-0` overlay at `z-40`, above both the sidebar (`z-30`) and
    the main column (`z-20`). Gated on `panelVisible()` alone — which is seeded
    `true` from a cookie — a phone landing on the channel list would have it
    painted over by a panel describing a channel the member has not opened yet.
  -->
  @if (shell.panelVisible() && (shell.isDesktop() || shell.mobilePane() === 'main')) {
    <app-workspace-layout-panel-outlet />
  }
</div>
