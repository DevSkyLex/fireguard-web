<div class="relative flex h-full min-h-dvh flex-col overflow-hidden bg-surface-950 text-surface-0">
  <!-- Ambient indigo glow -->
  <div
    class="pointer-events-none absolute -top-28 -right-24 size-[30rem] rounded-full bg-primary-500/20 blur-[130px]"
  ></div>
  <div
    class="pointer-events-none absolute -bottom-32 -left-24 size-80 rounded-full bg-primary-700/20 blur-[120px]"
  ></div>

  <!-- Faint dot grid, fading out toward the lower half -->
  <div
    class="pointer-events-none absolute inset-0"
    aria-hidden="true"
    style="
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: linear-gradient(to bottom, black, transparent 62%);
      -webkit-mask-image: linear-gradient(to bottom, black, transparent 62%);
    "
  ></div>

  <div class="relative flex h-full flex-1 flex-col justify-between gap-12 p-12 2xl:p-16">
    <!-- Brand lockup -->
    <div class="flex items-center gap-2.5">
      <app-logo class="size-8 shrink-0 text-surface-0" />
      <span class="text-xl font-semibold tracking-tight text-surface-0">Fireguard</span>
    </div>

    <!--
      Hero. The headline used to sit under a tracked uppercase "Fire safety
      platform" label, which told the reader nothing the next line does not say
      better and louder — the classic kicker. The headline carries itself.
    -->
    <div class="flex max-w-xl flex-col gap-9">
      <p
        class="text-4xl leading-[1.2] font-semibold tracking-tight text-balance text-surface-0 2xl:text-[3.25rem]"
        i18n="@@auth.showcase.headline"
      >
        Fire-safety compliance across every site, run from one place.
      </p>

      <ul class="flex flex-col gap-3.5">
        @for (feature of features; track feature.label) {
          <li class="flex items-center gap-3.5">
            <span class="flex shrink-0 items-center justify-center text-primary-500">
              <i [class]="feature.icon" class="text-base" aria-hidden="true"></i>
            </span>
            <span class="text-sm text-surface-300 2xl:text-base">{{ feature.label }}</span>
          </li>
        }
      </ul>
    </div>

    <!-- Footer -->
    <p class="text-sm text-surface-400" i18n="@@auth.showcase.copyright">
      © 2026 Fireguard — Safety &amp; compliance
    </p>
  </div>
</div>
