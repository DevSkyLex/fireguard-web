<div class="mx-auto flex max-w-lg flex-col items-center px-5 py-14 text-center sm:py-16">
  <span
    class="mb-4 flex size-13 items-center justify-center rounded-xl bg-surface-100 text-surface-500 dark:bg-surface-800 dark:text-surface-300"
  >
    <i class="pi text-xl" [class]="icon()" aria-hidden="true"></i>
  </span>
  <h3 class="text-lg font-semibold tracking-[-0.015em] text-surface-950 dark:text-surface-50">
    {{ title() }}
  </h3>
  @if (description(); as description) {
    <p class="mt-1.5 max-w-prose text-sm leading-6 text-surface-600 dark:text-surface-400">
      {{ description }}
    </p>
  }
  <div class="mt-5 flex flex-wrap items-center justify-center gap-2">
    <ng-content />
  </div>
</div>
