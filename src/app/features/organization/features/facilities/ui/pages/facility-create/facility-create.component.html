<div id="facility-create" class="flex flex-col p-3 sm:p-6 lg:p-8 xl:p-10">
  <section class="mx-auto w-full max-w-3xl">
    <header class="mb-6">
      <h1
        i18n="@@facility.create.title"
        class="text-2xl font-semibold tracking-[-0.025em] text-surface-950 dark:text-surface-50"
      >
        New Facility
      </h1>
      <p
        i18n="@@facility.create.description"
        class="mt-1.5 text-sm leading-6 text-surface-600 dark:text-surface-400"
      >
        Add a location and place it in your organization's facility hierarchy.
      </p>
    </header>

    <div
      class="rounded-xl border border-surface-200 bg-surface-0 p-5 sm:p-8 dark:border-surface-800 dark:bg-surface-900"
    >
      <app-facility-form
        [loading]="store.isCreating()"
        [serverError]="store.createError()"
        [parentFacilities]="store.facilities()"
        (submitted)="handleSubmit($event)"
        (cancelled)="handleCancel()"
      />
    </div>
  </section>

  <app-organization-quota-upgrade-dialog
    [(visible)]="quotaDialogVisible"
    [resource]="quotaResource"
  />
</div>
