    .fg-member-dark .guide { stroke: #6b6b75; stroke-width: .8; stroke-dasharray: 2 4; opacity: .55; }
    .fg-member-dark .accent { stroke: #ff7043; }
    .fg-member-dark .accent { stroke-width: 1.1; }
    .fg-member-dark .accent-fill { fill: #ff7043; }
    .fg-member-dark .tf { fill: url(#fg-member-dark-plane); }
    .fg-member-dark .lf { fill: #141417; }
    .fg-member-dark .rf { fill: #0d0d0f; }
    .fg-member-dark .accent { stroke-opacity: 1; }
  </style>
