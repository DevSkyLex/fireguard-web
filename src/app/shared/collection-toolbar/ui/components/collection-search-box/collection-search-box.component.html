<hlm-input-group class="w-full sm:w-72">
  <hlm-input-group-addon>
    <ng-icon name="lucideSearch" />
  </hlm-input-group-addon>
  <input
    hlmInputGroupInput
    type="search"
    [attr.data-testid]="testId()"
    [placeholder]="placeholder()"
    [attr.aria-label]="ariaLabel()"
    [value]="value()"
    (input)="onInput($event)"
  />
</hlm-input-group>
