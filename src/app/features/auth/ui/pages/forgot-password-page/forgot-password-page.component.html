<div id="forgot-password-page" class="mx-auto flex w-full max-w-xl flex-col gap-8 px-6 sm:px-8">
  <section class="flex flex-col gap-2">
    <h1
      class="text-2xl font-semibold tracking-tight text-surface-950 sm:text-[1.75rem] dark:text-surface-0"
      i18n="@@auth.forgotPassword.title"
    >
      Forgot Your Password?
    </h1>
    <p class="text-sm text-surface-500 dark:text-surface-400" i18n="@@auth.forgotPassword.subtitle">
      Enter your email address below, and we'll send you instructions to reset your password.
    </p>
  </section>

  <!-- Forgot password form -->
  <app-forgot-password-form
    [loading]="passwordResetStore.isRequesting()"
    [serverError]="passwordResetStore.requestError()"
    (submitted)="handleSubmit($event)"
  />

  <!-- Back to login link -->
  <p
    class="text-center text-sm text-surface-500 dark:text-surface-400"
    i18n="@@auth.forgotPassword.backToLoginPrompt"
  >
    Remember your password?
    <a
      routerLink="/auth/login"
      class="ml-1 font-medium text-primary hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
    >
      Back to login
    </a>
  </p>
</div>
