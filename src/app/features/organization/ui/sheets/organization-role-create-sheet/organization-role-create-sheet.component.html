<hlm-sheet
  [side]="side()"
  [state]="sheetState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-sheet-content
    *hlmSheetPortal
    class="w-full! overflow-y-auto overscroll-contain mobile-ui:max-h-[85dvh] mobile-ui:overflow-y-auto mobile-ui:pb-[env(safe-area-inset-bottom)] desktop-ui:w-[min(540px,100vw)]! desktop-ui:max-w-none!"
    data-testid="organization-role-create-sheet"
    [attr.data-dirty]="dirty()"
  >
    <hlm-sheet-header>
      <h3 hlmSheetTitle i18n="@@org.team.createDialog.title">New role</h3>
      <p hlmSheetDescription i18n="@@org.team.createDialog.description">
        Define a custom role and the permissions it grants.
      </p>
    </hlm-sheet-header>

    <app-organization-role-create-form
      [pending]="pending()"
      [serverError]="serverError()"
      [catalog]="catalog()"
      (submitted)="submitted.emit($event)"
      (cancelled)="requestClose()"
      (dirtyChanged)="dirty.set($event)"
    />
  </hlm-sheet-content>
</hlm-sheet>

<app-unsaved-changes-dialog
  [state]="unsavedChangesDialogState()"
  (confirmed)="onUnsavedChangesConfirmed()"
  (dismissed)="onUnsavedChangesDismissed()"
/>
