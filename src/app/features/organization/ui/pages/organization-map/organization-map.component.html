<!--
  Full-bleed: a map reads as a surface you look *into*, and an inset one
  wastes the scarcest thing on this screen — plotted area. The facilities
  browser lives in the shell's right-hand panel now (`MapFacilitiesPanel`),
  not here, so this page is the canvas and its legend overlay only.
-->
<div id="organization-map" class="relative min-h-[24rem] w-full flex-1 overflow-hidden">
  <app-map
    class="h-full w-full"
    [markers]="store.markers()"
    i18n-ariaLabel="@@map.facilitiesAria"
    ariaLabel="Facilities map"
    (markerSelect)="selectMarker($event)"
    (markerDragEnd)="onMarkerDragEnd($event)"
  />
  <app-map-legend class="absolute bottom-3 left-3 z-10" />
</div>
