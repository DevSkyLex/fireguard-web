<div
  class="mx-auto flex max-w-lg flex-col items-center px-5 text-center"
  [class]="dense() ? 'py-7' : 'py-14 sm:py-16'"
  role="alert"
>
  <span
    class="flex items-center justify-center rounded-xl bg-red-50 text-red-600 dark:bg-red-950/60 dark:text-red-300"
    [class]="dense() ? 'mb-3 size-11' : 'mb-4 size-13'"
  >
    <i class="pi" [class]="icon() + (dense() ? ' text-lg' : ' text-xl')" aria-hidden="true"></i>
  </span>
  <h3
    class="font-semibold tracking-[-0.015em] text-surface-950 dark:text-surface-50"
    [class]="dense() ? 'text-[15px]' : 'text-lg'"
  >
    {{ title() }}
  </h3>
  @if (description(); as description) {
    <p class="mt-1.5 max-w-prose text-sm leading-6 text-surface-600 dark:text-surface-400">
      {{ description }}
    </p>
  }
  <div class="flex flex-wrap items-center justify-center gap-2" [class]="dense() ? 'mt-4' : 'mt-5'">
    <ng-content />
  </div>
</div>
