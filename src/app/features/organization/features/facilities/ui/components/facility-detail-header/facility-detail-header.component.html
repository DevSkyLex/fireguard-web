@let facility = this.facility();

<div
  class="rounded-md border border-surface-200 bg-surface-0 p-4 dark:border-surface-800 dark:bg-surface-900"
>
  <app-page-header [title]="facility.name">
    <p-avatar
      avatar
      aria-hidden="true"
      [icon]="facilityTypeIcons[facility.type]"
      shape="square"
      size="xlarge"
    />

    <p-tag
      titleAccessory
      class="rounded-md text-xs"
      [severity]="facility.type === 'site' ? 'info' : 'secondary'"
    >
      <div class="flex items-center gap-1.5">
        <i [class]="facilityTypeIcons[facility.type]" class="text-xs" aria-hidden="true"></i>
        <span class="font-semibold">{{ facility.type | titlecase }}</span>
      </div>
    </p-tag>

    <p-tag
      titleAccessory
      [severity]="statusDescriptor(facility.status).severity"
      [icon]="statusDescriptor(facility.status).icon"
      [value]="statusDescriptor(facility.status).label"
    />

    <div
      meta
      class="flex flex-wrap items-center gap-3 text-sm text-surface-500 dark:text-surface-400"
    >
      @if (facility.address) {
        <span class="inline-flex items-center gap-1.5">
          <i class="pi pi-map-marker text-xs" aria-hidden="true"></i>
          {{ facility.address }}
        </span>
      }

      @if (facility.code) {
        <span class="font-mono">{{ facility.code }}</span>
      }

      <span i18n="@@facility.header.updated"
        >Updated {{ facility.updatedAt | date: 'mediumDate' }}</span
      >
    </div>

    @if (canManage()) {
      <div actions class="flex items-center gap-2">
        <p-button
          i18n-label="@@common.delete"
          label="Delete"
          icon="pi pi-trash"
          severity="danger"
          [outlined]="true"
          size="small"
          [loading]="deleting()"
          (onClick)="delete.emit()"
        />
      </div>
    }
  </app-page-header>
</div>
