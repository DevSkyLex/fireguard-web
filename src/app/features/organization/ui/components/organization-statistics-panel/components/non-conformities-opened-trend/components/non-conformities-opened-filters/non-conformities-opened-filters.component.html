<div [formGroup]="form" class="grid gap-4">
  <div class="flex flex-col gap-2">
    <label
      i18n="@@org.trendFilter.nonConformitiesOpenedStatus"
      for="non-conformities-opened-status"
      class="text-sm font-medium text-surface-700 dark:text-surface-300"
    >
      Status
    </label>

    <p-select
      inputId="non-conformities-opened-status"
      formControlName="nonConformityStatus"
      [options]="nonConformityStatusOptions"
      optionLabel="label"
      optionValue="value"
      i18n-placeholder="@@org.trendFilter.nonConformitiesOpenedStatusPlaceholder"
      placeholder="All statuses"
      [showClear]="true"
      [loading]="store.isQueryLoading()"
      class="w-full"
    >
      <ng-template #item let-option>
        <p-tag [severity]="option.severity" [icon]="option.icon" [value]="option.label" />
      </ng-template>
      <ng-template #selectedItem>
        @let option = selectedNonConformityStatusOption();
        @if (option) {
          <p-tag [severity]="option.severity" [icon]="option.icon" [value]="option.label" />
        }
      </ng-template>
    </p-select>
  </div>

  <div class="flex flex-col gap-2">
    <label
      i18n="@@org.trendFilter.nonConformitiesOpenedSeverity"
      for="non-conformities-opened-severity"
      class="text-sm font-medium text-surface-700 dark:text-surface-300"
    >
      Severity
    </label>

    <p-select
      inputId="non-conformities-opened-severity"
      formControlName="nonConformitySeverity"
      [options]="nonConformitySeverityOptions"
      optionLabel="label"
      optionValue="value"
      i18n-placeholder="@@org.trendFilter.nonConformitiesOpenedSeverityPlaceholder"
      placeholder="All severities"
      [showClear]="true"
      [loading]="store.isQueryLoading()"
      class="w-full"
    >
      <ng-template #item let-option>
        <p-tag [severity]="option.severity" [icon]="option.icon" [value]="option.label" />
      </ng-template>
      <ng-template #selectedItem>
        @let option = selectedSeverityOption();
        @if (option) {
          <p-tag [severity]="option.severity" [icon]="option.icon" [value]="option.label" />
        }
      </ng-template>
    </p-select>
  </div>

  <app-trend-base-filters-form
    dateRangeId="non-conformities-opened-date-range"
    [dateRange]="store.draftDateRange()"
    [compareEnabled]="store.draftCompareEnabled()"
    [loading]="store.isQueryLoading()"
    (dateRangeChange)="store.setDraftDateRange($event)"
    (compareEnabledChange)="store.setDraftCompareEnabled($event)"
  />
</div>
