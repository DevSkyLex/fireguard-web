<hlm-alert-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-alert-dialog-content
    class="max-h-[calc(100svh-2rem)] overflow-y-auto overscroll-contain mobile-ui:max-h-[calc(100dvh-2rem-env(safe-area-inset-top)-env(safe-area-inset-bottom))] mobile-ui:overflow-y-auto mobile-ui:overscroll-contain"
    *hlmAlertDialogPortal
    data-testid="organization-team-delete-dialog"
  >
    <hlm-alert-dialog-header>
      <h2 hlmAlertDialogTitle i18n="@@org.team.deleteConfirmTitle">Delete this role?</h2>
      <p hlmAlertDialogDescription i18n="@@org.team.deleteConfirmDescription">
        Every member holding only this role loses the permissions it grants. This cannot be undone.
      </p>
    </hlm-alert-dialog-header>

    @if (error(); as message) {
      <div hlmAlert variant="destructive" role="alert" data-testid="organization-team-delete-error">
        <ng-icon name="lucideCircleAlert" aria-hidden="true" />
        <p hlmAlertTitle i18n="@@org.team.deleteErrorTitle">Couldn't delete role</p>
        <p hlmAlertDescription>{{ message }}</p>
      </div>
    }

    <hlm-alert-dialog-footer>
      <button class="mobile-ui:min-h-11" hlmAlertDialogCancel i18n="@@common.cancel">Cancel</button>
      <button
        class="mobile-ui:min-h-11"
        hlmAlertDialogAction
        variant="destructive"
        data-testid="organization-team-delete-confirm"
        [disabled]="pending()"
        (click)="confirm()"
      >
        @if (pending()) {
          <span i18n="@@org.team.deleteConfirmPending">Deleting…</span>
        } @else {
          <span i18n="@@org.team.deleteConfirmAction">Delete</span>
        }
      </button>
    </hlm-alert-dialog-footer>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
