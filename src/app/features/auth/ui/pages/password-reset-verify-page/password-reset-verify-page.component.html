<div id="password-reset-verify-page" class="flex w-full flex-col gap-6">
  <header class="flex flex-col gap-1.5">
    <h1
      class="text-2xl font-semibold tracking-tight text-foreground"
      i18n="@@auth.passwordResetVerify.title"
    >
      Enter your reset code
    </h1>
    <p class="text-sm text-muted-foreground" i18n="@@auth.passwordResetVerify.subtitle">
      Check your inbox for the code we just sent.
    </p>
  </header>

  <app-otp-form
    [showResend]="true"
    [resending]="passwordResetStore.isResending()"
    (submitted)="verify($event)"
    (resent)="resend()"
  />
</div>
