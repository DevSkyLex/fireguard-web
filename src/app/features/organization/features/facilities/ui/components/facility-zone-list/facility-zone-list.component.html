<div
  role="listbox"
  [attr.aria-label]="listLabel"
  data-testid="facility-zone-list"
  class="flex flex-col gap-1"
  (keydown)="onKeydown($event)"
>
  @for (zone of zones(); track zone.facilityId; let i = $index) {
    <button
      #zoneOption
      type="button"
      role="option"
      hlmItem
      variant="outline"
      size="sm"
      [attr.aria-selected]="zone.facilityId === selectedZoneId()"
      [attr.tabindex]="i === activeIndex() ? 0 : -1"
      [class.bg-accent]="zone.facilityId === selectedZoneId()"
      [class.border-primary]="zone.facilityId === selectedZoneId()"
      data-testid="facility-zone-list-option"
      (click)="activate(zone.facilityId)"
    >
      <hlm-item-content>
        <span hlmItemTitle>
          @if (zone.facilityId === selectedZoneId()) {
            <ng-icon name="lucideCheck" class="shrink-0 text-primary" aria-hidden="true" />
          }
          <span class="truncate">{{ zone.name }}</span>
        </span>
      </hlm-item-content>
      <app-facility-status-tag [value]="zone.status" />
    </button>
  } @empty {
    <p class="px-2 py-1.5 text-sm text-muted-foreground" i18n="@@facility.zoneList.empty">
      No zones yet.
    </p>
  }
</div>
