<nav
  class="flex h-full flex-col rounded-xl border border-surface-200 bg-surface-0 p-4 sm:p-6 dark:border-surface-800 dark:bg-surface-950"
  i18n-aria-label="@@intervention.stepper.aria"
  aria-label="Intervention workflow progress"
>
  <ol class="flex flex-1 flex-col">
    @for (step of steps(); track step.key; let last = $last; let i = $index) {
      <li
        class="relative flex gap-3"
        [class.flex-1]="!last"
        [attr.aria-current]="step.state === 'current' ? 'step' : null"
      >
        <div class="flex flex-col items-center">
          <span
            class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-xs font-semibold transition-all duration-200 motion-reduce:transition-none"
            [class]="step.indicatorClass"
          >
            @if (step.state === 'done') {
              <i class="pi pi-check text-[0.65rem]" aria-hidden="true"></i>
            } @else {
              <i [class]="step.icon + ' text-[0.7rem]'" aria-hidden="true"></i>
            }
          </span>

          @if (!last) {
            <span
              class="mt-1 w-0.5 flex-1 rounded-full transition-colors duration-300 motion-reduce:transition-none"
              [class]="steps()[i + 1].connectorClass"
              aria-hidden="true"
            ></span>
          }
        </div>

        <div [class.pb-6]="!last">
          <p class="text-sm font-medium sm:text-base" [class]="step.labelClass">{{ step.label }}</p>
          <p class="mt-0.5 text-xs text-surface-500 sm:text-sm dark:text-surface-400">
            {{ step.hint }}
          </p>
        </div>
      </li>
    }
  </ol>
</nav>
