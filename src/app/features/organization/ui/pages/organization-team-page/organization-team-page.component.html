<div id="organization-team" class="flex h-full flex-col gap-6 p-4 md:p-6">
  @if (store.loadCallState().status === 'error') {
    <div hlmEmpty role="alert">
      <div hlmEmptyHeader>
        <div hlmEmptyMedia variant="icon" class="text-destructive">
          <ng-icon name="lucideCircleAlert" aria-hidden="true" />
        </div>
        <p hlmEmptyTitle i18n="@@org.team.loadErrorTitle">Roles could not be loaded</p>
        <p hlmEmptyDescription>{{ store.loadError()?.message ?? null }}</p>
      </div>
      <div hlmEmptyContent>
        <button hlmBtn type="button" data-testid="organization-team-retry" (click)="reload()">
          <span i18n="@@org.team.retry">Try again</span>
        </button>
      </div>
    </div>
  } @else {
    <section class="grid grid-cols-1 gap-4 sm:grid-cols-3" data-testid="organization-team-kpis">
      @for (tile of kpiTiles(); track tile.id) {
        <div [attr.data-testid]="'organization-team-kpi-' + tile.id">
          <app-stat-tile
            [label]="tile.label"
            [value]="tile.value"
            [icon]="tile.icon"
            [loading]="tile.loading"
          />
        </div>
      }
    </section>

    <app-organization-role-grid
      [items]="store.roles()"
      [loading]="store.isLoading()"
      [canManage]="canManage()"
      [membersRouteBase]="membersRouteBase()"
      (editPermissionsRequested)="openPermissionsEditor($event)"
      (deleteRequested)="requestDelete($event)"
    />
  }
</div>

<app-organization-role-create-sheet
  [visible]="createDialogVisible()"
  [pending]="store.isMutating()"
  [serverError]="createDialogError()"
  [catalog]="store.permissions()"
  (visibleChange)="onCreateDialogVisibleChange($event)"
  (submitted)="createRole($event)"
/>

<app-organization-role-permissions-sheet
  [visible]="editingRole() !== null"
  [role]="editingRole()"
  [catalog]="store.permissions()"
  [pending]="store.isMutating()"
  [serverError]="permissionsSheetError()"
  (visibleChange)="onPermissionsSheetVisibleChange($event)"
  (permissionsChanged)="updatePermissions($event)"
/>

<app-organization-role-delete-dialog
  [visible]="deleteDialogState() === 'open'"
  [pending]="store.isMutating()"
  [error]="deleteDialogError()?.message ?? null"
  (visibleChange)="onDeleteDialogVisibleChange($event)"
  (confirmed)="confirmDelete()"
/>

<ng-template #pageActions>
  @if (canManage()) {
    <button
      hlmBtn
      type="button"
      class="min-w-0 shrink max-sm:min-h-11"
      data-testid="organization-team-create-role"
      (click)="openCreateDialog()"
    >
      <ng-icon name="lucidePlus" aria-hidden="true" />
      <span class="truncate" i18n="@@org.team.createRole">New role</span>
    </button>
  }
</ng-template>
