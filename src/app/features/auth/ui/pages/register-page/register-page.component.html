<div id="register-page" class="flex w-full flex-col gap-6">
  <app-page-heading
    heading="Create your account"
    i18n-heading="@@auth.register.title"
    description="We will email you a code to confirm the address."
    i18n-description="@@auth.register.subtitle"
  />

  <app-register-form [pending]="registerStore.isRegistering()" (submitted)="register($event)" />

  <p class="text-center text-sm text-muted-foreground">
    <span i18n="@@auth.register.haveAccount">Already have an account?</span>
    <a
      class="ml-1 font-medium text-foreground underline-offset-4 hover:underline focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
      routerLink="/auth/login"
      i18n="@@auth.register.signIn"
      >Sign in</a
    >
  </p>
</div>
