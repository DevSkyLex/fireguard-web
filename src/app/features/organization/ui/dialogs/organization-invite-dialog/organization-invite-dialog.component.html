<hlm-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-dialog-content
    class="max-h-[calc(100svh-2rem)] overflow-y-auto overscroll-contain sm:max-w-md mobile-ui:max-h-[calc(100dvh-2rem-env(safe-area-inset-top)-env(safe-area-inset-bottom))] mobile-ui:overflow-y-auto mobile-ui:overscroll-contain"
    data-testid="organization-invite-dialog"
    *hlmDialogPortal
  >
    <hlm-dialog-header>
      <h3 hlmDialogTitle i18n="@@org.inviteDialog.title">Invite a member</h3>
    </hlm-dialog-header>

    <app-organization-invite-form
      [pending]="pending()"
      [serverError]="serverError()"
      [roleOptions]="roleOptions()"
      (submitted)="submitted.emit($event)"
      (cancelled)="visibleChange.emit(false)"
    />
  </hlm-dialog-content>
</hlm-dialog>
