<div
  id="error-content"
  class="mx-auto flex w-full max-w-md flex-col px-6 py-16 text-center sm:py-24"
>
  <p
    class="mx-auto grid size-16 place-items-center rounded-xl bg-surface-100 font-mono text-2xl leading-none font-semibold text-surface-600 select-none dark:bg-surface-800 dark:text-surface-300"
    aria-hidden="true"
  >
    {{ code() }}
  </p>

  <h1
    class="mt-6 text-3xl font-semibold tracking-[-0.025em] text-balance text-surface-950 dark:text-surface-0"
  >
    {{ title() }}
  </h1>

  <p class="mt-2 mb-8 text-sm leading-6 text-pretty text-surface-500 dark:text-surface-400">
    {{ description() }}
  </p>

  <div class="flex flex-wrap items-center justify-center gap-3">
    <ng-content />
  </div>
</div>
