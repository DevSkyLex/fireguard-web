<hlm-sheet
  side="right"
  [state]="sheetState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-sheet-content
    *hlmSheetPortal
    class="w-full overflow-y-auto sm:w-[540px] sm:max-w-none"
    data-testid="intervention-create-sheet"
  >
    <hlm-sheet-header>
      <h3 hlmSheetTitle i18n="@@intervention.createSheet.header">Create a field intervention</h3>
      <p hlmSheetDescription i18n="@@intervention.createSheet.intro">
        It opens as a draft — you can refine the plan before anyone goes on site.
      </p>
    </hlm-sheet-header>

    <app-intervention-create-form
      [pending]="pending()"
      [serverError]="serverError()"
      [siteOptions]="siteOptions()"
      [memberOptions]="memberOptions()"
      (submitted)="submitted.emit($event)"
      (cancelled)="visibleChange.emit(false)"
    />
  </hlm-sheet-content>
</hlm-sheet>
