<div class="flex items-center gap-2 text-surface-600 dark:text-surface-400">
  <i class="{{ icon() }} text-sm text-surface-500 dark:text-surface-400" aria-hidden="true"></i>
  <span class="truncate text-sm font-medium">{{ title() }}</span>
</div>

@if (loading()) {
  <p-skeleton height="20px" width="45%" class="mt-2 block" />
  <p-skeleton height="14px" width="60%" class="mt-2 block" />
  <p-skeleton height="26px" class="mt-3 block" />
} @else {
  <p
    class="mt-1.5 text-xl font-semibold tracking-[-0.015em] text-surface-950 tabular-nums dark:text-surface-50"
  >
    {{ value() ?? '—' }}
  </p>

  @if (comparison(); as comparison) {
    <div
      class="mt-2 flex items-center gap-1 text-xs font-semibold tabular-nums"
      [class]="deltaClass()"
    >
      @switch (comparison.direction) {
        @case ('up') {
          <i aria-hidden="true" class="pi pi-arrow-up-right text-xs"></i>
          <span class="sr-only" i18n="@@common.comparisonIncreased">increased</span>
        }
        @case ('down') {
          <i aria-hidden="true" class="pi pi-arrow-down-right text-xs"></i>
          <span class="sr-only" i18n="@@common.comparisonDecreased">decreased</span>
        }
        @default {
          <span class="sr-only" i18n="@@common.comparisonNoChange">no change</span>
        }
      }
      <span>{{ comparison.value }}</span>
      <span class="font-medium text-surface-500 dark:text-surface-400" i18n="@@common.lastPeriod"
        >last period</span
      >
    </div>
  }

  @if (sparklinePath(); as sparklinePath) {
    <svg
      class="mt-3 block h-[26px] w-full text-surface-500 dark:text-surface-400"
      viewBox="0 0 120 26"
      preserveAspectRatio="none"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      aria-hidden="true"
    >
      <path
        [attr.d]="sparklinePath"
        stroke-linecap="round"
        stroke-linejoin="round"
        vector-effect="non-scaling-stroke"
      />
    </svg>
  }
}
