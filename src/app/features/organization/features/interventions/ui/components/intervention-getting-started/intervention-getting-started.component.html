<section aria-labelledby="intervention-readiness-title">
  <div class="mb-2">
    <h3
      id="intervention-readiness-title"
      class="text-sm font-medium"
      i18n="@@intervention.checklist.readyToPlan"
    >
      Ready to plan
    </h3>
  </div>

  <div>
    <div hlmItemGroup class="grid gap-1 sm:grid-cols-2">
      @for (item of items(); track item.id) {
        <button
          hlmItem
          type="button"
          variant="default"
          size="xs"
          class="min-h-11 text-start"
          data-testid="intervention-getting-started-item"
          [disabled]="item.done"
          [attr.aria-current]="item.id === nextItemId() ? 'step' : null"
          (click)="itemActivated.emit(item.target)"
        >
          <hlm-item-media variant="icon">
            <ng-icon
              [name]="item.done ? 'lucideCheck' : 'lucideCircle'"
              [class]="item.done ? 'text-success' : 'text-muted-foreground'"
              aria-hidden="true"
            />
          </hlm-item-media>
          <hlm-item-content>
            <hlm-item-title
              [class.line-through]="item.done"
              [class.text-muted-foreground]="item.done"
            >
              {{ item.label }}
            </hlm-item-title>
          </hlm-item-content>
        </button>
      }
    </div>
  </div>
</section>
