<ol
  class="flex w-full items-center"
  i18n-aria-label="@@intervention.phase.stepperAria"
  aria-label="Workflow phases"
>
  @for (step of steps(); track step.key; let last = $last) {
    <li
      class="flex min-w-0 items-center"
      [class.flex-1]="!last"
      [attr.aria-current]="step.state === 'active' ? 'step' : null"
      [attr.aria-label]="step.label"
    >
      <span class="flex shrink-0 items-center gap-2">
        @if (step.state === 'active') {
          <span class="flex size-5 shrink-0 items-center justify-center rounded-full bg-primary">
            <span class="size-[7px] rounded-full bg-white" aria-hidden="true"></span>
          </span>
          <span
            class="text-xs font-semibold whitespace-nowrap text-surface-950 dark:text-surface-50"
          >
            {{ step.label }}
          </span>
          @if (activeDetail(); as detail) {
            <span
              class="hidden text-xs font-medium text-surface-500 tabular-nums sm:inline dark:text-surface-400"
            >
              {{ detail }}
            </span>
          }
        } @else if (step.state === 'done') {
          <span
            class="flex size-5 shrink-0 items-center justify-center rounded-full border-[1.5px] border-green-600/30 bg-green-50 text-green-700 dark:border-green-400/30 dark:bg-green-400/10 dark:text-green-300"
          >
            <i class="pi pi-check text-[9px]" aria-hidden="true"></i>
          </span>
          <span
            class="hidden text-xs font-semibold whitespace-nowrap text-surface-600 sm:inline dark:text-surface-400"
          >
            {{ step.label }}
          </span>
        } @else {
          <span
            class="size-5 shrink-0 rounded-full border-[1.5px] border-surface-200 bg-surface-0 dark:border-surface-800 dark:bg-surface-950"
            aria-hidden="true"
          ></span>
          <span
            class="hidden text-xs font-semibold whitespace-nowrap text-surface-500 sm:inline dark:text-surface-400"
          >
            {{ step.label }}
          </span>
        }
      </span>
      @if (!last) {
        <span
          class="mx-2 h-[1.5px] min-w-2 flex-1 rounded-full sm:mx-3 sm:min-w-4"
          [class]="connectorClasses(step.state)"
          aria-hidden="true"
        ></span>
      }
    </li>
  }
</ol>
