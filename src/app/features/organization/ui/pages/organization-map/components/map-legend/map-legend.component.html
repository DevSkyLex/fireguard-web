<span
  class="text-[11px] font-semibold tracking-[0.05em] text-surface-500 uppercase dark:text-surface-400"
  i18n="@@map.legend.title"
>
  Compliance
</span>
@for (bucket of buckets; track bucket.bucket) {
  <div class="flex items-center gap-2.5">
    <span
      class="inline-block h-2 w-2 shrink-0 rounded-full"
      [class]="bucket.barClass"
      aria-hidden="true"
    ></span>
    <span class="text-surface-700 dark:text-surface-300">{{ bucket.label }}</span>
  </div>
}
