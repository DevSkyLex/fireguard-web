<form novalidate (submit)="submit($event)">
  <hlm-field-group>
    @if (serverError(); as error) {
      <div role="alert" data-testid="otp-server-error" class="text-sm text-destructive">
        <p>
          @if (error.message; as message) {
            {{ message }}
          } @else {
            <span i18n="@@auth.otp.failed">Something went wrong. Try again.</span>
          }
        </p>
      </div>
    }

    <hlm-field class="items-center">
      <label hlmFieldLabel for="otp-code" class="self-start"
        ><span i18n="@@auth.otp.label">Verification code</span><app-required-marker
      /></label>

      <brn-input-otp
        hlmInputOtp
        inputId="otp-code"
        autocomplete="one-time-code"
        data-testid="otp-code"
        [length]="length"
        [formField]="otpForm.code"
        [attr.aria-invalid]="otpForm.code().touched() && otpForm.code().invalid()"
        (completed)="autoSubmit()"
      >
        <hlm-input-otp-group>
          <hlm-input-otp-slot index="0" />
          <hlm-input-otp-slot index="1" />
          <hlm-input-otp-slot index="2" />
        </hlm-input-otp-group>
        <hlm-input-otp-separator />
        <hlm-input-otp-group>
          <hlm-input-otp-slot index="3" />
          <hlm-input-otp-slot index="4" />
          <hlm-input-otp-slot index="5" />
        </hlm-input-otp-group>
      </brn-input-otp>

      @if (otpForm.code().touched() && otpForm.code().invalid()) {
        <hlm-field-error class="self-start">{{
          otpForm.code().errors()[0].message
        }}</hlm-field-error>
      }
    </hlm-field>

    <button
      hlmBtn
      type="submit"
      class="w-full max-sm:min-h-11"
      data-testid="otp-submit"
      [disabled]="pending()"
      [attr.aria-busy]="pending() ? 'true' : null"
      aria-live="polite"
    >
      @if (pending()) {
        <span i18n="@@auth.otp.submitting">Verifying…</span>
      } @else {
        <span i18n="@@auth.otp.submit">Verify</span>
      }
    </button>

    @if (showResend()) {
      <button
        hlmBtn
        type="button"
        variant="ghost"
        size="sm"
        class="w-full max-sm:min-h-11"
        data-testid="otp-resend"
        [disabled]="resending() || cooldownRemaining() > 0"
        (click)="resent.emit()"
      >
        @if (resending()) {
          <span i18n="@@auth.otp.resending">Sending a new code…</span>
        } @else if (cooldownRemaining() > 0) {
          <span data-testid="otp-resend-cooldown" i18n="@@auth.otp.resendIn"
            >Resend available in {{ cooldownRemaining() }}s</span
          >
        } @else {
          <span i18n="@@auth.otp.resend">Send a new code</span>
        }
      </button>
    }
  </hlm-field-group>
</form>
