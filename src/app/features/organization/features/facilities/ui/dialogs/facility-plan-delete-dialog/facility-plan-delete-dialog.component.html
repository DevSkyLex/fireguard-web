<hlm-alert-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-alert-dialog-content
    class="max-h-[calc(100svh-2rem)] overflow-y-auto overscroll-contain"
    *hlmAlertDialogPortal
    data-testid="facility-plan-delete-dialog"
  >
    <hlm-alert-dialog-header>
      <h2 hlmAlertDialogTitle i18n="@@facility.plans.deleteTitle">Delete this floor plan?</h2>
      <p hlmAlertDialogDescription i18n="@@facility.plans.deleteText">
        {{ plan()?.fileName }} will be permanently removed from this facility.
      </p>
    </hlm-alert-dialog-header>
    <hlm-alert-dialog-footer>
      <button
        hlmAlertDialogCancel
        [disabled]="pending()"
        i18n="@@common.cancel"
        class="mobile-ui:min-h-11"
      >
        Cancel
      </button>
      <button
        hlmAlertDialogAction
        variant="destructive"
        data-testid="facility-plan-delete-confirm"
        [disabled]="pending()"
        (click)="confirm()"
        i18n="@@facility.plans.deleteConfirm"
        class="mobile-ui:min-h-11"
      >
        Delete
      </button>
    </hlm-alert-dialog-footer>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
