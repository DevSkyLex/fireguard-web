<div id="register-verify-page" class="flex w-full flex-col gap-6">
  <header class="flex flex-col gap-1.5">
    <h1
      class="text-2xl font-semibold tracking-tight text-foreground"
      i18n="@@auth.registerVerify.title"
    >
      Confirm your email
    </h1>
    <p class="text-sm text-muted-foreground" i18n="@@auth.registerVerify.subtitle">
      Enter the code we just sent you.
    </p>
  </header>

  <app-otp-form
    [pending]="registerStore.isVerifying()"
    [showResend]="true"
    [resending]="registerStore.isResending()"
    (submitted)="verify($event)"
    (resent)="resend()"
  />
</div>
