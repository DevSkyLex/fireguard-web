<div
  #barRoot
  class="flex shrink-0 flex-wrap items-center gap-2 overflow-hidden rounded-md border border-border p-2 outline-none focus-visible:outline-[3px] focus-visible:outline-offset-2 focus-visible:outline-ring focus-visible:outline-solid"
  [class.justify-center]="isEmpty()"
  [attr.id]="testId('filter-bar')"
  [attr.data-testid]="testId('filter-chips')"
  role="group"
  tabindex="-1"
  [attr.aria-label]="regionLabel"
>
  @if (isEmpty()) {
    <span
      class="-my-2 min-w-8 flex-1 self-stretch rounded-none bg-[repeating-linear-gradient(135deg,var(--border)_0_1px,transparent_1px_8px)] opacity-70"
      [attr.data-testid]="testId('filter-empty-decoration-start')"
      aria-hidden="true"
    ></span>
  }

  @for (key of renderedKeys(); track key) {
    <app-filter-chip
      [fieldLabel]="fieldOf(key).fieldLabel"
      [icon]="fieldOf(key).icon"
      [removeLabel]="removeLabelFor(fieldOf(key).fieldLabel)"
      [operator]="operatorOf(key)"
      [operatorOptions]="fieldOf(key).operators"
      [operatorLabels]="fieldOf(key).operatorLabels ?? {}"
      [changeOperatorLabel]="changeOperatorLabelFor(fieldOf(key).fieldLabel)"
      [operatorTriggerId]="operatorTriggerIdFor(key)"
      [testIdPrefix]="testIdPrefix()"
      [disabled]="fieldOf(key).unavailableReason !== undefined"
      [unavailableReason]="fieldOf(key).unavailableReason ?? ''"
      [reasonId]="reasonIdFor(key)"
      (removed)="removeField(key)"
      (operatorChanged)="operatorChanged.emit({ key, operator: $event })"
    >
      <ng-container *ngTemplateOutlet="templates()[key] ?? null" />
    </app-filter-chip>
  }

  @if (unsetFields().length > 0) {
    <app-collection-filter-field-picker
      [fields]="unsetFields()"
      [isMobileInteractionMode]="isMobileInteractionMode()"
      [testIdPrefix]="testIdPrefix()"
      [triggerLabel]="addFilterLabel"
      [menuLabel]="addFilterMenuLabel"
      (fieldPicked)="pickField($event)"
    />
  }

  @if (isEmpty()) {
    <span
      class="-my-2 min-w-8 flex-1 self-stretch rounded-none bg-[repeating-linear-gradient(135deg,var(--border)_0_1px,transparent_1px_8px)] opacity-70"
      [attr.data-testid]="testId('filter-empty-decoration-end')"
      aria-hidden="true"
    ></span>
  }

  @if (hasActiveFilters()) {
    <button
      hlmBtn
      type="button"
      variant="ghost"
      size="sm"
      class="mobile-ui:min-h-11"
      [attr.data-testid]="testId('clear-filters')"
      (click)="clearAll()"
    >
      <ng-icon name="lucideX" aria-hidden="true" />
      <span>{{ clearFiltersLabel }}</span>
    </button>
  }
</div>
