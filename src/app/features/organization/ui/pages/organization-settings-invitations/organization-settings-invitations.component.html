<div
  id="organization-settings-invitations"
  class="flex h-full flex-col gap-6 p-3 sm:p-6 md:p-7 lg:p-8"
>
  <p
    i18n="@@org.settings.invitationsSubtitle"
    class="max-w-[60ch] text-sm text-surface-600 dark:text-surface-400"
  >
    Track pending invitations, resend expiring links, and revoke access that should no longer be
    granted.
  </p>

  @if (store.loadError(); as error) {
    <p-message severity="error">
      <div class="flex flex-wrap items-center gap-3">
        <span>{{ error.message ?? loadErrorFallback }}</span>
        <p-button
          i18n-label="@@org.settings.invitationsRetry"
          label="Retry"
          icon="pi pi-refresh"
          severity="secondary"
          [text]="true"
          (onClick)="reload()"
        />
      </div>
    </p-message>
  }
  @if (store.mutationError(); as error) {
    <p-message severity="error">{{ error.message ?? mutationErrorFallback }}</p-message>
  }

  <app-organization-invitation-table
    [invitations]="store.activeInvitations()"
    [roles]="store.roles()"
    [loading]="store.isLoading()"
    [canManage]="canManageInvitations()"
    (revoke)="revokeInvitation($event)"
    (resend)="resendInvitation($event)"
    (copyLink)="copyLink($event)"
  />
</div>
