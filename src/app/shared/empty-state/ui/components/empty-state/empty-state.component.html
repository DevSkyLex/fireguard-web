<div hlmEmpty class="border border-border">
  <div hlmEmptyHeader>
    @if (icon(); as iconName) {
      <div hlmEmptyMedia variant="icon">
        <ng-icon [name]="iconName" aria-hidden="true" />
      </div>
    }
    <p hlmEmptyTitle>{{ title() }}</p>
    @if (description(); as text) {
      <p hlmEmptyDescription>{{ text }}</p>
    }
  </div>

  <div hlmEmptyContent>
    <ng-content />
  </div>
</div>
