@if (entries().length) {
  <dl class="grid gap-1.5">
    @for (entry of entries(); track entry.field) {
      <div class="flex items-baseline justify-between gap-3">
        <dt class="shrink-0 text-xs text-surface-500 dark:text-surface-400">{{ entry.field }}</dt>
        <dd
          class="min-w-0 truncate text-right font-mono text-xs text-surface-700 dark:text-surface-200"
          [title]="entry.value"
        >
          {{ entry.value }}
        </dd>
      </div>
    }
  </dl>
} @else {
  <p i18n="@@intervention.changeDiff.empty" class="text-xs text-surface-400 dark:text-surface-500">
    No field changes.
  </p>
}
