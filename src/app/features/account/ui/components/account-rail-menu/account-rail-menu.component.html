@if (userIdentityPort.isLoading()) {
  <p-skeleton shape="circle" size="2.25rem" aria-busy="true" />
} @else {
  <button
    #trigger
    type="button"
    class="relative cursor-pointer rounded-full focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
    [attr.aria-label]="triggerLabel()"
    [attr.aria-expanded]="menuOpen()"
    aria-haspopup="dialog"
    i18n-pTooltip="@@workspace.rail.account.tooltip"
    pTooltip="Account"
    tooltipPosition="right"
    data-testid="account-rail-menu-trigger"
    (click)="toggle($event)"
  >
    <p-avatar
      class="contents"
      aria-hidden="true"
      styleClass="!size-9 !text-[13px] !font-semibold"
      shape="circle"
      [image]="userIdentityPort.avatarUrlSmall() ?? undefined"
      [label]="userIdentityPort.avatarUrlSmall() ? undefined : (userIdentityPort.initials() ?? '')"
    />

    @if (notificationCenter.hasUnread()) {
      <!--
        Decorative: `aria-label` on a generic `<span>` has no role to attach to
        and is dropped by most screen readers. The unread state is carried by
        the trigger's own accessible name instead.
      -->
      <span
        class="absolute -end-0.5 -top-0.5 size-2.5 rounded-full bg-primary ring-2 ring-surface-50 dark:ring-surface-900"
        aria-hidden="true"
        data-testid="account-rail-menu-unread"
      ></span>
    }
  </button>

  <p-popover #popover appendTo="body" (onShow)="menuOpen.set(true)" (onHide)="onPopoverHide()">
    <div class="flex w-56 flex-col">
      <div class="flex items-center gap-2.5 px-2 py-1.5">
        <p-avatar
          aria-hidden="true"
          styleClass="!size-8 !text-[12px] !font-semibold"
          shape="circle"
          [image]="userIdentityPort.avatarUrlSmall() ?? undefined"
          [label]="
            userIdentityPort.avatarUrlSmall() ? undefined : (userIdentityPort.initials() ?? '')
          "
        />
        <span class="flex min-w-0 flex-col">
          <span class="truncate text-sm font-semibold text-surface-950 dark:text-surface-50">
            {{ userIdentityPort.displayName() }}
          </span>
          <span class="truncate text-xs text-surface-500 dark:text-surface-400">
            {{ userIdentityPort.profile()?.email }}
          </span>
        </span>
      </div>

      <div class="mx-2 my-1.5 border-t border-surface-200 dark:border-surface-800"></div>

      <a
        class="flex min-h-8 items-center gap-2.5 rounded-lg px-2 py-1.5 text-[13px] font-medium text-surface-600 transition-colors hover:bg-surface-100 hover:text-surface-950 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:text-surface-400 dark:hover:bg-surface-900 dark:hover:text-surface-50"
        autofocus
        [routerLink]="accountLink()"
        [queryParams]="{ tab: 'profile' }"
        data-testid="account-rail-menu-profile"
        (click)="close()"
      >
        <i class="pi pi-user w-4 shrink-0 text-center text-xs" aria-hidden="true"></i>
        <span class="min-w-0 flex-1 truncate" i18n="@@account.nav.profile">Your profile</span>
      </a>

      <a
        class="flex min-h-8 items-center gap-2.5 rounded-lg px-2 py-1.5 text-[13px] font-medium text-surface-600 transition-colors hover:bg-surface-100 hover:text-surface-950 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:text-surface-400 dark:hover:bg-surface-900 dark:hover:text-surface-50"
        [routerLink]="accountLink()"
        [queryParams]="{ tab: 'notifications' }"
        data-testid="account-rail-menu-notifications"
        (click)="close()"
      >
        <i class="pi pi-bell w-4 shrink-0 text-center text-xs" aria-hidden="true"></i>
        <span class="min-w-0 flex-1 truncate" i18n="@@common.notifications">Notifications</span>
        @if (notificationCenter.hasUnread()) {
          <span
            class="inline-flex min-w-5 items-center justify-center rounded-full bg-surface-100 px-1.75 py-px text-[11px] font-semibold text-surface-600 tabular-nums dark:bg-surface-900 dark:text-surface-400"
          >
            {{ notificationCenter.unreadCount() }}
          </span>
        }
      </a>

      <div class="mx-2 my-1.5 border-t border-surface-200 dark:border-surface-800"></div>

      <button
        type="button"
        class="flex min-h-8 w-full cursor-pointer items-center gap-2.5 rounded-lg px-2 py-1.5 text-left text-[13px] font-medium text-surface-600 transition-colors hover:bg-surface-100 hover:text-surface-950 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-default disabled:opacity-60 dark:text-surface-400 dark:hover:bg-surface-900 dark:hover:text-surface-50"
        [disabled]="authLogoutPort.isLoggingOut()"
        data-testid="account-rail-menu-logout"
        (click)="onLogout()"
      >
        <i class="pi pi-sign-out w-4 shrink-0 text-center text-xs" aria-hidden="true"></i>
        <span class="min-w-0 flex-1 truncate">
          @if (authLogoutPort.isLoggingOut()) {
            <ng-container i18n="@@auth.userProfile.loggingOut">Logging out...</ng-container>
          } @else {
            <ng-container i18n="@@auth.userProfile.logout">Logout</ng-container>
          }
        </span>
      </button>
    </div>
  </p-popover>
}
