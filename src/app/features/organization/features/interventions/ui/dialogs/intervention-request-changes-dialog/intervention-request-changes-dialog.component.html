<hlm-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-dialog-content
    *hlmDialogPortal
    class="max-h-[calc(100dvh-2rem)] w-[calc(100vw-2rem)] overflow-y-auto sm:max-w-lg"
    data-testid="intervention-request-changes-dialog"
    [attr.data-dirty]="dirty()"
  >
    <hlm-dialog-header>
      <h3 hlmDialogTitle i18n="@@intervention.rcDrawer.header">Request changes</h3>
      <p hlmDialogDescription i18n="@@intervention.rc.hint">
        Explain what must change before this intervention can be published. The field agent sees
        this note when the work returns to execution.
      </p>
    </hlm-dialog-header>

    <p class="text-sm font-medium">{{ interventionName() }}</p>
    <app-intervention-request-changes-form
      [pending]="pending()"
      [disabled]="disabled()"
      [serverError]="serverError()"
      (submitted)="submitted.emit($event)"
      (cancelled)="requestClose()"
      (dirtyChanged)="dirty.set($event)"
    />
  </hlm-dialog-content>
</hlm-dialog>

<app-unsaved-changes-dialog
  [state]="unsavedChangesDialogState()"
  (confirmed)="onUnsavedChangesConfirmed()"
  (dismissed)="onUnsavedChangesDismissed()"
/>
