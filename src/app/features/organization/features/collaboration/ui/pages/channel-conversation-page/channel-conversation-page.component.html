<header
  class="flex h-12 shrink-0 items-center gap-1 border-b px-2 sm:gap-2 sm:px-4"
  data-testid="channel-conversation-header"
>
  <a
    hlmBtn
    variant="ghost"
    size="icon"
    class="size-11 shrink-0 lg:hidden"
    data-testid="channel-conversation-back"
    i18n-aria-label="@@channels.room.back"
    aria-label="Back to channels"
    [routerLink]="['..']"
  >
    <ng-icon name="lucideArrowLeft" class="text-base" aria-hidden="true" />
  </a>

  <span
    class="min-w-0 flex-1 truncate text-sm font-semibold text-foreground"
    data-testid="channel-conversation-name"
    [attr.title]="channelName()"
    >{{ channelName() }}</span
  >
  <button
    hlmBtn
    type="button"
    variant="ghost"
    size="sm"
    class="h-9 shrink-0 gap-1.5 px-2 text-muted-foreground max-lg:h-11"
    data-testid="channel-conversation-participants-count"
    [attr.aria-label]="participantsButtonLabel()"
    (click)="participantsSheetVisible.set(true)"
  >
    <span hlmAvatarGroup aria-hidden="true">
      @for (participant of participantAvatars(); track participant.memberId) {
        <hlm-avatar
          size="sm"
          [attr.title]="participant.displayName"
          data-testid="channel-header-avatar"
        >
          @if (participant.avatarUrl; as url) {
            <img hlmAvatarImage [src]="url" alt="" />
          }
          <span hlmAvatarFallback class="text-[10px]">{{ participant.initials }}</span>
        </hlm-avatar>
      } @empty {
        <ng-icon name="lucideUsers" class="text-base" />
      }
    </span>
    @if (participantCount() > 3) {
      <span class="text-xs tabular-nums" aria-hidden="true">+{{ participantCount() - 3 }}</span>
    }
  </button>

  <button
    hlmBtn
    type="button"
    variant="ghost"
    size="icon-sm"
    class="shrink-0 max-lg:size-11"
    data-testid="channel-conversation-favorite"
    [attr.aria-label]="isFavorite() ? favoriteOnLabel : favoriteOffLabel"
    [attr.aria-pressed]="isFavorite()"
    [disabled]="favoritePending()"
    (click)="toggleFavorite()"
  >
    <ng-icon
      name="lucideStar"
      class="text-base"
      [class.text-primary]="isFavorite()"
      aria-hidden="true"
    />
  </button>

  <button
    hlmBtn
    type="button"
    variant="ghost"
    size="icon-sm"
    class="shrink-0 max-lg:size-11"
    id="channel-conversation-actions-trigger"
    data-testid="channel-conversation-actions"
    [hlmDropdownMenuTrigger]="actionsMenu"
    align="end"
    i18n-aria-label="@@channels.room.actionsAria"
    aria-label="Channel actions"
  >
    <ng-icon name="lucideEllipsisVertical" class="text-base" aria-hidden="true" />
  </button>

  <ng-template #actionsMenu>
    <hlm-dropdown-menu class="min-w-52">
      <hlm-dropdown-menu-group>
        <button
          hlmDropdownMenuItem
          class="gap-2"
          data-testid="channel-conversation-info-action"
          (click)="infoSheetVisible.set(true)"
        >
          <ng-icon name="lucideInfo" class="text-sm" aria-hidden="true" />
          <span i18n="@@channels.room.info">Channel info</span>
        </button>

        <button
          hlmDropdownMenuItem
          class="gap-2"
          data-testid="channel-conversation-participants-action"
          (click)="participantsSheetVisible.set(true)"
        >
          <ng-icon name="lucideUsers" class="text-sm" aria-hidden="true" />
          <span i18n="@@channels.room.manageParticipants">Participants</span>
        </button>

        @if (canManage()) {
          <button
            hlmDropdownMenuItem
            class="gap-2"
            data-testid="channel-conversation-edit-action"
            (click)="editDialogVisible.set(true)"
          >
            <ng-icon name="lucidePencilLine" class="text-sm" aria-hidden="true" />
            <span i18n="@@channels.room.rename">Rename or move</span>
          </button>
        }
      </hlm-dropdown-menu-group>

      @if (canManage()) {
        <hlm-dropdown-menu-separator />

        <button
          hlmDropdownMenuItem
          variant="destructive"
          class="gap-2"
          data-testid="channel-conversation-delete-action"
          (click)="requestDelete()"
        >
          <ng-icon name="lucideTrash2" class="text-sm" aria-hidden="true" />
          <span i18n="@@channels.room.delete">Delete channel</span>
        </button>
      }
    </hlm-dropdown-menu>
  </ng-template>
</header>

<app-message-thread
  [messages]="messages()"
  [loading]="thread.isLoading()"
  [hasMore]="thread.hasMore()"
  [errorMessage]="loadErrorMessage()"
  [canReact]="canWrite()"
  [canWrite]="canWrite()"
  [actionsEnabled]="true"
  [actionsBusy]="thread.isInteracting()"
  (loadMore)="thread.loadOlder()"
  (retried)="thread.retryFailed($event)"
  (loadRetried)="thread.load(channelId())"
  (reactionToggled)="toggleReaction($event)"
  (threadRequested)="replyTargetId.set($event)"
  (pinToggleRequested)="togglePin($event)"
  (saveToggleRequested)="toggleSave($event)"
  (editRequested)="editTargetId.set($event)"
  (deleteRequested)="messageDeleteTargetId.set($event)"
  (caughtUp)="markRead()"
>
  <app-message-composer
    [pending]="thread.isPosting()"
    [readOnly]="!canWrite()"
    [placeholder]="composerPlaceholder()"
    [members]="mentionCandidates()"
    (sent)="send($event)"
  />
</app-message-thread>

<app-channel-edit-dialog
  [visible]="editDialogVisible()"
  [name]="channel()?.name ?? ''"
  [parentChannelId]="currentParentId()"
  [parentOptions]="parentOptions()"
  [pending]="channels.isMutating()"
  (visibleChange)="editDialogVisible.set($event)"
  (submitted)="submitEdit($event)"
/>

<app-channel-participants-sheet
  [visible]="participantsSheetVisible()"
  [participants]="participantViews()"
  [candidates]="addableMembers()"
  [canManage]="canManage()"
  [loading]="participantsStore.isLoading()"
  [pending]="participantsStore.isMutating()"
  (visibleChange)="participantsSheetVisible.set($event)"
  (added)="addParticipant($event)"
  (removed)="removeParticipant($event)"
/>

<app-channel-delete-dialog
  [visible]="deletePending()"
  [pending]="deleteDialogBusy()"
  [error]="deleteDialogError()"
  (visibleChange)="onDeleteDialogStateChanged($event ? 'open' : 'closed')"
  (confirmed)="confirmDelete()"
/>

<app-channel-info-sheet
  [visible]="infoSheetVisible()"
  [channelName]="channelName()"
  [participants]="participantViews()"
  [pinned]="pinnedItems()"
  [loading]="pinnedStore.isLoading()"
  [pending]="pinnedStore.isUnpinning()"
  (visibleChange)="infoSheetVisible.set($event)"
  (unpinned)="unpinFromSheet($event)"
/>

<app-message-reply-sheet
  [visible]="replyTargetId() !== null"
  [parent]="replyTargetView()"
  [canWrite]="canWrite()"
  [members]="mentionCandidates()"
  (visibleChange)="onReplySheetVisibleChange($event)"
  (replyPosted)="thread.noteReplyPosted($event)"
/>

<app-message-edit-dialog
  [visible]="editTargetId() !== null"
  [message]="editTargetMessage()"
  [pending]="messageEditBusy()"
  [error]="messageEditError()"
  (visibleChange)="onMessageEditDialogVisibleChange($event)"
  (submitted)="submitMessageEdit($event)"
/>

<app-message-delete-dialog
  [visible]="messageDeleteTargetId() !== null"
  [pending]="messageDeleteBusy()"
  [error]="messageDeleteError()"
  (visibleChange)="onMessageDeleteDialogVisibleChange($event)"
  (confirmed)="confirmMessageDelete()"
/>
