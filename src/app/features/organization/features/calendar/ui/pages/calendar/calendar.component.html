<div id="calendar" class="flex min-h-0 w-full flex-1 flex-col">
  <app-calendar
    class="flex min-h-0 flex-1 flex-col"
    [events]="store.events()"
    [view]="view()"
    [focusedDate]="focusedDate()"
    [categoryGroups]="categoryGroups()"
    [config]="calendarConfig"
    [loading]="store.isQueryLoading()"
    (viewChange)="view.set($event)"
    (focusedDateChange)="focusedDate.set($event)"
    (categoriesChange)="categoryGroups.set($event)"
    (eventClick)="openEvent($event)"
  >
    @if (canCreateEvent()) {
      <ng-template #actions>
        <p-button
          i18n-label="@@calendar.newEvent"
          label="New event"
          icon="pi pi-plus"
          size="small"
          (onClick)="openCreateDrawer()"
        />
      </ng-template>
    }
  </app-calendar>
</div>

<app-calendar-event-drawer
  [visible]="createDrawerVisible()"
  [loading]="eventStore.isCreating()"
  (visibleChange)="createDrawerVisible.set($event)"
  (submitted)="submitEvent($event)"
/>
