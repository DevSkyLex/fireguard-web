<hlm-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-dialog-content
    class="max-h-[calc(100svh-2rem)] overflow-y-auto overscroll-contain sm:max-w-lg"
    data-testid="maintenance-campaign-dialog"
    *hlmDialogPortal
  >
    <hlm-dialog-header>
      <h3 hlmDialogTitle i18n="@@maintenance.campaignDialog.title">Generate inspection campaign</h3>
      <p hlmDialogDescription i18n="@@maintenance.campaignDialog.description">
        Creates an intervention covering every schedule currently due, optionally narrowed to one
        facility or equipment type.
      </p>
    </hlm-dialog-header>

    <app-maintenance-campaign-form
      [pending]="pending()"
      [serverError]="serverError()"
      [facilityOptions]="facilityOptions()"
      (submitted)="submitted.emit($event)"
      (cancelled)="visibleChange.emit(false)"
    />
  </hlm-dialog-content>
</hlm-dialog>
