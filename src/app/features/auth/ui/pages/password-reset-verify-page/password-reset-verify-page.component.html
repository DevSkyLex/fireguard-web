<div id="password-reset-verify-page" class="mx-auto flex w-full max-w-md min-w-0 flex-col gap-8">
  <app-page-heading
    heading="Enter your reset code"
    i18n-heading="@@auth.passwordResetVerify.title"
    description="Check your inbox for the code we just sent."
    i18n-description="@@auth.passwordResetVerify.subtitle"
  />

  <app-otp-form
    [showResend]="true"
    [resending]="passwordResetStore.isResending()"
    [serverError]="passwordResetStore.resendError()"
    [resendAvailableIn]="passwordResetStore.resendAvailableIn()"
    (submitted)="verify($event)"
    (resent)="resend()"
  />

  <p
    class="flex flex-wrap items-center justify-center gap-x-1 border-t border-border pt-4 text-center text-sm text-muted-foreground"
  >
    <a
      class="inline-flex min-h-11 items-center justify-center rounded-sm font-medium text-foreground underline-offset-4 hover:underline focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
      routerLink="/auth/login"
      [queryParams]="{ returnUrl: returnUrl || undefined }"
      i18n="@@auth.forgotPassword.backToSignIn"
      >Back to sign in</a
    >
  </p>
</div>
