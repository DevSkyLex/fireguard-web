<div id="interventions-board" class="flex min-h-0 w-full flex-1 flex-col gap-4 p-4 md:p-6">
  <app-collection-toolbar>
    <div toolbarStart class="flex items-center gap-2">
      <app-collection-search-box
        testIdPrefix="interventions-board"
        placeholder="Search interventions..."
        i18n-placeholder="@@intervention.list.searchPlaceholder"
        ariaLabel="Search interventions..."
        i18n-ariaLabel="@@intervention.list.searchPlaceholder"
        [value]="draftSearch()"
        (queryChanged)="onSearchQueryChanged($event)"
      />
    </div>

    <div toolbarEnd class="flex items-center gap-2">
      <div
        hlmButtonGroup
        data-testid="intervention-view-toggle"
        aria-label="Change view"
        i18n-aria-label="@@intervention.list.viewToggleLabel"
      >
        <a
          hlmBtn
          variant="outline"
          size="sm"
          class="max-sm:min-h-11"
          data-testid="intervention-view-toggle-list"
          [routerLink]="['/organizations', organizationId(), 'interventions']"
          [queryParams]="listQueryParams()"
        >
          <span i18n="@@intervention.board.viewList">List</span>
        </a>
        <button
          hlmBtn
          type="button"
          variant="default"
          size="sm"
          class="max-sm:min-h-11"
          data-testid="intervention-view-toggle-board"
          aria-current="page"
        >
          <span i18n="@@intervention.board.viewBoard">Board</span>
        </button>
        <a
          hlmBtn
          variant="outline"
          size="sm"
          class="max-sm:min-h-11"
          data-testid="intervention-view-toggle-calendar"
          [routerLink]="['/organizations', organizationId(), 'interventions', 'calendar']"
          [queryParams]="listQueryParams()"
        >
          <span i18n="@@intervention.board.viewCalendar">Calendar</span>
        </a>
      </div>
    </div>
  </app-collection-toolbar>

  <div aria-live="polite" class="sr-only" data-testid="intervention-board-live-region">
    {{ liveMessage() }}
  </div>

  <div
    class="flex min-h-0 flex-1 gap-4 overflow-x-auto pb-2 motion-reduce:scroll-auto"
    data-testid="intervention-board"
  >
    @for (status of columns; track status) {
      <section
        class="flex w-72 shrink-0 flex-col gap-3 rounded-md border border-border bg-muted/30 p-3"
        [attr.aria-label]="statusLabelOf(status)"
        data-testid="intervention-board-column"
        [attr.data-status]="status"
      >
        <div class="flex items-center justify-between gap-2">
          <h2 class="text-sm font-semibold text-foreground">{{ statusLabelOf(status) }}</h2>
          <hlm-badge
            variant="secondary"
            data-testid="intervention-board-column-count"
            [attr.aria-label]="columnCountLabelOf(status)"
          >
            {{ (board().get(status) ?? []).length }}
          </hlm-badge>
        </div>

        <div
          cdkDropList
          [id]="dropListId(status)"
          [cdkDropListData]="status"
          [cdkDropListConnectedTo]="dropListIds"
          [cdkDropListEnterPredicate]="canDrop"
          (cdkDropListDropped)="onDropped($event)"
          class="flex min-h-16 flex-1 flex-col gap-2"
          data-testid="intervention-board-column-list"
        >
          @for (item of board().get(status) ?? []; track item.intervention.id) {
            <app-intervention-board-card
              [item]="item"
              [detailRouteBase]="detailRouteBase()"
              [canTransition]="canTransition()"
              [locked]="transitioningIds().includes(item.intervention.id)"
              (moveRequested)="requestMove(item.intervention, $event)"
            />
          } @empty {
            <p
              class="rounded-md border border-dashed border-border p-3 text-center text-xs text-muted-foreground"
              i18n="@@intervention.board.columnEmpty"
            >
              No interventions.
            </p>
          }
        </div>
      </section>
    }
  </div>
</div>
