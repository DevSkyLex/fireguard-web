<p-menu #actionMenu [model]="actionMenuItems()" [popup]="true" appendTo="body" />
<app-table-shell variant="fill">
  <ng-template #actions>
    <div>
      <h2 class="font-semibold" i18n="@@checklist.table.title">Checklists</h2>
      <p class="text-xs text-surface-500" i18n="@@checklist.table.subtitle">
        Reusable inspection templates
      </p>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <p-button
        i18n-label="@@checklist.table.filtersButton"
        label="Filters"
        icon="pi pi-filter"
        severity="secondary"
        size="small"
        [outlined]="true"
        [badge]="filterBadge()"
        (onClick)="onFilterToggle($event)"
        class="w-full sm:w-auto"
      />

      <p-popover #filterPopover>
        <div class="flex w-64 flex-col gap-4">
          <div class="flex flex-col gap-1.5">
            <label i18n="@@common.status" class="text-sm font-medium">Status</label>
            <p-select
              [options]="statusOptions"
              [formControl]="statusControl"
              optionLabel="label"
              optionValue="value"
              i18n-placeholder="@@common.status"
              placeholder="Status"
              size="small"
              [showClear]="true"
              class="w-full"
            >
              <ng-template pTemplate="item" let-option>
                <app-tag [descriptor]="option" variant="inline" />
              </ng-template>

              <ng-template pTemplate="selectedItem" let-option>
                @if (option) {
                  <app-tag [descriptor]="option" variant="inline" />
                }
              </ng-template>
            </p-select>
          </div>

          <div
            class="flex items-center justify-end gap-2 border-t border-surface-200 pt-3 dark:border-surface-800"
          >
            <p-button
              i18n-label="@@common.reset"
              label="Reset"
              severity="secondary"
              size="small"
              [text]="true"
              (onClick)="onResetColumnFilters()"
            />
            <p-button
              i18n-label="@@common.apply"
              label="Apply"
              severity="primary"
              size="small"
              (onClick)="onApplyColumnFilters()"
            />
          </div>
        </div>
      </p-popover>

      @if (canManage()) {
        <p-splitbutton
          label="New checklist"
          i18n-label="@@checklist.newButton"
          icon="pi pi-plus"
          size="small"
          [model]="toolbarActions()"
          [disabled]="loading()"
          (onClick)="add.emit()"
          class="w-full sm:w-auto"
        />
      } @else {
        <p-button
          label="Refresh"
          i18n-label="@@common.refresh"
          icon="pi pi-refresh"
          size="small"
          severity="secondary"
          [outlined]="true"
          [disabled]="loading()"
          class="w-full sm:w-auto"
          (onClick)="onRefresh()"
        />

        <p-button
          i18n-label="@@common.clearFilters"
          label="Clear filters"
          icon="pi pi-filter-slash"
          severity="secondary"
          size="small"
          [outlined]="true"
          [disabled]="loading()"
          class="w-full sm:w-auto"
          (onClick)="onClearFilters()"
        />
      }
    </div>
  </ng-template>

  <ng-template #table>
    <p-table
      [value]="showSkeleton() ? skeletonItems : empty() ? [] : [...checklists()]"
      dataKey="id"
      [lazy]="true"
      [paginator]="true"
      [rows]="rows"
      [first]="firstPage()"
      [totalRecords]="total()"
      [rowsPerPageOptions]="[12, 24, 48]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} checklists"
      i18n-currentPageReportTemplate="@@checklist.table.pageReport"
      [stripedRows]="true"
      [pt]="tablePt({ empty: total() === 0 })"
      (onLazyLoad)="onLazyLoad($event)"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="name">
            <div class="flex items-center gap-2">
              <span i18n="@@common.name">Name</span><p-sortIcon field="name" />
            </div>
          </th>
          <th pSortableColumn="version">
            <div class="flex items-center gap-2">
              <span i18n="@@common.version">Version</span><p-sortIcon field="version" />
            </div>
          </th>
          <th pSortableColumn="status">
            <div class="flex items-center gap-2">
              <span i18n="@@common.status">Status</span><p-sortIcon field="status" />
            </div>
          </th>
          <th i18n="@@checklist.table.lines">Lines</th>
          <th pSortableColumn="updatedAt">
            <div class="flex items-center gap-2">
              <span i18n="@@common.updated">Updated</span><p-sortIcon field="updatedAt" />
            </div>
          </th>
          <th class="w-20"><span class="sr-only" i18n="@@common.actions">Actions</span></th>
        </tr>
      </ng-template>

      <ng-template pTemplate="loadingbody">
        @for (_ of skeletonItems; track $index) {
          <tr>
            <td><p-skeleton width="12rem" /></td>
            <td><p-skeleton width="3rem" /></td>
            <td><p-skeleton width="6rem" height="1.75rem" borderRadius="999px" /></td>
            <td><p-skeleton width="3rem" /></td>
            <td><p-skeleton width="8rem" /></td>
            <td><p-skeleton shape="circle" size="2rem" /></td>
          </tr>
        }
      </ng-template>

      <ng-template pTemplate="body" let-checklist>
        <tr>
          <td>
            <button
              type="button"
              class="font-medium hover:text-primary"
              (click)="view.emit(checklist)"
            >
              {{ checklist.name }}
            </button>
          </td>
          <td>{{ checklist.version }}</td>
          <td>
            <app-tag
              [descriptor]="checklist.status === 'active' ? statusOptions[0] : statusOptions[1]"
            />
          </td>
          <td>{{ checklist.items.length }}</td>
          <td>{{ checklist.updatedAt | date: 'medium' }}</td>
          <td class="text-right">
            <p-button
              icon="pi pi-ellipsis-v"
              severity="secondary"
              size="small"
              [outlined]="true"
              ariaLabel="Checklist actions"
              i18n-ariaLabel="@@checklist.table.actions"
              (onClick)="onActionMenuToggle($event, checklist)"
            />
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr class="bg-transparent! [&>td]:border-b-0!">
          <td colspan="6">
            <app-empty-state
              icon="pi-list-check"
              title="No checklists found"
              i18n-title="@@checklist.table.emptyTitle"
              description="Checklists are the reusable inspection templates your teams run on site."
              i18n-description="@@checklist.table.emptyDesc"
            >
              @if (canManage()) {
                <p-button
                  label="New checklist"
                  i18n-label="@@checklist.newButton"
                  icon="pi pi-plus"
                  severity="primary"
                  size="small"
                  (onClick)="add.emit()"
                />
              }
            </app-empty-state>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </ng-template>
</app-table-shell>
