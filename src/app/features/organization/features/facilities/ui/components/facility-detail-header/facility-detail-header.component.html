@let facility = this.facility();

<div
  class="flex flex-col gap-4 rounded-xl border border-surface-200 bg-surface-0 p-4 lg:flex-row lg:items-start lg:justify-between dark:border-surface-800 dark:bg-surface-900"
>
  <div class="flex min-w-0 items-start gap-3">
    <p-avatar [icon]="facilityTypeIcons[facility.type]" shape="square" size="xlarge" />

    <div class="flex min-w-0 flex-col gap-1">
      <div class="flex flex-wrap items-center gap-2">
        <h1
          class="truncate text-2xl font-semibold tracking-[-0.035em] text-surface-950 dark:text-surface-50"
          [title]="facility.name"
        >
          {{ facility.name }}
        </h1>

        <p-tag
          class="rounded-md text-xs"
          [severity]="facility.type === 'site' ? 'info' : 'secondary'"
        >
          <div class="flex items-center gap-1.5">
            <i [class]="facilityTypeIcons[facility.type]" class="text-xs"></i>
            <span class="font-semibold">{{ facility.type | titlecase }}</span>
          </div>
        </p-tag>

        <app-tag [descriptor]="statusDescriptor(facility.status)" />
      </div>

      <div class="flex flex-wrap items-center gap-3 text-sm text-surface-600 dark:text-surface-400">
        @if (facility.address) {
          <span class="inline-flex items-center gap-1.5">
            <i class="pi pi-map-marker text-xs"></i>
            {{ facility.address }}
          </span>
        }

        @if (facility.code) {
          <span class="font-mono">{{ facility.code }}</span>
        }

        <span i18n="@@facility.header.updated"
          >Updated {{ facility.updatedAt | date: 'mediumDate' }}</span
        >
      </div>
    </div>
  </div>

  @if (canManage()) {
    <!--
      Edit leads; Move and Delete sit under the caret. Three flat buttons gave
      Delete the same weight as the routine action next to it — a destructive
      action offered as prominently as the one used every day.

      The plain button takes over while a delete is running: `p-splitbutton`
      has no `loading` input in this PrimeNG version, and trading the spinner
      for a caret would drop feedback at the moment it matters most.
    -->
    <div class="flex items-center gap-2">
      @if (deleting()) {
        <p-button
          i18n-label="@@common.delete"
          label="Delete"
          icon="pi pi-trash"
          severity="danger"
          [outlined]="true"
          size="small"
          [loading]="true"
        />
      } @else {
        <p-splitbutton
          i18n-label="@@common.edit"
          label="Edit"
          icon="pi pi-pencil"
          severity="secondary"
          [outlined]="true"
          size="small"
          appendTo="body"
          [model]="overflowItems()"
          data-testid="facility-header-actions"
          (onClick)="edit.emit()"
        />
      }
    </div>
  }
</div>
