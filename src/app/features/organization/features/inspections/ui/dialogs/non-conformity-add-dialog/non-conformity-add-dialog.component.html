<hlm-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-dialog-content
    class="max-h-[calc(100svh-2rem)] overflow-y-auto overscroll-contain sm:max-w-lg"
    data-testid="non-conformity-add-dialog"
    *hlmDialogPortal
  >
    <hlm-dialog-header>
      <h3 hlmDialogTitle i18n="@@inspection.nc.addDialog.title">Add non-conformity</h3>
      <p hlmDialogDescription i18n="@@inspection.nc.addDialog.description">
        Record a finding on this inspection, with its severity and an optional due date.
      </p>
    </hlm-dialog-header>

    <app-non-conformity-add-form
      [visible]="visible()"
      [pending]="pending()"
      [serverError]="serverError()"
      (submitted)="submitted.emit($event)"
      (cancelled)="visibleChange.emit(false)"
    />
  </hlm-dialog-content>
</hlm-dialog>
