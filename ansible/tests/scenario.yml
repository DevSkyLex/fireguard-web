---
- name: Configure the isolated environment
  ansible.builtin.set_fact:
    fireguard_environment: '{{ test_environment }}'
    fireguard_app_dir: '{{ test_directory.path }}/{{ test_environment }}'
    fireguard_project_name: '{{ test_directory.path | basename | lower }}-{{ test_environment }}'
    fireguard_container_name: '{{ test_directory.path | basename | lower }}-{{ test_environment }}'
    fireguard_router_name: '{{ test_directory.path | basename | lower }}-{{ test_environment }}'
    fireguard_image: '{{ test_image.stdout }}'
    fireguard_app_host: ansible-test.invalid
    fireguard_app_port: '4000'
    fireguard_api_url: https://api.ansible-test.invalid
    fireguard_mercure_url: https://api.ansible-test.invalid/.well-known/mercure
    fireguard_app_name: 'Fireguard "test" O''Brien ${tenant} \ fixture'
    fireguard_maintenance: 'false'
    fireguard_basic_auth_users: "{{ 'test:$2y$05$fixture.hash.with.literal.dollars' if test_environment == 'development' else '' }}"
    fireguard_compose_source_dir: /workspace
    fireguard_compose_files: "{{ ['docker-compose.prod.yml', 'docker-compose.dev.yml', 'docker-compose.test.yml'] if test_environment == 'development' else ['docker-compose.prod.yml', 'docker-compose.test.yml'] }}"

- name: Exercise safe deployment and refusal paths
  block:
    - name: Create the fixture installation directory
      ansible.builtin.file:
        path: '{{ fireguard_app_dir }}'
        state: directory
        mode: '0755'

    - name: Disable Traefik exposure and supply a healthy fixture process
      ansible.builtin.copy:
        dest: '{{ fireguard_app_dir }}/docker-compose.test.yml'
        mode: '0644'
        content: |
          services:
            fireguard-web:
              command: [sh, -c, 'while true; do sleep 3600; done']
              healthcheck:
                test: [CMD, 'true']
                interval: 1s
                timeout: 1s
                retries: 5
              labels:
                traefik.enable: 'false'

    - name: Deploy with the real role
      ansible.builtin.include_role:
        name: web
        public: true

    - name: Inspect the isolated fixture container
      ansible.builtin.command:
        argv: [docker, inspect, '{{ fireguard_container_name }}']
      register: test_inspection
      changed_when: false
      no_log: true

    - name: Verify identity, runtime values and environment-specific protections
      vars:
        container: '{{ (test_inspection.stdout | from_json)[0] }}'
        labels: '{{ container.Config.Labels }}'
        middleware_key: 'traefik.http.routers.{{ fireguard_router_name }}.middlewares'
        auth_key: 'traefik.http.middlewares.{{ fireguard_router_name }}-auth.basicauth.users'
        robots_key: 'traefik.http.middlewares.{{ fireguard_router_name }}-noindex.headers.customresponseheaders.X-Robots-Tag'
      ansible.builtin.assert:
        that:
          - container.Name == '/' + fireguard_container_name
          - container.State.Health.Status == 'healthy'
          - labels['com.docker.compose.project'] == fireguard_project_name
          - labels['com.docker.compose.project.working_dir'] == fireguard_app_dir
          - labels['traefik.enable'] == 'false'
          - "'APP_NAME=' + fireguard_app_name in container.Config.Env"
          - "'APP_API_URL=' + fireguard_api_url in container.Config.Env"
          - "'APP_MERCURE_HUB_URL=' + fireguard_mercure_url in container.Config.Env"
          - "'APP_MAINTENANCE=false' in container.Config.Env"
          - labels[middleware_key] == fireguard_secure_middlewares
          - labels.get(auth_key, '') == fireguard_basic_auth_users
          - labels.get(robots_key, '') == ('noindex,nofollow,noarchive' if test_environment == 'development' else '')
      no_log: true

    - name: Redeploy the same image and configuration
      ansible.builtin.include_role:
        name: web

    - name: Verify the existing container was preserved
      ansible.builtin.include_tasks: unchanged.yml

    - name: Require refusal of a different Compose project
      block:
        - name: Attempt deployment under a different project
          ansible.builtin.include_role:
            name: web
          vars:
            fireguard_project_name: '{{ test_directory.path | basename | lower }}-wrong-project'
        - name: Fail if the conflicting project was accepted
          ansible.builtin.fail:
            msg: A conflicting Compose project was accepted.
      rescue:
        - name: Verify the failure came from the identity guard
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg == 'Existing container belongs to a different project or directory; refusing migration.'

    - name: Require refusal of a different installation directory
      block:
        - name: Attempt deployment in a different directory
          ansible.builtin.include_role:
            name: web
          vars:
            fireguard_app_dir: '{{ test_directory.path }}/wrong-directory'
        - name: Fail if the conflicting directory was accepted
          ansible.builtin.fail:
            msg: A conflicting installation directory was accepted.
      rescue:
        - name: Verify the failure came from the directory guard
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg == 'Existing container belongs to a different project or directory; refusing migration.'

    - name: Verify the conflicting directory was never created
      ansible.builtin.stat:
        path: '{{ test_directory.path }}/wrong-directory'
      register: test_wrong_directory

    - name: Require refusal of a mutable image tag
      block:
        - name: Attempt deployment of a mutable image tag
          ansible.builtin.include_role:
            name: web
          vars:
            fireguard_image: busybox:latest
        - name: Fail if the mutable image tag was accepted
          ansible.builtin.fail:
            msg: A mutable image tag was accepted.
      rescue:
        - name: Verify the failure came from the immutable image guard
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg == 'Invalid deployment identity, directory, port, or immutable image.'

    - name: Verify refusals left the existing container unchanged
      ansible.builtin.include_tasks: unchanged.yml

    - name: Confirm no installation was created by a rejected deployment
      ansible.builtin.assert:
        that:
          - not test_wrong_directory.stat.exists

  always:
    - name: Remove only this scenario's isolated Compose project
      community.docker.docker_compose_v2:
        project_src: '{{ fireguard_app_dir }}'
        project_name: '{{ fireguard_project_name }}'
        files: '{{ fireguard_compose_files }}'
        state: absent
      no_log: true
