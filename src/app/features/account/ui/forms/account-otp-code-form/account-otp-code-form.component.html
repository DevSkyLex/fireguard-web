<form novalidate (submit)="submit($event)">
  <hlm-field-group>
    <hlm-field>
      <label hlmFieldLabel [attr.for]="inputId()"
        ><span i18n="@@auth.otp.label">Verification code</span
        ><span aria-hidden="true" class="text-destructive">&nbsp;*</span
        ><span class="sr-only" i18n="@@common.required"> required</span></label
      >

      <brn-input-otp
        hlmInputOtp
        class="w-full"
        autocomplete="one-time-code"
        data-testid="account-otp-code"
        [inputId]="inputId()"
        [length]="length"
        [formField]="codeForm.code"
        (completed)="autoSubmit()"
      >
        <hlm-input-otp-group class="min-w-0 flex-1">
          <hlm-input-otp-slot index="0" class="h-11 w-auto min-w-0 flex-1 text-base" />
          <hlm-input-otp-slot index="1" class="h-11 w-auto min-w-0 flex-1 text-base" />
          <hlm-input-otp-slot index="2" class="h-11 w-auto min-w-0 flex-1 text-base" />
        </hlm-input-otp-group>
        <hlm-input-otp-separator />
        <hlm-input-otp-group class="min-w-0 flex-1">
          <hlm-input-otp-slot index="3" class="h-11 w-auto min-w-0 flex-1 text-base" />
          <hlm-input-otp-slot index="4" class="h-11 w-auto min-w-0 flex-1 text-base" />
          <hlm-input-otp-slot index="5" class="h-11 w-auto min-w-0 flex-1 text-base" />
        </hlm-input-otp-group>
      </brn-input-otp>

      <hlm-field-error>{{ codeForm.code().errors()[0]?.message }}</hlm-field-error>
    </hlm-field>

    <hlm-field orientation="horizontal" class="justify-end">
      <button
        hlmBtn
        type="button"
        variant="outline"
        class="min-w-0 shrink max-sm:min-h-11"
        data-testid="account-otp-code-cancel"
        [disabled]="pending()"
        (click)="cancelled.emit()"
      >
        <span class="truncate" i18n="@@common.cancel">Cancel</span>
      </button>

      <button
        hlmBtn
        type="submit"
        [variant]="destructive() ? 'destructive' : 'default'"
        class="min-w-0 shrink max-sm:min-h-11"
        data-testid="account-otp-code-submit"
        [disabled]="pending()"
        [attr.aria-busy]="pending() ? 'true' : null"
        aria-live="polite"
      >
        @if (pending()) {
          <span class="truncate" i18n="@@account.otp.submitting">Checking…</span>
        } @else {
          <span class="truncate">{{ submitLabel() }}</span>
        }
      </button>
    </hlm-field>
  </hlm-field-group>
</form>
