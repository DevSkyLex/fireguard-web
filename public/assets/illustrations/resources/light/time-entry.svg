  <title id="fg-time-entry-light-title">Time entry</title>
  <desc id="fg-time-entry-light-description">A standing stopwatch, its elapsed time lit.</desc>
  <defs>
    <linearGradient id="fg-time-entry-light-cy" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f6f6f7"/><stop offset="1" stop-color="#efeff1"/></linearGradient>
    <linearGradient id="fg-time-entry-light-elapsed" gradientUnits="userSpaceOnUse" x1="188.5" y1="108.4" x2="237.4" y2="234.5"><stop offset="0" stop-color="#18181b" stop-opacity="0.12"/><stop offset="1" stop-color="#18181b" stop-opacity="0.1"/></linearGradient>
    
  </defs>
  <style>
    .fg-time-entry-light { stroke-linecap: round; stroke-linejoin: round; }
    .fg-time-entry-light path { vector-effect: non-scaling-stroke; }
