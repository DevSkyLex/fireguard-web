<div id="new-password-page" class="flex w-full flex-col gap-6">
  <app-page-heading
    heading="Choose a new password"
    i18n-heading="@@auth.newPassword.title"
    description="You will sign in with it right after."
    i18n-description="@@auth.newPassword.subtitle"
  />

  <app-new-password-form
    [pending]="passwordResetStore.isConfirming()"
    (submitted)="reset($event)"
  />
</div>
