<hlm-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-dialog-content
    class="max-h-[calc(100svh-2rem)] overflow-y-auto overscroll-contain sm:max-w-lg mobile-ui:max-h-[calc(100dvh-2rem-env(safe-area-inset-top)-env(safe-area-inset-bottom))] mobile-ui:overflow-y-auto mobile-ui:overscroll-contain"
    data-testid="organization-team-edit-dialog"
    *hlmDialogPortal
  >
    <hlm-dialog-header>
      <h3 hlmDialogTitle i18n="@@org.teams.editDialog.title">Edit team</h3>
      <p hlmDialogDescription i18n="@@org.teams.editDialog.description">
        Rename the team or update its description.
      </p>
    </hlm-dialog-header>

    <app-organization-team-edit-form
      [team]="team()"
      [pending]="pending()"
      [serverError]="serverError()"
      (submitted)="submitted.emit($event)"
      (cancelled)="visibleChange.emit(false)"
    />
  </hlm-dialog-content>
</hlm-dialog>
