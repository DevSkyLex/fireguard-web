@if (organizationContext.selectedOrganizationId() !== null) {
  @if (slotPresentation === 'menu') {
    <button
      #trigger
      hlmItem
      type="button"
      class="min-h-12 cursor-pointer text-start hover:bg-muted focus-visible:bg-muted"
      data-testid="global-search-trigger"
      i18n-aria-label="@@org.search.trigger.aria"
      aria-label="Search this organization"
      aria-haspopup="dialog"
      aria-keyshortcuts="Control+K Meta+K"
      [attr.aria-expanded]="search.paletteVisible()"
      (click)="search.open()"
    >
      <span hlmItemMedia variant="icon">
        <ng-icon name="lucideSearch" aria-hidden="true" />
      </span>
      <span hlmItemContent>
        <span hlmItemTitle i18n="@@org.search.visibleTitle">Search this organization</span>
      </span>
    </button>
  } @else {
    <button
      #trigger
      hlmBtn
      type="button"
      variant="outline"
      class="mobile-ui:size-11 mobile-ui:min-h-11 mobile-ui:px-0 desktop-ui:md:w-56 desktop-ui:md:justify-start desktop-ui:md:pe-1.5"
      data-testid="global-search-trigger"
      i18n-aria-label="@@org.search.trigger.aria"
      aria-label="Search this organization"
      aria-haspopup="dialog"
      aria-keyshortcuts="Control+K Meta+K"
      [attr.aria-expanded]="search.paletteVisible()"
      (click)="search.open()"
    >
      <ng-icon name="lucideSearch" class="text-base" aria-hidden="true" />
      <span class="mobile-ui:hidden" i18n="@@org.search.trigger.label">Search</span>
      <kbd hlmKbdGroup class="max-md:hidden md:ms-auto mobile-ui:hidden">
        <kbd hlmKbd>{{ search.shortcutModifier() }}</kbd>
        <kbd hlmKbd>K</kbd>
      </kbd>
    </button>
  }
}
