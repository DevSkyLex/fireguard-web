name: Prepare Node Workspace
description: Setup Node.js, restore the npm cache, install project dependencies, and optionally install Playwright browsers.

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '22.23.3'
  npm-version:
    description: Exact npm version used to reproduce the reviewed lockfile
    required: false
    default: '11.16.0'
  install-dependencies:
    description: Whether npm dependencies should be installed
    required: false
    default: 'true'
  install-playwright-browsers:
    description: Whether Playwright browsers should be installed
    required: false
    default: 'false'
  playwright-browsers:
    description: Space-separated list of Playwright browsers to install
    required: false
    default: chromium

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Pin npm on the disposable CI runner
      shell: bash
      env:
        NPM_VERSION: ${{ inputs.npm-version }}
      run: |
        [[ "$NPM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'An exact npm version is required'; exit 1; }
        npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
        node --version
        npm --version

    - name: Install dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      run: npm ci --no-audit --no-fund

    - name: Cache Playwright browsers
      if: ${{ inputs.install-playwright-browsers == 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-${{ inputs.playwright-browsers }}
        restore-keys: ${{ runner.os }}-playwright-

    - name: Install Playwright browsers
      if: ${{ inputs.install-playwright-browsers == 'true' }}
      shell: bash
      run: npx playwright install --with-deps ${{ inputs.playwright-browsers }}
