@if (iconOnly()) {
  <div
    class="flex h-14 items-center justify-center border-b border-surface-200 px-3 dark:border-surface-800"
  >
    @if (collapsible()) {
      <button
        type="button"
        class="flex size-9 cursor-pointer items-center justify-center rounded-md transition-colors hover:bg-surface-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:hover:bg-surface-900"
        pTooltip="Expand sidebar"
        i18n-pTooltip="@@layout.sidebar.expand"
        tooltipPosition="right"
        aria-label="Expand sidebar"
        i18n-aria-label="@@layout.sidebar.expand"
        (click)="sidebarService.togglePrimaryCollapsed()"
      >
        <app-logo class="size-7 text-surface-950 dark:text-surface-50" />
      </button>
    } @else {
      <app-logo class="size-7 text-surface-950 dark:text-surface-50" />
    }
  </div>
} @else {
  <div
    class="flex h-14 items-center gap-2 border-b border-surface-200 px-4 dark:border-surface-800"
  >
    @if (!hasOrganization()) {
      <app-logo class="size-7 shrink-0 text-surface-950 dark:text-surface-50" />
    }

    <p
      class="min-w-0 flex-1 truncate pl-1 text-base font-bold tracking-[-0.01em] text-surface-950 dark:text-surface-50"
      data-testid="sidebar-workspace-name"
    >
      {{ workspaceName() }}
    </p>

    @if (settingsLink(); as link) {
      <a
        [routerLink]="link"
        class="flex size-7 shrink-0 cursor-pointer items-center justify-center rounded-md text-surface-500 transition-colors hover:bg-surface-100 hover:text-surface-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:text-surface-400 dark:hover:bg-surface-900 dark:hover:text-surface-100"
        pTooltip="Organization settings"
        i18n-pTooltip="@@layout.sidebar.settings"
        tooltipPosition="bottom"
        aria-label="Organization settings"
        i18n-aria-label="@@layout.sidebar.settings"
        data-testid="sidebar-settings-link"
      >
        <i class="pi pi-cog text-sm" aria-hidden="true"></i>
      </a>
    }

    @if (collapsible()) {
      <button
        type="button"
        class="flex size-7 shrink-0 cursor-pointer items-center justify-center rounded-md text-surface-500 transition-colors hover:bg-surface-100 hover:text-surface-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:text-surface-400 dark:hover:bg-surface-900 dark:hover:text-surface-100"
        pTooltip="Collapse sidebar"
        i18n-pTooltip="@@layout.sidebar.collapse"
        tooltipPosition="right"
        aria-label="Collapse sidebar"
        i18n-aria-label="@@layout.sidebar.collapse"
        (click)="sidebarService.togglePrimaryCollapsed()"
      >
        <i class="pi pi-angle-left text-sm" aria-hidden="true"></i>
      </button>
    }
  </div>
}
