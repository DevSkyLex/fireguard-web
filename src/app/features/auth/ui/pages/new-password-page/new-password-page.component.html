<div id="new-password-page" class="flex w-full max-w-sm flex-col gap-6">
  <header class="flex flex-col gap-1.5">
    <h1
      class="text-2xl font-semibold tracking-tight text-foreground"
      i18n="@@auth.newPassword.title"
    >
      Choose a new password
    </h1>
    <p class="text-sm text-muted-foreground" i18n="@@auth.newPassword.subtitle">
      You will sign in with it right after.
    </p>
  </header>

  <app-new-password-form
    [pending]="passwordResetStore.isConfirming()"
    (submitted)="reset($event)"
  />
</div>
