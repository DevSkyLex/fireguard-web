<div id="mfa-verification-page" class="mx-auto flex w-full max-w-xl flex-col gap-8 px-6 sm:px-8">
  <!-- MFA Verification Form -->
  <section class="flex flex-col gap-2">
    <h1
      class="text-2xl font-semibold tracking-tight text-surface-900 sm:text-[1.75rem] dark:text-surface-50"
      i18n="@@auth.mfa.title"
    >
      Multi-Factor Authentication
    </h1>
    <p
      class="text-sm leading-relaxed text-surface-500 dark:text-surface-400"
      i18n="@@auth.mfa.subtitle"
    >
      Please enter the verification code from your authenticator app or email.
    </p>
    @if (mfaDestination(); as destination) {
      <p
        class="mt-1 text-sm text-surface-500 dark:text-surface-400"
        data-testid="mfa-verification-destination"
      >
        <ng-container i18n="@@auth.mfa.destination"
          >Verification method: {{ destination }}</ng-container
        >
      </p>
    }
  </section>

  <!-- OTP Verification Form -->
  <app-otp-verification-form
    [showTrustDevice]="showTrustDevice()"
    [loading]="loading()"
    [resendIn]="resendIn()"
    [showResend]="showResend()"
    (submitted)="handleOtpSubmit($event)"
    (cancelled)="handleOtpCancel()"
    (resend)="handleOtpResend()"
  />
</div>
