<!--
  Two shells, one body: a reference whose kind has a page is a link, one that
  has none is plain content. A dead <a> would advertise a navigation the app
  cannot perform.
-->
@if (routeLink(); as link) {
  <a
    [routerLink]="link"
    class="flex max-w-[30rem] items-center gap-2.5 rounded-lg border px-2.5 py-2 transition-colors hover:bg-surface-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:hover:bg-surface-800/60"
    [class]="
      isDanger()
        ? 'border-red-300 bg-red-50/60 dark:border-red-900 dark:bg-red-950/30'
        : 'border-surface-200 dark:border-surface-700'
    "
    data-testid="message-reference"
    [attr.data-reference-type]="reference().type"
  >
    <ng-container [ngTemplateOutlet]="body" />
  </a>
} @else {
  <div
    class="flex max-w-[30rem] items-center gap-2.5 rounded-lg border px-2.5 py-2"
    [class]="
      isDanger()
        ? 'border-red-300 bg-red-50/60 dark:border-red-900 dark:bg-red-950/30'
        : 'border-surface-200 dark:border-surface-700'
    "
    data-testid="message-reference"
    [attr.data-reference-type]="reference().type"
  >
    <ng-container [ngTemplateOutlet]="body" />
  </div>
}

<ng-template #body>
  <span class="grid size-8 shrink-0 place-items-center rounded-md" [class]="tileClass()">
    <i [class]="icon()" aria-hidden="true"></i>
  </span>

  <span class="flex min-w-0 flex-1 flex-col">
    <span
      class="truncate text-xs font-medium text-surface-800 dark:text-surface-200"
      data-testid="message-reference-title"
    >
      {{ title() }}
    </span>
    <!--
      The kind, always. The danger variant must not rest on its colour alone
      (PRODUCT.md), and on the neutral variants it says what the title is.
    -->
    <span
      class="text-[11px] text-surface-500 dark:text-surface-400"
      data-testid="message-reference-kind"
    >
      {{ typeLabel() }}
    </span>
  </span>

  @if (code(); as referenceCode) {
    <span
      class="shrink-0 rounded px-1.5 py-0.5 font-mono text-[11px]"
      [class]="
        isDanger()
          ? 'bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300'
          : 'bg-surface-100 text-surface-600 dark:bg-surface-800 dark:text-surface-300'
      "
      data-testid="message-reference-code"
      >{{ referenceCode }}</span
    >
  }
</ng-template>
