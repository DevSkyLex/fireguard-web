<div
  id="error-content"
  class="flex min-h-full flex-col items-center justify-center px-4 py-16 text-center"
>
  <p
    class="text-7xl leading-none font-semibold tracking-tight text-surface-300 select-none dark:text-surface-700"
    aria-hidden="true"
  >
    {{ code() }}
  </p>

  <h1 class="mt-6 text-2xl font-semibold text-surface-900 dark:text-surface-100">
    {{ title() }}
  </h1>

  <p class="mt-2 mb-8 max-w-sm text-sm text-surface-500 dark:text-surface-400">
    {{ description() }}
  </p>

  <div class="flex flex-wrap items-center justify-center gap-3">
    <ng-content />
  </div>
</div>
