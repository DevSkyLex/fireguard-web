@if (isLoading()) {
  <ul hlmSidebarMenu>
    <li hlmSidebarMenuItem>
      <div class="flex h-12 items-center gap-2 p-2">
        <hlm-skeleton class="size-8 shrink-0 rounded-lg" />
        <div class="grid flex-1 gap-1.5">
          <hlm-skeleton class="h-3.5 w-24" />
          <hlm-skeleton class="h-3 w-16" />
        </div>
      </div>
    </li>
  </ul>
} @else {
  <ul hlmSidebarMenu>
    <li hlmSidebarMenuItem>
      <button
        hlmSidebarMenuButton
        size="lg"
        id="organization-switcher-trigger"
        [hlmDropdownMenuTrigger]="menu"
        [side]="menuSide()"
        align="start"
      >
        @if (active(); as organization) {
          <hlm-avatar class="size-8 shrink-0 rounded-lg">
            @if (organization.logoUrl; as logoUrl) {
              <img hlmAvatarImage [src]="logoUrl" [alt]="organization.name" />
            }
            <span
              hlmAvatarFallback
              class="rounded-lg bg-sidebar-primary text-xs font-semibold text-sidebar-primary-foreground"
              >{{ organization.initials }}</span
            >
          </hlm-avatar>

          <div class="grid flex-1 text-left text-sm leading-tight">
            <span class="truncate font-medium">{{ organization.name }}</span>
            @if (organization.planName; as planName) {
              <span class="truncate text-xs text-muted-foreground">{{ planName }}</span>
            }
          </div>
        } @else {
          <div
            class="flex size-8 shrink-0 items-center justify-center rounded-lg border border-dashed border-sidebar-border"
          >
            <ng-icon
              name="lucideBuilding2"
              class="text-sm text-muted-foreground"
              aria-hidden="true"
            />
          </div>

          <div class="grid flex-1 text-left text-sm leading-tight">
            <span class="truncate font-medium" i18n="@@org.switcher.noneTitle"
              >No organization selected</span
            >
            @if (hasOrganizations()) {
              <span class="truncate text-xs text-muted-foreground" i18n="@@org.switcher.noneChoose"
                >Choose one to start working</span
              >
            } @else {
              <span class="truncate text-xs text-muted-foreground" i18n="@@org.switcher.noneCreate"
                >Create your first one</span
              >
            }
          </div>
        }
        <ng-icon name="lucideChevronsUpDown" class="ml-auto text-base" aria-hidden="true" />
      </button>
    </li>
  </ul>

  <ng-template #menu>
    <hlm-dropdown-menu class="min-w-60 rounded-lg">
      @if (hasOrganizations()) {
        <hlm-dropdown-menu-label i18n="@@org.switcher.heading"
          >Organizations</hlm-dropdown-menu-label
        >
      } @else {
        <p class="px-2 py-1.5 text-xs text-muted-foreground" i18n="@@org.switcher.empty">
          You do not belong to any organization yet.
        </p>
      }

      @for (option of options(); track option.id) {
        <button
          hlmDropdownMenuItem
          class="gap-2"
          [attr.aria-current]="option.active ? 'true' : null"
          (click)="select(option)"
        >
          <hlm-avatar class="size-6 shrink-0 rounded-md">
            @if (option.logoUrl; as logoUrl) {
              <img hlmAvatarImage [src]="logoUrl" [alt]="option.name" />
            }
            <span hlmAvatarFallback class="rounded-md text-[0.625rem] font-semibold">{{
              option.initials
            }}</span>
          </hlm-avatar>
          <span class="truncate">{{ option.name }}</span>
          @if (option.active) {
            <ng-icon name="lucideCheck" class="ml-auto text-sm" aria-hidden="true" />
          }
        </button>
      }

      @if (hasOrganizations()) {
        <hlm-dropdown-menu-separator />
      }

      <button hlmDropdownMenuItem class="gap-2" (click)="createOrganization()">
        <ng-icon name="lucidePlus" class="text-sm" aria-hidden="true" />
        <span i18n="@@org.switcher.create">Create organization</span>
      </button>
    </hlm-dropdown-menu>
  </ng-template>
}
