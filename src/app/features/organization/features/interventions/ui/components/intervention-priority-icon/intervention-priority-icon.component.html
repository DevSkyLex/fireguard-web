<svg
  width="16"
  height="18"
  viewBox="0 0 16 18"
  role="img"
  [attr.aria-label]="ariaLabel()"
  [class]="colorClass()"
>
  <rect
    x="1"
    y="12"
    width="2.6"
    height="4"
    rx="1"
    [class]="filledBars() >= 1 ? 'fill-current' : 'fill-surface-200 dark:fill-surface-700'"
  />
  <rect
    x="5"
    y="9"
    width="2.6"
    height="7"
    rx="1"
    [class]="filledBars() >= 2 ? 'fill-current' : 'fill-surface-200 dark:fill-surface-700'"
  />
  <rect
    x="9"
    y="6"
    width="2.6"
    height="10"
    rx="1"
    [class]="filledBars() >= 3 ? 'fill-current' : 'fill-surface-200 dark:fill-surface-700'"
  />
  <rect
    x="13"
    y="3"
    width="2.6"
    height="13"
    rx="1"
    [class]="filledBars() >= 4 ? 'fill-current' : 'fill-surface-200 dark:fill-surface-700'"
  />
</svg>
