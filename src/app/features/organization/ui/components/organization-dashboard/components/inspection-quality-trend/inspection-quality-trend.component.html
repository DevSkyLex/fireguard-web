<p-menu #actionMenu [model]="menuItems()" [popup]="true" appendTo="body" />

<p-card class="h-full" [pt]="cardPt">
  <ng-template pTemplate="header">
    <section class="flex flex-wrap items-center justify-between gap-x-3 gap-y-2">
      <section class="flex min-w-0 flex-1 basis-48 flex-col">
        <h2
          i18n="@@org.trend.inspQuality.title"
          class="text-lg font-semibold text-balance text-surface-900 dark:text-surface-100"
        >
          Inspection Quality
        </h2>
        <p
          i18n="@@org.trend.inspQuality.desc"
          class="truncate text-sm text-surface-500 dark:text-surface-300"
        >
          Inspection throughput versus opened non-conformity pressure
        </p>
      </section>

      <app-inspection-quality-toolbar
        [activeFilterCount]="activeFilterCount()"
        (filterToggle)="onFilterToggle()"
        (menuToggle)="onMenuToggle($event)"
      />
    </section>
  </ng-template>

  <ng-template pTemplate="content">
    <section class="flex flex-col">
      <app-trend-metric-strip [metrics]="summaryMetrics()" [loading]="isLoading()" />

      <div class="px-4">
        <app-inspection-quality-chart />
      </div>
    </section>
  </ng-template>
</p-card>

<app-trend-filter-drawer
  i18n-title="@@org.trend.inspQuality.filterTitle"
  title="Inspection Quality Filters"
  i18n-description="@@org.trend.inspQuality.filterDesc"
  description="Refine inspection quality metrics by inspection scope, NC severity, period, and comparison mode."
  [visible]="isFilterDrawerVisible()"
  [loading]="isLoading()"
  (cancel)="onCancelFilters()"
  (reset)="onResetFilters()"
  (apply)="onApplyFilters()"
>
  <app-inspection-quality-filters />
</app-trend-filter-drawer>
