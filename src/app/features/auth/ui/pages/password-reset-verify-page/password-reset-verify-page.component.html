<div
  id="password-reset-verify-page"
  class="mx-auto flex w-full max-w-xl flex-col gap-8 px-6 sm:px-8"
>
  <section class="flex flex-col gap-2">
    <h1
      class="text-2xl font-semibold tracking-tight text-surface-900 sm:text-[1.75rem] dark:text-surface-50"
      i18n="@@auth.passwordResetVerify.title"
    >
      Verify Password Reset
    </h1>
    <p
      class="text-sm leading-relaxed text-surface-500 dark:text-surface-400"
      i18n="@@auth.passwordResetVerify.subtitle"
    >
      Please enter the verification code sent to your email to proceed with resetting your password.
    </p>
  </section>

  <!-- OTP verification form -->
  <app-otp-verification-form
    [loading]="loading()"
    [resendIn]="resendIn()"
    (submitted)="handleVerify($event)"
    (cancelled)="handleCancel()"
    (resend)="handleResend()"
  />
</div>
