<button
  type="button"
  class="flex size-9 shrink-0 cursor-pointer items-center justify-center rounded-lg border transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
  [class]="
    isOpen()
      ? 'border-primary-200 bg-primary-50 text-primary-700 dark:border-primary-400/30 dark:bg-primary-400/15 dark:text-primary-300'
      : 'border-surface-200 bg-surface-50 text-surface-600 hover:border-surface-300 hover:bg-surface-100 hover:text-surface-950 dark:border-surface-800 dark:bg-surface-900 dark:text-surface-400 dark:hover:border-surface-700 dark:hover:bg-surface-800 dark:hover:text-surface-50'
  "
  [attr.aria-pressed]="isOpen()"
  aria-label="Toggle assistant"
  i18n-aria-label="@@shell.assistant.toggle"
  pTooltip="Assistant"
  i18n-pTooltip="@@shell.assistant.tooltip"
  tooltipPosition="bottom"
  (click)="toggle()"
>
  <i class="pi pi-sparkles text-base" aria-hidden="true"></i>
</button>
