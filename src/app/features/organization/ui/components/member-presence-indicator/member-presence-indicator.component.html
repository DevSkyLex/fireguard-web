@if (status()) {
  @if (showLabel()) {
    <span class="inline-flex items-center gap-2 text-xs text-muted-foreground">
      <span hlmAvatarBadge [class]="badgeClass()" aria-hidden="true"></span>
      <span>{{ label() }}</span>
    </span>
  } @else {
    <span hlmAvatarBadge [class]="badgeClass()" [attr.title]="label()">
      <svg class="size-full" role="img" viewBox="0 0 10 10" [attr.aria-label]="label()">
        <circle cx="5" cy="5" r="5" />
      </svg>
    </span>
  }
}
