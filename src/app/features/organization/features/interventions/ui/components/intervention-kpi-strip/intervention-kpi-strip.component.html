<div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
  @if (loading()) {
    <span
      class="sr-only"
      role="status"
      data-testid="intervention-kpi-strip-loading"
      i18n="@@intervention.kpi.loadingAria"
      >Loading key figures</span
    >
  }
  @for (tile of tiles(); track tile.id) {
    <div class="h-full" [attr.data-testid]="'intervention-kpi-strip-' + tile.id">
      <app-stat-tile
        class="block h-full"
        [label]="tile.label"
        [value]="tile.value"
        [icon]="tile.icon"
        [tone]="tile.tone"
        [badge]="tile.badge"
        [caption]="tile.caption"
        [description]="tile.context"
        [loading]="loading()"
        [link]="tile.queryParams ? baseRoute() : null"
        [queryParams]="tile.queryParams"
      />
    </div>
  }
</div>
