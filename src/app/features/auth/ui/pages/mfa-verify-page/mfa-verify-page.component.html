<div
  id="mfa-verify-page"
  class="mx-auto flex w-full max-w-md min-w-0 flex-col gap-8 mobile-ui:gap-6"
>
  <app-page-heading heading="Two-factor verification" i18n-heading="@@auth.mfa.title">
    @if (usingRecovery()) {
      <p class="text-sm text-muted-foreground" i18n="@@auth.recovery.instructions">
        Enter one of your saved recovery codes.
      </p>
    } @else if (destination(); as sentTo) {
      <p class="text-sm text-muted-foreground">
        <span i18n="@@auth.mfa.sentTo">We sent a code to</span>
        <span class="mt-1 block font-medium break-all text-foreground">{{ sentTo }}</span>
      </p>
    } @else {
      <p class="text-sm text-muted-foreground" i18n="@@auth.mfa.authenticator">
        Enter the code from your authenticator app.
      </p>
    }
  </app-page-heading>

  @if (usingRecovery()) {
    <app-recovery-code-form
      [pending]="authStore.isVerifyingMfa()"
      [serverError]="authStore.mfaVerifyError()"
      (submitted)="verifyRecovery($event)"
    />
  } @else {
    <app-otp-form
      [pending]="authStore.isVerifyingMfa()"
      [showResend]="canResend()"
      [showTrustDevice]="true"
      [resending]="authStore.isResendingMfa()"
      [serverError]="authStore.mfaVerifyError() ?? authStore.mfaResendError()"
      [resendAvailableIn]="authStore.mfaResendAvailableIn()"
      (submitted)="verify($event)"
      (resent)="resend()"
    />
  }
  @if (!canResend()) {
    <button
      hlmBtn
      type="button"
      variant="link"
      class="mobile-ui:min-h-11"
      [attr.aria-pressed]="usingRecovery()"
      [disabled]="authStore.isVerifyingMfa() || authStore.isResendingMfa()"
      (click)="toggleRecovery()"
    >
      @if (usingRecovery()) {
        <span i18n="@@auth.recovery.useAuthenticator">Use my authenticator</span>
      } @else {
        <span i18n="@@auth.recovery.useCode">Use a recovery code</span>
      }
    </button>
  }

  <p
    class="flex flex-wrap items-center justify-center gap-x-1 text-center text-sm text-muted-foreground"
  >
    <button
      hlmBtn
      type="button"
      variant="link"
      class="h-auto min-h-11 whitespace-normal text-foreground"
      [disabled]="authStore.isVerifyingMfa() || authStore.isResendingMfa()"
      (click)="restartSignIn()"
      i18n="@@auth.forgotPassword.backToSignIn"
    >
      Back to sign in
    </button>
  </p>
</div>
