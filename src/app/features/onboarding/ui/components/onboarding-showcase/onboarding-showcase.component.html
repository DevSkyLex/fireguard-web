<div class="flex max-w-sm flex-col gap-8">
  <div class="flex flex-col gap-2">
    <span class="text-lg font-semibold tracking-tight" i18n="@@onboarding.showcase.brand">
      FireGuard
    </span>
    <p class="text-sm text-muted-foreground" i18n="@@onboarding.showcase.subhead">
      A few steps to get your organization ready.
    </p>
  </div>

  <app-onboarding-step-rail
    [steps]="store.steps()"
    [activeStepKey]="store.nextStep()"
    [progress]="store.progress()"
  />
</div>
