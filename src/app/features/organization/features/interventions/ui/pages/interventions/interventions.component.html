<div id="interventions" class="flex min-h-0 flex-1 flex-col gap-6 overflow-y-auto">
  <header class="flex flex-wrap items-start justify-between gap-3">
    <div class="min-w-0">
      <h1
        i18n="@@intervention.dashboard.title"
        class="text-xl font-semibold text-surface-950 dark:text-surface-0"
      >
        Interventions
      </h1>
      <p
        i18n="@@intervention.dashboard.subtitle"
        class="mt-1 text-sm text-surface-500 dark:text-surface-400"
      >
        Plan field work, track progress and publish when interventions are ready.
      </p>
    </div>

    <p-button
      i18n-label="@@intervention.newButton"
      label="New intervention"
      icon="pi pi-plus"
      severity="primary"
      size="small"
      (onClick)="openCreate()"
    />
  </header>

  <section class="grid grid-cols-2 gap-4 xl:grid-cols-4">
    <app-metric-card
      i18n-title="@@intervention.metric.inProgress.title"
      title="In progress"
      i18n-description="@@intervention.metric.inProgress.description"
      description="Active field work"
      icon="pi pi-bolt"
      [value]="summaryStore.inProgressCount()"
      [loading]="summaryStore.loading()"
    />
    <app-metric-card
      i18n-title="@@intervention.metric.planned.title"
      title="Planned"
      i18n-description="@@intervention.metric.planned.description"
      description="Scheduled, not started"
      icon="pi pi-calendar"
      [value]="summaryStore.plannedCount()"
      [loading]="summaryStore.loading()"
    />
    <app-metric-card
      i18n-title="@@intervention.metric.overdue.title"
      title="Overdue"
      i18n-description="@@intervention.metric.overdue.description"
      description="Past their due date"
      icon="pi pi-exclamation-triangle"
      [value]="summaryStore.overdueCount()"
      [loading]="summaryStore.loading()"
    />
    <app-metric-card
      i18n-title="@@intervention.metric.blocked.title"
      title="Blocked"
      i18n-description="@@intervention.metric.blocked.description"
      description="Have publication blockers"
      icon="pi pi-ban"
      [value]="summaryStore.blockedCount()"
      [loading]="summaryStore.loading()"
    />
  </section>

  <section class="flex flex-col gap-3">
    <h2
      i18n="@@intervention.dashboard.listTitle"
      class="font-semibold text-surface-950 dark:text-surface-0"
    >
      All interventions
    </h2>
    <app-intervention-table
      [interventions]="store.interventionList()"
      [total]="store.totalInterventions()"
      [loading]="store.isLoadingInterventions()"
      [empty]="store.isEmpty()"
      [error]="store.listError()"
      [initialPage]="page()"
      [showHeading]="false"
      [showCreate]="false"
      (load)="onLoad($event)"
      (pageChange)="onPageChange($event)"
      (createRequested)="openCreate()"
      (view)="onView($event)"
    />
  </section>

  <section class="flex flex-col gap-3">
    <h2
      i18n="@@intervention.dashboard.scheduleTitle"
      class="font-semibold text-surface-950 dark:text-surface-0"
    >
      Schedule
    </h2>
    <div class="flex h-[38rem] flex-col">
      <app-intervention-calendar
        class="flex min-h-0 flex-1 flex-col"
        [interventions]="calendarStore.interventions()"
        [loading]="calendarStore.loading()"
        [currentMemberIri]="calendarStore.currentMemberIri()"
        [showCreate]="false"
        (selectIntervention)="onView($event)"
        (selectDay)="openCreateOnDay($event)"
        (focusedDateChange)="onCalendarFocusChange($event)"
      />
    </div>
  </section>
</div>

<app-intervention-create-drawer
  [visible]="createDrawerVisible()"
  (visibleChange)="createDrawerVisible.set($event)"
  [loading]="store.isCreating()"
  [optionsLoading]="planningOptions.loading()"
  [siteOptions]="planningOptions.sites()"
  [memberOptions]="planningOptions.members()"
  [initialPlannedStartAt]="initialPlannedStartAt()"
  (submitted)="create($event)"
/>
