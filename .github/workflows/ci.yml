name: CI

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      e2e_browsers:
        description: Space-separated Playwright projects for the end-to-end job
        required: false
        type: string
        default: chromium
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  CI: true

jobs:
  ci-tooling:
    name: CI Tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test deployment validation
        run: node --test .github/scripts/*.test.mjs

  # ==========================================================================
  # Code Style Check
  # ==========================================================================
  format:
    name: Code Style
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Node workspace
        uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check formatting
        run: npm run format:check

  # ==========================================================================
  # Static Analysis
  # ==========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Node workspace
        uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run oxlint
        run: npm run lint

  # ==========================================================================
  # Unit and Integration Tests
  # ==========================================================================
  tests-unit:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Node workspace
        uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run tests and enforce minimum line coverage
        id: coverage
        run: |
          npm run test:coverage -- \
            --coverage-reporters=lcovonly \
            --coverage-reporters=json-summary \
            --coverage-reporters=text-summary

      - name: Summarize line coverage
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { total: { lines } } = JSON.parse(readFileSync('coverage/fireguard-web/coverage-summary.json', 'utf8'));
          const workspace = JSON.parse(readFileSync('angular.json', 'utf8'));
          const minimum = workspace.projects['fireguard-web'].architect.test.configurations.coverage.coverageThresholds.lines;
          const percentage = 100 * lines.covered / lines.total;
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### Frontend coverage\n\nExecutable lines: **${percentage.toFixed(2)}%** (${lines.covered}/${lines.total}). Required: **${minimum}%**.\n`);
          NODE

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frontend-coverage
          path: |
            coverage/fireguard-web/lcov.info
            coverage/fireguard-web/coverage-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name != 'workflow_call'
        with:
          directory: coverage
          flags: unit
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

  # ==========================================================================
  # Production Build (strict templates, i18n locales, bundle budgets)
  # ==========================================================================
  sonar:
    name: SonarQube Quality Gate (fireguard-web-${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: tests-unit
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Node workspace
        uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download this run's coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/fireguard-web
      - name: Validate analysis inputs
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets[github.ref_name == 'main' && 'SONAR_TOKEN_MAIN' || 'SONAR_TOKEN_DEVELOP'] }}
        run: |
          test -n "$SONAR_HOST_URL" || { echo 'SONAR_HOST_URL is required'; exit 1; }
          test -n "$SONAR_TOKEN" || { echo 'Branch SonarQube token is required'; exit 1; }
          test -s coverage/fireguard-web/lcov.info
          grep -q '^SF:' coverage/fireguard-web/lcov.info
      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets[github.ref_name == 'main' && 'SONAR_TOKEN_MAIN' || 'SONAR_TOKEN_DEVELOP'] }}
        with:
          args: >-
            -Dsonar.projectKey=fireguard-web-${{ github.ref_name }}
            -Dsonar.scm.revision=${{ github.sha }}
      - name: Enforce SonarQube quality gate
        id: sonar-gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets[github.ref_name == 'main' && 'SONAR_TOKEN_MAIN' || 'SONAR_TOKEN_DEVELOP'] }}
        with:
          pollingTimeoutSec: '600'
      - name: Require a passed quality gate
        env:
          GATE_STATUS: ${{ steps.sonar-gate.outputs.quality-gate-status }}
        run: test "$GATE_STATUS" = PASSED
      - name: Summarize SonarQube analysis
        if: ${{ !cancelled() }}
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          GATE_STATUS: ${{ steps.sonar-gate.outputs.quality-gate-status || 'FAILED / UNAVAILABLE' }}
        run: |
          {
            echo '### SonarQube'
            echo
            echo "Project: [fireguard-web-${GITHUB_REF_NAME}](${SONAR_HOST_URL%/}/dashboard?id=fireguard-web-${GITHUB_REF_NAME})"
            echo "Branch: ${GITHUB_REF_NAME}; commit: ${GITHUB_SHA}; gate: ${GATE_STATUS}."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Node workspace
        uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build application
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_call'
        with:
          name: dist
          path: dist
          retention-days: 7
        continue-on-error: true

  # ==========================================================================
  # Translation Catalog Drift (non-blocking)
  # ==========================================================================
  i18n:
    name: Translation Catalog Drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Node workspace
        uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Extract messages
        run: npm run i18n:extract

      - name: Report catalog drift
        run: |
          if git diff --quiet -- src/locale; then
            echo "Translation catalogs are in sync." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::warning::Translation catalogs are out of sync. Run 'npm run i18n:extract' and commit src/locale."
          {
            echo "### Translation catalog drift"
            echo
            echo 'Run `npm run i18n:extract` and commit the updated `src/locale` catalogs.'
            echo
            echo '```diff'
            git diff --stat -- src/locale
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Security Check
  # ==========================================================================
  security:
    name: Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Node workspace
        uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: 'false'

      - name: Check for security vulnerabilities
        run: |
          if npm audit --omit=dev --audit-level=high; then
            echo "No high or critical runtime advisory." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::warning::npm audit reported high or critical runtime advisories."
          {
            echo "### npm audit"
            echo
            echo '```'
            npm audit --omit=dev --audit-level=high || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1

  # ==========================================================================
  # End-to-End Tests
  # ==========================================================================
  # Runs on every pull request and on main. Defaults to chromium; pass
  # `e2e_browsers` on a manual run to widen the matrix (e.g. "chromium webkit").
  tests-end-to-end:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Node workspace
        uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-playwright-browsers: 'true'
          playwright-browsers: ${{ inputs.e2e_browsers || 'chromium' }}

      - name: Run Playwright tests
        env:
          E2E_BROWSERS: ${{ inputs.e2e_browsers || 'chromium' }}
        run: |
          projects=()
          for browser in ${E2E_BROWSERS:-chromium}; do
            projects+=("--project=${browser}")
          done

          npx playwright test "${projects[@]}"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
        continue-on-error: true
