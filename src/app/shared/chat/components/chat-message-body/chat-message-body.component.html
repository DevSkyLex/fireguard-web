<!--
  One binding for the whole body. Splitting it — to weave chips in, say — cuts
  elements in half across bindings, and the parser auto-closes each fragment:
  a mention inside `<strong>` loses its emphasis. Whoever builds the HTML
  substitutes in place instead.

  The skin is a set of descendant rules because the stored HTML carries no
  classes of its own: a sanitizer that keeps only `a[href]` strips everything
  else on the way in, so the tags arrive bare and have to be styled by tag.
-->
<div
  class="[&_a]:text-primary [&_a]:underline [&_a]:underline-offset-2 [&_a:hover]:no-underline [&_blockquote]:my-1 [&_blockquote]:border-l-2 [&_blockquote]:border-surface-300 [&_blockquote]:pl-3 [&_blockquote]:text-surface-700 dark:[&_blockquote]:border-surface-700 dark:[&_blockquote]:text-surface-300 [&_code]:rounded [&_code]:bg-surface-100 [&_code]:px-1 [&_code]:py-0.5 [&_code]:font-mono [&_code]:text-[0.85em] dark:[&_code]:bg-white/10 [&_em]:italic [&_h1]:mt-2 [&_h1]:text-lg [&_h1]:font-semibold [&_h2]:mt-2 [&_h2]:text-base [&_h2]:font-semibold [&_h3]:mt-2 [&_h3]:text-sm [&_h3]:font-semibold [&_li]:my-0.5 [&_ol]:my-1 [&_ol]:list-decimal [&_ol]:pl-5 [&_p+p]:mt-2 [&_pre]:my-1.5 [&_pre]:overflow-x-auto [&_pre]:rounded-lg [&_pre]:border [&_pre]:border-surface-200 [&_pre]:bg-surface-50 [&_pre]:p-3 [&_pre]:text-[0.85em] dark:[&_pre]:border-surface-800 dark:[&_pre]:bg-surface-950 [&_pre_code]:bg-transparent [&_pre_code]:p-0 [&_s]:line-through [&_strong]:font-semibold [&_u]:underline [&_ul]:my-1 [&_ul]:list-disc [&_ul]:pl-5"
  [innerHTML]="bodyHtml()"
></div>
