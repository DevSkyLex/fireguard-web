<p-drawer
  i18n-header="@@intervention.skipDrawer.header"
  header="Skip work item"
  i18n-ariaCloseLabel="@@intervention.skipDrawer.closeAria"
  ariaCloseLabel="Close skip work item"
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [appendTo]="'body'"
  [modal]="true"
  [blockScroll]="true"
  [dismissible]="canDismiss()"
  [showCloseIcon]="canDismiss()"
  [closeOnEscape]="false"
  position="right"
  [styleClass]="drawerStyleClass"
>
  <ng-template #content>
    <app-intervention-skip-form
      [loading]="loading()"
      [serverError]="serverError()"
      [disabled]="disabled()"
      (submitted)="submitted.emit($event)"
    />
  </ng-template>
</p-drawer>
