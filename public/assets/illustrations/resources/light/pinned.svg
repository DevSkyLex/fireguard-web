  <title id="fg-pinned-light-title">Pinned</title>
  <desc id="fg-pinned-light-description">A note held in place by a push pin.</desc>
  <defs>
    <linearGradient id="fg-pinned-light-cy" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f6f6f7"/><stop offset="1" stop-color="#efeff1"/></linearGradient>


  </defs>
  <style>
    .fg-pinned-light { stroke-linecap: round; stroke-linejoin: round; }
    .fg-pinned-light path { vector-effect: non-scaling-stroke; }
    .fg-pinned-light .t { fill: #ffffff; }
    .fg-pinned-light .l { fill: #f6f6f7; }
    .fg-pinned-light .r { fill: #efeff1; }
    .fg-pinned-light .hole { fill: #ececef; }
    .fg-pinned-light .cy { fill: url(#fg-pinned-light-cy); }
    .fg-pinned-light .af { fill: #5f5f68; }
    .fg-pinned-light .kf { fill: #85858e; }
    .fg-pinned-light .eo { fill-rule: evenodd; }
    .fg-pinned-light .o { stroke: #8a8a93; stroke-width: 1.35; }
    .fg-pinned-light .o2 { stroke: #a8a8b0; stroke-width: 1.1; }
    .fg-pinned-light .e { stroke: #dcdce0; stroke-width: 1; }
    .fg-pinned-light .d { stroke: #a1a1aa; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-pinned-light .dh { stroke: #dcdce0; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-pinned-light .g { stroke: #a8a8b0; stroke-width: 1; stroke-dasharray: 3 3; }
    .fg-pinned-light .k { stroke: #85858e; stroke-width: 1.2; }
    .fg-pinned-light .ka, .fg-pinned-light .oa { stroke: #5f5f68; stroke-width: 1.35; }
    .fg-pinned-light .da { stroke: #5f5f68; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-pinned-light .ga { stroke: #5f5f68; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
