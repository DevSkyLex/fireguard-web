<!--
  Mobile only: the four columns collapse to one pane, so the main column needs
  a way back to the channel list.
-->
<p-button
  class="-ml-1 lg:hidden"
  icon="pi pi-bars"
  severity="secondary"
  size="small"
  [text]="true"
  i18n-ariaLabel="@@workspace.header.back.aria"
  ariaLabel="Back to navigation"
  data-testid="workspace-header-back"
  (onClick)="shell.showList()"
/>

<!--
  The heading the shell owes every hosted route — but only the routes that do
  not already have one.

  `DashboardLayout` rendered an `<h1>` from the route title in its page banner;
  the workspace replaced that banner with this 56px header and shipped nothing
  in its place, leaving every route in the shell with no level-1 heading at all.
  Visually hidden because the breadcrumb beside it already says the same thing.

  It is a fallback, and it had stopped behaving like one: four routes render a
  visible `h1` of their own, so those pages carried two level-1 headings. On
  Members and Settings both said the identical word; on the overview and the
  account page they disagreed, which is worse — someone navigating by heading
  met two different answers to "what page is this?".

  `main:has(div h1)` asks whether the routed column (the only `div` descendant
  of `main` that holds page content — this header is not one) brought its own
  heading, and stands down if so. `hidden` rather than a visual class: the
  point is to leave the accessibility tree, not just the screen. Done in CSS so
  it costs no shell/page coupling and survives SSR unchanged.

  Since the uniformization pass, the usual supplier of that page-owned `h1` is
  the shared `app-page-header` primitive (its scaffold nests the `h1` inside a
  `div`, which this selector matches); collection pages that let their table
  name the page still rely on this fallback.
-->
@if (items().at(-1); as current) {
  <h1 class="sr-only [main:has(div_h1)_&]:hidden">{{ current.label }}</h1>
}

<p-breadcrumb
  class="min-w-0 flex-1"
  [home]="breadcrumbService.home()"
  [model]="items()"
  [pt]="breadcrumbPt"
  i18n-homeAriaLabel="@@layout.breadcrumb.home"
  homeAriaLabel="Navigate to dashboard home"
>
  <ng-template #separator>
    <i
      class="pi pi-chevron-right text-xs text-surface-500 dark:text-surface-400"
      aria-hidden="true"
    ></i>
  </ng-template>
</p-breadcrumb>

@if (pageActions().length > 0) {
  <div class="flex shrink-0 items-center gap-2" data-testid="workspace-header-page-actions">
    @for (action of pageActions(); track action.id) {
      <ng-container *ngComponentOutlet="action.component" />
    }
  </div>
}

@if (tools().length > 0) {
  <div class="flex shrink-0 items-center gap-0.5" data-testid="workspace-header-tools">
    @for (tool of tools(); track tool.id) {
      <ng-container *ngComponentOutlet="tool.component" />
    }
  </div>
}
