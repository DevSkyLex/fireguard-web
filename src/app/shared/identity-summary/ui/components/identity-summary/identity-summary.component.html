<div class="flex items-center gap-3">
  <hlm-avatar class="size-14 shrink-0 rounded-full">
    @if (avatarUrl(); as pictureUrl) {
      <img hlmAvatarImage [src]="pictureUrl" alt="" />
    }
    <span hlmAvatarFallback class="rounded-full bg-muted text-sm font-semibold text-foreground">{{
      initials()
    }}</span>
  </hlm-avatar>

  <div class="flex min-w-0 flex-col">
    <span class="truncate text-base font-semibold text-foreground">{{ name() }}</span>
    @if (secondary(); as line) {
      <span class="truncate text-sm break-all text-muted-foreground">{{ line }}</span>
    }
  </div>
</div>
