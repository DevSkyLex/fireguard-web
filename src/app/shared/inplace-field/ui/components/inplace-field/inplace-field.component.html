<div class="flex flex-col gap-1">
  <span class="text-xs font-medium text-surface-500 dark:text-surface-400">{{ label() }}</span>

  @if (editable()) {
    <!--
      Escape closes without saving: the cancel path a keyboard user reaches for
      first, bound here rather than inside the projected control so every field
      behaves the same whatever it projects.
    -->
    <p-inplace
      #inplace
      [closable]="false"
      (onActivate)="onActivate()"
      (keydown.escape)="onCancel()"
    >
      <ng-template #display>
        <span
          class="inline-flex min-h-11 w-full items-center rounded-md px-2 text-sm transition-colors duration-150 hover:bg-surface-50 motion-reduce:transition-none sm:min-h-9 dark:hover:bg-surface-800"
          [class]="
            hasValue()
              ? 'text-surface-900 dark:text-surface-0'
              : 'text-surface-400 dark:text-surface-500'
          "
          [attr.aria-label]="editHint()"
          >{{ displayValue() }}</span
        >
      </ng-template>

      <ng-template #content>
        <div class="flex flex-col gap-2">
          <ng-content select="[editor]" />

          @if (error(); as message) {
            <p class="text-xs text-red-600 dark:text-red-400" role="alert">{{ message }}</p>
          }

          <div class="flex items-center justify-end gap-1.5">
            <p-button
              i18n-label="@@common.cancel"
              label="Cancel"
              severity="secondary"
              [text]="true"
              size="small"
              styleClass="max-sm:min-h-11"
              [disabled]="pending()"
              (onClick)="onCancel()"
            />
            <p-button
              i18n-label="@@common.save"
              label="Save"
              size="small"
              styleClass="max-sm:min-h-11"
              [loading]="pending()"
              (onClick)="onSave()"
            />
          </div>
        </div>
      </ng-template>
    </p-inplace>
  } @else {
    <span
      class="inline-flex min-h-11 items-center px-2 text-sm sm:min-h-9"
      [class]="
        hasValue()
          ? 'text-surface-900 dark:text-surface-0'
          : 'text-surface-400 dark:text-surface-500'
      "
      >{{ displayValue() }}</span
    >
  }
</div>
