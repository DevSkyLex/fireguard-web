<a
  class="flex h-8 items-center gap-2.5 text-sm text-surface-900 transition-colors hover:bg-surface-50 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-primary dark:text-surface-100 dark:hover:bg-white/5"
  [class]="
    nested()
      ? 'ml-3.5 rounded-r-md border-l border-surface-200 pr-2.5 pl-3 dark:border-surface-800'
      : 'rounded-md px-2.5'
  "
  [routerLink]="routerLink()"
  routerLinkActive="bg-surface-50 font-semibold text-surface-950 dark:bg-surface-900 dark:text-surface-50"
  #active="routerLinkActive"
  [routerLinkActiveOptions]="{ exact: exact() }"
  ariaCurrentWhenActive="page"
>
  @if (icon(); as iconClass) {
    <i
      class="w-4 shrink-0 text-center text-sm"
      [class]="
        iconClass + (active.isActive ? ' text-primary' : ' text-surface-400 dark:text-surface-500')
      "
      aria-hidden="true"
    ></i>
  }

  <span class="min-w-0 flex-1 truncate">{{ label() }}</span>

  @if (count(); as total) {
    <span
      class="min-w-[18px] shrink-0 text-center text-xs font-semibold text-surface-600 tabular-nums dark:text-surface-400"
    >
      {{ total }}
    </span>
  }
</a>
