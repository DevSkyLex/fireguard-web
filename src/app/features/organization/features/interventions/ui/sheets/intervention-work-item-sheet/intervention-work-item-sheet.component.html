<hlm-sheet
  [side]="side()"
  [state]="sheetState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-sheet-content
    *hlmSheetPortal
    class="w-full! mobile-ui:max-h-[85svh] mobile-ui:overflow-y-auto desktop-ui:w-[480px]! desktop-ui:max-w-[100vw]!"
    data-testid="intervention-work-item-sheet"
    [attr.data-dirty]="dirty()"
  >
    <hlm-sheet-header>
      <h3 hlmSheetTitle i18n="@@intervention.workItemDrawer.header">Add work item</h3>
      <p hlmSheetDescription i18n="@@intervention.wif.hint">
        Only the action is required; target and assignee can be set now or during execution.
      </p>
    </hlm-sheet-header>

    <app-intervention-work-item-form
      [workloadOrganizationId]="workloadOrganizationId()"
      [workloadStartsOn]="workloadStartsOn()"
      [workloadEndsOn]="workloadEndsOn()"
      [catalogues]="catalogues()"
      (catalogueRequested)="catalogueRequested.emit($event)"
      (catalogueSearched)="catalogueSearched.emit($event)"
      [pending]="pending()"
      [disabled]="disabled()"
      [serverError]="serverError()"
      [targetOptions]="targetOptions()"
      [memberOptions]="memberOptions()"
      (submitted)="submitted.emit($event)"
      (cancelled)="requestClose()"
      (dirtyChanged)="dirty.set($event)"
    />
  </hlm-sheet-content>
</hlm-sheet>

<app-unsaved-changes-dialog
  [state]="unsavedChangesDialogState()"
  (confirmed)="onUnsavedChangesConfirmed()"
  (dismissed)="onUnsavedChangesDismissed()"
/>
