<form class="flex min-w-0 flex-col gap-6" novalidate (submit)="submit($event)">
  <div class="min-w-0">
    <hlm-field-group>
      <hlm-field>
        <label hlmFieldLabel for="onboarding-org-name"
          ><span i18n="@@onboarding.orgForm.name"> Organization name</span><app-required-marker
        /></label>
        <input
          class="max-sm:min-h-11"
          hlmInput
          id="onboarding-org-name"
          type="text"
          data-testid="onboarding-org-name"
          placeholder="Acme Fire Safety"
          i18n-placeholder="@@onboarding.orgForm.namePlaceholder"
          [formField]="organizationForm.name"
          [attr.aria-required]="true"
        />
        <hlm-field-error>{{ organizationForm.name().errors()[0]?.message }}</hlm-field-error>
      </hlm-field>
    </hlm-field-group>
  </div>

  <app-onboarding-step-footer
    [label]="submitLabel"
    [pendingLabel]="pendingLabel"
    [pending]="pending()"
    [skippable]="skippable()"
    submitTestId="onboarding-org-submit"
    (skipped)="skipped.emit()"
  />
</form>
