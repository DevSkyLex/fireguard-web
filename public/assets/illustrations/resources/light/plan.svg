    .fg-plan-light .g { stroke: #a8a8b0; stroke-width: 1; stroke-dasharray: 3 3; }
    .fg-plan-light .k { stroke: #85858e; stroke-width: 1.2; }
    .fg-plan-light .ka, .fg-plan-light .oa { stroke: #5f5f68; stroke-width: 1.35; }
    .fg-plan-light .da { stroke: #5f5f68; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-plan-light .ga { stroke: #5f5f68; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
