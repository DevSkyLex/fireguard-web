@if (isInitialLoading()) {
  <span class="sr-only" role="status" i18n="@@shared.collectionSurface.loading">Loading…</span>
} @else if (loading()) {
  <span
    class="pointer-events-none absolute end-2 top-2 z-20 flex items-center rounded bg-background p-1 text-muted-foreground"
    role="status"
  >
    <hlm-spinner size="xs" aria-hidden="true" />
    <span class="sr-only" i18n="@@shared.collectionSurface.refreshing">Refreshing…</span>
  </span>
}

@switch (visibleSlot()) {
  @case ('error') {
    <ng-content select="[surfaceError]" />
  }
  @case ('empty') {
    <div
      class="flex min-h-32 w-full min-w-0 flex-1 items-center justify-center rounded-xl border border-dashed border-border"
    >
      <ng-content select="[surfaceEmpty]" />
    </div>
  }
  @default {
    <div [class]="tableWrapperClass()">
      <div
        hlmTableContainer
        [class]="containerClass()"
        tabindex="0"
        role="region"
        [attr.aria-labelledby]="captionId()"
      >
        <table hlmTable [attr.data-testid]="testId()">
          <caption hlmTableCaption [id]="captionId()" class="sr-only">
            {{
              caption()
            }}
          </caption>

          <thead hlmTableHeader class="sticky top-0 z-10 bg-background">
            <ng-content select="[surfaceHead]" />
          </thead>

          <tbody hlmTableBody [class]="tbodyClass()">
            @if (isInitialLoading()) {
              <app-collection-skeleton-rows
                [rows]="skeletonRowCount()"
                [columns]="skeletonColumns()"
                [columnCount]="columnCount()"
              />
            } @else {
              <ng-content select="[surfaceRows]" />
            }
          </tbody>
        </table>
      </div>
    </div>

    <div [class]="cardsWrapperClass()" [attr.data-testid]="testId() + '-cards'">
      @if (isInitialLoading()) {
        <app-collection-skeleton-cards [rows]="skeletonRowCount()" />
      } @else {
        <ng-content select="[surfaceCards]" />
      }
    </div>
  }
}
