<form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-3 lg:grid-cols-[1fr_1fr_2fr_auto]">
  <input
    pInputText
    formControlName="fileName"
    fluid
    placeholder="File name"
    i18n-placeholder="@@equipment.attach.fileName"
    aria-label="File name"
    i18n-aria-label="@@equipment.attach.fileName"
    [invalid]="form.controls.fileName.invalid && form.controls.fileName.touched"
  />
  <input
    pInputText
    formControlName="mimeType"
    fluid
    placeholder="MIME type"
    i18n-placeholder="@@equipment.attach.mimeType"
    aria-label="MIME type"
    i18n-aria-label="@@equipment.attach.mimeType"
    [invalid]="form.controls.mimeType.invalid && form.controls.mimeType.touched"
  />
  <input
    pInputText
    formControlName="content"
    fluid
    placeholder="Base64 content"
    i18n-placeholder="@@equipment.attach.content"
    aria-label="Base64 content"
    i18n-aria-label="@@equipment.attach.content"
    [invalid]="form.controls.content.invalid && form.controls.content.touched"
  />
  <p-button
    type="submit"
    label="Attach"
    i18n-label="@@equipment.attach.submit"
    icon="pi pi-paperclip"
    [loading]="loading()"
    [disabled]="form.invalid || loading()"
  />
  @if (form.invalid && form.touched) {
    <p-message
      severity="error"
      variant="simple"
      class="lg:col-span-4"
      i18n="@@equipment.attach.error"
      >File name, MIME type and Base64 content are required.</p-message
    >
  }
  @for (field of ['fileName', 'mimeType', 'content']; track field) {
    @if (serverFieldErrors()[field]; as serverMessage) {
      <p-message severity="error" variant="simple" class="lg:col-span-4" role="alert">
        <span>{{ serverMessage }}</span>
      </p-message>
    }
  }
  @if (unmatchedViolation(); as violation) {
    <p-message severity="error" variant="simple" class="lg:col-span-4" role="alert">
      <span>{{ violation }}</span>
    </p-message>
  }
</form>
