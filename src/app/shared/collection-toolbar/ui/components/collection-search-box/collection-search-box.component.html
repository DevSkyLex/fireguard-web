<hlm-input-group class="w-full max-sm:h-11 sm:w-56">
  <hlm-input-group-addon>
    <ng-icon name="lucideSearch" />
  </hlm-input-group-addon>
  <input
    hlmInputGroupInput
    class="max-sm:h-11"
    type="search"
    [attr.data-testid]="testId()"
    [placeholder]="placeholder()"
    [attr.aria-label]="ariaLabel()"
    [value]="value()"
    (input)="onInput($event)"
  />
</hlm-input-group>
