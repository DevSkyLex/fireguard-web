<div class="relative h-full w-full">
  <div
    #mapContainer
    class="h-full w-full overflow-hidden rounded-xl border border-surface-200 dark:border-surface-800"
    role="region"
    [attr.aria-label]="ariaLabel()"
  ></div>

  @if (error()) {
    <div
      class="absolute inset-0 z-10 flex items-center justify-center rounded-xl border border-surface-200 bg-surface-0/95 backdrop-blur-sm dark:border-surface-800 dark:bg-surface-950/95"
    >
      <app-error-state
        icon="pi-exclamation-triangle"
        i18n-title="@@map.errorTitle"
        title="Map unavailable"
        i18n-description="@@map.errorDescription"
        description="The map could not be loaded on this device. Check your connection and try again."
      >
        <p-button
          i18n-label="@@map.retry"
          label="Retry"
          icon="pi pi-refresh"
          severity="secondary"
          [outlined]="true"
          size="small"
          (onClick)="retry()"
        />
      </app-error-state>
    </div>
  } @else if (loading()) {
    <div
      class="absolute inset-0 z-10 flex items-center justify-center rounded-xl border border-surface-200 bg-surface-0/95 p-4 backdrop-blur-sm dark:border-surface-800 dark:bg-surface-950/95"
    >
      <app-skeleton preset="chart" i18n-label="@@map.loading" label="Loading map" />
    </div>
  }
</div>
