<!--
  `content` is stripped of its padding and made a flex column so the replies
  list — which owns its own scroller — can reach the panel's bottom edge. The
  root only carries the panel's width.

  It also takes the shell's own surface. `ChatThread`'s composer footer is
  opaque — history scrolls behind it — in `surface-0`/`surface-950`, which is
  the surface it was designed to sit on. The drawer's default body is a step
  lighter in dark mode, so leaving it be drew a darker band behind the
  composer. Matching here rather than parameterising the thread: the assumption
  is right for the surface the thread belongs to, and it is this panel that is
  the exception.
-->
<p-drawer
  i18n-header="@@workspace.replies.header"
  header="Thread"
  i18n-ariaCloseLabel="@@workspace.replies.closeAria"
  ariaCloseLabel="Close thread"
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [appendTo]="'body'"
  [modal]="true"
  [blockScroll]="true"
  position="right"
  [pt]="{
    root: { class: drawerStyleClass, 'data-testid': 'message-thread-drawer' },
    content: {
      class:
        '!flex !min-h-0 !flex-1 !flex-col !overflow-hidden !bg-surface-0 !p-0 dark:!bg-surface-950',
    },
  }"
>
  <ng-template #content>
    @if (parentMessage(); as parent) {
      <!--
        The root message, with every control off — including deletion, which
        the message itself may well permit: this is the thread's subject, not
        another row to act on, and acting on it stays where it was opened from.
        Left on, it would draw a bar whose only entry does nothing.
      -->
      <div
        class="shrink-0 border-b border-surface-200 px-4 py-3.5 dark:border-surface-800"
        data-testid="message-thread-drawer-parent"
      >
        <app-chat-message
          [message]="parent"
          [canReact]="false"
          [canPin]="false"
          [canSave]="false"
          [canReply]="false"
          [canCopy]="false"
          [canDelete]="false"
        />
      </div>
    }

    <app-chat-thread
      [messages]="replies()"
      i18n-label="@@workspace.replies.aria"
      label="Replies"
      [loading]="loading()"
      [errorMessage]="errorMessage()"
      [hasMore]="hasMore()"
      [loadedCount]="loadedCount()"
      [totalCount]="totalCount()"
      i18n-loadMoreLabel="@@workspace.replies.loadOlder"
      loadMoreLabel="Load earlier replies"
      i18n-loadingLabel="@@workspace.replies.loading"
      loadingLabel="Loading replies"
      emptyIcon="pi pi-reply"
      i18n-emptyTitle="@@workspace.replies.empty.title"
      emptyTitle="No replies yet"
      i18n-emptyDescription="@@workspace.replies.empty.description"
      emptyDescription="Be the first to answer."
      [canReact]="false"
      [canPin]="false"
      [canSave]="false"
      [canReply]="false"
      [canDelete]="false"
      (loadMore)="loadMore.emit()"
      (copied)="copied.emit($event)"
    >
      <app-message-composer
        i18n-placeholder="@@workspace.replies.placeholder"
        placeholder="Reply to this message"
        [pending]="posting()"
        [members]="members()"
        (sent)="sent.emit($event)"
      />
    </app-chat-thread>
  </ng-template>
</p-drawer>
