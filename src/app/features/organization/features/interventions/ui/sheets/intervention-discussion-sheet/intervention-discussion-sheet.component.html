<hlm-sheet
  [side]="side()"
  [state]="sheetState()"
  [disableClose]="dirty()"
  autoFocus="dialog"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-sheet-content
    *hlmSheetPortal
    id="intervention-discussion-sheet"
    class="w-full! bg-background! mobile-ui:h-[85svh]! desktop-ui:w-[560px]! desktop-ui:max-w-[100vw]!"
    data-testid="intervention-discussion-sheet"
    [attr.data-dirty]="dirty()"
    [showCloseButton]="false"
  >
    <button
      hlmBtn
      variant="ghost"
      size="icon-sm"
      type="button"
      class="absolute end-3 top-3 mobile-ui:size-11 mobile-ui:min-h-11"
      data-testid="intervention-discussion-sheet-close"
      (click)="requestClose()"
    >
      <span class="sr-only" i18n="@@common.close">Close</span>
      <ng-icon name="lucideX" aria-hidden="true" />
    </button>

    <hlm-sheet-header>
      <h3 hlmSheetTitle i18n="@@intervention.discussion.title">Discussion</h3>
      <p hlmSheetDescription i18n="@@intervention.discussion.subtitle">
        Live team messaging about this intervention
      </p>
    </hlm-sheet-header>

    <app-subject-discussion
      subjectType="intervention"
      [subjectId]="interventionId()"
      [organizationId]="organizationId()"
      [active]="visible()"
      [composerAutoFocus]="visible()"
      (dirtyChanged)="dirty.set($event)"
    />
  </hlm-sheet-content>
</hlm-sheet>

<app-unsaved-changes-dialog
  [state]="unsavedChangesDialogState()"
  (confirmed)="onUnsavedChangesConfirmed()"
  (dismissed)="onUnsavedChangesDismissed()"
/>
