<div id="inspection-list" class="flex h-full flex-col gap-6 p-3 sm:p-6 md:p-7 lg:p-8">
  <p
    i18n="@@inspection.list.subtitle"
    class="max-w-[60ch] text-sm text-surface-600 dark:text-surface-400"
  >
    History of the inspections performed across your organization's facilities and equipment.
  </p>

  @if (store.listError()) {
    <p-message severity="error" class="block">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <span class="flex items-center gap-2">
          <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
          <span i18n="@@inspection.list.errorText"
            >The inspections could not be loaded. Check your connection and try again.</span
          >
        </span>
        <p-button
          i18n-label="@@inspection.list.retry"
          label="Retry"
          icon="pi pi-refresh"
          severity="danger"
          [text]="true"
          size="small"
          (onClick)="retry()"
        />
      </div>
    </p-message>
  }

  <app-inspection-table
    class="flex min-h-0 flex-1 flex-col"
    [inspections]="store.inspections()"
    [total]="store.totalInspections()"
    [loading]="store.isLoadingInspections()"
    [empty]="store.isEmpty()"
    [initialPage]="page()"
    [createDisabled]="atInspectionLimit()"
    [createDisabledTooltip]="quotaLimitTooltip"
    (load)="onLoad($event)"
    (pageChange)="onPageChange($event)"
    (add)="onAdd()"
    (view)="onView($event.id)"
    (edit)="onEdit($event)"
    (cancel)="onCancel($event)"
  />
</div>
