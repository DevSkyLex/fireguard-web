<div class="flex h-full flex-col">
  <div class="grid shrink-0 grid-cols-7 border-b border-surface-200 dark:border-surface-800">
    @for (label of weekdayLabels(); track label) {
      <div
        class="px-2.5 py-2.5 text-[11px] font-semibold tracking-[0.05em] text-surface-500 uppercase dark:text-surface-400"
      >
        {{ label }}
      </div>
    }
  </div>

  <div class="grid min-h-0 flex-1 auto-rows-fr grid-cols-7 overflow-y-auto">
    @for (day of days(); track day.date.getTime()) {
      <div
        class="group flex min-h-20 flex-col gap-1 border-r border-b border-surface-100 px-1.5 pt-1.5 pb-2 sm:min-h-[118px] dark:border-surface-800/70 [&:nth-child(7n)]:border-r-0"
        [class]="cellClass(day)"
        [attr.aria-current]="day.isToday ? 'date' : null"
      >
        <div class="flex items-center justify-between">
          <!--
            The date number is the day's own target, rather than the whole
            cell: the cell already contains buttons (create, event chips), and
            wrapping it in one more would nest interactive elements — invalid
            markup, and a keyboard trap. This stays a real button, so it is
            focusable and reachable without a pointer.
          -->
          <button
            type="button"
            class="grid size-6 cursor-pointer place-items-center rounded-full text-xs font-semibold tabular-nums transition-colors motion-reduce:transition-none"
            [class]="
              day.isToday
                ? 'bg-primary-500 text-white'
                : day.inMonth
                  ? 'text-surface-700 hover:bg-surface-100 dark:text-surface-200 dark:hover:bg-surface-800'
                  : 'text-surface-400 hover:bg-surface-100 dark:text-surface-600 dark:hover:bg-surface-800'
            "
            aria-label="Open {{ day.date | date: 'longDate' }}"
            i18n-aria-label="@@calendar.openDay"
            data-testid="calendar-day-select"
            (click)="daySelect.emit(day.date)"
          >
            {{ day.date.getDate() }}
          </button>
          <button
            type="button"
            class="grid size-5 cursor-pointer place-items-center rounded text-surface-400 opacity-0 transition-opacity group-hover:opacity-100 hover:bg-surface-100 hover:text-surface-700 focus-visible:opacity-100 motion-reduce:transition-none max-sm:opacity-100 dark:hover:bg-surface-800 dark:hover:text-surface-200"
            aria-label="Create on {{ day.date | date: 'longDate' }}"
            i18n-aria-label="@@calendar.createOn"
            (click)="dayCreate.emit(day.date)"
          >
            <i class="pi pi-plus text-[0.65rem]" aria-hidden="true"></i>
          </button>
        </div>

        <div class="flex flex-col gap-1">
          @for (event of visibleEvents(day); track event.id) {
            <button
              type="button"
              class="w-full cursor-pointer overflow-hidden rounded border border-transparent text-left transition-colors duration-150 hover:border-current/40 focus-visible:border-current/60 motion-reduce:transition-none"
              [class]="chipClass(event)"
              [attr.aria-label]="openLabel(event.title)"
              (click)="eventClick.emit(event)"
            >
              <ng-container
                [ngTemplateOutlet]="eventTemplate()"
                [ngTemplateOutletContext]="{ $implicit: event }"
              />
            </button>
          }
          @if (overflowCount(day) > 0) {
            <button
              type="button"
              class="cursor-pointer self-start rounded px-1.5 py-0.5 text-left text-[11px] font-semibold text-surface-500 transition-colors duration-150 hover:bg-surface-100 hover:text-surface-950 motion-reduce:transition-none dark:text-surface-400 dark:hover:bg-surface-800 dark:hover:text-surface-50"
              (click)="daySelect.emit(day.date)"
              i18n="@@calendar.moreEvents"
            >
              +{{ overflowCount(day) }} more
            </button>
          }
        </div>
      </div>
    }
  </div>
</div>
