<hlm-alert-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-alert-dialog-content
    class="max-h-[calc(100svh-2rem)] overflow-y-auto overscroll-contain mobile-ui:max-h-[calc(100dvh-2rem-env(safe-area-inset-top)-env(safe-area-inset-bottom))] mobile-ui:overflow-y-auto mobile-ui:overscroll-contain"
    *hlmAlertDialogPortal
    data-testid="organization-invitation-revoke-dialog"
  >
    <hlm-alert-dialog-header>
      <h2 hlmAlertDialogTitle i18n="@@org.invitations.revokeConfirmTitle">
        Revoke this invitation?
      </h2>
      <p hlmAlertDialogDescription>{{ description() }}</p>
    </hlm-alert-dialog-header>

    @if (error(); as message) {
      <p
        role="alert"
        class="text-sm text-destructive"
        data-testid="organization-invitation-revoke-error"
      >
        {{ message }}
      </p>
    }

    <hlm-alert-dialog-footer>
      <button class="mobile-ui:min-h-11" hlmAlertDialogCancel i18n="@@common.cancel">Cancel</button>
      <button
        class="mobile-ui:min-h-11"
        hlmAlertDialogAction
        variant="destructive"
        data-testid="organization-invitation-revoke-confirm"
        [disabled]="pending()"
        (click)="confirm()"
      >
        @if (pending()) {
          <span i18n="@@org.invitations.revokeConfirmPending">Revoking…</span>
        } @else {
          <span i18n="@@org.invitations.revokeConfirmAction">Revoke</span>
        }
      </button>
    </hlm-alert-dialog-footer>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
