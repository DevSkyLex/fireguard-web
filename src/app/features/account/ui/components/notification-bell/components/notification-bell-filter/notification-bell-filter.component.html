<div class="flex border-b border-surface-100 px-3 py-2 dark:border-surface-800">
  <p-select-button
    i18n-ariaLabel="@@account.notifications.filterAria"
    ariaLabel="Filter notifications"
    [options]="options"
    [ngModel]="selectedValue()"
    (ngModelChange)="filterChange.emit($event)"
    optionLabel="label"
    optionValue="value"
    fluid
  />
</div>
