@if (rendered()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center overflow-hidden bg-surface-0 transition-opacity duration-300 ease-out dark:bg-surface-950"
    [class.opacity-0]="hiding()"
    role="status"
    aria-live="polite"
  >
    <!-- Ambient brand halo — subtle on white, a touch warmer in the dark -->
    <div
      class="pointer-events-none absolute top-1/2 left-1/2 size-[28rem] -translate-x-1/2 -translate-y-1/2 rounded-full bg-primary-500/5 blur-3xl dark:bg-primary-500/10"
      aria-hidden="true"
    ></div>

    <div class="relative flex flex-col items-center gap-10">
      <!-- Bare brand mark — gently pulses while booting (no tile, no ring) -->
      <app-logo
        data-testid="boot-indicator"
        class="size-24 text-surface-950 motion-reduce:animate-none dark:text-surface-50"
        [class.animate-pulse]="!stalled()"
        aria-hidden="true"
      />

      <!-- Phase title + detail -->
      <div class="flex max-w-xs flex-col items-center gap-2 text-center">
        <span class="text-2xl font-semibold tracking-tight text-surface-950 dark:text-surface-50">
          {{ statusTitle() }}
        </span>
        <p class="text-sm leading-relaxed text-surface-500 dark:text-surface-400">
          {{ statusDetail() }}
        </p>
      </div>

      @if (stalled()) {
        <!-- Boot failed to settle — offer a way out -->
        <p-button
          label="Retry"
          i18n-label="@@common.retry"
          icon="pi pi-refresh"
          size="small"
          severity="secondary"
          (onClick)="retry()"
        />
      }
    </div>
  </div>
}
