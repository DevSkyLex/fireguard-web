<!--
  `hlm-input-group` is spartan's own answer to "a control inside a field": it
  owns the border, the focus ring and the spacing, and the addon reserves real
  layout space rather than floating over the text. Positioning a button
  absolutely on top of a bare input looked the same until a long value scrolled
  under it.
-->
<hlm-input-group>
  <input
    hlmInputGroupInput
    [id]="inputId()"
    [type]="revealed() ? 'text' : 'password'"
    [attr.autocomplete]="autocomplete()"
    [attr.placeholder]="placeholder()"
    [formField]="field()"
    [attr.aria-invalid]="field()().touched() && field()().invalid()"
  />

  <hlm-input-group-addon align="inline-end">
    <button
      hlmInputGroupButton
      type="button"
      [attr.aria-label]="toggleLabel()"
      [attr.aria-pressed]="revealed()"
      (click)="toggle()"
    >
      <ng-icon [name]="revealed() ? 'lucideEyeOff' : 'lucideEye'" />
    </button>
  </hlm-input-group-addon>
</hlm-input-group>
