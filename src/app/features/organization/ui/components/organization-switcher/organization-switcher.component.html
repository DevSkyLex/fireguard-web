@if (loading() && !active()) {
  <div class="flex items-center gap-2.5" role="status">
    <span class="sr-only" i18n="@@org.switcher.loading">Loading organizations…</span>
    <p-skeleton size="28px" borderRadius="6px" aria-hidden="true" />
    <p-skeleton width="8rem" height="1rem" aria-hidden="true" />
  </div>
} @else if (active(); as current) {
  <!--
    The trigger doubles as the sidebar's title: the organization name is the
    heading of this column, and switching is the same control rather than a
    separate rail. A member with a single organization gets the same label
    without the affordance, so nothing suggests a choice that does not exist.
  -->
  @if (canSwitch()) {
    <button
      type="button"
      class="flex min-h-11 w-full min-w-0 items-center gap-2.5 rounded-md px-2 py-1.5 text-left transition-colors hover:bg-surface-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:hover:bg-white/5"
      [attr.aria-expanded]="expanded()"
      aria-haspopup="menu"
      i18n-aria-label="@@org.switcher.trigger.aria"
      aria-label="Switch organization"
      data-testid="organization-switcher"
      (click)="popover.toggle($event)"
    >
      @if (current.logoUrl; as logoUrl) {
        <img class="size-7 shrink-0 rounded-md object-cover" [src]="logoUrl" alt="" />
      } @else {
        <span
          class="grid size-7 shrink-0 place-content-center rounded-md bg-primary/10 text-xs font-semibold text-primary"
          aria-hidden="true"
          >{{ current.initials }}</span
        >
      }
      <span
        class="min-w-0 flex-1 truncate text-base font-semibold tracking-tight text-surface-950 dark:text-surface-50"
        >{{ current.name }}</span
      >
      <i
        class="pi pi-chevron-down shrink-0 text-xs text-surface-500 dark:text-surface-400"
        aria-hidden="true"
      ></i>
    </button>
  } @else {
    <div class="flex min-h-11 items-center gap-2.5 px-2 py-1.5">
      @if (current.logoUrl; as logoUrl) {
        <img class="size-7 shrink-0 rounded-md object-cover" [src]="logoUrl" alt="" />
      } @else {
        <span
          class="grid size-7 shrink-0 place-content-center rounded-md bg-primary/10 text-xs font-semibold text-primary"
          aria-hidden="true"
          >{{ current.initials }}</span
        >
      }
      <span
        class="min-w-0 flex-1 truncate text-base font-semibold tracking-tight text-surface-950 dark:text-surface-50"
        >{{ current.name }}</span
      >
    </div>
  }

  <p-popover #popover (onShow)="onToggle(true)" (onHide)="onToggle(false)">
    <div class="flex w-64 flex-col gap-1">
      <p
        class="px-2 pt-1 pb-1.5 text-xs font-semibold text-surface-500 dark:text-surface-400"
        i18n="@@org.switcher.heading"
      >
        Your organizations
      </p>

      <ul class="flex flex-col gap-px" role="menu">
        @for (option of options(); track option.id) {
          <li role="none">
            <button
              type="button"
              role="menuitem"
              class="flex min-h-11 w-full min-w-0 items-center gap-2.5 rounded-md px-2 py-1.5 text-left text-sm transition-colors hover:bg-surface-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:hover:bg-white/5"
              [attr.aria-current]="option.active ? 'true' : null"
              (click)="select(option)"
            >
              @if (option.logoUrl; as logoUrl) {
                <img class="size-6 shrink-0 rounded-md object-cover" [src]="logoUrl" alt="" />
              } @else {
                <span
                  class="grid size-6 shrink-0 place-content-center rounded-md bg-surface-100 text-xs font-semibold text-surface-600 dark:bg-surface-800 dark:text-surface-300"
                  aria-hidden="true"
                  >{{ option.initials }}</span
                >
              }
              <span class="min-w-0 flex-1 truncate text-surface-900 dark:text-surface-100">{{
                option.name
              }}</span>
              @if (option.active) {
                <i class="pi pi-check shrink-0 text-xs text-primary" aria-hidden="true"></i>
              }
            </button>
          </li>
        }
      </ul>

      <hr class="my-1 border-surface-200 dark:border-surface-800" />

      <button
        type="button"
        class="flex min-h-11 w-full items-center gap-2.5 rounded-md px-2 py-1.5 text-left text-sm text-surface-600 transition-colors hover:bg-surface-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:text-surface-300 dark:hover:bg-white/5"
        data-testid="organization-switcher-create"
        (click)="createOrganization()"
      >
        <span
          class="grid size-6 shrink-0 place-content-center rounded-md border border-dashed border-surface-400 dark:border-surface-600"
          aria-hidden="true"
        >
          <i class="pi pi-plus text-xs" aria-hidden="true"></i>
        </span>
        <span i18n="@@workspace.rail.addOrganization.aria">Add organization</span>
      </button>
    </div>
  </p-popover>
}
