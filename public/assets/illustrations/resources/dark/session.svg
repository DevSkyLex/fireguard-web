    .fg-session-dark .d { stroke: #71717a; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-session-dark .dh { stroke: #3f3f46; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-session-dark .g { stroke: #71717a; stroke-width: 1; stroke-dasharray: 3 3; }
    .fg-session-dark .k { stroke: #8e8e97; stroke-width: 1.2; }
    .fg-session-dark .ka, .fg-session-dark .oa { stroke: #bdbdc5; stroke-width: 1.35; }
    .fg-session-dark .da { stroke: #bdbdc5; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-session-dark .ga { stroke: #bdbdc5; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
