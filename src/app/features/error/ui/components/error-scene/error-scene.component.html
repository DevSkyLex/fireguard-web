<div class="relative mx-auto mb-4 flex w-full max-w-lg items-center justify-center py-6 sm:py-8">
  <div aria-hidden="true" class="pointer-events-none absolute inset-0 text-primary">
    <div
      class="absolute inset-x-4 inset-y-8 -rotate-12 rounded-[50%] border border-dashed border-primary/25 sm:inset-x-8"
    ></div>
    <div
      class="absolute top-0 left-5 -rotate-12 motion-safe:animate-[bounce_4s_ease-in-out_1] sm:left-10"
    >
      <ng-icon [name]="primaryIcon()" size="32" />
    </div>
    <div
      class="absolute right-4 bottom-1 rotate-12 motion-safe:animate-[bounce_3s_ease-in-out_1] sm:right-10"
    >
      <ng-icon [name]="secondaryIcon()" size="36" />
    </div>
    <div class="absolute top-2 right-9 rotate-12 opacity-60 sm:right-16">
      <ng-icon [name]="accentIcon()" size="24" />
    </div>
    <span class="absolute bottom-7 left-12 size-2 rounded-full bg-primary/50"></span>
    <span class="absolute top-1/2 right-0 size-2 rotate-45 border border-primary/50"></span>
    <span class="absolute top-1/2 left-0 size-1.5 rounded-full bg-primary/30"></span>
  </div>
  <p
    class="relative font-mono text-[clamp(7rem,24vw,12rem)] leading-none font-semibold tracking-tighter text-foreground"
  >
    {{ code() }}
  </p>
</div>
