<!--
  Vertical centring lives here, not in the pages: the grid row above has a
  definite height, so `min-h-full` resolves — whereas a page-level
  `min-h-full` dies against the auto-height host elements in between. Pages
  keep the canonical focused container (max-w-md, py breathing) and this
  flex column centres it; the host stretches horizontally by default, so
  the page's own `mx-auto` still owns horizontal centring.
-->
<main class="flex min-h-full flex-col justify-center">
  <ng-content />
</main>
