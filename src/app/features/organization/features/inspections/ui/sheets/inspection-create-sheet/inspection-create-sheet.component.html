<hlm-sheet
  [side]="side()"
  [state]="sheetState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-sheet-content
    *hlmSheetPortal
    class="w-full! mobile-ui:max-h-[85svh] mobile-ui:overflow-y-auto desktop-ui:w-[540px]! desktop-ui:max-w-[100vw]!"
    data-testid="inspection-create-sheet"
    [attr.data-dirty]="dirty()"
  >
    <hlm-sheet-header>
      <h3 hlmSheetTitle i18n="@@inspection.createSheet.header">Open an inspection</h3>
      <p hlmSheetDescription i18n="@@inspection.createSheet.intro">
        Record which equipment was inspected, its result and who carried it out.
      </p>
    </hlm-sheet-header>

    <app-inspection-create-form
      [pending]="pending()"
      [serverError]="serverError()"
      [equipmentOptions]="equipmentOptions()"
      [checklists]="checklists()"
      (submitted)="submitted.emit($event)"
      (cancelled)="requestClose()"
      (dirtyChanged)="dirty.set($event)"
    />
  </hlm-sheet-content>
</hlm-sheet>

<app-unsaved-changes-dialog
  [state]="unsavedChangesDialogState()"
  (confirmed)="onUnsavedChangesConfirmed()"
  (dismissed)="onUnsavedChangesDismissed()"
/>
