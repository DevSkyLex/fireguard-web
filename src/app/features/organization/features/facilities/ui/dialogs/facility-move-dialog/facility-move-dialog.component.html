<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: dialogWidth }"
  [breakpoints]="dialogBreakpoints"
  [closable]="!moving()"
  i18n-header="@@facility.move.header"
  header="Move Facility"
>
  <div class="flex flex-col gap-6">
    <p i18n="@@facility.move.description" class="text-sm text-surface-500 dark:text-surface-400">
      Select a new parent facility or choose "None" to move this facility to the root level.
    </p>

    <div class="flex flex-col gap-2">
      <label
        for="moveParent"
        i18n="@@facility.move.parentLabel"
        class="text-sm font-medium text-surface-700 dark:text-surface-300"
      >
        Parent Facility
      </label>
      <p-select
        inputId="moveParent"
        [options]="parentOptions()"
        optionLabel="label"
        optionValue="value"
        [ngModel]="selectedParentId()"
        (ngModelChange)="selectedParentId.set($event)"
        [filter]="true"
        i18n-filterPlaceholder="@@facility.searchFacilities"
        filterPlaceholder="Search facilities..."
        [disabled]="moving()"
        class="w-full"
      />
    </div>
  </div>

  <ng-template #footer>
    <div class="flex items-center justify-end gap-3">
      <p-button
        i18n-label="@@common.cancel"
        label="Cancel"
        severity="secondary"
        [outlined]="true"
        [disabled]="moving()"
        (onClick)="cancel()"
      />
      <p-button
        i18n-label="@@facility.header.move"
        label="Move"
        icon="pi pi-arrow-right-arrow-left"
        [loading]="moving()"
        (onClick)="confirm()"
      />
    </div>
  </ng-template>
</p-dialog>
