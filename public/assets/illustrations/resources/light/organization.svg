    .fg-organization-light .guide { stroke: #85858f; stroke-width: .8; stroke-dasharray: 2 4; opacity: .55; }
    .fg-organization-light .accent-edge, .fg-organization-light .accent-seam, .fg-organization-light .accent { stroke: #f4511e; }
    .fg-organization-light .accent { stroke-width: 1.1; }
    .fg-organization-light .accent-fill { fill: #f4511e; }
    .fg-organization-light .tf { fill: url(#fg-organization-light-plane); }
    .fg-organization-light .lf { fill: #eeeef1; }
    .fg-organization-light .rf { fill: #dddde3; }
    .fg-organization-light .at { fill: #fadfd7; }
    .fg-organization-light .af { fill: #f3d0c7; }
    .fg-organization-light .ar { fill: #ecc0b4; }
  </style>
