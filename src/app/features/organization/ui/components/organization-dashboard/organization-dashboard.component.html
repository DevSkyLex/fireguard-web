<div id="organization-dashboard" class="flex flex-col gap-6">
  @if (canReadDashboard() || canReadRecentInterventions()) {
    <app-dashboard-attention-panel
      [rows]="attentionRows()"
      [loading]="attentionLoading()"
      [hasError]="attentionHasError()"
      (selected)="openAttention($event)"
      (retried)="retryAttention()"
    />
  }

  @if (canReadRecentInterventions()) {
    <app-dashboard-recent-interventions
      [interventions]="store.recentInterventions()"
      [loading]="store.isQueryLoading()"
      [hasError]="store.queryHasError()"
      (open)="openIntervention($event)"
      (retry)="retryDashboard()"
    />
  }
</div>
