<form novalidate (submit)="submit($event)">
  <hlm-field-group>
    <div class="grid gap-4 sm:grid-cols-2">
      <hlm-field>
        <label hlmFieldLabel for="org-settings-name"
          ><span i18n="@@org.settings.general.nameLabel">Organization name</span
          ><app-required-marker
        /></label>
        <input
          hlmInput
          id="org-settings-name"
          type="text"
          autocomplete="organization"
          data-testid="org-settings-name"
          [formField]="generalForm.name"
          [attr.aria-required]="true"
          [attr.aria-invalid]="generalForm.name().touched() && generalForm.name().invalid()"
        />
        @if (generalForm.name().touched() && generalForm.name().invalid()) {
          <hlm-field-error>{{ generalForm.name().errors()[0].message }}</hlm-field-error>
        }
      </hlm-field>

      <hlm-field>
        <label hlmFieldLabel for="org-settings-slug"
          ><span i18n="@@org.settings.general.slugLabel">URL slug</span><app-required-marker
        /></label>
        <input
          hlmInput
          id="org-settings-slug"
          type="text"
          data-testid="org-settings-slug"
          [formField]="generalForm.slug"
          [attr.aria-required]="true"
          [attr.aria-invalid]="generalForm.slug().touched() && generalForm.slug().invalid()"
        />
        @if (generalForm.slug().touched() && generalForm.slug().invalid()) {
          <hlm-field-error>{{ generalForm.slug().errors()[0].message }}</hlm-field-error>
        }
      </hlm-field>
    </div>

    <hlm-field>
      <label
        hlmFieldLabel
        for="org-settings-description"
        i18n="@@org.settings.general.descriptionLabel"
        >Description</label
      >
      <textarea
        hlmTextarea
        id="org-settings-description"
        rows="3"
        data-testid="org-settings-description"
        [formField]="generalForm.description"
        [attr.aria-invalid]="
          generalForm.description().touched() && generalForm.description().invalid()
        "
      ></textarea>
    </hlm-field>

    <div class="flex flex-wrap items-center justify-end gap-2">
      <button
        hlmBtn
        type="submit"
        class="max-sm:min-h-11"
        data-testid="org-settings-general-submit"
        [disabled]="!canSubmit()"
        [attr.aria-busy]="pending() ? 'true' : null"
        aria-live="polite"
      >
        @if (pending()) {
          <span i18n="@@org.settings.general.submitting">Saving…</span>
        } @else {
          <span i18n="@@org.settings.general.submit">Save changes</span>
        }
      </button>
    </div>
  </hlm-field-group>
</form>
