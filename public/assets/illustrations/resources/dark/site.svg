    .fg-site-dark .accent-fill { fill: #ff7043; }
    .fg-site-dark .tf { fill: url(#fg-site-dark-plane); }
    .fg-site-dark .lf { fill: #141417; }
    .fg-site-dark .rf { fill: #0d0d0f; }
    .fg-site-dark .lens { fill: #141416; stroke: #ff7043; }
    .fg-site-dark .accent, .fg-site-dark .lens { stroke-opacity: 1; }
  </style>
