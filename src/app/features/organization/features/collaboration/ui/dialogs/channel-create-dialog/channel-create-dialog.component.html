<hlm-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-dialog-content
    *hlmDialogPortal
    class="flex max-h-[calc(100dvh-2rem)] w-[calc(100vw-2rem)] max-w-md min-w-0 flex-col overflow-hidden sm:max-w-md"
    data-testid="channel-create-dialog"
    [attr.data-dirty]="dirty()"
  >
    <hlm-dialog-header>
      <h3 hlmDialogTitle i18n="@@channels.newDialog.title">New channel</h3>
    </hlm-dialog-header>

    <app-channel-create-form
      class="flex min-h-0 min-w-0 flex-1 flex-col"
      [visible]="visible()"
      [parentOptions]="parentOptions()"
      [pending]="pending()"
      (submitted)="onFormSubmitted($event)"
      (cancelled)="requestClose()"
      (dirtyChanged)="dirty.set($event)"
    />
  </hlm-dialog-content>
</hlm-dialog>

<app-unsaved-changes-dialog
  [state]="unsavedChangesDialogState()"
  (confirmed)="onUnsavedChangesConfirmed()"
  (dismissed)="onUnsavedChangesDismissed()"
/>
