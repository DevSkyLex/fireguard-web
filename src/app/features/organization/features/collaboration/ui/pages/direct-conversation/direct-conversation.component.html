<!--
  Unlike a channel column, a direct conversation names its counterpart in an
  in-column header: the workspace breadcrumb cannot resolve the name (a direct
  conversation has no subject label), so the identity lives here.
-->
<header
  class="flex h-14 shrink-0 items-center gap-2.5 border-b border-surface-200 px-3.5 md:px-6 dark:border-surface-800"
  data-testid="direct-conversation-header"
>
  <span
    class="grid size-8 shrink-0 place-content-center rounded-full bg-primary-50 text-sm font-semibold text-primary-700 dark:bg-primary-400/15 dark:text-primary-300"
    aria-hidden="true"
  >
    {{ counterpartInitials() }}
  </span>
  <span
    class="min-w-0 truncate text-[15px] font-semibold text-surface-950 dark:text-surface-50"
    data-testid="direct-conversation-name"
  >
    {{ counterpartName() }}
  </span>
</header>

<!--
  The thread owns the scroller so the composer stays pinned while history moves
  behind it. The shell deliberately does not scroll this column.
-->
<app-chat-thread
  [messages]="chatMessages()"
  i18n-label="@@workspace.direct.thread.aria"
  label="Direct conversation"
  [loading]="thread.isLoading()"
  [errorMessage]="loadErrorMessage()"
  [hasMore]="thread.hasMore()"
  [loadedCount]="thread.messageEntities().length"
  [totalCount]="thread.total()"
  i18n-loadMoreLabel="@@workspace.thread.loadOlder"
  loadMoreLabel="Load earlier messages"
  i18n-loadingLabel="@@workspace.thread.loading"
  loadingLabel="Loading the conversation"
  emptyIcon="pi pi-comments"
  i18n-emptyTitle="@@workspace.direct.empty.title"
  emptyTitle="No messages yet"
  i18n-emptyDescription="@@workspace.direct.empty.description"
  emptyDescription="Say hello to start the conversation."
  [canMarkRead]="true"
  (loadMore)="loadOlder()"
  (reacted)="react($event.messageId, $event.emoji)"
  (reactionRemoved)="removeReaction($event.messageId, $event.emoji)"
  (saveToggled)="thread.toggleSave($event)"
  (pinToggled)="thread.togglePin($event)"
  (replied)="openReplies($event)"
  (copied)="copy($event)"
  (markedRead)="markReadUpTo($event)"
  (deleted)="requestDelete($event)"
  (retried)="retry($event)"
>
  <!--
    Reference cards are the one thing in a message that `@shared/chat` cannot
    understand: their four types are this domain's. They reach the row through
    this template instead of through a field on the view-model.
  -->
  <ng-template appChatMessageExtra let-message>
    @for (reference of message.data.references; track reference.type + reference.id) {
      <app-message-reference-card [reference]="reference" />
    }
  </ng-template>

  <!--
    Projected into the thread, not placed beside it: it becomes the scroller's
    sticky footer, so the scrollbar runs to the bottom of the pane and the
    composer shares the messages' content box.
  -->
  <app-message-composer
    [placeholder]="composerPlaceholder()"
    [pending]="thread.isPosting()"
    [members]="mentionMembers()"
    (sent)="send($event)"
  />
</app-chat-thread>

<!--
  Outside the thread, not inside it: the panel is an overlay over the whole
  conversation, and nesting it in the scroller would make it scroll with the
  history it sits on top of.
-->
<app-message-thread-drawer
  [visible]="replies.isOpen()"
  [parentMessage]="replyParent()"
  [replies]="replyMessages()"
  [loading]="replies.isLoading()"
  [posting]="replies.isPosting()"
  [errorMessage]="replyErrorMessage()"
  [hasMore]="replies.hasMore()"
  [loadedCount]="replies.replyEntities().length"
  [totalCount]="replies.total()"
  [members]="mentionMembers()"
  (visibleChange)="onRepliesVisibleChange($event)"
  (loadMore)="loadOlderReplies()"
  (sent)="sendReply($event)"
  (copied)="copy($event)"
/>
