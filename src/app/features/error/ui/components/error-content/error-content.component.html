<div
  id="error-content"
  class="mx-auto flex min-h-full max-w-xl flex-col items-center justify-center px-5 py-16 text-center sm:py-24"
>
  <p
    class="grid size-16 place-items-center rounded-xl bg-surface-100 font-mono text-2xl leading-none font-semibold tracking-[-0.03em] text-surface-600 select-none dark:bg-surface-800 dark:text-surface-300"
    aria-hidden="true"
  >
    {{ code() }}
  </p>

  <h1
    class="mt-6 text-3xl font-semibold tracking-[-0.03em] text-balance text-surface-950 dark:text-surface-50"
  >
    {{ title() }}
  </h1>

  <p
    class="mt-2 mb-8 max-w-md text-sm leading-6 text-pretty text-surface-600 dark:text-surface-400"
  >
    {{ description() }}
  </p>

  <div class="flex flex-wrap items-center justify-center gap-3">
    <ng-content />
  </div>
</div>
