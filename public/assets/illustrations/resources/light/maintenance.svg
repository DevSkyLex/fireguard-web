  <title id="fg-maintenance-light-title">Maintenance</title>
  <desc id="fg-maintenance-light-description">A service gear laid flat beside a ring spanner, the hub ringed in vermilion.</desc>
  <defs>
    <linearGradient id="fg-maintenance-light-plane" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fafafb"/>
    </linearGradient>
  </defs>
  <style>
