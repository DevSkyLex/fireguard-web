<form class="flex flex-col gap-4" novalidate (submit)="submit($event)">
  <div class="flex flex-col items-center gap-1.5">
    <label hlmFieldLabel for="otp-code" class="self-start" i18n="@@auth.otp.label"
      >Verification code</label
    >

    <!--
      `brn-input-otp` binds `[formField]` natively — no compatibility layer. It
      owns the real input behind the slots, which is what carries
      `autocomplete="one-time-code"` and the numeric keypad on a phone.

      `(completed)` submits on the sixth digit: retyping a code and then hunting
      for a button is the one interaction this screen exists for.
    -->
    <brn-input-otp
      hlmInputOtp
      inputId="otp-code"
      autocomplete="one-time-code"
      [length]="length"
      [formField]="otpForm.code"
      (completed)="autoSubmit()"
    >
      <hlm-input-otp-group>
        <hlm-input-otp-slot index="0" />
        <hlm-input-otp-slot index="1" />
        <hlm-input-otp-slot index="2" />
      </hlm-input-otp-group>
      <hlm-input-otp-separator />
      <hlm-input-otp-group>
        <hlm-input-otp-slot index="3" />
        <hlm-input-otp-slot index="4" />
        <hlm-input-otp-slot index="5" />
      </hlm-input-otp-group>
    </brn-input-otp>

    @if (otpForm.code().touched() && otpForm.code().invalid()) {
      <hlm-field-error class="self-start">{{ otpForm.code().errors()[0].message }}</hlm-field-error>
    }
  </div>

  <button hlmBtn type="submit" class="w-full max-sm:min-h-11" [disabled]="pending()">
    @if (pending()) {
      <span i18n="@@auth.otp.submitting">Verifying…</span>
    } @else {
      <span i18n="@@auth.otp.submit">Verify</span>
    }
  </button>

  @if (showResend()) {
    <button
      hlmBtn
      type="button"
      variant="ghost"
      size="sm"
      class="w-full max-sm:min-h-11"
      [disabled]="resending()"
      (click)="resent.emit()"
    >
      @if (resending()) {
        <span i18n="@@auth.otp.resending">Sending a new code…</span>
      } @else {
        <span i18n="@@auth.otp.resend">Send a new code</span>
      }
    </button>
  }
</form>
