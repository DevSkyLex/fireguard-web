    .fg-saved-dark .o2 { stroke: #71717a; stroke-width: 1.1; }
    .fg-saved-dark .e { stroke: #3f3f46; stroke-width: 1; }
    .fg-saved-dark .d { stroke: #71717a; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-saved-dark .dh { stroke: #3f3f46; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-saved-dark .g { stroke: #71717a; stroke-width: 1; stroke-dasharray: 3 3; }
    .fg-saved-dark .k { stroke: #8e8e97; stroke-width: 1.2; }
    .fg-saved-dark .ka, .fg-saved-dark .oa { stroke: #bdbdc5; stroke-width: 1.35; }
    .fg-saved-dark .da { stroke: #bdbdc5; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-saved-dark .ga { stroke: #bdbdc5; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
