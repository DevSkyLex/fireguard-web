<div class="mb-3 flex flex-wrap items-center justify-between gap-2.5">
  <span
    class="text-sm font-medium text-surface-500 dark:text-surface-400"
    i18n="@@compliance.nc.count"
    data-testid="compliance-nc-count"
    >{total(), plural, =1 {1 non-conformity} other {{{ total() }} non-conformities}}</span
  >

  <div class="flex flex-1 flex-wrap items-center justify-end gap-2.5">
    <input
      pInputText
      type="search"
      class="min-w-60 flex-1 sm:max-w-96"
      placeholder="Search non-conformities…"
      i18n-placeholder="@@compliance.nc.search"
      aria-label="Search non-conformities"
      i18n-aria-label="@@compliance.nc.searchAria"
      data-testid="compliance-nc-search"
      [ngModel]="search()"
      (ngModelChange)="search.set($event); onFilterChange()"
    />

    <p-select
      [options]="severityOptions"
      optionLabel="label"
      optionValue="value"
      size="small"
      [showClear]="true"
      i18n-placeholder="@@compliance.nc.severity"
      placeholder="Severity"
      data-testid="compliance-nc-severity"
      [ngModel]="severity()"
      (ngModelChange)="severity.set($event); onFilterChange()"
    >
      <ng-template pTemplate="item" let-option>
        <app-tag [descriptor]="option" variant="inline" />
      </ng-template>
      <ng-template pTemplate="selectedItem" let-option>
        @if (option) {
          <app-tag [descriptor]="option" variant="inline" />
        }
      </ng-template>
    </p-select>

    <p-select
      [options]="statusOptions"
      optionLabel="label"
      optionValue="value"
      size="small"
      [showClear]="true"
      i18n-placeholder="@@compliance.nc.status"
      placeholder="Status"
      data-testid="compliance-nc-status"
      [ngModel]="status()"
      (ngModelChange)="status.set($event); onFilterChange()"
    >
      <ng-template pTemplate="item" let-option>
        <app-tag [descriptor]="option" variant="inline" />
      </ng-template>
      <ng-template pTemplate="selectedItem" let-option>
        @if (option) {
          <app-tag [descriptor]="option" variant="inline" />
        }
      </ng-template>
    </p-select>
  </div>
</div>

@if (!loading() && rows().length === 0) {
  <app-empty-state
    icon="pi-check-circle"
    i18n-title="@@compliance.nc.empty.title"
    title="No non-conformities"
    i18n-description="@@compliance.nc.empty.desc"
    description="No findings match your search or filters."
  />
} @else {
  <p-table
    [value]="loading() ? skeletonItems : mutableRows()"
    dataKey="id"
    styleClass="text-sm"
    [lazy]="true"
    (onLazyLoad)="onLazyLoad($event)"
    [paginator]="total() > pageSize"
    [rows]="pageSize"
    [totalRecords]="total()"
    [rowsPerPageOptions]="[10, 25, 50]"
    [paginatorDropdownAppendTo]="'body'"
    [showCurrentPageReport]="true"
    i18n-currentPageReportTemplate="@@compliance.nc.table.pageReport"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} non-conformities"
    [rowHover]="true"
    [stripedRows]="true"
  >
    <ng-template #header>
      <tr>
        <th scope="col" i18n="@@compliance.nc.col.ref">Ref</th>
        <th scope="col" class="hidden md:table-cell" i18n="@@compliance.nc.col.equipment">
          Equipment
        </th>
        <th scope="col" i18n="@@compliance.nc.col.issue">Issue</th>
        <th scope="col" pSortableColumn="severity">
          <span i18n="@@compliance.nc.col.severity">Severity</span>
          <p-sortIcon field="severity" />
        </th>
        <th scope="col" pSortableColumn="status">
          <span i18n="@@compliance.nc.col.status">Status</span>
          <p-sortIcon field="status" />
        </th>
      </tr>
    </ng-template>

    <ng-template #body let-row>
      @if (loading()) {
        <tr>
          <td><p-skeleton width="6rem" /></td>
          <td class="hidden md:table-cell"><p-skeleton width="6rem" /></td>
          <td><p-skeleton width="12rem" /></td>
          <td><p-skeleton width="5rem" /></td>
          <td><p-skeleton width="6rem" /></td>
        </tr>
      } @else {
        <tr
          class="cursor-pointer transition-colors hover:bg-surface-50 motion-reduce:transition-none dark:hover:bg-surface-900/50"
          data-testid="compliance-nc-row"
          (click)="view.emit(row)"
        >
          <td>
            <span class="font-mono text-xs text-surface-500 dark:text-surface-400">
              {{ shortRef(row) }}
            </span>
          </td>
          <td class="hidden md:table-cell">
            <span class="text-surface-600 dark:text-surface-400">
              {{ row.equipmentSerialNumber ?? '—' }}
            </span>
          </td>
          <td>
            <!--
              The row's (click) is a mouse convenience; this button is the
              keyboard/AT target for the same action, so it stops propagation
              to emit exactly once.
            -->
            <button
              type="button"
              class="max-w-md cursor-pointer rounded text-left focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
              data-testid="compliance-nc-row-open"
              (click)="$event.stopPropagation(); view.emit(row)"
            >
              <span class="line-clamp-1 text-surface-900 dark:text-surface-100">
                {{ row.description }}
              </span>
            </button>
          </td>
          <td>
            <app-tag [descriptor]="severityDescriptor(row.severity)" />
          </td>
          <td>
            <app-tag [descriptor]="statusDescriptor(row.status)" />
          </td>
        </tr>
      }
    </ng-template>
  </p-table>
}
