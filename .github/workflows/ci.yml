name: CI

on:
  workflow_call:
    inputs:
      full_browser_matrix:
        description: Run all supported browser engines before a release
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_browser_matrix:
        description: Run all supported browser engines
        type: boolean
        default: true
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  # A reusable CI invocation inherits the caller's github.workflow name.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.3'
  CI: true

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Configure the temporary browser cache
        run: echo "PUPPETEER_CACHE_DIR=$RUNNER_TEMP/documentation-browser" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .github/documentation/package-lock.json
      - name: Pin npm on the disposable CI runner
        run: npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund
      - name: Install isolated documentation tools
        run: npm ci
        working-directory: .github/documentation
      - name: Prepare the Mermaid browser
        run: node node_modules/puppeteer/install.mjs
        working-directory: .github/documentation
      - name: Test the documentation failure gates
        run: npm test
        working-directory: .github/documentation
      - name: Check all project links and render Mermaid
        run: npm run check -- --output-dir "$RUNNER_TEMP/documentation-diagrams"
        working-directory: .github/documentation
      - name: Retain diagram review artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-diagrams
          path: ${{ runner.temp }}/documentation-diagrams
          retention-days: 7

  ci-tooling:
    name: CI Tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test deployment validation
        run: node --test .github/scripts/*.test.mjs
      - name: Require immutable action pins
        run: python3 -B .github/scripts/check-action-pins.py
      - name: Test immutable API reference validation
        run: node --test tests/contracts/check-reference.test.mjs tests/contracts/sync-openapi.test.mjs

  deployment-validation:
    name: Ansible Deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build the pinned Ansible test controller
        run: docker build -t fireguard-web-ansible-tests -f ansible/tests/Dockerfile .
      - name: Validate playbook syntax and isolated Compose deployment
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -e ANSIBLE_ROLES_PATH=/workspace/ansible/roles \
            fireguard-web-ansible-tests \
            sh -eu -c 'ansible-playbook --syntax-check -i "fireguard_vps," ansible/deploy.yml; ansible-playbook -i "localhost," ansible/tests/deploy.yml'

  # ==========================================================================
  # Code Style Check
  # ==========================================================================
  format:
    name: Code Style
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Prepare Node workspace
        uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check formatting
        run: npm run format:check

      - name: Check documentation on changed authored files
        env:
          DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: npm run docs:test && npm run docs:check

  # ==========================================================================
  # Static Analysis
  # ==========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare Node workspace
        uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run lint and architecture tests
        run: npm run lint

  contracts:
    name: API Fixture Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Resolve the reviewed immutable API revision
        id: api-reference
        run: node tests/contracts/check-reference.mjs --resolve
      - name: Checkout the canonical API export
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: DevSkyLex/fireguard-api
          ref: ${{ steps.api-reference.outputs.commit }}
          path: tmp/api-contract
          token: ${{ secrets.API_CONTRACT_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Require the canonical export to match its reviewed digest
        env:
          FIREGUARD_OPENAPI_PATH: tmp/api-contract/openapi.json
        run: node tests/contracts/check-reference.mjs
      - name: Prepare Node workspace
        uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-playwright-browsers: 'true'
          playwright-browsers: chromium
      - name: Validate OpenAPI reference and SSR fixtures
        env:
          FIREGUARD_OPENAPI_PATH: tmp/api-contract/openapi.json
        run: npm run test:contracts
      - name: Validate actual SPA mock responses
        run: npm run e2e:harness -- api-contract.spec.ts --project=chromium

  # ==========================================================================
  # Unit and Integration Tests
  # ==========================================================================
  tests-unit:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sonar-coverage-ready: ${{ steps.coverage-ready.outputs.ready }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare Node workspace
        uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run tests and collect complete coverage
        run: |
          npm run test:ci -- --coverage \
            --coverage-reporters=lcovonly \
            --coverage-reporters=json-summary \
            --coverage-reporters=text-summary

      - name: Validate and summarize line coverage
        run: node .github/scripts/coverage-threshold.mjs --report

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: |
            coverage/fireguard-web/lcov.info
            coverage/fireguard-web/coverage-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Mark same-run coverage ready for SonarQube
        id: coverage-ready
        run: echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        if: github.event_name != 'workflow_call'
        with:
          directory: coverage
          flags: unit
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

      - name: Enforce minimum line coverage
        run: node .github/scripts/coverage-threshold.mjs --enforce

  # ==========================================================================
  # Production Build (strict templates, i18n locales, bundle budgets)
  # ==========================================================================
  sonar:
    name: SonarQube Quality Gate (fireguard-web-${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: tests-unit
    if: >-
      always() &&
      needs.tests-unit.outputs.sonar-coverage-ready == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Prepare Node workspace
        uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download this run's coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-coverage
          path: coverage/fireguard-web
      - name: Validate analysis inputs
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets[github.ref_name == 'main' && 'SONAR_TOKEN_MAIN' || 'SONAR_TOKEN_DEVELOP'] }}
        run: |
          test -n "$SONAR_HOST_URL" || { echo 'SONAR_HOST_URL is required'; exit 1; }
          test -n "$SONAR_TOKEN" || { echo 'Branch SonarQube token is required'; exit 1; }
          test -s coverage/fireguard-web/lcov.info
          grep -q '^SF:' coverage/fireguard-web/lcov.info
      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets[github.ref_name == 'main' && 'SONAR_TOKEN_MAIN' || 'SONAR_TOKEN_DEVELOP'] }}
        with:
          args: >-
            -Dsonar.projectKey=fireguard-web-${{ github.ref_name }}
            -Dsonar.projectName=fireguard-web-${{ github.ref_name }}
            -Dsonar.scm.revision=${{ github.sha }}
      - name: Enforce SonarQube quality gate
        id: sonar-gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets[github.ref_name == 'main' && 'SONAR_TOKEN_MAIN' || 'SONAR_TOKEN_DEVELOP'] }}
        with:
          pollingTimeoutSec: '600'
      - name: Require a passed quality gate
        env:
          GATE_STATUS: ${{ steps.sonar-gate.outputs.quality-gate-status }}
        run: test "$GATE_STATUS" = PASSED
      - name: Summarize SonarQube analysis
        if: ${{ !cancelled() }}
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          GATE_STATUS: ${{ steps.sonar-gate.outputs.quality-gate-status || 'FAILED / UNAVAILABLE' }}
        run: |
          {
            echo '### SonarQube'
            echo
            echo "Project: [fireguard-web-${GITHUB_REF_NAME}](${SONAR_HOST_URL%/}/dashboard?id=fireguard-web-${GITHUB_REF_NAME})"
            echo "Branch: ${GITHUB_REF_NAME}; commit: ${GITHUB_SHA}; gate: ${GATE_STATUS}."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare Node workspace
        uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build application
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'workflow_call'
        with:
          name: dist
          path: dist
          retention-days: 7
        continue-on-error: true

  # ==========================================================================
  # Translation Catalog Drift
  # ==========================================================================
  i18n:
    name: Translation Catalog Drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare Node workspace
        uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Extract messages
        run: npm run i18n:extract

      - name: Report catalog drift
        run: |
          if git diff --quiet -- src/locale; then
            echo "Translation catalogs are in sync." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::Translation catalogs are out of sync. Run 'npm run i18n:extract' and commit src/locale."
          {
            echo "### Translation catalog drift"
            echo
            echo 'Run `npm run i18n:extract` and commit the updated `src/locale` catalogs.'
            echo
            echo '```diff'
            git diff --stat -- src/locale
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # ==========================================================================
  # Security Check
  # ==========================================================================
  security:
    name: Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare Node workspace
        uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: 'false'

      - name: Produce production SBOM and license declarations
        run: |
          mkdir -p tmp/dependency-evidence
          npm sbom --package-lock-only --omit=dev --sbom-format=cyclonedx > tmp/dependency-evidence/npm-sbom.cdx.json
          node .github/scripts/dependency-inventory.mjs tmp/dependency-evidence/npm-sbom.cdx.json tmp/dependency-evidence/npm-licenses.json

      - name: Reject high or critical runtime and build advisories
        run: npm audit --audit-level=high --json > tmp/dependency-evidence/npm-audit.json

      - name: Retain dependency evidence from this revision
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dependency-evidence
          path: tmp/dependency-evidence/
          if-no-files-found: error
          retention-days: 14

  # ==========================================================================
  # End-to-End Tests
  # ==========================================================================
  # Every PR covers desktop Chrome, Android Chrome and iOS Safari. Releases
  # additionally cover desktop Firefox and Safari with the same committed tests.
  tests-end-to-end:
    name: End-to-End Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON((inputs.full_browser_matrix || startsWith(github.ref, 'refs/tags/')) && '["chromium","Mobile Chrome","Mobile Safari","firefox","webkit"]' || '["chromium","Mobile Chrome","Mobile Safari"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare Node workspace
        uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-playwright-browsers: 'true'
          playwright-browsers: ${{ matrix.project == 'firefox' && 'firefox' || (matrix.project == 'webkit' || matrix.project == 'Mobile Safari') && 'webkit' || 'chromium' }}

      - name: Run Playwright tests
        env:
          E2E_PROJECT: ${{ matrix.project }}
        run: |
          npx playwright test --config=tests/e2e/playwright.config.ts --project="$E2E_PROJECT"

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 7
        continue-on-error: true

  tests-ssr:
    name: SSR Authentication and Request Boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-playwright-browsers: 'true'
          playwright-browsers: chromium webkit
      - name: Build the real SSR harness
        run: npm run e2e:ssr:build
      - name: Check authenticated SSR and hydration traffic
        run: npm run e2e:ssr

  tests-localized:
    name: Localized Browser Tests (${{ matrix.locale }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        locale: [fr, es]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/prepare-node-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-playwright-browsers: 'true'
          playwright-browsers: chromium
      - name: Check translated desktop and touch routes
        env:
          E2E_LOCALE: ${{ matrix.locale }}
        run: npm run e2e:localized
