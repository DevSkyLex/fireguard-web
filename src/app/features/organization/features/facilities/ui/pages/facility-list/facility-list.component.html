<div id="facility-list" class="flex h-full flex-col gap-6 p-3 sm:p-6 md:p-7 lg:p-8">
  @if (store.rootListCallState().status === 'error') {
    <app-error-banner
      [message]="rootListErrorMessage"
      [retrying]="store.isLoadingRootFacilities()"
      (retried)="retry()"
    />
  }
  <app-facility-table
    class="flex min-h-0 flex-1 flex-col"
    [facilities]="store.rootFacilities()"
    [total]="store.totalRootFacilities()"
    [loading]="store.isLoadingRootFacilities()"
    [empty]="store.isRootEmpty()"
    [initialPage]="page()"
    (load)="onLoad($event)"
    (pageChange)="onPageChange($event)"
    (view)="onView($event)"
    (edit)="onEdit($event)"
    (add)="onAdd()"
    (archive)="onArchive($event)"
    (restore)="onRestore($event)"
    (bulkArchive)="onBulkArchive($event)"
  />

  <app-organization-quota-upgrade-dialog
    [(visible)]="quotaDialogVisible"
    [resource]="quotaResource"
    [subscriptionLink]="quotaSubscriptionLink()"
  />
</div>
