<app-error-content [code]="code()" [title]="title()" [description]="description()">
  <p-button
    label="Try again"
    i18n-label="@@common.tryAgain"
    icon="pi pi-refresh"
    styleClass="max-sm:min-h-11"
    (onClick)="refresh()"
  />
  <p-button
    label="Back to home"
    i18n-label="@@error.backHome"
    icon="pi pi-home"
    routerLink="/"
    severity="secondary"
    [outlined]="true"
    styleClass="max-sm:min-h-11"
  />
</app-error-content>
