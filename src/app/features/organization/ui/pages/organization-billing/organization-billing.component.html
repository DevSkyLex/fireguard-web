<div
  id="organization-billing"
  class="mx-auto flex h-full w-full max-w-7xl flex-col gap-8 p-3 sm:p-6 md:p-7 lg:p-8"
>
  @if (!canManageBilling()) {
    <div
      class="flex items-center gap-2.5 rounded-xl border border-blue-200 bg-blue-50 px-3.5 py-2.5 text-sm font-medium text-blue-900 dark:border-blue-900 dark:bg-blue-950 dark:text-blue-200"
      role="status"
      data-testid="organization-billing-readonly-notice"
    >
      <i class="pi pi-info-circle" aria-hidden="true"></i>
      <span class="min-w-0 flex-1" i18n="@@org.billing.readOnly">
        You can view this organization's billing, but only an owner can change the plan.
      </span>
      <i class="pi pi-lock text-xs opacity-55" aria-hidden="true"></i>
    </div>
  }

  <app-organization-plan-selector />

  <app-billing-payment-method
    [method]="store.paymentMethod()"
    [loading]="store.isLoadingPaymentMethod()"
    [busy]="store.isStartingPortal()"
    (manage)="openPortal()"
  />
</div>
