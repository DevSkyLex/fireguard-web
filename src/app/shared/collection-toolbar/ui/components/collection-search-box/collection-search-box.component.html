<hlm-input-group
  class="w-full max-w-full sm:w-56 mobile-ui:h-11"
  [attr.data-testid]="testId() + '-group'"
>
  <hlm-input-group-addon>
    <ng-icon name="lucideSearch" />
  </hlm-input-group-addon>
  <input
    hlmInputGroupInput
    class="mobile-ui:h-11 mobile-ui:text-base"
    type="search"
    [attr.data-testid]="testId()"
    [placeholder]="placeholder()"
    [attr.aria-label]="ariaLabel()"
    [value]="value()"
    (input)="onInput($event)"
  />
</hlm-input-group>
