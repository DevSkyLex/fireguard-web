<div id="inspection-edit" class="flex flex-col p-3 sm:p-6 lg:p-8 xl:p-10">
  <section class="mx-auto w-full max-w-3xl">
    <header class="mb-6">
      <h1
        i18n="@@inspection.edit.title"
        class="text-2xl font-semibold tracking-[-0.025em] text-surface-950 dark:text-surface-50"
      >
        Edit Inspection Draft
      </h1>
      <p
        i18n="@@inspection.edit.description"
        class="mt-1.5 text-sm leading-6 text-surface-600 dark:text-surface-400"
      >
        Refine the inspection scope and checklist while the record is still a draft.
      </p>
    </header>
    <div
      class="rounded-xl border border-surface-200 bg-surface-0 p-5 sm:p-8 dark:border-surface-800 dark:bg-surface-900"
    >
      @if (isLoading()) {
        <div class="flex flex-col gap-5">
          <p-skeleton width="100%" height="2.5rem" />
          <p-skeleton width="100%" height="2.5rem" />
          <p-skeleton width="100%" height="2.5rem" />
          <p-skeleton width="100%" height="2.5rem" />
        </div>
      } @else if (inspection(); as inspection) {
        <app-inspection-form
          [inspection]="inspection"
          [loading]="store.isUpdating()"
          [equipments]="equipmentStore.equipmentList()"
          [facilities]="facilityStore.facilities()"
          [checklists]="checklistStore.checklists()"
          (submitted)="handleSubmit($event)"
          (cancelled)="handleCancel()"
        />
      }
    </div>
  </section>
</div>
