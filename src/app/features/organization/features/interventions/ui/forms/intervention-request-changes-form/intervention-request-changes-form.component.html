<form (submit)="submit($event)" class="flex min-h-0 flex-1 flex-col">
  <hlm-field-group class="min-h-0 flex-1 overflow-y-auto px-4">
    @if (serverMessages().length > 0) {
      <div
        role="alert"
        data-testid="intervention-request-changes-error"
        class="text-sm text-destructive"
      >
        @for (message of serverMessages(); track message) {
          <p>{{ message }}</p>
        }
      </div>
    }

    <hlm-field>
      <label
        hlmFieldLabel
        for="intervention-request-changes-note"
        i18n="@@intervention.rc.noteLabel"
        >Note</label
      >
      <textarea
        hlmTextarea
        id="intervention-request-changes-note"
        rows="5"
        data-testid="intervention-request-changes-note"
        placeholder="e.g. Re-inspect the third-floor extinguishers — the pressure gauge photo is missing."
        i18n-placeholder="@@intervention.rc.notePlaceholder"
        [formField]="requestForm.note"
      ></textarea>
      @if (requestForm.note().touched() && requestForm.note().invalid()) {
        <hlm-field-error>{{ requestForm.note().errors()[0].message }}</hlm-field-error>
      }
    </hlm-field>
  </hlm-field-group>

  <hlm-sheet-footer class="flex-col-reverse sm:flex-row sm:justify-end">
    <button
      hlmBtn
      type="submit"
      variant="destructive"
      data-testid="intervention-request-changes-submit"
      [disabled]="pending() || disabled()"
    >
      <span i18n="@@intervention.rc.submit">Request changes</span>
    </button>
    <button
      hlmBtn
      type="button"
      variant="outline"
      data-testid="intervention-request-changes-cancel"
      (click)="cancelled.emit()"
    >
      <span i18n="@@common.cancel">Cancel</span>
    </button>
  </hlm-sheet-footer>
</form>
