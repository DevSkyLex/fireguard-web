<div
  id="account-page"
  class="mx-auto flex w-full max-w-7xl flex-col gap-[18px] p-3 sm:p-6 lg:p-8 xl:p-10"
>
  <div class="min-w-0" data-testid="account-page-header">
    <h1
      class="text-2xl font-semibold tracking-[-0.025em] text-surface-950 dark:text-surface-50"
      data-testid="account-page-title"
      i18n="@@account.page.title"
    >
      Your profile
    </h1>
    <p class="mt-1 text-sm text-surface-500 dark:text-surface-400" i18n="@@account.page.subtitle">
      Your personal account, sign-in and security across Fireguard.
    </p>
  </div>

  <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)">
    <p-tablist [pt]="{ root: { class: 'bg-transparent!' } }" data-testid="account-page-nav">
      @for (tab of tabItems; track tab.value) {
        <p-tab [value]="tab.value">
          <span class="text-sm">{{ tab.label }}</span>
        </p-tab>
      }
    </p-tablist>

    <p-tabpanels [pt]="{ root: { class: 'bg-transparent! p-0' } }">
      <p-tabpanel value="profile">
        <app-account-profile-panel />
      </p-tabpanel>

      <p-tabpanel value="security">
        <div class="flex flex-col gap-[18px]">
          <app-account-mfa-panel />
          <app-account-sessions-panel />
          <app-account-trusted-devices-panel />
        </div>
      </p-tabpanel>

      <p-tabpanel value="roles">
        <app-account-access-panel />
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>
