<ul
  role="list"
  i18n-aria-label="@@org.team.roleListAria"
  aria-label="Organization roles"
  class="flex flex-col gap-3"
>
  @if (loading()) {
    @for (_ of skeletonItems; track $index) {
      <li
        class="flex flex-col gap-3 rounded-xl border border-surface-200 bg-surface-0 p-4 dark:border-surface-800 dark:bg-surface-900"
      >
        <div class="flex items-center gap-3">
          <p-skeleton shape="square" size="2.125rem" borderRadius="0.5rem" />
          <p-skeleton width="8rem" height="0.875rem" />
        </div>
        <p-skeleton width="100%" height="0.75rem" />
        <p-skeleton width="60%" height="0.75rem" />
      </li>
    }
  } @else {
    @for (role of roles(); track role.id) {
      @let selected = role.id === selectedRoleId();
      <li>
        <button
          type="button"
          [attr.aria-current]="selected ? 'true' : null"
          class="group flex w-full cursor-pointer flex-col gap-2 rounded-xl bg-surface-0 p-4 text-left transition-colors duration-150 dark:bg-surface-900"
          [class]="
            selected
              ? 'border border-primary ring-1 ring-primary'
              : 'border border-surface-200 hover:border-surface-400 dark:border-surface-800 dark:hover:border-surface-600'
          "
          (click)="select.emit(role)"
        >
          <span class="flex min-w-0 items-center gap-3">
            <span
              aria-hidden="true"
              class="grid h-[34px] w-[34px] shrink-0 place-items-center rounded-lg border transition-colors duration-150"
              [class]="
                selected
                  ? 'border-primary/30 bg-primary-50 text-primary-600 dark:bg-primary-400/15 dark:text-primary-400'
                  : 'border-surface-200 bg-surface-100 text-surface-600 dark:border-surface-800 dark:bg-surface-800 dark:text-surface-400'
              "
            >
              <i class="pi text-lg" [class]="roleIcon(role)"></i>
            </span>

            <span class="min-w-0 flex-1 truncate">
              <span
                class="text-sm font-semibold tracking-[-0.01em] text-surface-950 dark:text-surface-50"
                >{{ role.name }}</span
              >
              @if (role.isSystem) {
                <span
                  i18n="@@org.roleTable.system"
                  class="ml-1 text-xs font-normal text-surface-500 dark:text-surface-400"
                  >(system)</span
                >
              }
            </span>

            @if (selected) {
              <i class="pi pi-check-circle shrink-0 text-primary" aria-hidden="true"></i>
            }
          </span>

          <span class="line-clamp-2 text-xs leading-relaxed text-surface-600 dark:text-surface-400">
            {{ role.description || noDescriptionLabel }}
          </span>

          <span class="flex items-center justify-between gap-2.5">
            <span
              i18n="@@org.roleCard.permissionCount"
              class="text-xs text-surface-500 tabular-nums dark:text-surface-400"
              >{role.permissions.length, plural,
                =1 {1 permission}
                other {{{ role.permissions.length }} permissions}
              }</span
            >

            @if (canManage()) {
              <span
                class="inline-flex items-center gap-1 text-xs font-semibold transition-colors duration-150"
                [class]="
                  selected
                    ? 'text-primary-700 dark:text-primary-300'
                    : 'text-surface-500 group-hover:text-surface-600 dark:text-surface-400 dark:group-hover:text-surface-300'
                "
              >
                <ng-container i18n="@@org.roleCard.manage">Manage</ng-container>
                <i class="pi pi-chevron-right text-[10px]" aria-hidden="true"></i>
              </span>
            }
          </span>
        </button>
      </li>
    } @empty {
      <li
        class="rounded-xl border border-surface-200 bg-surface-0 dark:border-surface-800 dark:bg-surface-900"
      >
        <app-empty-state
          icon="pi-id-card"
          i18n-title="@@org.roleTable.emptyTitle"
          title="No roles yet"
          i18n-description="@@org.roleTable.emptyDesc"
          description="Roles you create for this organization will appear here."
        />
      </li>
    }
  }
</ul>
