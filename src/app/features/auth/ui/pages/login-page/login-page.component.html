<div id="login-page" class="flex w-full max-w-sm flex-col gap-6">
  <header class="flex flex-col gap-1.5">
    <h1 class="text-2xl font-semibold tracking-tight text-foreground" i18n="@@auth.login.title">
      Sign in
    </h1>
    <p class="text-sm text-muted-foreground" i18n="@@auth.login.subtitle">
      Access your FireGuard workspace.
    </p>
  </header>

  <app-login-form [pending]="authStore.isLoggingIn()" (submitted)="login($event)" />

  <p class="text-center text-sm text-muted-foreground">
    <span i18n="@@auth.login.noAccount">No account yet?</span>
    <a
      class="ml-1 font-medium text-foreground underline-offset-4 hover:underline focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
      routerLink="/auth/register"
      i18n="@@auth.login.register"
      >Create one</a
    >
  </p>
</div>
