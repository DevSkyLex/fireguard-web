@let facility = this.facility();

<section
  class="rounded-md border border-surface-200 bg-surface-0 dark:border-surface-800 dark:bg-surface-900"
>
  <header
    class="flex flex-wrap items-baseline gap-x-2 gap-y-1 border-b border-surface-200 px-4 py-3 dark:border-surface-800"
  >
    <h2
      i18n="@@facility.info.title"
      class="text-[15px] font-semibold text-surface-900 dark:text-surface-0"
    >
      Site information
    </h2>

    @if (editable()) {
      <span i18n="@@common.clickToEdit" class="text-xs text-surface-500 dark:text-surface-400">
        click a field to change it
      </span>
    }
  </header>

  <div class="flex flex-col divide-y divide-surface-100 px-4 py-2 dark:divide-surface-800">
    <!--
      Type and parent are read-only on purpose: the update endpoint accepts
      neither — `UpdateFacilityInput` omits them, and the parent moves through
      its own action. A property that cannot be written must not look writable.
    -->
    <div class="flex flex-col gap-1 py-2">
      <span
        i18n="@@facility.info.type"
        class="text-xs font-medium text-surface-500 dark:text-surface-400"
        >Type</span
      >
      <span class="px-2 text-sm text-surface-900 dark:text-surface-100">{{
        facility.type | titlecase
      }}</span>
    </div>

    <div class="flex flex-col gap-1 py-2">
      <span
        i18n="@@facility.info.status"
        class="text-xs font-medium text-surface-500 dark:text-surface-400"
        >Status</span
      >
      <span class="px-2">
        <p-tag
          [severity]="statusDescriptor(facility.status).severity"
          [icon]="statusDescriptor(facility.status).icon"
          [value]="statusDescriptor(facility.status).label"
        />
      </span>
    </div>

    <div class="py-2">
      <app-inplace-field
        label="Name"
        i18n-label="@@facility.info.name"
        [display]="facility.name"
        [editable]="editable()"
        [pending]="saving()"
        [error]="fieldError('name')"
        (opened)="seed('name', facility.name)"
        (saved)="save('name')"
        (cancelled)="clearError()"
      >
        <input
          editor
          pInputText
          pSize="small"
          type="text"
          [formControl]="nameControl"
          i18n-aria-label="@@facility.info.name"
          aria-label="Name"
          class="w-full"
        />
      </app-inplace-field>
    </div>

    <div class="py-2">
      <app-inplace-field
        label="Code"
        i18n-label="@@facility.info.code"
        [display]="facility.code"
        [editable]="editable()"
        [pending]="saving()"
        [error]="fieldError('code')"
        (opened)="seed('code', facility.code)"
        (saved)="save('code')"
        (cancelled)="clearError()"
      >
        <input
          editor
          pInputText
          pSize="small"
          type="text"
          [formControl]="codeControl"
          i18n-aria-label="@@facility.info.code"
          aria-label="Code"
          class="w-full font-mono"
        />
      </app-inplace-field>
    </div>

    <div class="py-2">
      <app-inplace-field
        label="Address"
        i18n-label="@@facility.info.address"
        [display]="facility.address"
        [editable]="editable()"
        [pending]="saving()"
        [error]="fieldError('address')"
        (opened)="seed('address', facility.address)"
        (saved)="save('address')"
        (cancelled)="clearError()"
      >
        <textarea
          editor
          pTextarea
          rows="2"
          [autoResize]="true"
          [formControl]="addressControl"
          i18n-aria-label="@@facility.info.address"
          aria-label="Address"
          class="w-full resize-none text-sm"
        ></textarea>
      </app-inplace-field>
    </div>

    <div class="py-2">
      <app-inplace-field
        label="Coordinates"
        i18n-label="@@facility.info.coordinates"
        [display]="coordinatesDisplay()"
        [editable]="editable()"
        [pending]="saving()"
        [error]="fieldError('coordinates')"
        (opened)="seedCoordinates()"
        (saved)="save('coordinates')"
        (cancelled)="clearError()"
      >
        <div editor class="flex gap-2">
          <input
            pInputText
            pSize="small"
            type="number"
            step="any"
            [formControl]="latitudeControl"
            i18n-aria-label="@@facility.info.latitude"
            aria-label="Latitude"
            i18n-placeholder="@@facility.info.latitude"
            placeholder="Latitude"
            class="w-full"
          />
          <input
            pInputText
            pSize="small"
            type="number"
            step="any"
            [formControl]="longitudeControl"
            i18n-aria-label="@@facility.info.longitude"
            aria-label="Longitude"
            i18n-placeholder="@@facility.info.longitude"
            placeholder="Longitude"
            class="w-full"
          />
        </div>
      </app-inplace-field>
    </div>

    <div class="flex flex-col gap-1 py-2">
      <span
        i18n="@@facility.info.created"
        class="text-xs font-medium text-surface-500 dark:text-surface-400"
        >Created</span
      >
      <span class="px-2 text-sm text-surface-900 dark:text-surface-100">{{
        facility.createdAt | date: 'mediumDate'
      }}</span>
    </div>

    <div class="flex flex-col gap-1 py-2">
      <span
        i18n="@@facility.info.lastUpdated"
        class="text-xs font-medium text-surface-500 dark:text-surface-400"
        >Last updated</span
      >
      <span class="px-2 text-sm text-surface-900 dark:text-surface-100">{{
        facility.updatedAt | date: 'mediumDate'
      }}</span>
    </div>
  </div>
</section>
