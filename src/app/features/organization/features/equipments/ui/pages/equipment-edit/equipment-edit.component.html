<div id="equipment-edit" class="flex flex-col p-3 sm:p-6 md:p-7 lg:p-8 xl:p-10">
  <section class="mx-auto flex w-full max-w-3xl flex-col gap-6">
    <header class="flex flex-wrap items-end justify-between gap-x-4 gap-y-2">
      <div class="flex min-w-0 flex-col gap-1.5">
        <h1
          class="text-2xl font-semibold tracking-[-0.025em] text-surface-950 dark:text-surface-50"
          i18n="@@equipment.edit.title"
        >
          Edit Equipment
        </h1>
        <p
          i18n="@@equipment.edit.description"
          class="max-w-[60ch] text-sm text-surface-600 dark:text-surface-400"
        >
          Update identification, lifecycle, and assignment information for this asset.
        </p>
      </div>
    </header>
    <div
      class="rounded-md border border-surface-200 bg-surface-0 p-5 sm:p-8 dark:border-surface-800 dark:bg-surface-900"
    >
      @if (isLoading()) {
        <div class="flex flex-col gap-5">
          <p-skeleton width="100%" height="2.5rem" />
          <p-skeleton width="100%" height="2.5rem" />
          <p-skeleton width="100%" height="2.5rem" />
          <p-skeleton width="100%" height="2.5rem" />
        </div>
      } @else if (equipment(); as equipment) {
        <app-equipment-form
          [equipment]="equipment"
          [loading]="store.isUpdating()"
          [serverError]="store.updateError()"
          (submitted)="handleSubmit($event)"
          (cancelled)="handleCancel()"
        />
      }
    </div>
  </section>
</div>
