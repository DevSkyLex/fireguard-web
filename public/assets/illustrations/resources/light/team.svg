    .fg-team-light .accent { stroke-width: 1.1; }
    .fg-team-light .accent-fill { fill: #f4511e; }
    .fg-team-light .tf { fill: url(#fg-team-light-plane); }
    .fg-team-light .lf { fill: #eeeef1; }
