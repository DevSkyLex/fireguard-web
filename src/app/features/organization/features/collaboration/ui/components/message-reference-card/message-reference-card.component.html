<!--
  Not a p-message: that component imposes its own icon slot, padding and radius
  and cannot host the leading tile plus the trailing code chip.
-->
<div
  class="flex items-center gap-3 rounded-xl border px-3.5 py-3"
  [class]="
    danger()
      ? 'border-red-200 bg-red-50 dark:border-red-900 dark:bg-red-950/50'
      : 'border-surface-200 bg-surface-0 dark:border-surface-800 dark:bg-surface-900'
  "
>
  <span
    class="grid size-9 shrink-0 place-content-center rounded-md"
    [class]="danger() ? 'bg-red-600 text-white' : 'bg-primary/10 text-primary'"
  >
    <i [class]="icon()" aria-hidden="true"></i>
  </span>

  <span class="flex min-w-0 flex-1 flex-col">
    <!-- The type is always spelled out, so severity is never colour-only. -->
    <span
      class="truncate text-sm font-semibold"
      [class]="
        danger() ? 'text-red-700 dark:text-red-300' : 'text-surface-950 dark:text-surface-50'
      "
    >
      {{ title() }}
    </span>
    <span class="truncate text-xs text-surface-500 dark:text-surface-400">
      {{ typeLabel(reference().type) }}
    </span>
  </span>

  @if (reference().code) {
    <span
      class="shrink-0 rounded-md border px-1.5 py-0.5 font-mono text-xs"
      [class]="
        danger()
          ? 'border-red-200 bg-surface-0 text-red-700 dark:border-red-900 dark:bg-surface-900 dark:text-red-300'
          : 'border-surface-200 bg-surface-0 text-surface-500 dark:border-surface-800 dark:bg-surface-900 dark:text-surface-400'
      "
    >
      {{ reference().code }}
    </span>
  }
</div>
