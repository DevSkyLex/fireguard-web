<div id="maintenance-schedules" class="flex min-h-0 w-full flex-1 flex-col gap-4 p-4 md:p-6">
  <app-collection-toolbar>
    <app-collection-filter-toggle
      toolbarEnd
      [visible]="filtersVisible()"
      [activeCount]="activeFilterKeys().length"
      label="Filters"
      i18n-label="@@maintenance.filter.filtersButton"
      testIdPrefix="maintenance"
      (visibleChange)="toggleFiltersVisible($event)"
    />
  </app-collection-toolbar>

  @if (filtersVisible()) {
    <app-collection-filter-bar
      [fields]="filterFields"
      [activeKeys]="activeFilterKeys()"
      [pendingKey]="openFilterKey()"
      [templates]="chipTemplates()"
      testIdPrefix="maintenance"
      (fieldPicked)="onFieldPicked($event)"
      (fieldRemoved)="onFieldRemoved($event)"
      (filtersCleared)="clearFilters()"
    />
  }

  <ng-template #dueStatusChip>
    <app-collection-filter-select
      [options]="dueStatusOptions"
      [value]="filters().dueStatus"
      placeholder="Any status"
      i18n-placeholder="@@maintenance.filter.anyDueStatus"
      emptyLabel="No status matches."
      i18n-emptyLabel="@@maintenance.filter.noDueStatus"
      accessibleName="Due status"
      i18n-accessibleName="@@maintenance.filter.dueStatus"
      triggerId="maintenance-filter-due-status"
      testId="maintenance-filter-due-status"
      [state]="fieldPopoverState('dueStatus')"
      [optionTemplate]="dueStatusOptionRow"
      [valueTemplate]="dueStatusOptionRow"
      (valueChanged)="applyFilter({ dueStatus: $any($event) })"
      (stateChanged)="onFieldPopoverStateChanged('dueStatus', $event)"
    />
    <ng-template #dueStatusOptionRow let-option>
      <app-maintenance-due-status-tag [value]="option.value" asOption />
    </ng-template>
  </ng-template>

  <ng-template #facilityChip>
    <app-collection-filter-select
      [options]="facilityOptions()"
      [value]="filters().facility"
      placeholder="Any facility"
      i18n-placeholder="@@maintenance.filter.anyFacility"
      searchPlaceholder="Search a facility"
      i18n-searchPlaceholder="@@maintenance.filter.facilitySearchPlaceholder"
      emptyLabel="No facility matches."
      i18n-emptyLabel="@@maintenance.filter.noFacility"
      accessibleName="Facility"
      i18n-accessibleName="@@maintenance.filter.facility"
      triggerId="maintenance-filter-facility"
      testId="maintenance-filter-facility"
      [state]="fieldPopoverState('facility')"
      (valueChanged)="applyFilter({ facility: $any($event) })"
      (stateChanged)="onFieldPopoverStateChanged('facility', $event)"
    />
  </ng-template>

  <ng-template #equipmentTypeChip>
    <app-collection-filter-select
      [options]="equipmentTypeOptions"
      [value]="filters().equipmentType"
      placeholder="Any type"
      i18n-placeholder="@@maintenance.filter.anyType"
      searchPlaceholder="Search a type"
      i18n-searchPlaceholder="@@maintenance.filter.equipmentTypeSearchPlaceholder"
      emptyLabel="No type matches."
      i18n-emptyLabel="@@maintenance.filter.noEquipmentType"
      accessibleName="Equipment type"
      i18n-accessibleName="@@maintenance.filter.equipmentType"
      triggerId="maintenance-filter-equipment-type"
      testId="maintenance-filter-equipment-type"
      [state]="fieldPopoverState('equipmentType')"
      (valueChanged)="applyFilter({ equipmentType: $any($event) })"
      (stateChanged)="onFieldPopoverStateChanged('equipmentType', $event)"
    />
  </ng-template>

  <ng-template #dueBeforeChip>
    <app-collection-filter-date
      [value]="filters().dueBefore"
      placeholder="Pick a date"
      i18n-placeholder="@@maintenance.filter.dueBeforePlaceholder"
      accessibleName="Due before"
      i18n-accessibleName="@@maintenance.filter.dueBefore"
      triggerId="maintenance-filter-due-before"
      testId="maintenance-filter-due-before"
      [state]="fieldPopoverState('dueBefore')"
      (valueChanged)="applyFilter({ dueBefore: $event })"
      (stateChanged)="onFieldPopoverStateChanged('dueBefore', $event)"
    />
  </ng-template>

  @if (store.hasListError()) {
    <app-error-state
      icon="lucideCircleAlert"
      title="Couldn't load maintenance schedules"
      i18n-title="@@maintenance.list.errorTitle"
      description="The schedules could not be loaded. Check your connection and try again."
      i18n-description="@@maintenance.list.errorText"
    >
      <button hlmBtn variant="outline" data-testid="maintenance-retry" (click)="reload()">
        <span i18n="@@maintenance.list.retry">Retry</span>
      </button>
    </app-error-state>
  } @else if (!store.isLoading() && items().length === 0) {
    <app-empty-state
      [icon]="hasFilters() ? 'lucideCircleAlert' : 'lucidePackage'"
      title="No maintenance schedules found"
      i18n-title="@@maintenance.list.emptyTitle"
      description="Adjust your filters, or track equipment to see its schedule here."
      i18n-description="@@maintenance.list.emptyDesc"
    >
      @if (hasFilters()) {
        <button hlmBtn variant="outline" (click)="clearFilters()">
          <span i18n="@@common.clearFilters">Clear filters</span>
        </button>
      }
    </app-empty-state>
  } @else {
    <app-maintenance-schedule-table
      [items]="items()"
      [loading]="store.isLoading() && items().length === 0"
      [canManage]="canManage()"
      [equipmentRouteBase]="equipmentRouteBase()"
      [facilityRouteBase]="facilityRouteBase()"
      [facilityLabelOf]="tableFacilityLabelOf"
      (overrideRequested)="openOverrideDialog($event)"
    />

    <app-collection-pagination
      [page]="page()"
      [pageCount]="pageCount()"
      [pageSize]="pageSize()"
      [total]="store.totalSchedules()"
      [shown]="items().length"
      testIdPrefix="maintenance"
      (pageChanged)="goToPage($event)"
      (pageSizeChanged)="setPageSize($event)"
    />
  }
</div>

<app-maintenance-override-dialog
  [visible]="overrideDialogVisible()"
  [pending]="store.isOverriding()"
  [schedule]="overrideTarget()"
  (visibleChange)="$event ? overrideDialogVisible.set(true) : closeOverrideDialog()"
  (submitted)="submitOverride($event)"
/>

<app-maintenance-campaign-dialog
  [visible]="campaignDialogVisible()"
  [pending]="store.isGeneratingCampaign()"
  [serverError]="store.campaignError()"
  [facilityOptions]="facilityOptions()"
  (visibleChange)="$event ? campaignDialogVisible.set(true) : closeCampaignDialog()"
  (submitted)="submitCampaign($event)"
/>

<ng-template #pageActions>
  @if (canPlanCampaign()) {
    <button
      hlmBtn
      type="button"
      class="min-w-0 shrink max-sm:min-h-11"
      data-testid="maintenance-generate-campaign"
      i18n-aria-label="@@maintenance.generateCampaignButton"
      aria-label="Generate inspection campaign"
      (click)="openCampaignDialog()"
    >
      <ng-icon name="lucideSparkles" aria-hidden="true" />
      <span class="truncate max-sm:hidden" i18n="@@maintenance.generateCampaignButton"
        >Generate inspection campaign</span
      >
    </button>
  }
</ng-template>
