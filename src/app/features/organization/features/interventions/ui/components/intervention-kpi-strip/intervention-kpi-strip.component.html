<div class="grid grid-cols-[repeat(auto-fit,minmax(9rem,1fr))] gap-4">
  @if (loading()) {
    <span
      class="sr-only"
      role="status"
      data-testid="intervention-kpi-strip-loading"
      i18n="@@intervention.kpi.loadingAria"
      >Loading key figures</span
    >
  }
  @for (tile of tiles(); track tile.id) {
    <div [attr.data-testid]="'intervention-kpi-strip-' + tile.id">
      <app-stat-tile
        [label]="tile.label"
        [value]="tile.value"
        [icon]="tile.icon"
        [tone]="tile.tone"
        [loading]="loading()"
      />
    </div>
  }
</div>
