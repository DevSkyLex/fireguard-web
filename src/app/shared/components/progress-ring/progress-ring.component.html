<svg
  [attr.width]="size()"
  [attr.height]="size()"
  [attr.viewBox]="'0 0 ' + size() + ' ' + size()"
  role="img"
  [attr.aria-label]="ariaLabel()"
  class="-rotate-90 text-surface-200 dark:text-surface-700"
>
  <circle
    [attr.cx]="center()"
    [attr.cy]="center()"
    [attr.r]="radius()"
    fill="none"
    [attr.stroke]="trackColor() ?? 'currentColor'"
    [attr.stroke-width]="strokeWidth()"
  />
  <circle
    [attr.cx]="center()"
    [attr.cy]="center()"
    [attr.r]="radius()"
    fill="none"
    [attr.stroke]="color() ?? 'var(--p-primary-color)'"
    [attr.stroke-width]="strokeWidth()"
    stroke-linecap="round"
    [attr.stroke-dasharray]="circumference()"
    [attr.stroke-dashoffset]="dashOffset()"
    class="transition-[stroke-dashoffset] duration-300 ease-out motion-reduce:transition-none"
  />
</svg>
