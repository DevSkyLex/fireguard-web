@for (section of sections(); track section.id) {
  <div hlmSidebarGroup>
    <div hlmSidebarGroupLabel>{{ section.label }}</div>
    <div hlmSidebarGroupContent>
      <ul hlmSidebarMenu>
        @for (link of section.links; track link.id) {
          <li hlmSidebarMenuItem>
            <a
              hlmSidebarMenuButton
              [routerLink]="link.route"
              routerLinkActive
              #active="routerLinkActive"
              [routerLinkActiveOptions]="{ exact: link.id === 'today' }"
              [attr.data-active]="active.isActive ? 'true' : null"
              [attr.aria-current]="active.isActive ? 'page' : null"
              [tooltip]="link.label"
            >
              <ng-icon [name]="link.icon" aria-hidden="true" />
              <span>{{ link.label }}</span>
              @if (counterOf(link.counterKey); as count) {
                @if (count > 0) {
                  <span hlmBadge variant="secondary" [attr.aria-label]="counterLabelOf(count)">
                    {{ count }}
                  </span>
                }
              }
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
}
