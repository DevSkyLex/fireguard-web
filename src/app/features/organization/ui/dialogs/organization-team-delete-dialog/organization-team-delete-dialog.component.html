<hlm-alert-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-alert-dialog-content
    class="max-h-[calc(100svh-2rem)] overflow-y-auto overscroll-contain mobile-ui:max-h-[calc(100dvh-2rem-env(safe-area-inset-top)-env(safe-area-inset-bottom))] mobile-ui:overflow-y-auto mobile-ui:overscroll-contain"
    *hlmAlertDialogPortal
    data-testid="organization-team-delete-dialog"
  >
    <hlm-alert-dialog-header>
      <h2 hlmAlertDialogTitle i18n="@@org.teams.deleteDialog.title">Delete this team?</h2>
      <p hlmAlertDialogDescription>{{ description() }}</p>
    </hlm-alert-dialog-header>

    <p
      class="text-sm text-muted-foreground"
      data-testid="organization-team-delete-warning"
      i18n="@@org.teams.deleteDialog.warning"
    >
      Channels bound to this team keep referencing it.
    </p>

    @if (error(); as message) {
      <p role="alert" class="text-sm text-destructive" data-testid="organization-team-delete-error">
        {{ message }}
      </p>
    }

    <hlm-alert-dialog-footer>
      <button class="mobile-ui:min-h-11" hlmAlertDialogCancel i18n="@@common.cancel">Cancel</button>
      <button
        class="mobile-ui:min-h-11"
        hlmAlertDialogAction
        variant="destructive"
        data-testid="organization-team-delete-confirm"
        [disabled]="pending()"
        (click)="confirm()"
      >
        @if (pending()) {
          <span i18n="@@org.teams.deleteDialog.confirming">Deleting…</span>
        } @else {
          <span i18n="@@org.teams.deleteDialog.confirm">Delete</span>
        }
      </button>
    </hlm-alert-dialog-footer>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
