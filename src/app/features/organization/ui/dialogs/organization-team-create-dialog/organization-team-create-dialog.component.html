<hlm-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-dialog-content
    class="sm:max-w-lg"
    data-testid="organization-team-create-dialog"
    *hlmDialogPortal
  >
    <hlm-dialog-header>
      <h3 hlmDialogTitle i18n="@@org.teams.createDialog.title">New team</h3>
      <p hlmDialogDescription i18n="@@org.teams.createDialog.description">
        Create a named group of members you can assign to interventions.
      </p>
    </hlm-dialog-header>

    <app-organization-team-create-form
      [pending]="pending()"
      [serverError]="serverError()"
      (submitted)="submitted.emit($event)"
      (cancelled)="visibleChange.emit(false)"
    />
  </hlm-dialog-content>
</hlm-dialog>
