<div
  #barRoot
  class="flex shrink-0 flex-wrap items-center gap-2 rounded-md border border-border p-2 outline-none focus-visible:outline-[3px] focus-visible:outline-offset-2 focus-visible:outline-ring focus-visible:outline-solid"
  [attr.id]="testId('filter-bar')"
  [attr.data-testid]="testId('filter-chips')"
  role="group"
  tabindex="-1"
  [attr.aria-label]="regionLabel"
>
  @for (key of renderedKeys(); track key) {
    <app-filter-chip
      [fieldLabel]="fieldOf(key).fieldLabel"
      [icon]="fieldOf(key).icon"
      [removeLabel]="removeLabelFor(fieldOf(key).fieldLabel)"
      [operator]="operatorOf(key)"
      [operatorOptions]="fieldOf(key).operators"
      [operatorLabels]="fieldOf(key).operatorLabels ?? {}"
      [changeOperatorLabel]="changeOperatorLabelFor(fieldOf(key).fieldLabel)"
      [operatorTriggerId]="operatorTriggerIdFor(key)"
      [testIdPrefix]="testIdPrefix()"
      [disabled]="fieldOf(key).unavailableReason !== undefined"
      [unavailableReason]="fieldOf(key).unavailableReason ?? ''"
      [reasonId]="reasonIdFor(key)"
      (removed)="removeField(key)"
      (operatorChanged)="operatorChanged.emit({ key, operator: $event })"
    >
      <ng-container *ngTemplateOutlet="templates()[key] ?? null" />
    </app-filter-chip>
  }

  @if (unsetFields().length > 0) {
    <button
      #addFilterButton
      hlmBtn
      type="button"
      variant="outline"
      size="sm"
      class="border-dashed text-muted-foreground max-sm:min-h-11"
      [attr.data-testid]="testId('filters-add')"
      [hlmDropdownMenuTrigger]="addFilterMenu"
      align="start"
    >
      <ng-icon name="lucidePlus" aria-hidden="true" />
      <span>{{ addFilterLabel }}</span>
    </button>
  }

  <ng-template #addFilterMenu>
    <hlm-dropdown-menu class="w-56">
      <hlm-dropdown-menu-label>{{ addFilterMenuLabel }}</hlm-dropdown-menu-label>
      <hlm-dropdown-menu-separator />
      @for (field of unsetFields(); track field.key) {
        <button
          #unsetFieldItem
          hlmDropdownMenuItem
          class="aria-disabled:cursor-not-allowed aria-disabled:opacity-50"
          [attr.aria-disabled]="field.unavailableReason !== undefined"
          [attr.aria-describedby]="
            field.unavailableReason !== undefined ? reasonIdFor(field.key) : null
          "
          [attr.data-testid]="testId('filters-add-option')"
          (click)="pickField(field.key)"
        >
          <ng-icon [name]="field.icon" aria-hidden="true" />
          <span class="flex min-w-0 flex-col items-start">
            <span class="truncate">{{ field.fieldLabel }}</span>
            @if (field.unavailableReason; as reason) {
              <span
                [id]="reasonIdFor(field.key)"
                class="text-xs whitespace-normal text-muted-foreground"
                >{{ reason }}</span
              >
            }
          </span>
        </button>
      }
    </hlm-dropdown-menu>
  </ng-template>

  @if (hasActiveFilters()) {
    <button
      hlmBtn
      type="button"
      variant="ghost"
      size="sm"
      class="max-sm:min-h-11"
      [attr.data-testid]="testId('clear-filters')"
      (click)="clearAll()"
    >
      <ng-icon name="lucideX" aria-hidden="true" />
      <span>{{ clearFiltersLabel }}</span>
    </button>
  }
</div>
