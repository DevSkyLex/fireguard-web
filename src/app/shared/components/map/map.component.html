<div class="relative h-full w-full">
  <div
    #mapContainer
    class="h-full w-full overflow-hidden"
    role="region"
    [attr.aria-label]="ariaLabel()"
  ></div>

  <!--
    Bottom-right, clear of MapLibre's own navigation control at top-right.
    Hidden until the map has rendered and something is actually placeable, so
    it never offers a re-frame that would do nothing.
  -->
  @if (canFitAll()) {
    <p-button
      icon="pi pi-arrows-alt"
      severity="secondary"
      size="small"
      [rounded]="true"
      i18n-ariaLabel="@@map.fitAll"
      ariaLabel="Fit all markers to view"
      i18n-pTooltip="@@map.fitAll"
      pTooltip="Fit all markers to view"
      tooltipPosition="left"
      data-testid="map-fit-all"
      class="absolute right-3 bottom-3 z-10"
      (onClick)="fitAll()"
    />
  }

  @if (error()) {
    <div
      class="absolute inset-0 z-10 flex items-center justify-center bg-surface-0/95 backdrop-blur-sm dark:bg-surface-950/95"
    >
      <app-error-state
        icon="pi-exclamation-triangle"
        i18n-title="@@map.errorTitle"
        title="Map unavailable"
        i18n-description="@@map.errorDescription"
        description="The map could not be loaded on this device. Check your connection and try again."
      >
        <p-button
          i18n-label="@@map.retry"
          label="Retry"
          icon="pi pi-refresh"
          severity="secondary"
          [outlined]="true"
          size="small"
          (onClick)="retry()"
        />
      </app-error-state>
    </div>
  } @else if (loading()) {
    <div
      class="absolute inset-0 z-10 flex items-center justify-center bg-surface-0/95 p-4 backdrop-blur-sm dark:bg-surface-950/95"
    >
      <app-skeleton preset="chart" i18n-label="@@map.loading" label="Loading map" />
    </div>
  }
</div>
