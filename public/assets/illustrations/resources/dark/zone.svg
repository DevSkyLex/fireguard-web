    .fg-zone-dark .accent-edge, .fg-zone-dark .accent-seam, .fg-zone-dark .accent { stroke: #ff7043; }
    .fg-zone-dark .accent { stroke-width: 1.1; }
    .fg-zone-dark .accent-fill { fill: #ff7043; }
    .fg-zone-dark .tf { fill: url(#fg-zone-dark-plane); }
    .fg-zone-dark .lf { fill: #141417; }
    .fg-zone-dark .rf { fill: #0d0d0f; }
    .fg-zone-dark .at { fill: #4a2a20; }
    .fg-zone-dark .af { fill: #3c221a; }
    .fg-zone-dark .accent-edge, .fg-zone-dark .accent-seam, .fg-zone-dark .accent { stroke-opacity: 1; }
  </style>
