    .fg-time-entry-light .o2 { stroke: #a8a8b0; stroke-width: 1.1; }
    .fg-time-entry-light .e { stroke: #dcdce0; stroke-width: 1; }
    .fg-time-entry-light .d { stroke: #a1a1aa; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-time-entry-light .dh { stroke: #dcdce0; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-time-entry-light .g { stroke: #a8a8b0; stroke-width: 1; stroke-dasharray: 3 3; }
    .fg-time-entry-light .k { stroke: #85858e; stroke-width: 1.2; }
    .fg-time-entry-light .ka, .fg-time-entry-light .oa { stroke: #5f5f68; stroke-width: 1.35; }
    .fg-time-entry-light .da { stroke: #5f5f68; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-time-entry-light .ga { stroke: #5f5f68; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
