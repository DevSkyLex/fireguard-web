name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Full Docker image reference to deploy. Defaults to the branch channel image.
        required: false
        type: string
      source_run_id:
        description: Original CI run ID supplied by automatic publication. Leave empty for manual deployment or rollback.
        required: false
        type: string

concurrency:
  group: deploy-vps-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  guard:
    name: Verify image and SonarQube provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      image-ref: ${{ steps.image.outputs.image-ref }}
      source-sha: ${{ steps.image.outputs.source-sha }}
      deploy-environment: ${{ steps.context.outputs.deploy-environment }}
    steps:
      - name: Checkout deployment verifier
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve deployment event
        id: context
        run: node .github/scripts/deployment-context.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR for image inspection
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Select image reference
        id: selected
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_INPUT: ${{ inputs.image_ref }}
          SOURCE_BRANCH: ${{ steps.context.outputs.source-branch }}
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "$IMAGE_INPUT" ]; then
            image_ref="$IMAGE_INPUT"
          elif [ "$SOURCE_BRANCH" = main ]; then
            image_ref="${image_name}:latest"
          else
            image_ref="${image_name}:develop"
          fi
          # Validate before writing untrusted user input to GITHUB_OUTPUT.
          IMAGE_REF="$image_ref" GH_TOKEN="$GH_TOKEN" node --input-type=module -e '
            import { validateImageConfig } from "./.github/scripts/resolve-image.mjs";
            validateImageConfig(process.env);
          '
          echo "image-ref=$image_ref" >> "$GITHUB_OUTPUT"
        shell: bash
        # This job has only registry/read access; VPS credentials are in deploy.
      - name: Resolve immutable image and source revision
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ steps.selected.outputs.image-ref }}
          SOURCE_BRANCH: ${{ steps.context.outputs.source-branch }}
        run: node .github/scripts/resolve-image.mjs
      - name: Verify exact CI and SonarQube gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ steps.context.outputs.source-branch }}
          SOURCE_SHA: ${{ steps.image.outputs.source-sha }}
          EXPECTED_RUN_ID: ${{ inputs.source_run_id }}
          SONAR_PROJECT_PREFIX: fireguard-web
          SONAR_DEPLOYMENTS_READY: ${{ vars[steps.context.outputs.source-branch == 'main' && 'SONAR_READY_MAIN' || 'SONAR_READY_DEVELOP'] }}
        run: node .github/scripts/verify-ci.mjs

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: guard
    environment: ${{ needs.guard.outputs.deploy-environment }}
    timeout-minutes: 25
    env:
      DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'develop' && 'development' || 'production' }}
      APP_DIR: ${{ vars.VPS_APP_DIR }}
      APP_HOST: ${{ vars.APP_HOST }}
      APP_PORT: ${{ vars.VPS_APP_PORT || '4000' }}
      APP_API_URL: ${{ vars.APP_API_URL }}
      APP_MERCURE_HUB_URL: ${{ vars.APP_MERCURE_HUB_URL }}
      APP_NAME: ${{ vars.APP_NAME || 'Fireguard' }}
      APP_MAINTENANCE: ${{ vars.APP_MAINTENANCE || 'false' }}
      COMPOSE_PROJECT_NAME: ${{ vars.DOCKER_PROJECT_NAME }}
      CONTAINER_NAME: ${{ vars.DOCKER_CONTAINER_NAME }}
      TRAEFIK_ROUTER_NAME: ${{ vars.TRAEFIK_ROUTER_NAME }}
      BASIC_AUTH_USERS: ${{ secrets.BASIC_AUTH_USERS }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}

    steps:
      - name: Validate deploy configuration
        shell: bash
        env:
          BASIC_AUTH_CREDENTIALS: ${{ secrets.BASIC_AUTH_CREDENTIALS }}
        run: |
          case "$GITHUB_REF_NAME" in
            main|develop) ;;
            *) echo "Unsupported deployment branch: $GITHUB_REF_NAME"; exit 1 ;;
          esac

          for value in APP_DIR APP_HOST APP_API_URL APP_MERCURE_HUB_URL COMPOSE_PROJECT_NAME CONTAINER_NAME TRAEFIK_ROUTER_NAME VPS_HOST VPS_USER VPS_SSH_KEY; do
            test -n "${!value}" || { echo "$value is required."; exit 1; }
          done

          if [ "$DEPLOY_ENVIRONMENT" = "development" ]; then
            test -n "$BASIC_AUTH_USERS" || { echo "BASIC_AUTH_USERS secret is required for development."; exit 1; }
            test -n "$BASIC_AUTH_CREDENTIALS" || { echo "BASIC_AUTH_CREDENTIALS secret is required for development checks."; exit 1; }
          fi

      - name: Checkout current deployment tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: deployment

      - name: Checkout verified image source Compose files
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.source-sha }}
          path: image-source

      - name: Set up Ansible controller Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned Ansible dependencies
        run: |
          python -m pip install -r deployment/ansible/requirements.txt
          ansible-galaxy collection install -r deployment/ansible/requirements.yml

      - name: Prepare SSH and Ansible inventory
        shell: bash
        run: |
          directory="$RUNNER_TEMP/fireguard-web-ansible"
          mkdir -p "$directory"
          chmod 700 "$directory"
          printf '%s\n' "$VPS_SSH_KEY" > "$directory/private-key"
          chmod 600 "$directory/private-key"
          python - <<'PY'
          import json
          import os
          import pathlib
          import re

          host = os.environ["VPS_HOST"]
          user = os.environ["VPS_USER"]
          port = os.environ["VPS_PORT"]
          if not re.fullmatch(r"[a-zA-Z0-9][a-zA-Z0-9.:-]*", host):
              raise SystemExit("Invalid VPS host")
          if not re.fullmatch(r"[a-z_][a-z0-9_-]*", user):
              raise SystemExit("Invalid VPS user")
          if not port.isdecimal() or not 1 <= int(port) <= 65535:
              raise SystemExit("Invalid VPS port")
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "fireguard-web-ansible"
          inventory = {"all": {"children": {"fireguard_vps": {"hosts": {"vps": {
              "ansible_host": host,
              "ansible_user": user,
              "ansible_port": int(port),
              "ansible_python_interpreter": "/usr/bin/python3",
              "ansible_ssh_private_key_file": str(directory / "private-key"),
              "ansible_ssh_common_args": f"-o UserKnownHostsFile={directory / 'known_hosts'} -o StrictHostKeyChecking=yes",
          }}}}}}
          (directory / "inventory.json").write_text(json.dumps(inventory))
          PY
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" > "$directory/known_hosts"

      - name: Deploy the verified image with Ansible
        env:
          IMAGE_REF: ${{ needs.guard.outputs.image-ref }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          COMPOSE_SOURCE_DIR: ${{ github.workspace }}/image-source
        run: ansible-playbook -i "$RUNNER_TEMP/fireguard-web-ansible/inventory.json" deployment/ansible/deploy.yml

      - name: Remove temporary SSH credentials
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/fireguard-web-ansible"

      - name: Verify the site publicly
        shell: bash
        env:
          BASIC_AUTH_CREDENTIALS: ${{ secrets.BASIC_AUTH_CREDENTIALS }}
        run: |
          if [ "$DEPLOY_ENVIRONMENT" = "development" ]; then
            curl_options=(-u "$BASIC_AUTH_CREDENTIALS")
          else
            curl_options=()
          fi

          attempt=1
          while [ "$attempt" -le 10 ]; do
            if [ "$DEPLOY_ENVIRONMENT" = "development" ]; then
              unauthenticated=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://${APP_HOST}/") || true
              if [ "$unauthenticated" != "401" ]; then
                echo "attempt ${attempt}/10: expected Basic Auth 401, got ${unauthenticated:-000}"
                attempt=$((attempt + 1))
                sleep 6
                continue
              fi
            fi

            result=$(curl "${curl_options[@]}" -sSL -o /dev/null -w '%{http_code}|%header{x-robots-tag}' --max-time 15 "https://${APP_HOST}/") || true
            [ -n "$result" ] || result="000|"
            code=${result%%|*}
            robots_header=${result#*|}
            if [ "$code" = "200" ]; then
              if [ "$DEPLOY_ENVIRONMENT" != "development" ] || [[ "${robots_header,,}" == *noindex* ]]; then
                exit 0
              fi
              echo "attempt ${attempt}/10: final response is missing X-Robots-Tag noindex"
            else
              echo "attempt ${attempt}/10: HTTP ${code}"
            fi
            attempt=$((attempt + 1))
            sleep 6
          done

          echo "::error::https://${APP_HOST}/ never answered 200."
          exit 1
