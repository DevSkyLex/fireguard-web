<div class="flex flex-col" data-testid="calendar-entry-list">
  @for (item of items(); track item.sourceKey + item.id) {
    @if (interventionLinkOf(item); as link) {
      <a
        hlmItem
        size="sm"
        class="rounded-none border-x-0 border-t-0 border-b border-border last:border-b-0"
        data-testid="calendar-day-item"
        [routerLink]="link"
      >
        <div hlmItemContent>
          <span hlmItemTitle class="line-clamp-1">{{ item.title }}</span>
          <span hlmItemDescription>{{ timeLabelOf(item) }}</span>
        </div>
        <span hlmBadge [variant]="toneOf(item)">{{ sourceLabelOf(item) }}</span>
      </a>
    } @else {
      <div
        hlmItem
        size="sm"
        class="rounded-none border-x-0 border-t-0 border-b border-border last:border-b-0"
        data-testid="calendar-day-item"
      >
        <div hlmItemContent>
          <span hlmItemTitle class="line-clamp-1">{{ item.title }}</span>
          <span hlmItemDescription>{{ timeLabelOf(item) }}</span>
        </div>
        <span hlmBadge [variant]="toneOf(item)">{{ sourceLabelOf(item) }}</span>
        @if (isEditableOf(item)) {
          <div class="flex items-center gap-1">
            <button
              hlmBtn
              type="button"
              variant="ghost"
              size="icon-sm"
              class="max-sm:size-11"
              data-testid="calendar-day-item-edit"
              [attr.aria-label]="editAriaLabelOf(item)"
              (click)="editRequested.emit(item)"
            >
              <ng-icon name="lucidePencil" aria-hidden="true" />
            </button>
            <button
              hlmBtn
              type="button"
              variant="ghost"
              size="icon-sm"
              class="max-sm:size-11"
              data-testid="calendar-day-item-delete"
              [attr.aria-label]="deleteAriaLabelOf(item)"
              (click)="deleteRequested.emit(item)"
            >
              <ng-icon name="lucideTrash2" aria-hidden="true" />
            </button>
          </div>
        }
      </div>
    }
  }
</div>
