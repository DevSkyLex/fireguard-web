<div id="organization-map" class="flex min-h-0 w-full flex-1 flex-col p-3 sm:p-6 md:p-7 lg:p-8">
  @if (isEmpty()) {
    <app-empty-state
      icon="pi pi-map-marker"
      i18n-title="@@map.empty.title"
      title="No facilities to place yet"
      i18n-description="@@map.empty.desc"
      description="Facilities with an address will appear here once they are added."
    />
  } @else {
    <!--
      A definite min-height, not just `flex-1`: MapLibre renders into a canvas
      that needs real pixels, and the dashboard content wrapper is `min-h-full`,
      so `flex-1` alone resolves to zero and the map collapses to a strip.
    -->
    <app-map
      class="min-h-[24rem] flex-1 overflow-hidden rounded-lg"
      [markers]="markers()"
      i18n-ariaLabel="@@map.facilitiesAria"
      ariaLabel="Facilities map"
      (markerSelect)="openFacility($event)"
    />
  }
</div>
