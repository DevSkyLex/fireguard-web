    .fg-usage-light .da { stroke: #5f5f68; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-usage-light .ga { stroke: #5f5f68; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
