<ol
  class="flex w-full items-center"
  i18n-aria-label="@@intervention.phase.stepperAria"
  aria-label="Workflow phases"
>
  @for (step of steps(); track step.key; let last = $last) {
    <li
      class="flex min-w-0 items-start"
      [class.flex-1]="!last"
      [attr.aria-current]="step.state === 'active' ? 'step' : null"
      [attr.aria-label]="step.label"
    >
      <span class="flex shrink-0 flex-col items-center gap-1.5">
        @if (step.state === 'active') {
          <span class="flex size-5 shrink-0 items-center justify-center rounded-full bg-primary">
            <i [class]="step.icon + ' text-[9px] text-white'" aria-hidden="true"></i>
          </span>
          <span
            class="text-xs font-semibold whitespace-nowrap text-surface-950 dark:text-surface-50"
          >
            {{ step.label }}
          </span>
          @if (activeDetail(); as detail) {
            <span class="text-xs font-medium text-surface-500 tabular-nums dark:text-surface-400">
              {{ detail }}
            </span>
          }
        } @else if (step.state === 'done') {
          <span
            class="flex size-5 shrink-0 items-center justify-center rounded-full border-[1.5px] border-green-600/30 bg-green-50 text-green-700 dark:border-green-400/30 dark:bg-green-400/10 dark:text-green-300"
          >
            <i class="pi pi-check text-[9px]" aria-hidden="true"></i>
          </span>
          <span
            class="text-xs font-semibold whitespace-nowrap text-surface-600 dark:text-surface-400"
          >
            {{ step.label }}
          </span>
        } @else {
          <!-- Each milestone carries its own icon; an empty circle said only
               "not yet" and threw that away. -->
          <span
            class="flex size-5 shrink-0 items-center justify-center rounded-full border-[1.5px] border-surface-200 bg-surface-0 text-surface-400 dark:border-surface-800 dark:bg-surface-950 dark:text-surface-500"
            aria-hidden="true"
          >
            <i [class]="step.icon + ' text-[9px]'" aria-hidden="true"></i>
          </span>
          <span
            class="text-xs font-semibold whitespace-nowrap text-surface-500 dark:text-surface-400"
          >
            {{ step.label }}
          </span>
        }
      </span>
      @if (!last) {
        <span
          class="mx-2 mt-2.5 h-[1.5px] min-w-2 flex-1 self-start rounded-full sm:mx-3 sm:min-w-4"
          [class]="connectorClasses(step.state)"
          aria-hidden="true"
        ></span>
      }
    </li>
  }
</ol>
