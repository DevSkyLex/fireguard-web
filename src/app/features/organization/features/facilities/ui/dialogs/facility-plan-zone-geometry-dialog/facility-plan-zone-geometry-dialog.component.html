<hlm-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-dialog-content
    class="max-h-[calc(100svh-2rem)] overflow-y-auto overscroll-contain sm:max-w-md"
    data-testid="facility-plan-zone-geometry-dialog"
    *hlmDialogPortal
  >
    <hlm-dialog-header>
      <h3 hlmDialogTitle i18n="@@facility.plans.editor.zoneDialog.title">Edit coordinates</h3>
      <p hlmDialogDescription>{{ zoneName() }}</p>
    </hlm-dialog-header>

    <div class="flex flex-col gap-2">
      <div class="flex items-center gap-2 text-xs text-muted-foreground">
        <span class="flex-1" i18n="@@facility.plans.editor.zoneDialog.xLabel">X (%)</span>
        <span class="flex-1" i18n="@@facility.plans.editor.zoneDialog.yLabel">Y (%)</span>
        <span class="w-9"></span>
      </div>
      @for (row of rows(); track $index) {
        <div class="flex items-center gap-2" data-testid="facility-plan-zone-geometry-row">
          <div hlmField class="min-w-0 flex-1">
            <label hlmFieldLabel class="sr-only" [for]="'zone-x-' + $index">{{
              vertexXLabel($index + 1)
            }}</label>
            <input
              [id]="'zone-x-' + $index"
              hlmInput
              type="text"
              inputmode="decimal"
              class="w-full mobile-ui:min-h-11 mobile-ui:min-w-11"
              data-testid="facility-plan-zone-geometry-row-x"
              [attr.aria-label]="vertexXLabel($index + 1)"
              [attr.aria-invalid]="isInvalidValue(row.x) ? 'true' : null"
              [attr.aria-describedby]="
                isInvalidValue(row.x) ? 'facility-plan-zone-geometry-row-error-' + $index : null
              "
              [formField]="coordinatesForm[$index].x"
            />
          </div>
          <div hlmField class="min-w-0 flex-1">
            <label hlmFieldLabel class="sr-only" [for]="'zone-y-' + $index">{{
              vertexYLabel($index + 1)
            }}</label>
            <input
              [id]="'zone-y-' + $index"
              hlmInput
              type="text"
              inputmode="decimal"
              class="w-full mobile-ui:min-h-11 mobile-ui:min-w-11"
              data-testid="facility-plan-zone-geometry-row-y"
              [attr.aria-label]="vertexYLabel($index + 1)"
              [attr.aria-invalid]="isInvalidValue(row.y) ? 'true' : null"
              [attr.aria-describedby]="
                isInvalidValue(row.y) ? 'facility-plan-zone-geometry-row-error-' + $index : null
              "
              [formField]="coordinatesForm[$index].y"
            />
          </div>
          <button
            hlmBtn
            type="button"
            variant="ghost"
            size="icon-sm"
            data-testid="facility-plan-zone-geometry-row-remove"
            [attr.aria-label]="removeVertexLabel($index + 1)"
            [disabled]="pending()"
            (click)="removeRow($index)"
            class="mobile-ui:min-h-11 mobile-ui:min-w-11"
          >
            <ng-icon name="lucideTrash2" aria-hidden="true" />
          </button>
        </div>
        @if (isInvalidValue(row.x) || isInvalidValue(row.y)) {
          <hlm-field-error
            class="text-xs"
            role="alert"
            [id]="'facility-plan-zone-geometry-row-error-' + $index"
            data-testid="facility-plan-zone-geometry-row-error"
            i18n="@@facility.plans.editor.invalidPercent"
          >
            Enter a value between 0 and 100
          </hlm-field-error>
        }
      }

      <button
        hlmBtn
        type="button"
        variant="outline"
        size="sm"
        class="self-start mobile-ui:min-h-11"
        data-testid="facility-plan-zone-geometry-add-row"
        [disabled]="pending()"
        (click)="addRow()"
      >
        <ng-icon name="lucidePlus" aria-hidden="true" />
        <span i18n="@@facility.plans.editor.zoneDialog.addVertex">Add vertex</span>
      </button>

      @if (rows().length > 0 && rows().length < 3) {
        <hlm-field-error
          class="text-xs"
          role="alert"
          i18n="@@facility.plans.editor.zoneDialog.minVertices"
        >
          A zone outline needs at least three vertices.
        </hlm-field-error>
      }
    </div>

    <hlm-dialog-footer class="justify-between">
      <button
        hlmBtn
        type="button"
        variant="destructive"
        class="mobile-ui:min-h-11"
        data-testid="facility-plan-zone-geometry-clear"
        [disabled]="pending() || rows().length === 0"
        (click)="requestClear()"
        i18n="@@facility.plans.editor.zoneDialog.clear"
      >
        Clear geometry
      </button>
      <button
        hlmBtn
        type="button"
        class="mobile-ui:min-h-11"
        data-testid="facility-plan-zone-geometry-submit"
        [disabled]="pending() || !canSubmit()"
        (click)="submit()"
      >
        @if (pending()) {
          <hlm-spinner class="size-3.5" aria-hidden="true" />
        }
        <span i18n="@@common.save">Save</span>
      </button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
