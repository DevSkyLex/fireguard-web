<form novalidate (submit)="submit($event)">
  <hlm-field-group>
    @if (serverError(); as error) {
      <div role="alert" data-testid="otp-server-error" class="text-sm text-destructive">
        <p>
          @if (error.message; as message) {
            {{ message }}
          } @else {
            <span i18n="@@auth.otp.failed">Something went wrong. Try again.</span>
          }
        </p>
      </div>
    }

    <hlm-field>
      <label hlmFieldLabel for="otp-code"
        ><span i18n="@@auth.otp.label">Verification code</span
        ><span aria-hidden="true" class="text-destructive">&nbsp;*</span
        ><span class="sr-only" i18n="@@common.required"> required</span></label
      >

      <brn-input-otp
        hlmInputOtp
        class="w-full"
        inputId="otp-code"
        autocomplete="one-time-code"
        data-testid="otp-code"
        [length]="length"
        [formField]="otpForm.code"
        (completed)="autoSubmit()"
      >
        <hlm-input-otp-group class="min-w-0 flex-1">
          <hlm-input-otp-slot index="0" class="h-11 w-auto min-w-0 flex-1 text-base" />
          <hlm-input-otp-slot index="1" class="h-11 w-auto min-w-0 flex-1 text-base" />
          <hlm-input-otp-slot index="2" class="h-11 w-auto min-w-0 flex-1 text-base" />
        </hlm-input-otp-group>
        <hlm-input-otp-separator />
        <hlm-input-otp-group class="min-w-0 flex-1">
          <hlm-input-otp-slot index="3" class="h-11 w-auto min-w-0 flex-1 text-base" />
          <hlm-input-otp-slot index="4" class="h-11 w-auto min-w-0 flex-1 text-base" />
          <hlm-input-otp-slot index="5" class="h-11 w-auto min-w-0 flex-1 text-base" />
        </hlm-input-otp-group>
      </brn-input-otp>

      <hlm-field-error>{{ otpForm.code().errors()[0]?.message }}</hlm-field-error>
    </hlm-field>

    @if (showTrustDevice()) {
      <label class="flex items-center gap-2 text-sm text-muted-foreground">
        <hlm-checkbox
          id="otp-trust-device"
          data-testid="otp-trust-device"
          [formField]="otpForm.trustDevice"
        />
        <span i18n="@@auth.otp.trustDevice">Trust this device for 30 days</span>
      </label>
    }

    <button
      hlmBtn
      type="submit"
      class="w-full max-sm:min-h-11"
      data-testid="otp-submit"
      [disabled]="pending()"
      [attr.aria-busy]="pending() ? 'true' : null"
      aria-live="polite"
    >
      @if (pending()) {
        <span i18n="@@auth.otp.submitting">Verifying…</span>
      } @else {
        <span i18n="@@auth.otp.submit">Verify</span>
      }
    </button>

    @if (showResend()) {
      <button
        hlmBtn
        type="button"
        variant="ghost"
        size="sm"
        class="w-full max-sm:min-h-11"
        data-testid="otp-resend"
        [disabled]="resending() || cooldownRemaining() > 0"
        (click)="resent.emit()"
      >
        @if (resending()) {
          <span i18n="@@auth.otp.resending">Sending a new code…</span>
        } @else if (cooldownRemaining() > 0) {
          <span data-testid="otp-resend-cooldown" i18n="@@auth.otp.resendIn"
            >Resend available in {{ cooldownRemaining() }}s</span
          >
        } @else {
          <span i18n="@@auth.otp.resend">Send a new code</span>
        }
      </button>
    }
  </hlm-field-group>
</form>
