<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" fill="none" role="img" aria-labelledby="fg-channel-dark-title fg-channel-dark-description" class="fg-channel-dark">
  <title id="fg-channel-dark-title">Channel</title>
  <desc id="fg-channel-dark-description">A standing speech bubble with the channel hash engraved on it.</desc>
  <defs>
    <linearGradient id="fg-channel-dark-cy" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#121215"/><stop offset="1" stop-color="#0f0f12"/></linearGradient>


  </defs>
  <style>
    .fg-channel-dark { stroke-linecap: round; stroke-linejoin: round; }
    .fg-channel-dark path { vector-effect: non-scaling-stroke; }
    .fg-channel-dark .t { fill: #0c0c0f; }
    .fg-channel-dark .l { fill: #121215; }
    .fg-channel-dark .r { fill: #0f0f12; }
    .fg-channel-dark .hole { fill: #060607; }
    .fg-channel-dark .cy { fill: url(#fg-channel-dark-cy); }
    .fg-channel-dark .af { fill: #bdbdc5; }
    .fg-channel-dark .kf { fill: #8e8e97; }
    .fg-channel-dark .eo { fill-rule: evenodd; }
    .fg-channel-dark .o { stroke: #a1a1aa; stroke-width: 1.35; }
    .fg-channel-dark .o2 { stroke: #71717a; stroke-width: 1.1; }
    .fg-channel-dark .e { stroke: #3f3f46; stroke-width: 1; }
    .fg-channel-dark .d { stroke: #71717a; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-channel-dark .dh { stroke: #3f3f46; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-channel-dark .g { stroke: #71717a; stroke-width: 1; stroke-dasharray: 3 3; }
    .fg-channel-dark .k { stroke: #8e8e97; stroke-width: 1.2; }
    .fg-channel-dark .ka, .fg-channel-dark .oa { stroke: #bdbdc5; stroke-width: 1.35; }
    .fg-channel-dark .da { stroke: #bdbdc5; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-channel-dark .ga { stroke: #bdbdc5; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
