<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5">
  @if (unmatchedViolation(); as violation) {
    <p-message severity="error" variant="simple" size="small" role="alert">
      <span>{{ violation }}</span>
    </p-message>
  }

  <div class="flex flex-col gap-2">
    <label for="role-name" class="text-sm font-medium text-surface-900 dark:text-surface-50">
      <ng-container i18n="@@org.roleForm.nameLabel">Role name</ng-container>
      <span class="text-red-500" aria-hidden="true">&nbsp;*</span>
    </label>
    <input
      pInputText
      id="role-name"
      formControlName="name"
      class="w-full"
      i18n-placeholder="@@org.roleForm.name"
      placeholder="Role name"
      [invalid]="form.controls.name.invalid && form.controls.name.touched"
    />
    @if (form.controls.name.invalid && form.controls.name.touched) {
      <p-message severity="error" variant="simple" size="small">
        <span i18n="@@org.roleForm.nameError">Enter a role name.</span>
      </p-message>
    }
    @if (serverFieldErrors()['name']; as serverMessage) {
      <p-message severity="error" variant="simple" size="small" role="alert">
        <span>{{ serverMessage }}</span>
      </p-message>
    }
  </div>

  <div class="flex flex-col gap-2">
    <label
      for="role-description"
      class="text-sm font-medium text-surface-900 dark:text-surface-50"
      i18n="@@org.roleForm.descriptionLabel"
    >
      Description
      <span class="font-normal text-surface-500 dark:text-surface-400">(optional)</span>
    </label>
    <textarea
      pTextarea
      id="role-description"
      rows="3"
      formControlName="description"
      class="w-full"
      i18n-placeholder="@@org.roleForm.description"
      placeholder="Role description"
    ></textarea>
  </div>

  <div class="flex flex-col gap-2">
    <label for="role-permissions" class="text-sm font-medium text-surface-900 dark:text-surface-50">
      <ng-container i18n="@@org.roleForm.permissionsLabel">Permissions</ng-container>
    </label>
    <p-multiselect
      inputId="role-permissions"
      [options]="[...permissions()]"
      optionLabel="name"
      optionValue="name"
      formControlName="permissions"
      i18n-placeholder="@@org.roleForm.permissions"
      placeholder="Select permissions"
      [filter]="true"
      display="chip"
      styleClass="w-full"
    />
  </div>

  <div class="flex items-center justify-end gap-2">
    @if (role()) {
      <p-button
        type="button"
        i18n-label="@@org.roleForm.cancelEdit"
        label="Cancel edit"
        severity="secondary"
        [outlined]="true"
        (onClick)="cancelled.emit()"
      />
    } @else {
      <p-button
        type="button"
        i18n-label="@@common.cancel"
        label="Cancel"
        severity="secondary"
        [outlined]="true"
        (onClick)="cancelled.emit()"
      />
    }
    <p-button
      type="submit"
      [label]="submitLabel"
      icon="pi pi-check"
      [loading]="loading()"
      [disabled]="form.invalid || loading()"
    />
  </div>
</form>
