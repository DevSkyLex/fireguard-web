<!--
  One tile per workspace, geometry from the collaboration kit: 38px square,
  11px radius. The active tile is the only elevated surface on the rail.
-->
<ul class="flex flex-col items-center gap-2" data-testid="organization-rail-switcher">
  @for (organization of organizations(); track organization.id) {
    <li>
      <button
        type="button"
        class="grid size-9.5 cursor-pointer place-content-center overflow-hidden rounded-[11px] text-[13px] font-semibold transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        [class]="
          organization.id === activeOrganizationId()
            ? 'bg-surface-0 text-surface-950 ring-2 ring-primary dark:bg-surface-950 dark:text-surface-50'
            : 'bg-surface-200 text-surface-700 hover:bg-surface-300 dark:bg-surface-800 dark:text-surface-300 dark:hover:bg-surface-700'
        "
        [pTooltip]="organization.name"
        tooltipPosition="right"
        [attr.aria-label]="organization.name"
        [attr.aria-current]="organization.id === activeOrganizationId() ? 'true' : null"
        [attr.data-testid]="'organization-rail-tile'"
        (click)="switchTo(organization)"
      >
        @if (organization.logoUrl) {
          <img [src]="organization.logoUrl" [alt]="''" class="size-full object-cover" />
        } @else {
          {{ initialOf(organization) }}
        }
      </button>
    </li>
  }

  <li>
    <button
      type="button"
      class="grid size-9.5 cursor-pointer place-content-center rounded-[11px] border border-dashed border-surface-400 text-surface-500 transition-colors hover:border-primary hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:border-surface-600 dark:text-surface-400 dark:hover:border-primary dark:hover:text-primary"
      pTooltip="Add organization"
      i18n-pTooltip="@@layout.orgRail.add"
      tooltipPosition="right"
      aria-label="Add organization"
      i18n-aria-label="@@layout.orgRail.add"
      data-testid="organization-rail-add"
      (click)="addOrganization()"
    >
      <i class="pi pi-plus text-[13px]" aria-hidden="true"></i>
    </button>
  </li>
</ul>
