<div class="flex flex-col gap-6">
  @if (!compact()) {
    <div class="flex flex-col gap-3">
      <p class="text-xs text-muted-foreground">{{ progressLabel() }}</p>
      <hlm-progress
        [value]="progress().total ? (progress().done / progress().total) * 100 : 0"
        aria-hidden="true"
      >
        <hlm-progress-indicator class="motion-reduce:transition-none" />
      </hlm-progress>
    </div>
  }
  <ol hlmItemGroup class="gap-1">
    @for (row of rows(); track row.key) {
      <li
        hlmItem
        size="sm"
        [variant]="row.isActive ? 'muted' : 'default'"
        class="min-w-0 flex-nowrap items-start"
        [attr.aria-current]="row.isActive ? 'step' : null"
      >
        <ng-icon
          [name]="row.isActive ? row.icon : row.statusIcon"
          size="16px"
          class="mt-0.5 shrink-0"
          [class]="row.isActive ? 'text-foreground' : row.statusIconClass"
          aria-hidden="true"
        />
        <div class="flex min-w-0 flex-col gap-1">
          <p
            class="text-sm leading-snug"
            data-testid="onboarding-step-label"
            [class.font-semibold]="row.isActive"
            [class.text-muted-foreground]="!row.isActive"
          >
            {{ row.label }}
          </p>
          @if (row.showSublabel) {
            <p class="text-xs leading-relaxed text-muted-foreground">{{ row.sublabel }}</p>
          }
          <span class="text-xs text-muted-foreground" [class.sr-only]="!row.statusLabelVisible">{{
            row.statusLabel
          }}</span>
        </div>
      </li>
    }
  </ol>
</div>
