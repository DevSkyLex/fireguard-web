<div id="organization-list" class="flex h-full flex-col gap-6 p-3 sm:p-6 md:p-7 lg:p-8">
  <app-organization-dataview
    class="flex min-h-0 flex-1 flex-col"
    [organizations]="store.organizations()"
    [total]="store.totalOrganizations()"
    [loading]="store.isLoadingOrganizations()"
    [initialPage]="page()"
    (load)="onLoad($event)"
    (pageChange)="onPageChange($event)"
    (view)="onView($event)"
    (add)="onAdd()"
  />
</div>
