<div id="split-layout" class="flex min-h-dvh bg-surface-50 transition-colors dark:bg-surface-950">
  <!-- Showcase panel (left): full-bleed, 50/50 with the form column on large screens -->
  <aside class="hidden lg:block lg:w-1/2">
    <app-split-layout-showcase-outlet />
  </aside>

  <!-- Form column (right). The header floats so the content centers on the full height. -->
  <div class="relative flex min-h-dvh flex-1 flex-col">
    <app-split-layout-header class="absolute inset-x-0 top-0 z-10" />

    <app-split-layout-content class="flex flex-1 flex-col">
      <router-outlet />
    </app-split-layout-content>

    <app-split-layout-footer class="shrink-0" />
  </div>
</div>
