<div
  id="not-found-page"
  class="flex w-full max-w-full min-w-0 flex-col items-center gap-8 text-center sm:max-w-xl"
>
  <div class="flex flex-col gap-2">
    <app-error-scene
      code="404"
      primaryIcon="lucideMapPin"
      secondaryIcon="lucideRoute"
      accentIcon="lucideCompass"
    />
    <app-page-heading
      size="large"
      heading="That page is not here"
      i18n-heading="@@error.notFound.title"
      description="The link may be out of date, or the record it pointed to may have been removed."
      i18n-description="@@error.notFound.description"
    />
  </div>

  <div class="grid w-full max-w-md grid-cols-1 items-stretch gap-3 sm:grid-cols-2">
    <a hlmBtn size="lg" class="h-11 min-h-11" routerLink="/" i18n="@@error.notFound.home">
      Go to my workspace
    </a>
    <button hlmBtn variant="outline" size="lg" class="h-11 min-h-11 gap-2" (click)="goBack()">
      <ng-icon name="lucideArrowLeft" class="text-sm" aria-hidden="true" />
      <span i18n="@@error.notFound.back">Go back</span>
    </button>
  </div>
</div>
