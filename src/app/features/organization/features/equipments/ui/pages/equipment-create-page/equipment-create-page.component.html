<div id="equipment-create" class="flex w-full flex-col gap-4 p-4 md:p-6">
  <p class="text-sm text-muted-foreground" i18n="@@equipment.create.description">
    Register an asset with the details field agents need to identify and inspect it.
  </p>

  <div hlmCard class="max-w-xl">
    <div hlmCardContent>
      <app-equipment-create-form
        [pending]="store.isCreating()"
        [serverError]="store.createError()"
        (submitted)="onSubmitted($event)"
        (cancelled)="onCancelled()"
        (dirtyChanged)="formDirty.set($event)"
      />
    </div>
  </div>
</div>

<app-unsaved-changes-dialog
  [state]="unsavedChangesDialogState()"
  (confirmed)="onUnsavedChangesConfirmed()"
  (dismissed)="onUnsavedChangesDismissed()"
/>

<ng-template #pageActions>
  <a
    hlmBtn
    type="button"
    variant="outline"
    size="sm"
    class="min-w-0 shrink"
    data-testid="equipment-create-back"
    [routerLink]="['/organizations', organizationId(), 'equipments']"
  >
    <span class="truncate" i18n="@@equipment.detail.backToList">Back to equipment</span>
  </a>
</ng-template>
