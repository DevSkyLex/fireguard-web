---
fireguard_environment: "{{ lookup('env', 'DEPLOY_ENVIRONMENT') }}"
fireguard_app_dir: "{{ lookup('env', 'APP_DIR') }}"
fireguard_project_name: "{{ lookup('env', 'COMPOSE_PROJECT_NAME') }}"
fireguard_container_name: "{{ lookup('env', 'CONTAINER_NAME') }}"
fireguard_router_name: "{{ lookup('env', 'TRAEFIK_ROUTER_NAME') }}"
fireguard_image: "{{ lookup('env', 'IMAGE_REF') }}"
fireguard_app_host: "{{ lookup('env', 'APP_HOST') }}"
fireguard_app_port: "{{ lookup('env', 'APP_PORT') }}"
fireguard_api_url: "{{ lookup('env', 'APP_API_URL') }}"
fireguard_mercure_url: "{{ lookup('env', 'APP_MERCURE_HUB_URL') }}"
fireguard_app_name: "{{ lookup('env', 'APP_NAME') }}"
fireguard_maintenance: "{{ lookup('env', 'APP_MAINTENANCE') }}"
fireguard_basic_auth_users: "{{ lookup('env', 'BASIC_AUTH_USERS') }}"
fireguard_ghcr_username: "{{ lookup('env', 'GHCR_USERNAME') }}"
fireguard_ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') }}"
fireguard_compose_source_dir: "{{ lookup('env', 'COMPOSE_SOURCE_DIR') | default(role_path + '/../../..', true) }}"
fireguard_compose_files: "{{ ['docker-compose.prod.yml', 'docker-compose.dev.yml'] if fireguard_environment == 'development' else ['docker-compose.prod.yml'] }}"
fireguard_secure_middlewares: "{{ fireguard_router_name + '-security,' + fireguard_router_name + '-auth,' + fireguard_router_name + '-noindex' if fireguard_environment == 'development' else fireguard_router_name + '-security' }}"
fireguard_uses_ghcr: "{{ fireguard_image is match('^ghcr\\.io/') }}"
fireguard_compose_argv: "{{ ['docker', 'compose', '--project-directory', fireguard_app_dir, '--project-name', fireguard_project_name] + (fireguard_compose_files | map('regex_replace', '^(.*)$', '-f,\\1') | join(',') | split(',')) }}"
