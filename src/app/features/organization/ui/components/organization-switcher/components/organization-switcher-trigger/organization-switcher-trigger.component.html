@if (isLoading() && !organization()) {
  <p-skeleton width="100%" height="2.875rem" borderRadius="0.5rem" />
} @else {
  <button
    type="button"
    class="flex w-full cursor-pointer items-center gap-2.5 rounded-lg border border-surface-200 bg-surface-0 px-2.5 py-2 text-left shadow-2xs transition-colors hover:border-surface-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-default dark:border-surface-800 dark:bg-surface-900 dark:hover:border-surface-600"
    [disabled]="isSwitching()"
    (click)="onButtonClick($event)"
  >
    @if (organization(); as org) {
      <p-avatar
        [image]="org.logoUrl || undefined"
        [label]="org.logoUrl ? undefined : orgInitials(org.name)"
        [pt]="avatarPt(org)"
      />

      <span class="min-w-0 flex-1 leading-tight">
        <span
          class="block truncate text-[13px] font-semibold text-surface-950 dark:text-surface-50"
        >
          {{ org.name }}
        </span>
        @if (org.planName) {
          <span class="block truncate text-xs font-medium text-surface-600 dark:text-surface-400">
            {{ org.planName }}
          </span>
        }
      </span>

      @if (isSwitching()) {
        <i
          class="pi pi-spin pi-spinner shrink-0 text-sm text-surface-500 dark:text-surface-400"
        ></i>
      } @else {
        <span
          class="flex shrink-0 flex-col items-center text-surface-500 dark:text-surface-400"
          aria-hidden="true"
        >
          <i class="pi pi-chevron-up text-[8px] leading-none"></i>
          <i class="pi pi-chevron-down mt-px text-[8px] leading-none"></i>
        </span>
      }
    } @else {
      <span
        class="flex size-7 shrink-0 items-center justify-center rounded-md border border-surface-200 bg-surface-100 dark:border-surface-800 dark:bg-surface-800"
      >
        <i class="pi pi-building text-xs text-surface-500 dark:text-surface-400"></i>
      </span>

      <span
        class="min-w-0 flex-1 truncate text-[13px] font-medium text-surface-600 dark:text-surface-400"
        i18n="@@org.switcher.selectWorkspace"
        >Select workspace</span
      >

      <span
        class="flex shrink-0 flex-col items-center text-surface-500 dark:text-surface-400"
        aria-hidden="true"
      >
        <i class="pi pi-chevron-up text-[8px] leading-none"></i>
        <i class="pi pi-chevron-down mt-px text-[8px] leading-none"></i>
      </span>
    }
  </button>
}
