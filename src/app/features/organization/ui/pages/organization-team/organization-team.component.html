<div id="organization-team" class="flex h-full min-h-0 flex-col">
  <section class="px-4 pt-8 pb-4 sm:px-6 lg:px-8 xl:px-10">
    <h1
      i18n="@@org.team.title"
      class="text-2xl font-semibold tracking-[-0.025em] text-surface-950 dark:text-surface-50"
    >
      Roles &amp; permissions
    </h1>
    <p
      i18n="@@org.team.subtitle"
      class="mt-1.5 text-sm leading-6 text-surface-600 dark:text-surface-400"
    >
      Define the roles and permissions that govern what members can do.
    </p>
  </section>

  <section
    class="flex min-h-0 flex-1 flex-col gap-6 overflow-y-auto p-4 sm:px-6 sm:pb-6 lg:px-8 lg:pb-8 xl:px-10 xl:pb-10"
  >
    @if (store.loadError(); as error) {
      <p-message severity="error">
        <div class="flex flex-wrap items-center gap-3">
          <span>{{ error.message ?? loadErrorFallback }}</span>
          <p-button
            i18n-label="@@org.team.retry"
            label="Retry"
            icon="pi pi-refresh"
            severity="secondary"
            [text]="true"
            (onClick)="reload()"
          />
        </div>
      </p-message>
    }
    @if (store.mutationError(); as error) {
      <p-message severity="error">{{ error.message ?? mutationErrorFallback }}</p-message>
    }

    @if (canManageRoles()) {
      <p-card
        [header]="roleCardHeader()"
        styleClass="border border-surface-200 dark:border-surface-800 dark:bg-surface-900"
      >
        <app-organization-role-form
          [role]="selectedRole()"
          [permissions]="store.permissions()"
          [loading]="store.isMutating()"
          (submitted)="saveRole($event)"
          (cancelled)="selectedRole.set(null)"
        />
      </p-card>
    }

    <app-organization-role-table
      [roles]="store.roles()"
      [loading]="store.isLoading()"
      [canManage]="canManageRoles()"
      (edit)="selectedRole.set($event)"
      (remove)="removeRole($event)"
    />
  </section>
</div>
