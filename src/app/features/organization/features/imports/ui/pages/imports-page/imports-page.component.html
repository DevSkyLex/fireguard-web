<div id="imports" class="flex min-h-0 w-full flex-1 flex-col gap-4 p-4 md:p-6">
  @if (canUpload()) {
    <section hlmCard class="max-w-xl" data-testid="imports-upload-card">
      <div hlmCardHeader>
        <h2 hlmCardTitle i18n="@@imports.upload.title">Import from CSV</h2>
        <p hlmCardDescription i18n="@@imports.upload.description">
          Bulk-create equipment, facilities or member invitations from a spreadsheet export.
        </p>
      </div>
      <div hlmCardContent>
        <app-import-upload-form
          [kindOptions]="availableKindOptions()"
          [pending]="store.isCreating()"
          [error]="store.createError()"
          (submitted)="upload($event)"
        />
      </div>
    </section>
  }

  <app-collection-toolbar>
    <app-collection-filter-toggle
      toolbarEnd
      [visible]="filtersVisible()"
      [activeCount]="activeFilterKeys().length"
      label="Filters"
      i18n-label="@@imports.list.filtersButton"
      testIdPrefix="imports"
      (visibleChange)="toggleFiltersVisible($event)"
    />
  </app-collection-toolbar>

  @if (filtersVisible()) {
    <app-collection-filter-bar
      [fields]="filterFields"
      [activeKeys]="activeFilterKeys()"
      [pendingKey]="openFilterKey()"
      [templates]="chipTemplates()"
      testIdPrefix="imports"
      (fieldPicked)="onFieldPicked($event)"
      (fieldRemoved)="onFieldRemoved()"
      (filtersCleared)="clearFilters()"
    />
  }

  <ng-template #kindChip>
    <app-collection-filter-select
      [options]="kindFilterOptions"
      [value]="kindFilter()"
      placeholder="Any kind"
      i18n-placeholder="@@imports.list.filterKindPlaceholder"
      emptyLabel="No kind matches."
      i18n-emptyLabel="@@imports.list.filterNoKind"
      accessibleName="Kind"
      i18n-accessibleName="@@imports.list.filterKind"
      triggerId="imports-filter-kind"
      testId="imports-filter-kind"
      [state]="fieldPopoverState()"
      (valueChanged)="applyKindFilter($any($event))"
      (stateChanged)="onFieldPopoverStateChanged($event)"
    />
  </ng-template>

  @if (store.hasListError()) {
    <app-error-state
      icon="lucideCircleAlert"
      title="Couldn't load import jobs"
      i18n-title="@@imports.list.errorTitle"
      description="The jobs could not be loaded. Check your connection and try again."
      i18n-description="@@imports.list.errorText"
    >
      <button hlmBtn variant="outline" data-testid="imports-retry" (click)="reload()">
        <span i18n="@@imports.list.retry">Retry</span>
      </button>
    </app-error-state>
  } @else if (!store.isLoading() && items().length === 0) {
    <app-empty-state
      [icon]="hasFilters() ? 'lucideSearch' : 'lucideUpload'"
      title="No import jobs yet"
      i18n-title="@@imports.list.emptyTitle"
      description="Upload a CSV file above to bulk-create equipment, facilities or member invitations."
      i18n-description="@@imports.list.emptyDesc"
    >
      @if (hasFilters()) {
        <button hlmBtn variant="outline" (click)="clearFilters()">
          <span i18n="@@common.clearFilters">Clear filters</span>
        </button>
      }
    </app-empty-state>
  } @else {
    <app-import-job-table
      [regionalFormatting]="regionalFormatting()"
      [items]="items()"
      [loading]="store.isLoading() && items().length === 0"
      (selected)="openReport($event)"
    />

    <app-collection-pagination
      [page]="page()"
      [pageCount]="pageCount()"
      [pageSize]="pageSize()"
      [total]="store.totalJobs()"
      [shown]="items().length"
      testIdPrefix="imports"
      (pageChanged)="goToPage($event)"
      (pageSizeChanged)="setPageSize($event)"
    />
  }
</div>

<app-import-job-detail-sheet
  [regionalFormatting]="regionalFormatting()"
  [visible]="detailVisible()"
  [job]="selectedJob()"
  (visibleChange)="closeReport()"
/>
