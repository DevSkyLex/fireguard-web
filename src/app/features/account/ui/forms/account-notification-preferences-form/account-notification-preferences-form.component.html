<div class="overflow-hidden rounded-lg border border-border">
  <div hlmTableContainer>
    <table hlmTable aria-describedby="notif-pref-description">
      <caption hlmTableCaption class="sr-only" i18n="@@account.notificationPreferences.title">
        Notification preferences
      </caption>
      <thead hlmTableHeader>
        <tr hlmTableRow>
          <th hlmTableHead scope="col" i18n="@@account.notificationPreferences.categoryHeader">
            Category
          </th>
          <th
            hlmTableHead
            scope="col"
            id="notif-pref-email-header"
            class="w-16 text-center"
            i18n="@@account.notificationPreferences.emailHeader"
          >
            Email
          </th>
          <th
            hlmTableHead
            scope="col"
            id="notif-pref-in-app-header"
            class="w-16 text-center"
            i18n="@@account.notificationPreferences.inAppHeader"
          >
            In-app
          </th>
        </tr>
      </thead>
      <tbody hlmTableBody>
        @for (row of model(); track row.category; let i = $index) {
          <tr hlmTableRow>
            <th
              hlmTableHead
              scope="row"
              [id]="'notif-pref-cat-' + row.category"
              class="font-medium text-foreground"
            >
              {{ row.label }}
            </th>
            <td hlmTableCell [attr.data-testid]="'notif-pref-email-' + row.category">
              <span class="flex min-h-11 min-w-11 items-center justify-center">
                <hlm-switch
                  [inputId]="'notif-pref-email-' + row.category"
                  [formField]="preferencesForm[i].emailEnabled"
                  [attr.aria-disabled]="pending() ? true : null"
                  [aria-labelledby]="'notif-pref-cat-' + row.category + ' notif-pref-email-header'"
                  (checkedChange)="commit(i)"
                />
              </span>
            </td>
            <td hlmTableCell [attr.data-testid]="'notif-pref-in-app-' + row.category">
              <span class="flex min-h-11 min-w-11 items-center justify-center">
                <hlm-switch
                  [inputId]="'notif-pref-in-app-' + row.category"
                  [formField]="preferencesForm[i].mercureEnabled"
                  [attr.aria-disabled]="pending() ? true : null"
                  [aria-labelledby]="'notif-pref-cat-' + row.category + ' notif-pref-in-app-header'"
                  (checkedChange)="commit(i)"
                />
              </span>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
