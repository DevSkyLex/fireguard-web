<div id="direct-messages" class="flex min-h-0 min-w-0 flex-1 flex-col">
  @if (!hasOpenConversation()) {
    <div class="m-auto">
      <div hlmEmpty>
        <div hlmEmptyHeader>
          <p hlmEmptyTitle i18n="@@messages.page.noneOpenTitle">No conversation open</p>
          <p hlmEmptyDescription i18n="@@messages.page.noneOpenDescription">
            Select a conversation or start a new message.
          </p>
        </div>
      </div>
    </div>
  }

  <router-outlet
    (activate)="hasOpenConversation.set(true)"
    (deactivate)="hasOpenConversation.set(false)"
  />
</div>
