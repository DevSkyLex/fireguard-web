<div class="flex w-full flex-col gap-1">
  <button
    #trigger
    type="button"
    class="flex min-h-9 w-full min-w-0 cursor-pointer rounded-md border border-transparent text-start ring-ring transition-colors duration-100 outline-none focus-visible:border-ring focus-visible:bg-muted/30 focus-visible:ring-2 focus-visible:ring-ring/50 enabled:hover:border-border/30 enabled:hover:bg-muted/30 enabled:active:bg-muted/40 disabled:cursor-default mobile-ui:min-h-11"
    [class]="triggerLayout() + ' ' + triggerPadding()"
    [hidden]="editing()"
    [disabled]="!editable()"
    [attr.aria-expanded]="editable() ? editing() : null"
    [attr.aria-controls]="editable() ? editorId : null"
    (click)="requestOpen()"
  >
    <span class="text-xs text-muted-foreground" [class]="labelLayout()">{{ label() }}</span>
    <span class="flex min-w-0 flex-1 items-center gap-1.5">
      <span class="flex min-w-0 flex-1 flex-wrap items-center gap-1.5 text-sm">
        <ng-content select="[fieldValue]" />
      </span>
    </span>
  </button>

  @if (editing()) {
    <div
      #editor
      class="flex flex-col gap-2 rounded-md border border-border/60 bg-muted/40 p-2"
      [id]="editorId"
      [attr.aria-busy]="pending() ? 'true' : null"
      (keydown.escape)="onEscape($event)"
    >
      <span [id]="labelId" class="text-xs font-medium text-muted-foreground">{{ label() }}</span>

      <ng-content select="[fieldEditor]" />

      @if (commit() === 'confirm') {
        <div class="flex items-center justify-end gap-2">
          <button
            hlmBtn
            type="button"
            variant="ghost"
            size="sm"
            class="mobile-ui:min-h-11"
            [disabled]="pending()"
            (click)="requestCancel()"
            i18n="@@common.cancel"
          >
            Cancel
          </button>
          <button
            hlmBtn
            type="button"
            size="sm"
            class="mobile-ui:min-h-11"
            [disabled]="pending() || !canSave()"
            (click)="saved.emit()"
          >
            @if (pending()) {
              <hlm-spinner class="size-3.5" aria-hidden="true" />
            }
            <span i18n="@@common.save">Save</span>
          </button>
        </div>
      } @else if (pending()) {
        <span class="flex items-center gap-1.5 text-xs text-muted-foreground">
          <hlm-spinner class="size-3.5" aria-hidden="true" />
          <span i18n="@@common.saving">Saving…</span>
        </span>
      }

      @if (error(); as message) {
        <p class="text-xs text-destructive" role="alert">{{ message }}</p>
      }
    </div>
  }
</div>
