<div id="inspection-create" class="flex flex-col p-3 sm:p-6 md:p-7 lg:p-8">
  <section class="mx-auto flex w-full max-w-3xl flex-col gap-6">
    <header class="flex flex-wrap items-end justify-between gap-x-4 gap-y-2">
      <div class="flex min-w-0 flex-col gap-1.5">
        <h1
          i18n="@@inspection.create.title"
          class="text-2xl font-semibold tracking-tight text-surface-950 dark:text-surface-0"
        >
          New Inspection
        </h1>
        <p
          i18n="@@inspection.create.description"
          class="max-w-prose text-sm text-surface-500 dark:text-surface-400"
        >
          Prepare the inspection scope, target, and checklist before field execution.
        </p>
      </div>
    </header>
    <div
      class="rounded-md border border-surface-200 bg-surface-0 p-5 dark:border-surface-800 dark:bg-surface-900"
    >
      <app-inspection-form
        [loading]="store.isCreating()"
        [serverError]="store.createError()"
        [equipments]="equipmentStore.equipmentList()"
        [facilities]="facilityStore.facilities()"
        [checklists]="checklistStore.checklists()"
        (submitted)="handleSubmit($event)"
        (cancelled)="handleCancel()"
      />
    </div>
  </section>

  <app-organization-quota-upgrade-dialog
    [(visible)]="quotaDialogVisible"
    [resource]="quotaResource"
    [subscriptionLink]="quotaSubscriptionLink()"
  />
</div>
