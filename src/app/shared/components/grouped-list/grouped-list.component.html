<div class="flex flex-col gap-6">
  @for (group of groups(); track group.id) {
    <section>
      <header
        class="flex items-center justify-between gap-2 rounded-md bg-surface-50 px-3 py-2 dark:bg-surface-900/50"
      >
        @if (headerTemplate(); as template) {
          <ng-container
            *ngTemplateOutlet="template; context: { $implicit: group, count: group.items.length }"
          />
        } @else {
          <span class="text-sm font-medium text-surface-700 dark:text-surface-200"
            >{{ group.id }} ({{ group.items.length }})</span
          >
        }

        @if (collapsible()) {
          <button
            type="button"
            class="grid size-6 shrink-0 place-items-center rounded text-surface-400 hover:text-surface-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:hover:text-surface-300"
            [attr.aria-expanded]="!isCollapsed(group)"
            [attr.aria-label]="toggleAriaLabel(isCollapsed(group))"
            (click)="toggle(group.id)"
          >
            <i
              class="pi text-xs"
              [class.pi-chevron-down]="!isCollapsed(group)"
              [class.pi-chevron-right]="isCollapsed(group)"
              aria-hidden="true"
            ></i>
          </button>
        }
      </header>

      @if (!isCollapsed(group)) {
        <div class="flex flex-col divide-y divide-surface-100 dark:divide-surface-800/60">
          @for (item of group.items; track itemId()(item)) {
            <div
              role="button"
              tabindex="0"
              class="flex min-h-11 cursor-pointer flex-col justify-center px-3 py-2 outline-none hover:bg-surface-50 focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-inset dark:hover:bg-surface-900/40"
              (click)="rowClicked.emit(item)"
              (keydown.enter)="rowClicked.emit(item)"
              (keydown.space)="$event.preventDefault(); rowClicked.emit(item)"
            >
              @if (rowTemplate(); as template) {
                <ng-container *ngTemplateOutlet="template; context: { $implicit: item }" />
              }
            </div>
          }
        </div>
      }
    </section>
  }
</div>
