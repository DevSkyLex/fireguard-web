<nav
  class="flex flex-col items-center gap-2"
  i18n-aria-label="@@workspace.rail.organizations.aria"
  aria-label="Organizations"
>
  @if (loading()) {
    @for (placeholder of [1, 2, 3]; track $index) {
      <div
        class="size-[38px] animate-pulse rounded-[11px] bg-surface-200 motion-reduce:animate-none dark:bg-surface-800"
      ></div>
    }
  } @else {
    @for (tile of tiles(); track tile.id) {
      <!--
        Real <button> with aria-current: the source prototype used a bare
        <div onClick> with no role, tabindex or keyboard handling.
      -->
      <button
        type="button"
        class="grid size-[38px] cursor-pointer place-content-center overflow-hidden rounded-[11px] text-[15px] font-bold transition-[filter] hover:brightness-105 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        [class]="
          tile.active
            ? 'bg-surface-100 text-surface-950 ring-2 ring-primary ring-inset dark:bg-surface-800 dark:text-surface-50'
            : 'bg-transparent text-surface-600 dark:text-surface-400'
        "
        [attr.aria-current]="tile.active ? 'true' : null"
        [attr.aria-label]="tile.name"
        [pTooltip]="tile.name"
        tooltipPosition="right"
        (click)="select(tile)"
      >
        @if (tile.logoUrl; as logoUrl) {
          <img class="size-full object-cover" [src]="logoUrl" alt="" />
        } @else {
          {{ tile.initials }}
        }
      </button>
    }
  }

  <button
    type="button"
    class="grid size-[38px] cursor-pointer place-content-center rounded-[11px] border border-dashed border-surface-400 text-surface-500 hover:border-primary hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:border-surface-600 dark:text-surface-400"
    i18n-aria-label="@@workspace.rail.addOrganization.aria"
    aria-label="Add organization"
    i18n-pTooltip="@@workspace.rail.addOrganization.tooltip"
    pTooltip="Add organization"
    tooltipPosition="right"
    (click)="createOrganization()"
  >
    <i class="pi pi-plus text-[13px]"></i>
  </button>
</nav>
