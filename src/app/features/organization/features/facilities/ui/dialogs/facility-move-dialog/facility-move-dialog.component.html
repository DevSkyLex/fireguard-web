<hlm-dialog [state]="dialogState()" [disableClose]="busy()" (stateChanged)="onStateChanged($event)">
  <hlm-dialog-content class="sm:max-w-md" data-testid="facility-move-dialog" *hlmDialogPortal>
    <hlm-dialog-header>
      <h3 hlmDialogTitle i18n="@@facility.moveDialog.header">Move facility</h3>
      <p hlmDialogDescription>{{ description() }}</p>
    </hlm-dialog-header>

    <hlm-field>
      <label hlmFieldLabel for="facility-move-parent" i18n="@@facility.moveDialog.parentLabel"
        >New parent</label
      >
      <hlm-combobox
        [value]="selectedParent()"
        [itemToString]="parentLabelOf"
        (valueChange)="selectedParent.set($any($event))"
      >
        <hlm-combobox-input
          inputId="facility-move-parent"
          placeholder="Search a facility, or leave empty for the root level"
          i18n-placeholder="@@facility.moveDialog.parentPlaceholder"
          data-testid="facility-move-parent-input"
        />
        <hlm-combobox-content *hlmComboboxPortal>
          <hlm-combobox-empty i18n="@@facility.moveDialog.noMatch"
            >No facility matches.</hlm-combobox-empty
          >
          <div hlmComboboxList>
            <hlm-combobox-item value="" data-testid="facility-move-option-root">{{
              rootOptionLabel
            }}</hlm-combobox-item>
            @for (option of options(); track option.value) {
              <hlm-combobox-item
                [value]="option.value"
                [attr.data-testid]="'facility-move-option-' + option.value"
                >{{ option.label }}</hlm-combobox-item
              >
            }
          </div>
        </hlm-combobox-content>
      </hlm-combobox>
    </hlm-field>

    <hlm-dialog-footer>
      <button hlmDialogClose hlmBtn type="button" variant="outline">
        <span i18n="@@common.cancel">Cancel</span>
      </button>
      <button
        hlmBtn
        type="button"
        data-testid="facility-move-submit"
        [disabled]="busy()"
        [attr.aria-busy]="busy() ? 'true' : null"
        (click)="submit()"
      >
        @if (busy()) {
          <span i18n="@@facility.moveDialog.submitting">Moving…</span>
        } @else {
          <span i18n="@@facility.moveDialog.submit">Move</span>
        }
      </button>
      <span class="sr-only" aria-live="polite">
        @if (busy()) {
          <span i18n="@@facility.moveDialog.submittingStatus">Moving, please wait…</span>
        }
      </span>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
