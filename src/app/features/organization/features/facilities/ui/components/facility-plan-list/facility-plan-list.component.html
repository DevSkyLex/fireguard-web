<div class="flex flex-col gap-3" data-testid="facility-plan-list">
  <div class="flex items-center justify-between gap-2">
    @if (showHeading()) {
      <h3 class="text-sm font-medium text-muted-foreground" i18n="@@facility.plans.listTitle">
        Floor plans
      </h3>
    }
    @if (canManage()) {
      <button
        hlmBtn
        type="button"
        variant="outline"
        size="sm"
        class="mobile-ui:min-h-11"
        [disabled]="uploading()"
        [attr.aria-busy]="uploading() ? 'true' : null"
        data-testid="facility-plans-upload"
        (click)="pick(planInput)"
      >
        @if (uploading()) {
          <hlm-spinner size="xs" aria-hidden="true" />
        } @else {
          <ng-icon name="lucidePlus" aria-hidden="true" />
        }
        <span i18n="@@facility.plans.upload">Upload plan</span>
      </button>
      <input
        #planInput
        type="file"
        aria-label="Upload plan"
        i18n-aria-label="@@facility.plans.upload"
        class="sr-only"
        tabindex="-1"
        [accept]="acceptedTypes"
        [disabled]="uploading()"
        (change)="onFileSelected($event)"
      />
    }
  </div>

  @if (pickError(); as message) {
    <div hlmAlert variant="destructive" data-testid="facility-plans-pick-error">
      <ng-icon name="lucideCircleAlert" aria-hidden="true" />
      <p hlmAlertTitle i18n="@@facility.plans.pickErrorTitle">Couldn't use this file</p>
      <p hlmAlertDescription>{{ message }}</p>
    </div>
  }

  @if (plans().length > 0) {
    <ul hlmItemGroup class="gap-0">
      @for (plan of plans(); track plan.id; let first = $first) {
        @if (!first) {
          <hlm-item-separator class="my-0" />
        }
        <li
          hlmItem
          size="sm"
          class="transition-colors hover:bg-muted/50 motion-reduce:transition-none"
          [class.bg-muted]="selectedPlanId() === plan.id"
          data-testid="facility-plan-row"
        >
          <button
            type="button"
            class="flex min-w-0 flex-1 cursor-pointer items-center gap-2.5 rounded-md text-left focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none mobile-ui:min-h-11"
            [attr.aria-current]="selectedPlanId() === plan.id ? 'true' : null"
            data-testid="facility-plan-select"
            (click)="planSelected.emit(plan.id)"
          >
            <div hlmItemMedia variant="icon" class="text-muted-foreground">
              <ng-icon name="lucideMap" aria-hidden="true" />
            </div>
            <div hlmItemContent>
              <span hlmItemTitle class="line-clamp-1">{{ plan.fileName }}</span>
              <span hlmItemDescription>
                @if (dimensionsLabelOf(plan); as dimensions) {
                  {{ dimensions }} ·
                }
                {{ sizeLabelOf(plan) }} ·
                {{ plan.uploadedAt | appOrgDate: 'date' : regionalFormatting() }}
                @if (plan.isPrimaryPlan) {
                  ·
                  <span
                    hlmBadge
                    variant="secondary"
                    class="align-middle"
                    data-testid="facility-plan-primary-badge"
                  >
                    <ng-icon name="lucideCheck" size="xs" aria-hidden="true" />
                    <span i18n="@@facility.plans.primaryBadge">Primary</span>
                  </span>
                }
              </span>
            </div>
          </button>
          <div hlmItemActions>
            <button
              hlmBtn
              type="button"
              variant="ghost"
              size="icon-sm"
              class="text-muted-foreground mobile-ui:size-11"
              i18n-aria-label="@@facility.plans.rowMenu"
              aria-label="Plan actions"
              hlmTooltip="Plan actions"
              i18n-hlmTooltip="@@facility.plans.rowMenu"
              data-testid="facility-plan-menu-trigger"
              [hlmDropdownMenuTrigger]="menu"
            >
              @if (isRowSettingPrimary(plan) || isRowDeleting(plan)) {
                <hlm-spinner size="xs" aria-hidden="true" />
              } @else {
                <ng-icon name="lucideEllipsisVertical" aria-hidden="true" />
              }
            </button>
            <ng-template #menu>
              <div hlmDropdownMenu>
                <button
                  hlmDropdownMenuItem
                  type="button"
                  data-testid="facility-plan-view"
                  (triggered)="planSelected.emit(plan.id)"
                  class="mobile-ui:min-h-11"
                >
                  <span i18n="@@facility.plans.view">View</span>
                </button>
                @if (canManage()) {
                  <button
                    hlmDropdownMenuItem
                    type="button"
                    [disabled]="plan.isPrimaryPlan"
                    data-testid="facility-plan-set-primary"
                    (triggered)="setPrimaryRequested.emit(plan)"
                    class="mobile-ui:min-h-11"
                  >
                    <span i18n="@@facility.plans.setPrimary">Set as primary</span>
                  </button>
                  <button
                    hlmDropdownMenuItem
                    type="button"
                    variant="destructive"
                    data-testid="facility-plan-delete"
                    (triggered)="deleteRequested.emit(plan)"
                    class="mobile-ui:min-h-11"
                  >
                    <span i18n="@@facility.plans.delete">Delete</span>
                  </button>
                }
              </div>
            </ng-template>
          </div>
        </li>
      }
    </ul>
  }
</div>
