@if (store.isAvailable()) {
  <button
    type="button"
    class="grid size-8 cursor-pointer place-content-center rounded-md transition-colors hover:bg-surface-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:hover:bg-white/5"
    [class]="
      store.panelOpen()
        ? 'bg-primary-50 text-primary-700 dark:bg-primary-400/15 dark:text-primary-300'
        : 'text-surface-500 dark:text-surface-400'
    "
    [attr.aria-expanded]="store.panelOpen()"
    [attr.aria-controls]="store.panelOpen() ? 'workspace-panel' : null"
    i18n-aria-label="@@workspace.assistant.toggle.aria"
    aria-label="Assistant"
    i18n-pTooltip="@@workspace.assistant.toggle.aria"
    pTooltip="Assistant"
    tooltipPosition="bottom"
    data-testid="assistant-toggle"
    (click)="toggle()"
  >
    <i class="pi pi-sparkles text-sm" aria-hidden="true"></i>
  </button>
}
