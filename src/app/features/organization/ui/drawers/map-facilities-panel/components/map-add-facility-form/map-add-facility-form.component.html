<form
  class="flex flex-col gap-3 rounded-md border border-surface-200 bg-surface-50 p-3 dark:border-surface-800 dark:bg-surface-900"
  data-testid="map-add-facility-form"
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
>
  <span
    class="text-[11px] font-semibold tracking-[0.05em] text-surface-500 uppercase dark:text-surface-400"
    i18n="@@map.addForm.title"
  >
    New facility
  </span>

  <div class="flex flex-col gap-1">
    <label
      for="map-add-facility-name"
      class="text-xs font-medium text-surface-600 dark:text-surface-400"
      i18n="@@map.addForm.name"
    >
      Site name
    </label>
    <input
      id="map-add-facility-name"
      pInputText
      type="text"
      class="w-full"
      formControlName="name"
      data-testid="map-add-facility-name"
      i18n-placeholder="@@map.addForm.namePlaceholder"
      placeholder="e.g. Northgate Depot"
      [attr.aria-invalid]="form.controls.name.invalid && form.controls.name.touched"
      [attr.aria-describedby]="
        form.controls.name.invalid && form.controls.name.touched
          ? 'map-add-facility-name-error'
          : null
      "
    />
    @if (form.controls.name.invalid && form.controls.name.touched) {
      <p-message severity="error" variant="simple" size="small">
        <span id="map-add-facility-name-error" i18n="@@map.addForm.nameRequired">
          Site name is required.
        </span>
      </p-message>
    }
  </div>

  <div class="flex flex-col gap-1">
    <label
      for="map-add-facility-city"
      class="text-xs font-medium text-surface-600 dark:text-surface-400"
      i18n="@@map.addForm.city"
    >
      City
    </label>
    <input
      id="map-add-facility-city"
      pInputText
      type="text"
      class="w-full"
      formControlName="city"
      data-testid="map-add-facility-city"
      i18n-placeholder="@@map.addForm.cityPlaceholder"
      placeholder="e.g. Lyon"
    />
  </div>

  <p class="text-xs text-surface-500 dark:text-surface-400" i18n="@@map.addForm.helper">
    Dropped at the map centre — drag the pin to reposition.
  </p>

  <div class="flex items-center justify-end gap-2">
    <p-button
      type="button"
      label="Cancel"
      i18n-label="@@map.addForm.cancel"
      severity="secondary"
      size="small"
      [text]="true"
      [disabled]="loading()"
      data-testid="map-add-facility-cancel"
      (onClick)="onCancel()"
    />
    <p-button
      type="submit"
      label="Add"
      i18n-label="@@map.addForm.add"
      icon="pi pi-check"
      severity="contrast"
      size="small"
      [loading]="loading()"
      data-testid="map-add-facility-submit"
    />
  </div>
</form>
