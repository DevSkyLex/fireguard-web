<hlm-dialog [state]="dialogState()" [disableClose]="busy()" (stateChanged)="onStateChanged($event)">
  <hlm-dialog-content
    class="max-h-[calc(100svh-2rem)] overflow-y-auto overscroll-contain sm:max-w-md"
    data-testid="equipment-assign-facility-dialog"
    *hlmDialogPortal
  >
    <hlm-dialog-header>
      <h3 hlmDialogTitle i18n="@@equipment.facility.dialog.title">Assign to a facility</h3>
      <p hlmDialogDescription i18n="@@equipment.facility.dialog.description">
        Choose the facility this equipment is installed at.
      </p>
    </hlm-dialog-header>

    <hlm-field>
      <label hlmFieldLabel for="equipment-facility-picker" i18n="@@equipment.facility.dialog.label"
        >Facility</label
      >
      <app-facility-option-picker
        [value]="selectedFacilityId()"
        (valueChange)="selectedFacilityId.set($event)"
        [options]="options()"
        [disabled]="busy()"
        inputId="equipment-facility-picker"
        [page]="facilityPage()"
        [pageCount]="facilityPageCount()"
        [callState]="facilityCallState()"
        (searchChanged)="facilitySearchChanged.emit($event)"
        (pageChanged)="facilityPageChanged.emit($event)"
      />
    </hlm-field>

    <hlm-dialog-footer class="flex-wrap gap-2">
      @if (canUnassign()) {
        <button
          hlmBtn
          type="button"
          variant="outline"
          class="mobile-ui:min-h-11"
          data-testid="equipment-facility-unassign"
          [disabled]="busy()"
          [attr.aria-busy]="unassigning() ? 'true' : null"
          (click)="submitUnassign()"
        >
          @if (unassigning()) {
            <span i18n="@@equipment.facility.dialog.unassigning">Unassigning…</span>
          } @else {
            <span i18n="@@equipment.facility.dialog.unassign">Unassign</span>
          }
        </button>
      }
      <button hlmDialogClose hlmBtn type="button" variant="ghost" class="mobile-ui:min-h-11">
        <span i18n="@@common.cancel">Cancel</span>
      </button>
      <button
        hlmBtn
        type="button"
        class="mobile-ui:min-h-11"
        data-testid="equipment-facility-assign"
        [disabled]="!canAssign()"
        [attr.aria-busy]="assigning() ? 'true' : null"
        (click)="submitAssign()"
      >
        @if (assigning()) {
          <span i18n="@@equipment.facility.dialog.assigning">Assigning…</span>
        } @else {
          <span i18n="@@equipment.facility.dialog.assign">Assign</span>
        }
      </button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
