<form novalidate (submit)="submit($event)">
  <hlm-field-group>
    <hlm-field class="items-center">
      <label hlmFieldLabel [attr.for]="inputId()" class="self-start"
        ><span i18n="@@auth.otp.label">Verification code</span><app-required-marker
      /></label>

      <brn-input-otp
        hlmInputOtp
        class="justify-start"
        autocomplete="one-time-code"
        data-testid="account-otp-code"
        [inputId]="inputId()"
        [length]="length"
        [formField]="codeForm.code"
        [attr.aria-invalid]="codeForm.code().touched() && codeForm.code().invalid()"
        (completed)="autoSubmit()"
      >
        <hlm-input-otp-group>
          <hlm-input-otp-slot index="0" />
          <hlm-input-otp-slot index="1" />
          <hlm-input-otp-slot index="2" />
        </hlm-input-otp-group>
        <hlm-input-otp-separator />
        <hlm-input-otp-group>
          <hlm-input-otp-slot index="3" />
          <hlm-input-otp-slot index="4" />
          <hlm-input-otp-slot index="5" />
        </hlm-input-otp-group>
      </brn-input-otp>

      @if (codeForm.code().touched() && codeForm.code().invalid()) {
        <hlm-field-error>{{ codeForm.code().errors()[0].message }}</hlm-field-error>
      }
    </hlm-field>

    <div class="flex flex-wrap items-center justify-end gap-2">
      <button
        hlmBtn
        type="button"
        variant="outline"
        class="min-w-0 shrink max-sm:min-h-11"
        data-testid="account-otp-code-cancel"
        [disabled]="pending()"
        (click)="cancelled.emit()"
      >
        <span class="truncate" i18n="@@common.cancel">Cancel</span>
      </button>

      <button
        hlmBtn
        type="submit"
        [variant]="destructive() ? 'destructive' : 'default'"
        class="min-w-0 shrink max-sm:min-h-11"
        data-testid="account-otp-code-submit"
        [disabled]="pending()"
        [attr.aria-busy]="pending() ? 'true' : null"
        aria-live="polite"
      >
        @if (pending()) {
          <span class="truncate" i18n="@@account.otp.submitting">Checking…</span>
        } @else {
          <span class="truncate">{{ submitLabel() }}</span>
        }
      </button>
    </div>
  </hlm-field-group>
</form>
