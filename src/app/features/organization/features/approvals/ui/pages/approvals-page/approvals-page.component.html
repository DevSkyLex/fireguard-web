<div id="approvals" class="flex min-h-0 w-full flex-1 flex-col gap-4 p-4 md:p-6">
  <app-collection-toolbar>
    <app-collection-filter-toggle
      toolbarEnd
      [visible]="filtersVisible()"
      [activeCount]="activeFilterKeys().length"
      label="Filters"
      i18n-label="@@approvals.list.filtersButton"
      testIdPrefix="approvals"
      (visibleChange)="toggleFiltersVisible($event)"
    />
  </app-collection-toolbar>

  @if (filtersVisible()) {
    <app-collection-filter-bar
      [fields]="filterFields"
      [activeKeys]="activeFilterKeys()"
      [pendingKey]="openFilterKey()"
      [templates]="chipTemplates()"
      testIdPrefix="approvals"
      (fieldPicked)="onFieldPicked($event)"
      (fieldRemoved)="onFieldRemoved($event)"
      (filtersCleared)="clearFilters()"
    />
  }

  <ng-template #statusChip>
    <hlm-toggle-group
      type="single"
      [nullable]="true"
      size="sm"
      [value]="status()"
      data-testid="approvals-filter-status"
      aria-label="Filter by status"
      i18n-aria-label="@@approvals.filter.statusAriaLabel"
      (valueChange)="applyStatus($event)"
    >
      @for (value of statusValues; track value) {
        <button
          hlmToggleGroupItem
          class="max-sm:min-h-11"
          [value]="value"
          [attr.data-testid]="'approvals-filter-status-' + value"
        >
          <app-approval-status-tag [value]="value" asOption />
        </button>
      }
    </hlm-toggle-group>
  </ng-template>

  <ng-template #actionTypeChip>
    <app-collection-filter-select
      [options]="actionTypeOptions()"
      [value]="actionType()"
      placeholder="Any action"
      i18n-placeholder="@@approvals.filter.anyAction"
      emptyLabel="No action type matches."
      i18n-emptyLabel="@@approvals.filter.noActionType"
      accessibleName="Action type"
      i18n-accessibleName="@@approvals.filter.actionType"
      triggerId="approvals-filter-action-type"
      testId="approvals-filter-action-type"
      [state]="fieldPopoverState()"
      (valueChanged)="applyActionType($any($event))"
      (stateChanged)="onFieldPopoverStateChanged($event)"
    />
  </ng-template>

  @if (store.hasListError()) {
    <app-error-state
      icon="lucideCircleAlert"
      title="Couldn't load approval requests"
      i18n-title="@@approvals.list.errorTitle"
      description="The requests could not be loaded. Check your connection and try again."
      i18n-description="@@approvals.list.errorText"
    >
      <button hlmBtn variant="outline" data-testid="approvals-retry" (click)="reload()">
        <span i18n="@@approvals.list.retry">Retry</span>
      </button>
    </app-error-state>
  } @else if (!store.isLoading() && items().length === 0) {
    <app-empty-state
      icon="lucideShieldCheck"
      title="No approval requests"
      i18n-title="@@approvals.list.emptyTitle"
      description="Nothing is waiting on a decision for this filter."
      i18n-description="@@approvals.list.emptyDesc"
    />
  } @else {
    <app-approval-request-table
      [regionalFormatting]="regionalFormatting()"
      [items]="items()"
      [loading]="store.isLoading() && items().length === 0"
      [canDecide]="canDecide()"
      [organizationId]="organizationId()"
      [actionTypeLabelOf]="actionTypeLabelOf"
      (approveRequested)="openApprove($event)"
      (rejectRequested)="openReject($event)"
    />

    <app-collection-pagination
      [page]="page()"
      [pageCount]="pageCount()"
      [pageSize]="pageSize()"
      [total]="store.totalRequests()"
      [shown]="items().length"
      testIdPrefix="approvals"
      (pageChanged)="goToPage($event)"
      (pageSizeChanged)="setPageSize($event)"
    />
  }
</div>

<app-approval-decision-dialog
  [target]="decisionTarget()"
  [pending]="store.isDeciding()"
  [errorText]="store.decideErrorText()"
  (decided)="submitDecision($event)"
  (dismissed)="closeDecisionDialog()"
/>
