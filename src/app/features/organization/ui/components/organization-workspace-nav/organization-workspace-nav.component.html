<!--
  Workspace header: the organization switcher doubles as the sidebar's title,
  plus the settings shortcut. No bottom border — the sidebar header carries none.
-->
<div class="flex min-h-14 shrink-0 items-center gap-1 py-1.5 pr-3 pl-2">
  <app-organization-switcher class="min-w-0 flex-1" />

  @if (settingsLink(); as link) {
    <a
      class="grid size-8 shrink-0 place-content-center rounded-md text-surface-500 transition-colors hover:bg-surface-50 hover:text-surface-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:text-surface-400 dark:hover:bg-white/5 dark:hover:text-surface-100"
      [routerLink]="link"
      i18n-aria-label="@@workspace.sidebar.settings.aria"
      aria-label="Organization settings"
      data-testid="workspace-nav-settings"
    >
      <i class="pi pi-cog text-sm" aria-hidden="true"></i>
    </a>
  }
</div>

<!--
  One titled group per navigation section. The grouping already drove RBAC
  filtering; rendering it restores the reading structure the flat list dropped —
  three sections instead of eight peers, so a destination is found by area
  rather than scanned for. No scroller here: the sidebar's one scroller lives in
  the slot host.
-->
<nav
  class="flex flex-col gap-3 px-2 pb-1"
  i18n-aria-label="@@workspace.sidebar.nav.aria"
  aria-label="Organization"
>
  @for (section of sections(); track section.id) {
    <div class="flex flex-col gap-px">
      <h2
        class="px-2 pt-1 pb-1 text-xs font-semibold text-surface-500 dark:text-surface-400"
        [id]="'workspace-nav-group-' + section.id"
      >
        {{ section.label }}
      </h2>
      <ul class="flex flex-col gap-px" [attr.aria-labelledby]="'workspace-nav-group-' + section.id">
        @for (item of section.items; track item.id) {
          <li>
            <app-nav-row
              [icon]="item.icon ?? null"
              [label]="item.label ?? ''"
              [routerLink]="item.routerLink"
              [exact]="item.id === 'dashboard'"
            />
          </li>
        }
      </ul>
    </div>
  }
</nav>
