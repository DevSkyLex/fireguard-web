<!--
  No standfirst. This was the only one of the four collection pages carrying a
  sentence under its title, and the sentence — "History of the inspections
  performed across your organization's facilities and equipment" — described
  what the table underneath it already shows. Facilities, Equipment and
  Interventions open straight onto their toolbar and rows; this one now matches.
-->
<div id="inspection-list" class="flex h-full flex-col gap-6 p-3 sm:p-6 md:p-7 lg:p-8">
  @if (store.listError()) {
    <app-error-banner
      [message]="listErrorMessage"
      [retrying]="store.isLoadingInspections()"
      (retried)="retry()"
    />
  }

  <app-inspection-table
    class="flex min-h-0 flex-1 flex-col"
    [inspections]="store.inspections()"
    [total]="store.totalInspections()"
    [loading]="store.isLoadingInspections()"
    [empty]="store.isEmpty()"
    [initialPage]="page()"
    [createDisabled]="atInspectionLimit()"
    [createDisabledTooltip]="quotaLimitTooltip"
    (load)="onLoad($event)"
    (pageChange)="onPageChange($event)"
    (add)="onAdd()"
    (view)="onView($event.id)"
    (cancel)="onCancel($event)"
  />
</div>
