<form novalidate (submit)="submit($event)">
  <hlm-field-group>
    <hlm-field>
      <label hlmFieldLabel for="edit-channel-name"
        ><span i18n="@@channels.editDialog.name">Name</span
        ><span aria-hidden="true" class="text-destructive">&nbsp;*</span
        ><span class="sr-only" i18n="@@common.required"> required</span></label
      >
      <input
        hlmInput
        id="edit-channel-name"
        type="text"
        data-testid="edit-channel-name"
        [formField]="editForm.name"
        [attr.aria-required]="true"
        [attr.aria-invalid]="editForm.name().touched() && editForm.name().invalid()"
      />
      @if (editForm.name().touched() && editForm.name().invalid()) {
        <hlm-field-error>{{ editForm.name().errors()[0].message }}</hlm-field-error>
      }
    </hlm-field>

    @if (parentOptions().length > 0) {
      <hlm-field>
        <label hlmFieldLabel for="edit-channel-parent" i18n="@@channels.editDialog.parent"
          >Parent channel</label
        >
        <hlm-select [itemToString]="parentLabelOf" [formField]="editForm.parentChannelId">
          <hlm-select-trigger
            buttonId="edit-channel-parent"
            class="w-full"
            data-testid="edit-channel-parent"
          >
            <hlm-select-value
              placeholder="No parent — top level"
              i18n-placeholder="@@channels.editDialog.parentPlaceholder"
            />
          </hlm-select-trigger>
          <hlm-select-content *hlmSelectPortal>
            <hlm-select-group>
              <hlm-select-item value="" i18n="@@channels.editDialog.parentNone"
                >No parent — top level</hlm-select-item
              >
              @for (option of parentOptions(); track option.value) {
                <hlm-select-item [value]="option.value">{{ option.label }}</hlm-select-item>
              }
            </hlm-select-group>
          </hlm-select-content>
        </hlm-select>
      </hlm-field>
    }

    <hlm-field orientation="horizontal" class="justify-end">
      <button
        hlmBtn
        type="button"
        variant="outline"
        class="max-sm:min-h-11"
        data-testid="edit-channel-cancel"
        [disabled]="pending()"
        (click)="cancelled.emit()"
      >
        <span i18n="@@common.cancel">Cancel</span>
      </button>
      <button
        hlmBtn
        type="submit"
        class="max-sm:min-h-11"
        data-testid="edit-channel-submit"
        [disabled]="pending()"
        [attr.aria-busy]="pending() ? 'true' : null"
      >
        <span i18n="@@channels.editDialog.submit">Save changes</span>
      </button>
    </hlm-field>
  </hlm-field-group>
</form>
