<app-error-content
  code="403"
  title="No workspace you can open"
  i18n-title="@@error.403.title"
  description="Your account exists, but none of its organizations are open to you right now. An administrator can grant you access, or you can start your own organization."
  i18n-description="@@error.403.description"
>
  <p-button
    label="Create an organization"
    i18n-label="@@error.403.createOrganization"
    icon="pi pi-plus"
    routerLink="/onboarding"
    styleClass="max-sm:min-h-11"
  />
  <p-button
    label="Sign out"
    i18n-label="@@error.403.signOut"
    icon="pi pi-sign-out"
    severity="secondary"
    [outlined]="true"
    styleClass="max-sm:min-h-11"
    (onClick)="signOut()"
  />
</app-error-content>
