<div class="flex h-full min-w-0 flex-col">
  <div class="flex items-center gap-2.5">
    <img
      src="fireguard-logo-primary.svg"
      width="30"
      height="30"
      alt=""
      data-theme-logo="onboarding"
    />
    <span class="text-base font-semibold tracking-tight" i18n="@@onboarding.showcase.brand">
      Fireguard
    </span>
  </div>

  <div class="mt-20 flex min-w-0 flex-col gap-8 pb-8">
    <div class="flex flex-col gap-2">
      <p class="text-sm leading-relaxed text-muted-foreground">
        <span i18n="@@onboarding.showcase.subhead">
          A few steps to get your organization ready.
        </span>
      </p>
    </div>

    <app-onboarding-step-rail
      [steps]="store.steps()"
      [activeStepKey]="store.nextStep()"
      [progress]="store.progress()"
    />
  </div>
</div>
