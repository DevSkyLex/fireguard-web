<div
  id="dashboard-layout"
  class="flex h-dvh overflow-hidden bg-surface-50 transition-colors dark:bg-surface-950"
>
  <!--
    Skip link: with rail + sidebar + header a keyboard user crosses dozens of
    tab stops before the page — this is the required shortcut. First focusable
    element, visible only while focused.
  -->
  <a
    href="#dashboard-content"
    class="sr-only rounded-md bg-primary px-3 py-2 text-sm font-semibold text-primary-contrast focus-visible:not-sr-only focus-visible:absolute focus-visible:top-2 focus-visible:left-2 focus-visible:z-50"
    i18n="@@layout.skipToContent"
    data-testid="skip-to-content"
    (click)="focusContent($event)"
  >
    Skip to content
  </a>

  <!-- Organization rail: chrome, never collapses, hidden below tablet. -->
  @if (isTablet()) {
    <div class="shrink-0" [style.width.px]="railWidth">
      <app-dashboard-layout-org-rail />
    </div>
  }

  <!-- Channel sidebar: collapses to zero width, not to an icon rail. -->
  @if (isTablet()) {
    <aside
      class="shrink-0 overflow-hidden transition-[width] duration-200 ease-in-out motion-reduce:transition-none"
      [style.width.px]="sidebarInlineWidth()"
    >
      <app-dashboard-layout-sidebar class="w-full" variant="primary" [collapsible]="true" />
    </aside>
  }

  <!-- Main column: header, then the pane row. Never scrolls itself. -->
  <div class="flex min-w-0 flex-1 flex-col overflow-hidden">
    <app-dashboard-layout-header [showMenuButton]="!isTablet()" />

    <div class="flex min-h-0 flex-1 overflow-hidden">
      <!--
        The one page scroller. `min-w-0` keeps wide tables from pushing it, and
        `relative` makes it the containing block for absolutely positioned
        descendants — without it, `sr-only` spans deep in the page resolve
        against the initial containing block, escape this scroller's clipping
        and stretch the document to the full content height.
      -->
      <div
        id="dashboard-content"
        tabindex="-1"
        class="relative min-w-0 flex-1 overflow-y-auto overscroll-contain outline-none"
      >
        <app-dashboard-layout-content>
          <router-outlet />
        </app-dashboard-layout-content>
      </div>

      @if (canInlinePanel()) {
        <app-dashboard-layout-panel-host [maxPanels]="maxInlinePanels()" />
      }
    </div>
  </div>

  <!-- Below tablet the rail and sidebar share one left drawer. -->
  <p-drawer
    [visible]="sidebarService.visible()"
    (visibleChange)="sidebarService.setVisible($event)"
    [blockScroll]="true"
    i18n-ariaCloseLabel="@@layout.sidebar.closeAria"
    ariaCloseLabel="Close navigation menu"
  >
    <ng-template #headless>
      <div class="flex h-full">
        <div class="shrink-0" [style.width.px]="railWidth">
          <app-dashboard-layout-org-rail />
        </div>
        <app-dashboard-layout-sidebar class="min-w-0 flex-1" />
      </div>
    </ng-template>
  </p-drawer>

  <!-- Too narrow for an inline panel: show it as a right-hand overlay. -->
  <p-drawer
    position="right"
    [visible]="panelsInDrawer()"
    (visibleChange)="!$event && panelService.close()"
    [blockScroll]="true"
    i18n-ariaCloseLabel="@@layout.panel.closeDrawerAria"
    ariaCloseLabel="Close panel"
  >
    <ng-template #headless>
      <app-dashboard-layout-panel-host class="flex h-full" [maxPanels]="1" />
    </ng-template>
  </p-drawer>
</div>
