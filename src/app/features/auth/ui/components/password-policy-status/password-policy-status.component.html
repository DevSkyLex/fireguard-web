@if (state().status === 'pending' || state().status === 'idle') {
  <output
    class="flex items-center gap-2 text-sm text-muted-foreground"
    aria-live="polite"
    aria-atomic="true"
  >
    <hlm-spinner aria-hidden="true" />
    <span i18n="@@auth.password.policyLoading">Loading password requirements…</span>
  </output>
} @else if (state().status === 'error') {
  <div hlmAlert variant="destructive">
    <p hlmAlertTitle i18n="@@auth.password.policyUnavailable">
      Password requirements are unavailable
    </p>
    <p hlmAlertDescription i18n="@@auth.password.policyRetryDescription">
      Retry before choosing a new password.
    </p>
    <button
      hlmBtn
      type="button"
      variant="outline"
      size="sm"
      class="mobile-ui:min-h-11"
      (click)="retried.emit()"
      i18n="@@common.retry"
    >
      Retry
    </button>
  </div>
}
