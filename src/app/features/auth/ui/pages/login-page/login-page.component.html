<div id="login-page" class="mx-auto flex w-full max-w-xl flex-col gap-8 px-6 sm:px-8">
  <section class="flex flex-col gap-2">
    <h1
      class="text-2xl font-semibold tracking-tight text-surface-900 sm:text-[1.75rem] dark:text-surface-50"
      i18n="@@auth.login.title"
    >
      Welcome Back
    </h1>
    <p
      class="text-sm leading-relaxed text-surface-500 dark:text-surface-400"
      i18n="@@auth.login.subtitle"
    >
      Please sign in to your account to continue.
    </p>
  </section>

  <!-- Login form -->
  <app-login-form [loading]="loading()" (submitted)="handleLogin($event)" />

  <!-- Sign-up link -->
  <p class="text-center text-sm text-surface-500 dark:text-surface-400">
    <span i18n="@@auth.login.noAccount">Don't have an account?</span>
    <a
      routerLink="/auth/register"
      class="ml-1 font-medium text-primary hover:underline"
      i18n="@@auth.login.createAccount"
    >
      Create one
    </a>
  </p>
</div>
