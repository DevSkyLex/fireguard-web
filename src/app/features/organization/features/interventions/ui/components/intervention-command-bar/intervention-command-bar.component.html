@if (action(); as action) {
  <app-intervention-command-button
    [action]="action"
    [busy]="busy()"
    block
    (invoked)="invoked.emit()"
  />

  @if (action.disabledReason; as reason) {
    @if (blockers().length > 0) {
      <button
        type="button"
        class="inline-flex min-h-11 items-center justify-center gap-1.5 text-xs text-muted-foreground underline-offset-4 hover:underline"
        data-testid="intervention-detail-command-bar-details"
        (click)="detailsRequested.emit()"
      >
        <ng-icon name="lucideLock" class="shrink-0" aria-hidden="true" />
        <span>{{ reason }}</span>
        <span i18n="@@intervention.detail.commandBarSeeDetails">— see what is blocking</span>
      </button>
    } @else {
      <p class="text-center text-xs text-muted-foreground">{{ reason }}</p>
    }
  }
}
