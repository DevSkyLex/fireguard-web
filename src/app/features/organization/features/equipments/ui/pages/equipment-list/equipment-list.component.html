<div id="equipment-list" class="flex h-full flex-col gap-6 p-3 sm:p-6 md:p-7 lg:p-8">
  @if (hasListError()) {
    <app-error-banner
      [message]="listErrorMessage"
      [retrying]="store.isLoadingEquipment()"
      (retried)="retry()"
    />
  }
  <app-equipment-table
    class="flex min-h-0 flex-1 flex-col"
    [equipments]="store.equipmentList()"
    [total]="store.totalEquipment()"
    [loading]="store.isLoadingEquipment()"
    [empty]="store.isEmpty()"
    [initialPage]="page()"
    (load)="onLoad($event)"
    (pageChange)="onPageChange($event)"
    (add)="onAdd()"
    (view)="onView($event.id)"
  />

  <app-organization-quota-upgrade-dialog
    [(visible)]="quotaDialogVisible"
    [resource]="quotaResource"
    [subscriptionLink]="quotaSubscriptionLink()"
  />
</div>
