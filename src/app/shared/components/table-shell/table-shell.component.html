<p-card class="h-full" [pt]="cardPt()">
  @if (actions(); as actions) {
    <ng-template pTemplate="header">
      <div
        class="flex flex-col gap-4 border-b border-surface-200 px-4 py-3 sm:flex-row sm:items-center sm:justify-between dark:border-surface-800"
      >
        <ng-container *ngTemplateOutlet="actions" />
      </div>
    </ng-template>
  }

  <ng-template pTemplate="content">
    <ng-container *ngTemplateOutlet="table()" />
  </ng-template>
</p-card>
