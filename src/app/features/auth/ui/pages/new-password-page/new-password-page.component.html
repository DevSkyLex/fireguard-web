<div id="new-password-page" class="mx-auto flex w-full max-w-xl flex-col gap-8 px-6 sm:px-8">
  <section class="flex flex-col gap-2">
    <h1
      class="text-2xl font-semibold tracking-tight text-surface-900 sm:text-[1.75rem] dark:text-surface-50"
      i18n="@@auth.newPassword.title"
    >
      Set Your New Password
    </h1>
    <p
      class="text-sm leading-relaxed text-surface-500 dark:text-surface-400"
      i18n="@@auth.newPassword.subtitle"
    >
      Please enter a new password for your account. Make sure to choose a strong password that you
      haven't used before.
    </p>
  </section>

  <!-- New Password Form -->
  <app-new-password-form
    [loading]="isResetting()"
    (submitted)="handlePasswordSubmit($event)"
    (cancelled)="handlePasswordCancel()"
  />
</div>
