<form novalidate (submit)="submit($event)">
  <hlm-field-group>
    @if (serverMessages().length > 0) {
      <div role="alert" data-testid="onboarding-org-error" class="text-sm text-destructive">
        @for (message of serverMessages(); track message) {
          <p>{{ message }}</p>
        }
      </div>
    }

    <hlm-field>
      <label hlmFieldLabel for="onboarding-org-name"
        ><span i18n="@@onboarding.orgForm.name"> Organization name</span
        ><span aria-hidden="true" class="text-destructive">&nbsp;*</span
        ><span class="sr-only" i18n="@@common.required"> required</span>
      </label>
      <input
        hlmInput
        id="onboarding-org-name"
        type="text"
        data-testid="onboarding-org-name"
        placeholder="Acme Fire Safety"
        i18n-placeholder="@@onboarding.orgForm.namePlaceholder"
        [formField]="organizationForm.name"
        [attr.aria-required]="true"
        [attr.aria-invalid]="organizationForm.name().touched() && organizationForm.name().invalid()"
      />
      @if (organizationForm.name().touched() && organizationForm.name().invalid()) {
        <hlm-field-error>{{ organizationForm.name().errors()[0].message }}</hlm-field-error>
      }
    </hlm-field>

    <hlm-field>
      <label hlmFieldLabel for="onboarding-org-slug" i18n="@@onboarding.orgForm.slug">
        URL slug (optional)
      </label>
      <input
        hlmInput
        id="onboarding-org-slug"
        type="text"
        data-testid="onboarding-org-slug"
        placeholder="acme-fire-safety"
        i18n-placeholder="@@onboarding.orgForm.slugPlaceholder"
        [formField]="organizationForm.slug"
        [attr.aria-invalid]="organizationForm.slug().touched() && organizationForm.slug().invalid()"
      />
    </hlm-field>

    <hlm-field orientation="horizontal" class="justify-end">
      <button
        hlmBtn
        type="submit"
        class="max-sm:min-h-11"
        data-testid="onboarding-org-submit"
        [disabled]="pending()"
        [attr.aria-busy]="pending() ? 'true' : null"
        aria-live="polite"
      >
        @if (pending()) {
          <span i18n="@@onboarding.orgForm.submitting">Creating…</span>
        } @else {
          <span i18n="@@onboarding.orgForm.submit">Continue</span>
        }
      </button>
    </hlm-field>
  </hlm-field-group>
</form>
