<div id="interventions-board" class="flex min-h-0 w-full flex-1 flex-col gap-3">
  <div aria-live="polite" class="sr-only" data-testid="intervention-board-live-region">
    {{ liveMessage() }}
  </div>

  @if (canScrollLeft() || canScrollRight()) {
    <div
      class="flex shrink-0 items-center justify-end gap-1"
      data-testid="intervention-board-scroll-controls"
    >
      <button
        hlmBtn
        type="button"
        variant="outline"
        size="icon-sm"
        data-testid="intervention-board-scroll-left"
        i18n-aria-label="@@intervention.board.scrollLeft"
        aria-label="Show earlier columns"
        [disabled]="!canScrollLeft()"
        (click)="scrollColumns(-1)"
      >
        <ng-icon name="lucideChevronLeft" aria-hidden="true" />
      </button>
      <button
        hlmBtn
        type="button"
        variant="outline"
        size="icon-sm"
        data-testid="intervention-board-scroll-right"
        i18n-aria-label="@@intervention.board.scrollRight"
        aria-label="Show later columns"
        [disabled]="!canScrollRight()"
        (click)="scrollColumns(1)"
      >
        <ng-icon name="lucideChevronRight" aria-hidden="true" />
      </button>
    </div>
  }

  <div class="relative flex min-h-0 flex-1 flex-col">
    <div
      class="pointer-events-none absolute inset-y-0 left-0 z-10 w-8 bg-gradient-to-r from-background to-transparent transition-opacity duration-150"
      [class.opacity-0]="!canScrollLeft()"
      aria-hidden="true"
    ></div>

    <div
      #scroller
      class="min-h-0 min-w-0 flex-1 overflow-x-auto pb-2"
      data-testid="intervention-board"
      (scroll)="onScroll()"
    >
      <div class="flex h-full w-max gap-4">
        @for (status of columns; track status) {
          <section
            class="flex w-72 shrink-0 flex-col gap-3 rounded-md border border-border bg-muted/30 p-3"
            [attr.aria-label]="statusLabelOf(status)"
            data-testid="intervention-board-column"
            [attr.data-status]="status"
          >
            <div class="flex items-center justify-between gap-2">
              <h2 class="text-sm font-medium text-muted-foreground">{{ statusLabelOf(status) }}</h2>
              <hlm-badge
                variant="secondary"
                data-testid="intervention-board-column-count"
                [attr.aria-label]="columnCountLabelOf(status)"
              >
                {{ (board().get(status) ?? []).length }}
              </hlm-badge>
            </div>

            <div
              cdkDropList
              [id]="dropListId(status)"
              [cdkDropListData]="status"
              [cdkDropListConnectedTo]="dropListIds"
              [cdkDropListEnterPredicate]="canDrop"
              (cdkDropListDropped)="onDropped($event)"
              class="flex min-h-16 flex-1 flex-col gap-2"
              data-testid="intervention-board-column-list"
            >
              @for (item of board().get(status) ?? []; track item.intervention.id) {
                <app-intervention-board-card
                  [regionalFormatting]="regionalFormatting()"
                  [item]="item"
                  [detailRouteBase]="detailRouteBase()"
                  [canTransition]="canTransition()"
                  [locked]="transitioningIds().includes(item.intervention.id)"
                  (moveRequested)="requestMove(item.intervention, $event)"
                />
              } @empty {
                <p
                  class="rounded-md border border-dashed border-border p-3 text-center text-xs text-muted-foreground"
                  i18n="@@intervention.board.columnEmpty"
                >
                  No interventions.
                </p>
              }
            </div>
          </section>
        }
      </div>
    </div>

    <div
      class="pointer-events-none absolute inset-y-0 right-0 z-10 w-8 bg-gradient-to-l from-background to-transparent transition-opacity duration-150"
      [class.opacity-0]="!canScrollRight()"
      aria-hidden="true"
    ></div>
  </div>
</div>
