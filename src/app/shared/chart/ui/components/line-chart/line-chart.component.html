@if (loading() || !isBrowser) {
  <hlm-skeleton class="w-full" [style.height.px]="height()" />
} @else if (isEmpty()) {
  <div hlmEmpty [style.height.px]="height()">
    <div hlmEmptyHeader>
      <app-state-illustration hlmEmptyMedia state="no-data" size="sm" />
      <p hlmEmptyTitle>{{ emptyTitle }}</p>
    </div>
  </div>
} @else {
  <tanstack-chart hlmChart data-testid="line-chart" [options]="chartOptions()" />
}
