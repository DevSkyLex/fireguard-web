<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex w-full flex-col gap-8">
  <section class="flex flex-col gap-5" aria-labelledby="intervention-request-changes-heading">
    <div>
      <h2
        id="intervention-request-changes-heading"
        i18n="@@intervention.rc.title"
        class="text-lg font-semibold text-surface-900 dark:text-surface-100"
      >
        Request changes
      </h2>
      <p
        i18n="@@intervention.rc.hint"
        class="mt-0.5 text-sm text-surface-500 dark:text-surface-400"
      >
        Explain what must change before this intervention can be published. The field agent sees
        this note when the work returns to execution.
      </p>
    </div>

    <div class="grid gap-5">
      <label class="grid gap-1.5 text-sm">
        <span i18n="@@intervention.rc.note" class="font-medium"
          >Note <span class="text-red-500" aria-hidden="true">*</span></span
        ><span i18n="@@common.requiredSr" class="sr-only">required</span>
        <textarea
          pTextarea
          formControlName="note"
          class="min-h-32 w-full resize-y"
          i18n-placeholder="@@intervention.rc.notePlaceholder"
          placeholder="e.g. Re-inspect the third-floor extinguishers — the pressure gauge photo is missing."
          [invalid]="form.controls.note.invalid && form.controls.note.touched"
          [attr.aria-invalid]="form.controls.note.invalid && form.controls.note.touched"
          [attr.aria-describedby]="
            form.controls.note.invalid && form.controls.note.touched
              ? 'intervention-rc-note-error'
              : null
          "
        ></textarea>
        @if (form.controls.note.invalid && form.controls.note.touched) {
          <p-message severity="error" variant="simple">
            <span id="intervention-rc-note-error" i18n="@@intervention.rc.noteRequired"
              >A note is required so the agent knows what to fix.</span
            >
          </p-message>
        }
      </label>
    </div>
  </section>

  <div class="sticky bottom-0 -mb-2 bg-surface-0 pt-4 pb-2 dark:bg-surface-900">
    <p-button
      i18n-label="@@intervention.rc.submit"
      label="Request changes"
      type="submit"
      icon="pi pi-replay"
      severity="secondary"
      [fluid]="true"
      [loading]="loading()"
      [disabled]="form.invalid || disabled() || loading()"
    />
  </div>
</form>
