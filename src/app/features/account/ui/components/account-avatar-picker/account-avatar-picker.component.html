<div class="flex flex-col gap-1.5">
  <button
    hlmBtn
    type="button"
    variant="outline"
    size="sm"
    class="w-fit gap-2 mobile-ui:min-h-11"
    [disabled]="pending()"
    [attr.aria-busy]="pending() ? 'true' : null"
    (click)="fileInput.click()"
  >
    @if (pending()) {
      <hlm-spinner aria-hidden="true" />
      <span i18n="@@account.avatar.uploading">Uploading…</span>
    } @else {
      <ng-icon name="lucideUpload" class="text-sm" aria-hidden="true" />
      <span i18n="@@account.avatar.choose">Change picture</span>
    }
  </button>

  <input
    #fileInput
    type="file"
    aria-label="Change picture"
    i18n-aria-label="@@account.avatar.choose"
    class="sr-only"
    tabindex="-1"
    data-testid="account-avatar-input"
    [accept]="accept"
    [disabled]="pending()"
    (change)="pick($event)"
  />

  @if (error(); as message) {
    <p class="text-sm text-destructive" role="alert">{{ message }}</p>
  } @else {
    <p class="text-xs text-muted-foreground" i18n="@@account.avatar.hint">
      JPEG, PNG, WebP or GIF, up to 5 MB.
    </p>
  }
</div>
