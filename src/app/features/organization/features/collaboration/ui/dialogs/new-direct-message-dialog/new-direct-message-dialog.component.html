<hlm-dialog
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-dialog-content class="sm:max-w-md" data-testid="new-direct-message-dialog" *hlmDialogPortal>
    <hlm-dialog-header>
      <h3 hlmDialogTitle i18n="@@messages.picker.title">New message</h3>
    </hlm-dialog-header>

    <div class="flex flex-col gap-3">
      <div class="relative">
        <ng-icon
          name="lucideSearch"
          class="pointer-events-none absolute start-3 top-1/2 -translate-y-1/2 text-sm text-muted-foreground"
          aria-hidden="true"
        />
        <input
          hlmInput
          type="search"
          class="w-full ps-9"
          data-testid="new-direct-message-search"
          placeholder="Search members"
          i18n-placeholder="@@messages.picker.searchPlaceholder"
          i18n-aria-label="@@messages.picker.searchLabel"
          aria-label="Search members"
          [value]="query()"
          (input)="onQueryInput($event)"
        />
      </div>

      @if (matches().length === 0) {
        <app-empty-state
          icon="lucideUsers"
          title="No one to message"
          i18n-title="@@messages.picker.emptyTitle"
          description="No active member of this organization matches."
          i18n-description="@@messages.picker.emptyDescription"
        />
      } @else {
        <ul class="-mx-1 max-h-72 overflow-y-auto px-1">
          @for (member of matches(); track member.memberId) {
            <li>
              <button
                type="button"
                class="flex w-full items-center gap-2.5 rounded-lg px-2 py-2 text-start transition-colors hover:bg-accent focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none disabled:opacity-50"
                data-testid="new-direct-message-candidate"
                [disabled]="pending()"
                (click)="pick(member.memberId)"
              >
                <hlm-avatar class="size-8 shrink-0">
                  @if (member.avatarUrl; as avatarUrl) {
                    <img hlmAvatarImage [src]="avatarUrl" alt="" />
                  }
                  <span hlmAvatarFallback class="text-[11px]">
                    {{ initialsOf(member.displayName) }}
                  </span>
                </hlm-avatar>

                <span class="flex min-w-0 flex-1 flex-col">
                  <span class="truncate text-sm font-medium text-foreground">
                    {{ member.displayName }}
                  </span>
                  @if (member.roleNames.length > 0) {
                    <span class="truncate text-[11px] text-muted-foreground">
                      {{ member.roleNames.join(', ') }}
                    </span>
                  }
                </span>
              </button>
            </li>
          }
        </ul>
      }
    </div>
  </hlm-dialog-content>
</hlm-dialog>
