name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Full Docker image reference to deploy. Defaults to the branch channel image.
        required: false
        type: string
      source_run_id:
        description: Original CI run ID supplied by automatic publication. Leave empty for manual deployment or rollback.
        required: false
        type: string

concurrency:
  group: deploy-vps-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  guard:
    name: Verify image and SonarQube provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      image-ref: ${{ steps.image.outputs.image-ref }}
      source-sha: ${{ steps.image.outputs.source-sha }}
      deploy-environment: ${{ steps.context.outputs.deploy-environment }}
    steps:
      - name: Checkout deployment verifier
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve deployment event
        id: context
        run: node .github/scripts/deployment-context.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR for image inspection
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Select image reference
        id: selected
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_INPUT: ${{ inputs.image_ref }}
          SOURCE_BRANCH: ${{ steps.context.outputs.source-branch }}
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "$IMAGE_INPUT" ]; then
            image_ref="$IMAGE_INPUT"
          elif [ "$SOURCE_BRANCH" = main ]; then
            image_ref="${image_name}:latest"
          else
            image_ref="${image_name}:develop"
          fi
          # Validate before writing untrusted user input to GITHUB_OUTPUT.
          IMAGE_REF="$image_ref" GH_TOKEN="$GH_TOKEN" node --input-type=module -e '
            import { validateImageConfig } from "./.github/scripts/resolve-image.mjs";
            validateImageConfig(process.env);
          '
          echo "image-ref=$image_ref" >> "$GITHUB_OUTPUT"
        shell: bash
        # This job has only registry/read access; VPS credentials are in deploy.
      - name: Resolve immutable image and source revision
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ steps.selected.outputs.image-ref }}
          SOURCE_BRANCH: ${{ steps.context.outputs.source-branch }}
        run: node .github/scripts/resolve-image.mjs
      - name: Verify exact CI and SonarQube gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ steps.context.outputs.source-branch }}
          SOURCE_SHA: ${{ steps.image.outputs.source-sha }}
          EXPECTED_RUN_ID: ${{ inputs.source_run_id }}
          SONAR_PROJECT_PREFIX: fireguard-web
          SONAR_DEPLOYMENTS_READY: ${{ vars[steps.context.outputs.source-branch == 'main' && 'SONAR_READY_MAIN' || 'SONAR_READY_DEVELOP'] }}
        run: node .github/scripts/verify-ci.mjs

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: guard
    environment: ${{ needs.guard.outputs.deploy-environment }}
    timeout-minutes: 25
    env:
      DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'develop' && 'development' || 'production' }}
      APP_DIR: ${{ vars.VPS_APP_DIR }}
      APP_HOST: ${{ vars.APP_HOST }}
      APP_PORT: ${{ vars.VPS_APP_PORT || '4000' }}
      APP_API_URL: ${{ vars.APP_API_URL }}
      APP_MERCURE_HUB_URL: ${{ vars.APP_MERCURE_HUB_URL }}
      APP_NAME: ${{ vars.APP_NAME || 'Fireguard' }}
      APP_MAINTENANCE: ${{ vars.APP_MAINTENANCE || 'false' }}
      COMPOSE_PROJECT_NAME: ${{ vars.DOCKER_PROJECT_NAME }}
      CONTAINER_NAME: ${{ vars.DOCKER_CONTAINER_NAME }}
      TRAEFIK_ROUTER_NAME: ${{ vars.TRAEFIK_ROUTER_NAME }}
      BASIC_AUTH_USERS: ${{ secrets.BASIC_AUTH_USERS }}

    steps:
      - name: Validate deploy configuration
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            main|develop) ;;
            *) echo "Unsupported deployment branch: $GITHUB_REF_NAME"; exit 1 ;;
          esac

          for value in APP_DIR APP_HOST APP_API_URL APP_MERCURE_HUB_URL COMPOSE_PROJECT_NAME CONTAINER_NAME TRAEFIK_ROUTER_NAME; do
            test -n "${!value}" || { echo "$value is required."; exit 1; }
          done

          test -n "${{ secrets.VPS_HOST }}" || { echo "VPS_HOST secret is required."; exit 1; }
          test -n "${{ secrets.VPS_USER }}" || { echo "VPS_USER secret is required."; exit 1; }
          test -n "${{ secrets.VPS_SSH_KEY }}" || { echo "VPS_SSH_KEY secret is required."; exit 1; }

          if [ "$DEPLOY_ENVIRONMENT" = "development" ]; then
            test -n "$BASIC_AUTH_USERS" || { echo "BASIC_AUTH_USERS secret is required for development."; exit 1; }
            test -n "${{ secrets.BASIC_AUTH_CREDENTIALS }}" || { echo "BASIC_AUTH_CREDENTIALS secret is required for development checks."; exit 1; }
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.source-sha }}

      - name: Prepare image reference
        id: image
        shell: bash
        env:
          VERIFIED_IMAGE_REF: ${{ needs.guard.outputs.image-ref }}
        run: |
          echo "image_ref=${VERIFIED_IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Check VPS capacity and Docker projects
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || '22' }}
          script: |
            set -eu
            available_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
            free_kib=$(df -Pk /srv | awk 'NR==2 {print $4}')
            test "$available_kib" -ge 2621440 || { echo "At least 2.5 GiB of available memory is required."; exit 1; }
            test "$free_kib" -ge 10485760 || { echo "At least 10 GiB of free disk is required."; exit 1; }
            docker compose ls
            docker network inspect traefik_proxy >/dev/null

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || '22' }}
          script: mkdir -p "${{ env.APP_DIR }}"

      - name: Upload Docker Compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || '22' }}
          source: docker-compose.prod.yml,docker-compose.dev.yml
          target: ${{ env.APP_DIR }}

      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_ENVIRONMENT: ${{ env.DEPLOY_ENVIRONMENT }}
          APP_DIR: ${{ env.APP_DIR }}
          APP_HOST: ${{ env.APP_HOST }}
          APP_PORT: ${{ env.APP_PORT }}
          APP_API_URL: ${{ env.APP_API_URL }}
          APP_MERCURE_HUB_URL: ${{ env.APP_MERCURE_HUB_URL }}
          APP_NAME: ${{ env.APP_NAME }}
          APP_MAINTENANCE: ${{ env.APP_MAINTENANCE }}
          COMPOSE_PROJECT_NAME: ${{ env.COMPOSE_PROJECT_NAME }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          TRAEFIK_ROUTER_NAME: ${{ env.TRAEFIK_ROUTER_NAME }}
          BASIC_AUTH_USERS: ${{ env.BASIC_AUTH_USERS }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || '22' }}
          envs: DEPLOY_ENVIRONMENT,APP_DIR,APP_HOST,APP_PORT,APP_API_URL,APP_MERCURE_HUB_URL,APP_NAME,APP_MAINTENANCE,COMPOSE_PROJECT_NAME,CONTAINER_NAME,TRAEFIK_ROUTER_NAME,BASIC_AUTH_USERS,GHCR_USERNAME,GHCR_TOKEN,IMAGE_REF
          script: |
            set -eu
            mkdir -p "$APP_DIR"

            if [ "$DEPLOY_ENVIRONMENT" = "development" ]; then
              compose_files="-f docker-compose.prod.yml -f docker-compose.dev.yml"
              secure_middlewares="${TRAEFIK_ROUTER_NAME}-security,${TRAEFIK_ROUTER_NAME}-auth,${TRAEFIK_ROUTER_NAME}-noindex"
              basic_auth_users=$(printf '%s' "$BASIC_AUTH_USERS" | sed 's/\$/$$/g')
            else
              compose_files="-f docker-compose.prod.yml"
              secure_middlewares="${TRAEFIK_ROUTER_NAME}-security"
              basic_auth_users=""
            fi

            cat > "$APP_DIR/.env" <<EOF
            IMAGE_REF=$IMAGE_REF
            APP_HOST=$APP_HOST
            APP_PORT=$APP_PORT
            APP_API_URL=$APP_API_URL
            APP_MERCURE_HUB_URL=$APP_MERCURE_HUB_URL
            APP_NAME=$APP_NAME
            APP_MAINTENANCE=$APP_MAINTENANCE
            COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME
            CONTAINER_NAME=$CONTAINER_NAME
            TRAEFIK_ROUTER_NAME=$TRAEFIK_ROUTER_NAME
            TRAEFIK_SECURE_MIDDLEWARES=$secure_middlewares
            BASIC_AUTH_USERS=$basic_auth_users
            EOF

            cd "$APP_DIR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker compose $compose_files config --quiet

            existing_project=$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$CONTAINER_NAME" 2>/dev/null || true)
            if [ -n "$existing_project" ] && [ "$existing_project" != "$COMPOSE_PROJECT_NAME" ]; then
              docker rm -f "$CONTAINER_NAME"
            fi

            docker compose $compose_files pull
            docker compose $compose_files up -d --remove-orphans
            docker compose $compose_files ps
            docker logout ghcr.io

      - name: Wait for the container to become healthy
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_ENVIRONMENT: ${{ env.DEPLOY_ENVIRONMENT }}
          APP_DIR: ${{ env.APP_DIR }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || '22' }}
          envs: DEPLOY_ENVIRONMENT,APP_DIR,CONTAINER_NAME
          script: |
            set -eu
            cd "$APP_DIR"
            if [ "$DEPLOY_ENVIRONMENT" = "development" ]; then
              compose_files="-f docker-compose.prod.yml -f docker-compose.dev.yml"
            else
              compose_files="-f docker-compose.prod.yml"
            fi

            attempt=1
            while [ "$attempt" -le 30 ]; do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo missing)
              if [ "$status" = "healthy" ]; then
                echo "container healthy after ${attempt} attempt(s)"
                exit 0
              fi
              echo "attempt ${attempt}/30: ${status}"
              attempt=$((attempt + 1))
              sleep 5
            done

            docker compose $compose_files logs --tail=200 --no-color || true
            exit 1

      - name: Verify the site publicly
        shell: bash
        env:
          BASIC_AUTH_CREDENTIALS: ${{ secrets.BASIC_AUTH_CREDENTIALS }}
        run: |
          if [ "$DEPLOY_ENVIRONMENT" = "development" ]; then
            curl_options=(-u "$BASIC_AUTH_CREDENTIALS")
          else
            curl_options=()
          fi

          attempt=1
          while [ "$attempt" -le 10 ]; do
            if [ "$DEPLOY_ENVIRONMENT" = "development" ]; then
              unauthenticated=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://${APP_HOST}/") || true
              if [ "$unauthenticated" != "401" ]; then
                echo "attempt ${attempt}/10: expected Basic Auth 401, got ${unauthenticated:-000}"
                attempt=$((attempt + 1))
                sleep 6
                continue
              fi
            fi

            result=$(curl "${curl_options[@]}" -sSL -o /dev/null -w '%{http_code}|%header{x-robots-tag}' --max-time 15 "https://${APP_HOST}/") || true
            [ -n "$result" ] || result="000|"
            code=${result%%|*}
            robots_header=${result#*|}
            if [ "$code" = "200" ]; then
              if [ "$DEPLOY_ENVIRONMENT" != "development" ] || [[ "${robots_header,,}" == *noindex* ]]; then
                exit 0
              fi
              echo "attempt ${attempt}/10: final response is missing X-Robots-Tag noindex"
            else
              echo "attempt ${attempt}/10: HTTP ${code}"
            fi
            attempt=$((attempt + 1))
            sleep 6
          done

          echo "::error::https://${APP_HOST}/ never answered 200."
          exit 1
