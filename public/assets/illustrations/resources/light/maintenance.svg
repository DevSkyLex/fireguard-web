    .fg-maintenance-light .accent { stroke-width: 1.1; }
    .fg-maintenance-light .accent-tint { fill: #fadfd7; stroke: #f4511e; stroke-width: 1.1; }
    .fg-maintenance-light .tf { fill: url(#fg-maintenance-light-plane); }
    .fg-maintenance-light .lf { fill: #eeeef1; }
    .fg-maintenance-light .rf { fill: #dddde3; }
    .fg-maintenance-light .lens-fill { fill: #ffffff; }
  </style>
