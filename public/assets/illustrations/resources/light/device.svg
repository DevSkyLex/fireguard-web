    .fg-device-light .d { stroke: #a1a1aa; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-device-light .dh { stroke: #dcdce0; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-device-light .g { stroke: #a8a8b0; stroke-width: 1; stroke-dasharray: 3 3; }
    .fg-device-light .k { stroke: #85858e; stroke-width: 1.2; }
    .fg-device-light .ka, .fg-device-light .oa { stroke: #5f5f68; stroke-width: 1.35; }
    .fg-device-light .da { stroke: #5f5f68; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-device-light .ga { stroke: #5f5f68; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
