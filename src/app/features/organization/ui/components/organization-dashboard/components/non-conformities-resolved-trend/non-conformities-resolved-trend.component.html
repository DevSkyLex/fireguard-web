<p-menu #actionMenu [model]="menuItems()" [popup]="true" appendTo="body" />

<p-card class="h-full" [pt]="cardPt">
  <ng-template pTemplate="header">
    <section class="flex flex-wrap items-center justify-between gap-x-3 gap-y-2">
      <section class="flex min-w-0 flex-1 basis-48 flex-col">
        <h2
          i18n="@@org.trend.ncResolved.title"
          class="text-[15px] font-semibold text-balance text-surface-900 dark:text-surface-0"
        >
          Non-Conformities Resolved
        </h2>
        <p
          i18n="@@org.trend.ncResolved.desc"
          class="truncate text-sm text-surface-500 dark:text-surface-400"
        >
          Resolved non-conformities over time
        </p>
      </section>

      <app-non-conformities-resolved-toolbar
        [activeFilterCount]="activeFilterCount()"
        (filterToggle)="onFilterToggle()"
        (menuToggle)="onMenuToggle($event)"
      />
    </section>
  </ng-template>

  <ng-template pTemplate="content">
    <section class="flex flex-col">
      <app-trend-metric-strip [metrics]="summaryMetrics()" [loading]="isLoading()" />

      <div class="px-4">
        <app-non-conformities-resolved-chart />
      </div>
    </section>
  </ng-template>
</p-card>

<app-trend-filter-drawer
  i18n-title="@@org.trend.ncResolved.filterTitle"
  title="Non-Conformities Resolved Filters"
  i18n-description="@@org.trend.ncResolved.filterDesc"
  description="Refine resolved non-conformity metrics by status, severity, period, and comparison mode."
  [visible]="isFilterDrawerVisible()"
  [loading]="isLoading()"
  (cancel)="onCancelFilters()"
  (reset)="onResetFilters()"
  (apply)="onApplyFilters()"
>
  <app-non-conformities-resolved-filters />
</app-trend-filter-drawer>
