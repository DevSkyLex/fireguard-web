<div
  id="maintenance-page"
  class="mx-auto flex w-full max-w-md flex-col px-6 py-16 text-center sm:py-24"
>
  <!-- Icon -->
  <div
    class="mx-auto mb-6 flex size-16 items-center justify-center rounded-xl bg-surface-100 text-surface-600 dark:bg-surface-800 dark:text-surface-300"
  >
    <i class="pi pi-wrench text-2xl" aria-hidden="true"></i>
  </div>

  <!-- Heading -->
  <h1
    class="mb-2 text-3xl font-semibold tracking-[-0.025em] text-balance text-surface-950 dark:text-surface-0"
    i18n="@@maintenance.title"
  >
    Under Maintenance
  </h1>

  <!-- Description -->
  <p
    class="mb-8 text-sm leading-6 text-pretty text-surface-500 dark:text-surface-400"
    i18n="@@maintenance.description"
  >
    We're performing scheduled maintenance to improve your experience. Please check back in a few
    moments.
  </p>

  <!-- Retry -->
  <p-button
    label="Try again"
    i18n-label="@@common.tryAgain"
    icon="pi pi-refresh"
    (onClick)="refresh()"
  />
</div>
