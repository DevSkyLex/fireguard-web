<form novalidate (submit)="submit($event)">
  <hlm-field-group>
    <hlm-field>
      <label hlmFieldLabel for="new-password"
        ><span i18n="@@auth.newPassword.label">New password</span><app-required-marker
      /></label>
      <app-password-input
        inputId="new-password"
        autocomplete="new-password"
        placeholder="At least 8 characters"
        i18n-placeholder="@@auth.password.placeholder"
        [field]="passwordForm.password"
      />
      @if (passwordForm.password().touched() && passwordForm.password().invalid()) {
        <hlm-field-error>{{ passwordForm.password().errors()[0].message }}</hlm-field-error>
      }
    </hlm-field>

    <hlm-field>
      <label hlmFieldLabel for="new-password-confirm"
        ><span i18n="@@auth.passwordConfirmation.label">Repeat password</span><app-required-marker
      /></label>
      <app-password-input
        inputId="new-password-confirm"
        autocomplete="new-password"
        placeholder="Repeat your password"
        i18n-placeholder="@@auth.passwordConfirmation.placeholder"
        [field]="passwordForm.confirmPassword"
      />
      @if (passwordForm.confirmPassword().touched() && passwordForm.confirmPassword().invalid()) {
        <hlm-field-error>{{ passwordForm.confirmPassword().errors()[0].message }}</hlm-field-error>
      }
    </hlm-field>

    <button
      hlmBtn
      type="submit"
      class="w-full max-sm:min-h-11"
      data-testid="new-password-submit"
      [disabled]="pending()"
      [attr.aria-busy]="pending() ? 'true' : null"
      aria-live="polite"
    >
      @if (pending()) {
        <span i18n="@@auth.newPassword.submitting">Saving…</span>
      } @else {
        <span i18n="@@auth.newPassword.submit">Set new password</span>
      }
    </button>
  </hlm-field-group>
</form>
