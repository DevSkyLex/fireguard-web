<!--
  A system view, not a conversation: it owns its own scroller and has no
  composer, because a bookmark list is not somewhere you post.
-->
<section
  class="flex min-h-0 flex-1 flex-col gap-6 p-3 sm:p-6 md:p-7 lg:p-8"
  [attr.aria-busy]="store.isLoading()"
  data-testid="saved-messages"
>
  @if (store.loadError()) {
    <app-error-banner
      [message]="loadErrorMessage"
      [retrying]="store.isLoading()"
      (retried)="retryLoad()"
    />
  }

  @for (message of chatMessages(); track message.id) {
    <!--
      Reacting, pinning and replying are off: this page can only unsave and
      copy. `SavedMessagesStore` has no method for the rest, so leaving those
      controls mounted put focusable buttons in the tab order that did nothing
      at all — and a reply here has no thread to open over.
    -->
    <app-chat-message
      [message]="message"
      [canReact]="false"
      [canPin]="false"
      [canReply]="false"
      (saveToggled)="store.unsave(message.id)"
      (copied)="copy($event)"
    />
  } @empty {
    @if (store.isLoading()) {
      <div class="flex flex-col gap-3" role="status">
        <span class="sr-only" i18n="@@workspace.saved.loading">Loading saved messages</span>
        @for (row of [1, 2, 3, 4, 5]; track row) {
          <div class="flex items-center gap-3">
            <p-skeleton shape="circle" size="2.5rem" />
            <div class="flex flex-1 flex-col gap-2">
              <p-skeleton width="30%" height="0.875rem" />
              <p-skeleton width="55%" height="0.875rem" />
            </div>
          </div>
        }
      </div>
    } @else {
      <app-empty-state
        class="m-auto"
        icon="pi pi-bookmark"
        i18n-title="@@workspace.saved.empty.title"
        title="Nothing saved yet"
        i18n-description="@@workspace.saved.empty.description"
        description="Bookmark a message to find it here."
      />
    }
  }

  @if (store.hasMore()) {
    <button
      type="button"
      class="mx-auto cursor-pointer rounded-md px-3 py-1 text-sm text-surface-500 hover:bg-surface-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:text-surface-400 dark:hover:bg-white/5"
      data-testid="saved-messages-load-more"
      (click)="loadMore()"
    >
      <ng-container i18n="@@common.loadMore">Load more</ng-container>
      ({{ store.savedEntities().length }}/{{ store.total() }})
    </button>
  }
</section>
