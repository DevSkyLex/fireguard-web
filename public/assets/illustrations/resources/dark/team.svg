    .fg-team-dark .da { stroke: #bdbdc5; stroke-width: 1.2; stroke-dasharray: 0 3; }
    .fg-team-dark .ga { stroke: #bdbdc5; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
