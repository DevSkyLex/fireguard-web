<app-tree
  ariaLabel="Facility hierarchy chart"
  i18n-ariaLabel="@@facility.hierarchy.treeLabel"
  [nodes]="nodes()"
  [childrenByParent]="treeChildrenByParent()"
  [loadingIds]="loadingIds()"
  [failedIds]="emptyIds"
  [selectedId]="activeFacilityId()"
  [nodeTemplate]="hierarchyNode"
  (expandRequested)="onExpandRequested()"
  (selected)="onNodeSelected($event)"
/>

<ng-template #hierarchyNode let-node="node">
  <div class="flex min-w-0 flex-1 items-center gap-2" data-testid="facility-hierarchy-node">
    <span class="min-w-0 flex-1 truncate text-sm font-medium"
      >{{ node.data.name }}
      <span class="font-normal text-muted-foreground">· {{ typeLabelOf(node.data.type) }}</span>
    </span>
    @if (isArchived(node.data)) {
      <app-facility-status-tag [value]="node.data.status" />
    }
  </div>
</ng-template>
