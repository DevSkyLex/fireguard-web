<app-trend-card
  i18n-title="@@org.dash.inspResult.title"
  title="Inspection results"
  [loading]="isLoading()"
>
  <ng-template #content>
    @if (hasData()) {
      <div class="flex flex-col items-center gap-4 sm:flex-row">
        <!--
          The canvas is decorative: every number it encodes is also in the
          legend below, which is real text. `aria-hidden` keeps a screen
          reader from announcing an empty graphic.
        -->
        <div class="relative h-26 w-26 shrink-0" aria-hidden="true">
          <p-chart type="doughnut" [data]="data()" [options]="options()" height="104px" />

          <div
            class="pointer-events-none absolute inset-0 flex flex-col items-center justify-center"
          >
            <span class="text-2xl font-bold text-surface-950 tabular-nums dark:text-surface-50">
              {{ total() }}
            </span>
            <span
              class="text-[9px] font-medium tracking-[0.08em] text-surface-500 dark:text-surface-400"
              i18n="@@org.dash.inspResult.unit"
            >
              graded
            </span>
          </div>
        </div>

        <ul class="flex min-w-0 flex-1 flex-col gap-2.5">
          @for (row of legend(); track row.label) {
            <li class="flex items-center gap-2.5">
              <span
                class="size-2.5 shrink-0 rounded-full"
                [style.background-color]="row.color"
              ></span>

              <span class="min-w-0 flex-1 truncate text-xs text-surface-600 dark:text-surface-400">
                {{ row.label }}
              </span>

              <span
                class="shrink-0 text-xs font-semibold text-surface-950 tabular-nums dark:text-surface-50"
              >
                {{ row.count }}
              </span>
            </li>
          }
        </ul>
      </div>
    } @else {
      <p
        class="py-8 text-center text-sm text-surface-500 dark:text-surface-400"
        i18n="@@org.dash.inspResult.empty"
      >
        No inspection has been graded yet.
      </p>
    }
  </ng-template>
</app-trend-card>
