<hlm-sheet
  [side]="side()"
  [state]="dialogState()"
  [disableClose]="pending()"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-sheet-content
    *hlmSheetPortal
    class="w-full! max-w-none! overflow-y-auto pb-[env(safe-area-inset-bottom)] mobile-ui:max-h-[90svh] desktop-ui:w-[min(576px,100vw)]!"
    data-testid="calendar-event-dialog"
    [attr.data-dirty]="dirty()"
  >
    <hlm-sheet-header>
      @if (editing()) {
        <h3 hlmSheetTitle i18n="@@calendar.eventDialog.editTitle">Edit event</h3>
        <p hlmSheetDescription i18n="@@calendar.eventDialog.editDescription">
          Changes apply only to this standalone event.
        </p>
      } @else {
        <h3 hlmSheetTitle i18n="@@calendar.eventDialog.createTitle">New event</h3>
        <p hlmSheetDescription i18n="@@calendar.eventDialog.createDescription">
          Adds a standalone event to the organization calendar.
        </p>
      }
    </hlm-sheet-header>

    <app-calendar-event-form
      class="px-4 pb-4"
      [visible]="visible()"
      [pending]="pending()"
      [serverError]="serverError()"
      [editing]="editing()"
      [facilityOptions]="facilityOptions()"
      [initialStartsAt]="initialStartsAt()"
      (submitted)="submitted.emit($event)"
      (cancelled)="requestClose()"
      (dirtyChanged)="dirty.set($event)"
    />
  </hlm-sheet-content>
</hlm-sheet>

<app-unsaved-changes-dialog
  [state]="unsavedChangesDialogState()"
  (confirmed)="onUnsavedChangesConfirmed()"
  (dismissed)="onUnsavedChangesDismissed()"
/>
