<form class="flex flex-col gap-5" [formGroup]="form" (ngSubmit)="onSubmit()">
  <p class="text-sm text-surface-500 dark:text-surface-400" i18n="@@org.legal.intro">
    Used on reports, invoices and compliance exports. Every field is optional.
  </p>

  <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
    <div class="flex flex-col gap-1.5 sm:col-span-2">
      <label class="text-sm text-surface-900/50 dark:text-surface-0/50" for="legalName">
        <span i18n="@@org.legal.name">Registered name</span>
      </label>
      <input
        id="legalName"
        pInputText
        formControlName="legalName"
        autocomplete="organization"
        class="w-full"
      />
      <small class="text-xs text-surface-500 dark:text-surface-400" i18n="@@org.legal.nameHint">
        May differ from the display name.
      </small>
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-sm text-surface-900/50 dark:text-surface-0/50" for="legalType">
        <span i18n="@@org.legal.type">Legal type</span>
      </label>
      <input id="legalType" pInputText formControlName="legalType" class="w-full" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-sm text-surface-900/50 dark:text-surface-0/50" for="country">
        <span i18n="@@org.legal.country">Country</span>
      </label>
      <input
        id="country"
        pInputText
        formControlName="country"
        autocomplete="country"
        maxlength="2"
        class="w-full uppercase"
      />
      <small class="text-xs text-surface-500 dark:text-surface-400" i18n="@@org.legal.countryHint">
        Two-letter code, e.g. FR.
      </small>
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-sm text-surface-900/50 dark:text-surface-0/50" for="registrationNumber">
        <span i18n="@@org.legal.registration">Registration number</span>
      </label>
      <input
        id="registrationNumber"
        pInputText
        formControlName="registrationNumber"
        class="w-full"
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-sm text-surface-900/50 dark:text-surface-0/50" for="vatNumber">
        <span i18n="@@org.legal.vat">VAT number</span>
      </label>
      <input id="vatNumber" pInputText formControlName="vatNumber" class="w-full" />
    </div>
  </div>

  <div class="flex justify-end">
    <p-button
      type="submit"
      i18n-label="@@common.save"
      label="Save"
      [loading]="saving()"
      [disabled]="saving()"
    />
  </div>
</form>
