<div class="flex flex-col gap-3" role="status" [attr.aria-label]="label()">
  <span class="sr-only">{{ label() }}</span>

  @switch (preset()) {
    @case ('card') {
      @for (row of rows(); track row) {
        <div
          class="flex flex-col gap-3 rounded-lg border border-surface-200 p-4 dark:border-surface-800"
        >
          <p-skeleton width="40%" height="1rem" />
          <p-skeleton width="100%" height="2rem" />
          <p-skeleton width="60%" height="1rem" />
        </div>
      }
    }
    @case ('chart') {
      <p-skeleton width="100%" height="16rem" />
    }
    @case ('text') {
      @for (row of rows(); track row) {
        <p-skeleton width="100%" height="1rem" />
      }
    }
    @default {
      @for (row of rows(); track row) {
        <div class="flex items-center gap-3">
          <p-skeleton shape="circle" size="2.5rem" />
          <div class="flex flex-1 flex-col gap-2">
            <p-skeleton width="30%" height="0.875rem" />
            <p-skeleton width="55%" height="0.875rem" />
          </div>
        </div>
      }
    }
  }
</div>
