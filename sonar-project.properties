# The CI selects one independent Community Build project for each supported branch.
# Never set sonar.branch.name: main/develop have separate project keys.
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src
sonar.exclusions=src/**/*.spec.ts,src/**/testing/**,src/environments/**,src/app/shared/ui/**,src/locale/**,**/*.generated.*
sonar.test.inclusions=src/**/*.spec.ts,src/**/testing/**/*.ts
sonar.test.exclusions=src/environments/**,src/app/shared/ui/**
sonar.coverage.exclusions=**/testing/**,src/environments/**,src/app/shared/ui/**
sonar.javascript.lcov.reportPaths=coverage/fireguard-web/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.app.json,tsconfig.spec.json
# The dedicated quality-gate action waits for this exact analysis (600 seconds).
sonar.qualitygate.wait=false
