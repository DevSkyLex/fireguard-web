<hlm-sheet side="right" [state]="sheetState()" (stateChanged)="onStateChanged($event)">
  <hlm-sheet-content
    *hlmSheetPortal
    id="intervention-discussion-sheet"
    class="w-full! overflow-y-auto sm:w-[560px]! sm:max-w-none!"
    data-testid="intervention-discussion-sheet"
  >
    <hlm-sheet-header>
      <h3 hlmSheetTitle i18n="@@intervention.discussion.title">Discussion</h3>
      <p hlmSheetDescription i18n="@@intervention.discussion.subtitle">
        Live team messaging about this intervention
      </p>
    </hlm-sheet-header>

    <app-subject-discussion
      subjectType="intervention"
      [subjectId]="interventionId()"
      [organizationId]="organizationId()"
      [active]="visible()"
    />
  </hlm-sheet-content>
</hlm-sheet>
