<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" fill="none" role="img" aria-labelledby="fg-workload-dark-title fg-workload-dark-description" class="fg-workload-dark">
  <title id="fg-workload-dark-title">Workload</title>
  <desc id="fg-workload-dark-description">Three workload columns against a dashed capacity plane, the overloaded one in vermilion.</desc>
  <defs>
    <linearGradient id="fg-workload-dark-plane" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#141416"/>
      <stop offset="1" stop-color="#101012"/>
    </linearGradient>
  </defs>
  <style>
    .fg-workload-dark { stroke-linecap: butt; stroke-linejoin: miter; stroke-width: 2; stroke-opacity: .45; }
    .fg-workload-dark .edge, .fg-workload-dark .seam { stroke: #a1a1aa; }
    .fg-workload-dark .seam { stroke: #51515c; }
    .fg-workload-dark .seam, .fg-workload-dark .accent-seam { stroke-width: 1.35; }
    .fg-workload-dark .shade { fill: #000000; fill-opacity: .28; }
    .fg-workload-dark .soft { stroke: #46464f; stroke-width: 1.1; }
    .fg-workload-dark .guide { stroke: #6b6b75; stroke-width: .8; stroke-dasharray: 2 4; opacity: .55; }
    .fg-workload-dark .accent-edge, .fg-workload-dark .accent-seam, .fg-workload-dark .accent { stroke: #ff7043; }
    .fg-workload-dark .accent { stroke-width: 1.1; }
    .fg-workload-dark .accent-fill { fill: #ff7043; }
    .fg-workload-dark .tf { fill: url(#fg-workload-dark-plane); }
    .fg-workload-dark .lf { fill: #141417; }
    .fg-workload-dark .rf { fill: #0d0d0f; }
    .fg-workload-dark .at { fill: #4a2a20; }
    .fg-workload-dark .af { fill: #3c221a; }
    .fg-workload-dark .ar { fill: #2e1a14; }
    .fg-workload-dark .accent-edge, .fg-workload-dark .accent-seam, .fg-workload-dark .accent { stroke-opacity: 1; }
  </style>
