<!-- Search trigger: full field on desktop, icon-only square below lg -->
<button
  type="button"
  class="flex h-8.5 w-8.5 shrink-0 cursor-pointer items-center justify-center gap-2 rounded-md border border-surface-200 bg-surface-100 text-[13px] text-surface-600 transition-colors hover:border-surface-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary lg:w-auto lg:min-w-52 lg:justify-start lg:px-2.5 dark:border-surface-800 dark:bg-surface-900 dark:text-surface-400 dark:hover:border-surface-600"
  aria-label="Search"
  i18n-aria-label="@@layout.search.open"
  aria-haspopup="dialog"
  data-testid="header-search-trigger"
  (click)="open()"
>
  <i class="pi pi-search text-sm" aria-hidden="true"></i>

  <span class="hidden lg:inline" i18n="@@layout.search.placeholderShort">Search…</span>

  <span
    class="ml-auto hidden items-center rounded-md border border-surface-200 bg-surface-0 px-1.5 py-px text-[11px] font-semibold lg:inline-flex dark:border-surface-800 dark:bg-surface-800"
    aria-hidden="true"
  >
    {{ isMacLike ? '⌘K' : 'Ctrl K' }}
  </span>
</button>

<!-- Command palette -->
<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  [showHeader]="false"
  [style]="{ width: '40rem' }"
  [breakpoints]="{ '640px': '92vw' }"
  [contentStyle]="{ padding: '0' }"
  appendTo="body"
  (onShow)="searchInput.focus()"
>
  <div class="flex flex-col" role="search">
    <!-- Query input -->
    <div
      class="flex items-center gap-2.5 border-b border-surface-200 px-4 py-3 dark:border-surface-800"
    >
      <i
        class="pi pi-search text-base text-surface-500 dark:text-surface-400"
        aria-hidden="true"
      ></i>

      <input
        type="text"
        class="min-w-0 flex-1 border-0 bg-transparent text-[15px] text-surface-950 outline-none placeholder:text-surface-500 dark:text-surface-50 dark:placeholder:text-surface-400"
        placeholder="Search or jump to…"
        i18n-placeholder="@@layout.search.placeholder"
        aria-label="Search a destination"
        i18n-aria-label="@@layout.search.inputAria"
        data-testid="header-search-input"
        [value]="query()"
        (input)="query.set($any($event.target).value)"
        (keydown)="onListKeydown($event)"
        #searchInput
      />

      <button
        type="button"
        class="flex size-7 shrink-0 cursor-pointer items-center justify-center rounded-md text-surface-500 transition-colors hover:bg-surface-100 hover:text-surface-950 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:text-surface-400 dark:hover:bg-surface-900 dark:hover:text-surface-50"
        aria-label="Close"
        i18n-aria-label="@@common.close"
        (click)="visible.set(false)"
      >
        <i class="pi pi-times text-sm" aria-hidden="true"></i>
      </button>
    </div>

    <!-- Destinations -->
    <div class="max-h-90 overflow-y-auto p-1.5">
      @if (filteredEntries().length === 0) {
        <p
          class="px-2.5 py-6 text-center text-[13px] text-surface-600 dark:text-surface-400"
          i18n="@@layout.search.empty"
        >
          No matching destination.
        </p>
      } @else {
        <p
          class="px-2.5 pt-1.5 pb-1 text-[11px] font-semibold tracking-[0.04em] text-surface-600 uppercase dark:text-surface-400"
          i18n="@@layout.search.goTo"
        >
          Go to
        </p>

        @for (entry of filteredEntries(); track entry.routerLink) {
          <button
            type="button"
            class="flex w-full cursor-pointer items-center gap-2.5 rounded-md px-2.5 py-2 text-left text-[13px] font-medium text-surface-950 transition-colors hover:bg-surface-100 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-primary dark:text-surface-50 dark:hover:bg-surface-900"
            data-search-item
            (click)="onEntrySelect(entry)"
            (keydown)="onListKeydown($event)"
          >
            @if (entry.icon) {
              <i
                [class]="entry.icon + ' w-4 text-center text-surface-500 dark:text-surface-400'"
                aria-hidden="true"
              ></i>
            }

            <span class="min-w-0 flex-1 truncate">{{ entry.label }}</span>

            <span class="shrink-0 text-[11px] text-surface-500 dark:text-surface-500">
              {{ entry.section }}
            </span>
          </button>
        }
      }
    </div>
  </div>
</p-dialog>
