<ul class="grid gap-2 text-sm">
  @for (check of checks(); track check.label) {
    <li class="flex items-center gap-2">
      @if (check.done) {
        <i
          class="pi pi-check-circle shrink-0 text-green-600 dark:text-green-400"
          aria-hidden="true"
        ></i>
        <span class="text-surface-700 dark:text-surface-200">{{ check.label }}</span>
      } @else {
        <i
          class="pi pi-exclamation-circle shrink-0 text-amber-600 dark:text-amber-400"
          aria-hidden="true"
        ></i>
        <span class="text-surface-500 dark:text-surface-400">{{ check.label }}</span>
      }
    </li>
  }
</ul>
