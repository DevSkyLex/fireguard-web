<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" fill="none" role="img" aria-labelledby="fg-calendar-light-title fg-calendar-light-description" class="fg-calendar-light">
  <title id="fg-calendar-light-title">Calendar</title>
  <desc id="fg-calendar-light-description">A bound calendar lying open on the desk with one day selected in vermilion.</desc>
  <defs>
    <linearGradient id="fg-calendar-light-plane" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fafafb"/>
    </linearGradient>
  </defs>
  <style>
    .fg-calendar-light { stroke-linecap: butt; stroke-linejoin: miter; stroke-width: 2; }
    .fg-calendar-light .edge, .fg-calendar-light .seam { stroke: #777781; }
    .fg-calendar-light .seam, .fg-calendar-light .accent-seam { stroke-width: 1.35; }
    .fg-calendar-light .shade { fill: #1b1b24; fill-opacity: .055; }
    .fg-calendar-light .soft { stroke: #a1a1ab; stroke-width: 1.1; }
    .fg-calendar-light .guide { stroke: #85858f; stroke-width: .8; stroke-dasharray: 2 4; opacity: .55; }
    .fg-calendar-light .accent-edge, .fg-calendar-light .accent-seam, .fg-calendar-light .accent { stroke: #f4511e; }
    .fg-calendar-light .accent { stroke-width: 1.1; }
    .fg-calendar-light .accent-fill { fill: #f4511e; }
    .fg-calendar-light .tf { fill: url(#fg-calendar-light-plane); }
    .fg-calendar-light .lf { fill: #eeeef1; }
    .fg-calendar-light .rf { fill: #dddde3; }
    .fg-calendar-light .at { fill: #fadfd7; }
    .fg-calendar-light .af { fill: #f3d0c7; }
    .fg-calendar-light .ar { fill: #ecc0b4; }
  </style>
