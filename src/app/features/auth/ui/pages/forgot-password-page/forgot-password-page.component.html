<div id="forgot-password-page" class="flex w-full max-w-sm flex-col gap-6">
  <header class="flex flex-col gap-1.5">
    <h1
      class="text-2xl font-semibold tracking-tight text-foreground"
      i18n="@@auth.forgotPassword.title"
    >
      Reset your password
    </h1>
    <p class="text-sm text-muted-foreground" i18n="@@auth.forgotPassword.subtitle">
      Tell us your address and we will send you a code.
    </p>
  </header>

  <app-email-request-form
    [pending]="passwordResetStore.isRequesting()"
    [submitLabel]="submitLabel"
    (submitted)="request($event)"
  />

  <p class="text-center text-sm text-muted-foreground">
    <a
      class="font-medium text-foreground underline-offset-4 hover:underline focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
      routerLink="/auth/login"
      i18n="@@auth.forgotPassword.backToSignIn"
      >Back to sign in</a
    >
  </p>
</div>
