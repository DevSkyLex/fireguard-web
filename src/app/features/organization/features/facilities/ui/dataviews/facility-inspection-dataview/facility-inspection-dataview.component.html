<p-card class="block h-full" [pt]="cardPt">
  <ng-template pTemplate="header">
    <div
      class="flex flex-col gap-4 border-b border-surface-200 px-4 py-3 sm:flex-row sm:items-center sm:justify-between dark:border-surface-800"
    >
      <div class="flex items-center gap-2">
        <h2
          i18n="@@facility.inspections.title"
          class="text-[15px] font-semibold text-surface-900 dark:text-surface-0"
        >
          Inspections
        </h2>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <span class="text-sm text-surface-600 tabular-nums dark:text-surface-400">{{
          store.inspections().length
        }}</span>

        <p-selectbutton
          i18n-ariaLabel="@@facility.inspections.filterAria"
          ariaLabel="Filter inspections"
          [options]="filterOptions"
          [allowEmpty]="false"
          optionLabel="label"
          optionValue="value"
          size="small"
          [ngModel]="filter()"
          (ngModelChange)="filter.set($event)"
        />
      </div>
    </div>
  </ng-template>

  <p-dataview
    [value]="store.isLoadingInspections() ? [1, 2, 3, 4, 5] : [...inspections()]"
    layout="list"
    [pt]="dataviewPt"
    class="flex min-h-0 flex-1 flex-col"
  >
    <ng-template #list let-items>
      @if (store.isLoadingInspections()) {
        <div class="space-y-2 p-4">
          @for (_ of items; track $index) {
            <p-skeleton width="100%" height="2.5rem" />
          }
        </div>
      } @else if (items.length === 0) {
        <app-empty-state
          icon="pi-search"
          i18n-title="@@facility.inspDv.emptyTitle"
          title="No inspections"
          i18n-description="@@facility.inspDv.empty"
          description="No inspection matches this filter."
        />
      } @else {
        <div class="divide-y divide-surface-100 dark:divide-surface-800">
          @for (item of items; track item.id) {
            <article class="flex flex-wrap items-center justify-between gap-3 px-4 py-3">
              <div class="min-w-0">
                <p class="truncate text-sm font-medium text-surface-900 dark:text-surface-100">
                  {{ getInspectorDisplayName(item) }}
                </p>
                <p class="text-xs text-surface-500">{{ item.performedAt | date: 'mediumDate' }}</p>
              </div>

              <div class="flex items-center gap-2">
                <p-tag
                  [severity]="resultDescriptor(item.result).severity"
                  [icon]="resultDescriptor(item.result).icon"
                  [value]="resultDescriptor(item.result).label"
                />
                <p-tag
                  [severity]="statusDescriptor(item.status).severity"
                  [icon]="statusDescriptor(item.status).icon"
                  [value]="statusDescriptor(item.status).label"
                />
              </div>
            </article>
          }
        </div>
      }
    </ng-template>
  </p-dataview>
</p-card>
