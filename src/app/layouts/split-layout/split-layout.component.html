<div id="split-layout" [class]="layoutClass()">
  <div id="split-layout-column" [class]="columnClass()">
    @if (header.length > 0) {
      <header
        class="flex shrink-0 items-center justify-between gap-4 px-6 py-3 sm:px-8 sm:py-4 mobile-ui:gap-2 mobile-ui:px-4 mobile-ui:pt-[max(0.75rem,env(safe-area-inset-top))]"
      >
        <div
          id="split-layout-brand"
          class="flex items-center gap-2.5"
          [class.lg:hidden]="showcase() !== null"
        >
          <img src="fireguard-logo-primary.svg" width="28" height="28" alt="" data-theme-logo />
          <span class="text-base font-semibold tracking-tight">Fireguard</span>
        </div>
        <div class="ml-auto flex items-center gap-2">
          <app-slot-outlet [contributions]="header" />
        </div>
      </header>
    }

    <main
      #content
      id="split-layout-content"
      class="flex min-h-0 flex-1 flex-col overflow-y-auto px-6 py-6 sm:px-8 sm:py-10 mobile-ui:scroll-pb-28 mobile-ui:px-4 mobile-ui:pt-5 mobile-ui:pb-[max(1.5rem,env(safe-area-inset-bottom))]"
    >
      <div id="split-layout-content-box" [class]="contentClass()">
        <router-outlet (activate)="resetContentScroll()" />
      </div>
    </main>

    @if (footer.length > 0) {
      <footer
        class="flex shrink-0 items-center justify-between gap-4 px-6 py-5 sm:px-8 mobile-ui:gap-2 mobile-ui:px-4 mobile-ui:pt-3 mobile-ui:pb-[max(0.75rem,env(safe-area-inset-bottom))]"
      >
        <app-slot-outlet [contributions]="footer" />
      </footer>
    }
  </div>

  @if (showcase(); as contribution) {
    <aside id="split-layout-showcase" [class]="showcaseClass()">
      <ng-container *ngComponentOutlet="contribution.component" />
    </aside>
  }
</div>
